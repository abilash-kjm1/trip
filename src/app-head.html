  font-weight:600; color:var(--apricot-dk); cursor:pointer; -webkit-tap-highlight-color:transparent; }
.af-main{ display:flex; gap:var(--s2); align-items:stretch; }
.af-amt, .af-desc{ min-height:56px; border-radius:14px; background:var(--surface);
  border:1px solid rgba(180,112,62,.24); transition:border-color .15s, box-shadow .15s; }
.af-amt{ flex:0 0 40%; display:flex; align-items:center; gap:4px; padding:0 14px; margin:0; cursor:text; }
.af-cur{ font-size:22px; font-weight:600; color:var(--ink-3); }
.af-amt input{ flex:1; min-width:0; width:100%; min-height:0; border:0; background:transparent;
  padding:0; box-shadow:none; font:inherit; font-size:26px; font-weight:700; letter-spacing:-.02em;
  color:var(--ink); font-variant-numeric:tabular-nums; outline:none; -moz-appearance:textfield; }
.af-amt input::-webkit-outer-spin-button, .af-amt input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.af-desc{ flex:1; min-width:0; padding:0 14px; font:inherit; font-size:16px; color:var(--ink); outline:none; }
.af-amt:focus-within, .af-desc:focus{ border-color:var(--apricot-dk); box-shadow:0 0 0 3px rgba(238,181,134,.35); }
.af-sum{ display:flex; flex-wrap:wrap; gap:8px; margin:var(--s3) 0 0; }
.af-pill{ display:inline-flex; align-items:center; gap:4px; padding:7px 9px 7px 12px; border-radius:999px;
  border:1px solid rgba(180,112,62,.22); background:rgba(255,255,255,.72); font:inherit; font-size:13.5px;
  color:var(--ink-2); cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:background .15s, color .15s, border-color .15s; }
span.af-pill{ cursor:default; padding-right:12px; }
.af-pill b{ font-weight:700; color:var(--ink); }
.af-pill .ms{ font-size:18px; color:var(--ink-3); transition:transform .2s; }
.af-pill[aria-expanded="true"]{ background:var(--ink); border-color:var(--ink); color:rgba(252,250,245,.72); }
.af-pill[aria-expanded="true"] b, .af-pill[aria-expanded="true"] .ms{ color:var(--cream); }
.af-pill[aria-expanded="true"] .ms{ transform:rotate(180deg); }
.af-pill:focus:not(:focus-visible){ outline:none; }
.af-panel{ margin:var(--s2) 0 0; padding:12px; border-radius:14px; background:rgba(255,255,255,.55); }
.af-panel[hidden]{ display:none; }
.af-panel .chips{ margin:0; }
.af-hint{ display:flex; align-items:center; justify-content:space-between; margin:0 2px 8px;
  font-size:12.5px; font-weight:600; color:var(--ink-3); }
.af-link{ border:0; background:transparent; padding:2px 0; font:inherit; font-size:12.5px; font-weight:600;
  color:var(--apricot-dk); cursor:pointer; }
.af-foot{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); margin-top:var(--s4); }
.af-each{ font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.af-foot .btn{ margin:0; min-width:160px; }
@media (max-width:520px){
  .af-main{ flex-direction:column; }
  .af-amt{ flex-basis:auto; }
  .af-foot{ flex-direction:column-reverse; align-items:stretch; gap:8px; }
  .af-foot .btn{ width:100%; }
  .af-each{ text-align:center; }
}
:root[data-theme="purple"] .af-amt, :root[data-theme="purple"] .af-desc,
:root[data-theme="purple"] .af-pill{ border-color:rgba(109,63,191,.20); }
:root[data-theme="purple"] .af-amt:focus-within, :root[data-theme="purple"] .af-desc:focus{
  border-color:#6D3FBF; box-shadow:0 0 0 3px rgba(160,120,240,.28); }

/* ---- Balances: you first, then most owed back down to most owing ---------- */
.ballist{ padding:4px 0; overflow:hidden; }
.balrow{ gap:12px; }
.balrow.mine{ background:color-mix(in srgb, var(--apricot) 11%, transparent); }
/* A soft tint and a "You" tag mark your row; the old edge bar is not needed. */
.balrow.mine::after, .owe-row.mine::after{ display:none; }
.balrow .t1{ display:flex; align-items:center; gap:6px; min-width:0; }
.balrow .t1 .nm{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bal-tag{ flex:0 0 auto; padding:1px 8px; border-radius:999px; font-size:10.5px; font-weight:600;
  letter-spacing:.02em; line-height:1.6; background:var(--fill-1); color:var(--ink-3); }
.bal-tag.you{ background:var(--apricot-lt); color:var(--apricot-dk); }
.balrow .t2{ margin-top:2px; font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.balrow .right{ display:flex; flex-direction:column; align-items:flex-end; }
.balrow .amt{ font-size:16px; font-weight:700; letter-spacing:-.01em; }
.balrow .amt.pos{ color:var(--good); }
.balrow .amt.neg{ color:var(--bad); }
.balrow .amt.zero{ color:var(--ink-3); }
.balrow .cap{ margin-top:1px; font-size:11.5px; color:var(--ink-3); }
.nw{ white-space:nowrap; }

/* ---- Who owes whom: one plain sentence per payment ---------------------- */
.howbtn{ display:flex; align-items:center; gap:6px; margin:2px var(--s4) 14px; }
.howbtn .ms{ font-size:17px; }
.simp-combine{ display:flex; align-items:center; justify-content:center; gap:6px;
  margin:2px 0 14px; color:var(--ink-3); font-size:13px; font-weight:600; }
.simp-combine .ms{ font-size:18px; color:var(--apricot-dk); }
.owelist{ padding:4px 0; overflow:hidden; }
.owe-row{ position:relative; display:flex; align-items:center; gap:12px; padding:13px var(--s4); }
.owe-row + .owe-row::before{ content:""; position:absolute; top:0; left:var(--s4); right:var(--s4);
  height:1px; background:var(--line-2); }
.owe-row.mine{ background:color-mix(in srgb, var(--apricot) 11%, transparent); }
.owe-pair{ flex:0 0 auto; display:flex; align-items:center; gap:2px; }
.owe-pair > .ms{ font-size:15px; color:var(--ink-3); }
.owe-b{ flex:1; min-width:0; }
.owe-t{ display:block; font-size:14.5px; line-height:1.3; color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.owe-t b{ font-weight:700; color:var(--ink); }
.owe-m{ display:block; margin-top:2px; font-size:12px; color:var(--ink-3); }
.owe-r{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.owe-amt{ font-size:15.5px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.owe-amt.neg{ color:var(--bad); } .owe-amt.pos{ color:var(--good); } .owe-amt.zero{ color:var(--ink); }
.owe-btn{ border:0; border-radius:999px; padding:5px 13px; font:inherit; font-size:12px; font-weight:600;
  cursor:pointer; background:var(--ink); color:var(--cream); -webkit-tap-highlight-color:transparent; }
.owe-btn.soft{ background:var(--fill-1); color:var(--ink); }
.owe-btn:disabled{ opacity:.6; cursor:default; }
.owe-btn:focus:not(:focus-visible){ outline:none; }

/* ---- Today card: a breathing glow, and light across it on each new card ----
   The glow matches the + in the bar, so the two read as one family. It pauses
   while a hand is on the card, and stands still for reduced motion. */
.hero.carousel{ --hc-glow: rgba(233,150,92,.55);
  animation:hcBreathe 3.6s ease-in-out infinite; }
.hero.carousel.mood-get{  --hc-glow: rgba(72,164,118,.45); }
.hero.carousel.mood-done{ --hc-glow: rgba(238,181,134,.60); }
@keyframes hcBreathe{
  0%,100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 22px 44px -26px var(--hero-glow), 0 0 0 0 transparent; }
  50%    { box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 22px 44px -26px var(--hero-glow), 0 0 32px 5px var(--hc-glow); }
}
.hero.carousel.held{ animation-play-state:paused; }
.hc-sheen{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; border-radius:inherit; }
.hc-sheen::before{ content:""; position:absolute; top:-20%; bottom:-20%; left:0; width:45%;
  background:linear-gradient(100deg, rgba(255,255,255,0) 15%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 85%);
  transform:translateX(-120%) skewX(-14deg); opacity:0; }
.hc-sheen.go::before{ animation:hcSweep 1.4s cubic-bezier(.4,0,.2,1) .2s 1 both; }
@keyframes hcSweep{
  0%  { transform:translateX(-120%) skewX(-14deg); opacity:0; }
  15% { opacity:1; }
  85% { opacity:1; }
  100%{ transform:translateX(330%) skewX(-14deg); opacity:0; }
}
:root[data-theme="purple"] .hero.carousel{ --hc-glow: rgba(160,120,240,.58); }
:root[data-theme="purple"] .hero.carousel.mood-get{ --hc-glow: rgba(96,190,160,.45); }
@media (prefers-reduced-motion: reduce){
  .hero.carousel{ animation:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 22px 44px -26px var(--hero-glow), 0 0 26px 3px var(--hc-glow); }
  .hc-sheen{ display:none; }
}
.hc-track{ position:relative; display:flex; touch-action:pan-y;
  -webkit-user-select:none; user-select:none;
  transition:transform .6s cubic-bezier(.22,.61,.36,1); }
.hc-slide{ flex:0 0 100%; min-width:0; opacity:.2; transition:opacity .6s ease; }
.hc-slide.on{ opacity:1; }

.hc-top{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); }
.hc-av{ flex:0 0 auto; width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.64); color:var(--hero-ink);
  font-size:13px; font-weight:700; letter-spacing:.03em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), 0 4px 10px -6px rgba(0,0,0,.35); }
.hc-av .ms{ font-size:20px; }
.hc-chip{ display:inline-flex; align-items:center; gap:7px; min-width:0; max-width:72%;
  padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.5);
  color:var(--hero-soft); font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hc-chip i{ flex:0 0 auto; width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.7; }

.hero p.hc-line{ margin:var(--s4) 0 0; max-width:none; font-size:15px; color:var(--hero-soft); }
.hc-line b{ color:var(--hero-ink); font-weight:700; }
.hero h2.hc-amt{ margin:2px 0 0; max-width:none; font-family:var(--serif); font-weight:600;
  font-size:clamp(42px,12vw,56px); line-height:1; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums; }
.hc-slide.owe .hc-amt{ color:var(--hero-owe); }
.hc-slide.get .hc-amt{ color:var(--hero-get); }
.hc-slide.done .hero, .hc-slide.done .hc-amt{ margin-top:var(--s4); font-size:clamp(26px,7.4vw,34px);
  line-height:1.1; color:var(--hero-ink); }
.hero p.hc-for{ margin:6px 0 0; max-width:none; font-size:13.5px; color:var(--hero-soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.hero .act{ margin-top:var(--s4); }
.hc-btn{ display:inline-flex; align-items:center; gap:8px; padding:11px 18px 11px 14px;
  box-shadow:0 10px 20px -12px rgba(0,0,0,.6); }
.hc-btn .ms{ font-size:18px; }
.hc-btn:disabled{ opacity:1; cursor:default; background:rgba(255,255,255,.58);
  color:var(--hero-get); box-shadow:none; }

.hc-foot{ position:relative; display:flex; align-items:center; justify-content:space-between;
  gap:var(--s4); margin-top:var(--s5); padding-top:var(--s3); border-top:1px solid var(--hero-line); }
/* Overall balance: a soft pill on one line - label, then the signed figure. */
.hero .hc-foot .net{ display:inline-flex; align-items:baseline; gap:8px; margin-left:auto;
  padding:6px 13px 6px 12px; border-radius:999px; background:rgba(255,255,255,.5);
  text-align:left; font-size:13px; letter-spacing:0; white-space:nowrap; }
.hero .hc-foot .net small{ display:inline; margin:0; font-size:12.5px; font-weight:500;
  letter-spacing:0; text-transform:none; color:var(--hero-soft); }
.hero .hc-foot .net b{ font-size:15px; font-weight:700; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums; color:var(--hero-ink); }
.hero .hc-foot .net.pos b{ color:var(--hero-get); }
.hero .hc-foot .net.neg b{ color:var(--hero-owe); }

/* Slim bars rather than dots. The tappable area is taller than the bar. */
.hc-segs{ display:flex; align-items:center; gap:6px; min-height:24px; }
.hc-seg{ position:relative; box-sizing:content-box; width:16px; height:4px; padding:10px 0;
  border:0; background:transparent; cursor:pointer; transition:width .35s ease; }
.hc-seg i{ position:absolute; left:0; right:0; top:10px; height:4px; border-radius:999px;
  background:var(--hero-track); overflow:hidden; }
.hc-seg i::after{ content:""; position:absolute; top:0; bottom:0; left:0; width:0;
  border-radius:inherit; background:var(--hero-ink); }
.hc-seg[aria-current="true"]{ width:36px; }
.hc-seg[aria-current="true"] i::after{ width:100%; }
.hc-seg.run i::after{ width:0; animation:hcfill 5s linear forwards; }
.hero.held .hc-seg.run i::after{ animation-play-state:paused; }
@keyframes hcfill{ from{ width:0; } to{ width:100%; } }

@media (min-width:1000px){
  .hero.carousel{ padding:var(--s6) var(--s6) var(--s5); }
  .hero.carousel h2.hc-amt{ font-size:64px; }
  .hero.carousel .hc-foot .net b{ font-size:16px; }
}
@media (prefers-reduced-motion: reduce){ .hc-track, .hc-slide, .hc-seg{ transition:none; } }


/* ---- Expenses: by month, then by day ----------------------------------- */
/* The month is a quiet divider - a small label, a hairline and its total - not
   a second heading competing with the page title above it. */
.act-month{ display:flex; align-items:center; gap:var(--s3); margin:var(--s6) 4px 0; }
.ltitle + .act-month{ margin-top:var(--s4); }
.act-month h2{ order:0; flex:0 0 auto; margin:0; text-align:left; font-family:var(--f);
  font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); }
.act-month::after{ content:""; order:1; flex:1; height:1px; background:var(--line); }
.act-mtotal{ order:2; font-size:12px; font-weight:600; color:var(--ink-3); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
/* A day is named plainly, in ordinary case, with its figure beside it. */
.act-day{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
  margin:var(--s4) 6px var(--s2); font-size:13.5px; font-weight:600; color:var(--ink); }
.act-dtotal{ font-size:12.5px; font-weight:500; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.act-card{ padding:4px 0; }
.act-row{ position:relative; display:flex; align-items:center; gap:var(--s3); width:100%;
  padding:13px var(--s4); border:0; background:transparent; color:inherit; font:inherit;
  text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:background .15s ease; }
.act-row + .act-row::before{ content:""; position:absolute; top:0; left:66px; right:var(--s4);
  height:1px; background:var(--line-2); }
.act-row:active{ background:var(--fill-1); }
@media (hover:hover){ .act-row:hover{ background:var(--fill-1); } }
.act-row:focus:not(:focus-visible){ outline:none; }
.act-ic{ flex:0 0 auto; width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--gc-lt, var(--apricot-lt)); color:var(--gc, var(--apricot-dk)); }
.act-ic .ms{ font-size:20px; }
.act-row.pay .act-ic{ border-radius:50%; background:rgba(44,106,79,.12); color:var(--good); }
.act-b{ flex:1; min-width:0; display:flex; flex-direction:column; }
.act-t{ font-size:15px; font-weight:600; letter-spacing:-.01em; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.act-m{ margin-top:3px; font-size:12.5px; color:var(--ink-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.act-r{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; text-align:right; }
.act-amt{ font-size:15px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.act-amt.pos{ color:var(--good); } .act-amt.neg{ color:var(--bad); } .act-amt.zero{ color:var(--ink); }
.act-cap{ margin-top:2px; font-size:11.5px; color:var(--ink-3); white-space:nowrap; }
.act-more{ margin:var(--s4) 0 0; text-align:center; font-size:12.5px; color:var(--ink-3); }


/* ---- Delete group: say what goes, then make them type the name ---------- */
.delwarn{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; margin:0 0 14px;
  border-radius:14px; background:color-mix(in srgb, var(--bad) 9%, transparent);
  color:var(--ink); }
.delwarn .ms{ flex:0 0 auto; color:var(--bad); font-size:22px; }
.delwarn p{ margin:0; font-size:14.5px; line-height:1.45; }
.dellist{ margin:0 0 18px; padding:0 0 0 20px; font-size:13.5px; line-height:1.7; color:var(--ink-2); }
.btn.d:disabled{ opacity:.4; cursor:not-allowed; }

/* ---- desktop --------------------------------------------------------- */
@media (min-width:1000px){
  body{ background:var(--cream); }
  .side{
    display:flex; flex-direction:column; gap:2px; position:fixed; inset:0 auto 0 0;
    width:244px; padding:var(--s5) var(--s4); overflow:auto;
    background:var(--ink); color:rgba(252,250,245,.70);
  }
  .side .brand{ color:var(--cream); padding:0 10px var(--s5); }
  .side .brand i{ color:var(--apricot); }
  .side .grp{ font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:rgba(252,250,245,.34); padding:var(--s4) 10px var(--s2); }
  .side button{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:transparent; border:0; color:inherit; font-size:14px; font-weight:500;
    padding:10px 11px; border-radius:var(--r1); cursor:pointer;
  }
  .side button .ms{ font-size:20px; }
  .side button:hover{ background:rgba(255,255,255,.07); color:var(--cream); }
  .side button[aria-current="page"]{ background:var(--apricot); color:#3A2414; font-weight:600; }
  .side .foot{ margin-top:auto; border-top:1px solid rgba(255,255,255,.10); padding-top:var(--s3); }

  .shell{ margin-left:244px; min-height:100vh; }
  .panel{ background:transparent; padding:var(--s6) var(--s7) 64px; }
  .wrap{ max-width:980px; margin:0 auto; padding:0; }
  .bar, .nav{ display:none; }

  .sums{ grid-template-columns:repeat(3,1fr); }
  .cols2{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:var(--s5); align-items:start; }
  .hero{ padding:var(--s6); }
  .hero h2{ font-size:30px; max-width:16ch; }
  .hero .net{ font-size:30px; }
}
@media (max-width:999px){
  .shell{ margin:0; padding:0; }
  .panel{ background:transparent; padding:0; }
  /* One column exactly as wide as the phone. Left to size itself, a grid
     column grows to fit its longest unbroken line - "Saturday, September 12
     · Montreal & Quebec" - and pushed Today 29px wider than the screen, which
     is what let the page slide sideways and zoom. */
  .cols2{ display:grid; grid-template-columns:minmax(0,1fr); gap:0; }
}






/* ============================================================
   APRICOT THEME: Maple the bear, and honey on the Today card
   Maple peeks over the top edge like Bora does in Purple - awake by day,
   asleep by night. Inside the card, a coat of honey drips from the top
   under a soft shine. Only the Apricot theme shows any of it.
   ============================================================ */
.bear-deco, .hc-honey{ display:none; }
:root:not([data-theme="purple"]) .hero-wrap{ padding-top:96px; }
:root:not([data-theme="purple"]) .bear-deco{ display:block; position:absolute; inset:0; pointer-events:none; --ct:calc(96px + var(--s4)); }
:root:not([data-theme="purple"]) .bear-deco.back{ z-index:0; }
:root:not([data-theme="purple"]) .bear-deco.front{ z-index:2; }
.bear-deco svg, .bear-deco .mp-ffly{ position:absolute; overflow:visible; }
.mp-o{ stroke:#3A2A1E; stroke-width:2.6; stroke-linejoin:round; stroke-linecap:round; }
.mp-rim{ stroke:#FFFFFF; stroke-width:8; stroke-linejoin:round; paint-order:stroke; }
.mp-thin{ stroke-width:1.8; }

.mp-head{ left:50%; top:calc(var(--ct) - 106px); width:164px; height:124px; margin-left:-60px; }
.mp-paws{ left:50%; top:calc(var(--ct) - 18px); width:164px; height:36px; margin-left:-60px; }
.mp-paws.night{ top:calc(var(--ct) - 10px); }
.mp-jar{ left:22px; top:calc(var(--ct) - 50px); width:62px; height:58px; }
/* a little paw holding the card's bottom-left corner */
.mp-cornerpaw{ left:-9px; bottom:-11px; width:38px; height:34px; transform:rotate(-28deg); }
.mp-pat{ transform-box:fill-box; transform-origin:50% 100%; animation:mpPat 6s ease-in-out infinite; }
.mp-cornerpaw.night .mp-pat{ animation:none; }
@keyframes mpPat{ 0%, 76%, 100%{ transform:translate(0,0) rotate(0); } 81%{ transform:translate(2px,-5px) rotate(-8deg); }
  86%{ transform:translate(0,0) rotate(0); } 91%{ transform:translate(2px,-4px) rotate(-6deg); } 96%{ transform:translate(0,0) rotate(0); } }
.mp-sun{ right:20px; top:calc(var(--ct) - 86px); width:58px; height:58px; }
.mp-moon{ right:20px; top:calc(var(--ct) - 90px); width:58px; height:58px; animation:mpGlow 4s ease-in-out infinite; }
.mp-leaf{ right:40px; top:calc(var(--ct) - 112px); width:22px; height:22px; animation:mpFall 9s linear infinite; }
.mp-bee{ left:calc(50% - 96px); top:calc(var(--ct) - 70px); width:22px; height:18px; animation:mpBee1 6s ease-in-out infinite; }
.mp-bee.b2{ left:calc(50% - 20px); top:calc(var(--ct) - 80px); animation:mpBee2 7s ease-in-out infinite; }
.mp-star{ width:14px; height:14px; animation:mpTwinkle 2.6s ease-in-out infinite; }
.mp-star path{ fill:#FFE39A; stroke:#fff; stroke-width:2; paint-order:stroke; }
.mp-ffly{ left:calc(50% - 74px); top:calc(var(--ct) - 64px); width:8px; height:8px; border-radius:50%;
  background:#FFE680; box-shadow:0 0 8px 3px rgba(255,220,90,.85); animation:mpFfly 7s ease-in-out infinite; }

/* by day */
.mp-tilt{ transform-box:view-box; transform-origin:82px 120px; animation:mpTilt 6s ease-in-out infinite; }
@keyframes mpTilt{ 0%, 100%{ transform:rotate(-4deg); } 25%{ transform:rotate(2deg); } 50%{ transform:rotate(5deg); } 75%{ transform:rotate(-1deg); } }
.mp-look{ animation:mpLook 6s ease-in-out infinite; }
@keyframes mpLook{ 0%, 100%{ transform:translate(-3px, 1px); } 25%{ transform:translate(-1px, -2px); } 50%{ transform:translate(3px, 0); } 75%{ transform:translate(0, -2px); } }
.mp-eyes{ transform-box:fill-box; transform-origin:center; animation:mpBlink 5s infinite; }
@keyframes mpBlink{ 0%, 42%, 46%, 100%{ transform:scaleY(1); } 44%{ transform:scaleY(.1); } }
.mp-ear{ transform-box:fill-box; transform-origin:50% 100%; animation:mpEar 7s ease-in-out infinite; }
.mp-ear.r{ animation-delay:3.4s; }
@keyframes mpEar{ 0%, 86%, 100%{ transform:rotate(0); } 90%{ transform:rotate(-14deg); } 94%{ transform:rotate(8deg); } }
.mp-tongue{ transform-box:fill-box; transform-origin:50% 0; animation:mpLick 8s ease-in-out infinite; }
@keyframes mpLick{ 0%, 70%, 86%, 100%{ transform:scale(0); } 74%, 82%{ transform:scale(1) translateX(3px); } 78%{ transform:scale(1) translateX(-3px); } }
.mp-wave{ transform-box:fill-box; transform-origin:50% 100%; animation:mpWave 9s ease-in-out infinite; }
@keyframes mpWave{ 0%, 30%, 100%{ transform:translateY(0) rotate(0); } 34%{ transform:translateY(-14px) rotate(-12deg); }
  38%{ transform:translateY(-14px) rotate(12deg); } 42%{ transform:translateY(-14px) rotate(-12deg); } 46%{ transform:translateY(0) rotate(0); } }
.mp-drip{ transform-box:fill-box; transform-origin:50% 0; animation:mpDrip 3.2s ease-in infinite; }
@keyframes mpDrip{ 0%{ transform:scaleY(.2); } 70%, 100%{ transform:scaleY(1); } }
.mp-drop{ opacity:0; animation:mpDrop 3.2s ease-in infinite; }
@keyframes mpDrop{ 0%, 70%{ opacity:0; transform:translateY(0); } 72%{ opacity:1; } 100%{ opacity:0; transform:translateY(14px); } }
.mp-wing{ transform-box:fill-box; transform-origin:50% 100%; animation:mpBuzz .12s linear infinite alternate; }
@keyframes mpBuzz{ to{ transform:scaleY(.3); } }
@keyframes mpBee1{ 0%, 100%{ transform:translate(-40px, 6px); } 25%{ transform:translate(10px, -40px) rotate(10deg); } 50%{ transform:translate(70px, -30px); } 75%{ transform:translate(14px, -48px) rotate(-10deg); } }
@keyframes mpBee2{ 0%, 100%{ transform:translate(0, 0) scaleX(-1); } 30%{ transform:translate(40px, 16px) scaleX(-1); } 60%{ transform:translate(70px, -12px) scaleX(1); } 80%{ transform:translate(20px, -20px) scaleX(1); } }
@keyframes mpFall{ 0%{ transform:translate(0, 0) rotate(0); opacity:0; } 10%{ opacity:1; } 50%{ transform:translate(-26px, 50px) rotate(160deg); } 90%{ opacity:1; } 100%{ transform:translate(6px, 104px) rotate(320deg); opacity:0; } }
.mp-rays{ transform-box:fill-box; transform-origin:center; animation:mpSpin 26s linear infinite; }
@keyframes mpSpin{ to{ transform:rotate(360deg); } }

/* by night */
.mp-tilt.mp-sleeping{ animation:mpSleep 4.6s ease-in-out infinite; }
@keyframes mpSleep{ 0%, 100%{ transform:translateY(8px) rotate(9deg) scale(1); } 50%{ transform:translateY(8px) rotate(9deg) scale(1.035); } }
.mp-sleeping .mp-ear.l{ animation-duration:10s; }
.mp-sleeping .mp-ear.r{ animation:none; }
.mp-snore{ transform-box:view-box; transform-origin:96px 84px; animation:mpSnore 4.6s ease-in-out infinite; }
@keyframes mpSnore{ 0%{ opacity:.9; transform:scale(.2); } 46%{ opacity:.9; transform:scale(1); } 50%{ opacity:0; transform:scale(1.25); } 51%, 100%{ opacity:0; transform:scale(.2); } }
.mp-zz text{ font:700 16px/1 var(--f); fill:#6B6FA8; stroke:#fff; stroke-width:4; paint-order:stroke; opacity:0; animation:mpZ 4s ease-out infinite; }
.mp-zz text:nth-child(2){ animation-delay:1.4s; font-size:20px; }
.mp-zz text:nth-child(3){ animation-delay:2.8s; font-size:24px; }
@keyframes mpZ{ 0%{ opacity:0; transform:translate(0,0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(18px,-44px); } }
@keyframes mpGlow{ 0%, 100%{ filter:drop-shadow(0 0 6px rgba(255,220,140,.55)); } 50%{ filter:drop-shadow(0 0 16px rgba(255,220,140,.95)); } }
@keyframes mpTwinkle{ 50%{ transform:scale(.45) rotate(30deg); opacity:.55; } }
@keyframes mpFfly{ 0%{ transform:translate(0,0); opacity:.2; } 25%{ opacity:1; } 50%{ transform:translate(24px,-16px); opacity:.35; } 75%{ opacity:1; } 100%{ transform:translate(0,0); opacity:.2; } }

/* inside the card: honey and shine, beneath everything the card says */
:root:not([data-theme="purple"]) .hc-honey{ display:block; position:absolute; inset:0; z-index:0; pointer-events:none;
  overflow:hidden; border-radius:inherit; }
.hc-honey::after{ content:""; position:absolute; inset:0; border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.38), inset 0 -22px 34px -24px rgba(120,60,10,.28); }
.hh-gloss{ position:absolute; inset:0; overflow:hidden;
  background:radial-gradient(120% 70% at 0% 0%, rgba(255,255,255,.44), rgba(255,255,255,0) 55%),
             linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 42%); }
.hh-gloss::after{ content:""; position:absolute; top:-30%; bottom:-30%; left:0; width:36%;
  background:linear-gradient(100deg, rgba(255,255,255,0) 20%, rgba(255,255,255,.38) 50%, rgba(255,255,255,0) 80%);
  transform:translateX(-160%) skewX(-16deg); animation:hhShimmer 7s ease-in-out 2s infinite; }
@keyframes hhShimmer{ 0%{ transform:translateX(-160%) skewX(-16deg); } 32%, 100%{ transform:translateX(380%) skewX(-16deg); } }
.hh-coat{ position:absolute; left:0; top:0; width:100%; height:24px; }
.hh-coat path{ fill:#EDA23A; }
.hh-coat path.hl{ fill:none; stroke:rgba(255,242,205,.8); stroke-width:2; stroke-linecap:round; }
.hh-drip{ position:absolute; top:8px; width:11px; border-radius:0 0 6px 6px; transform-origin:50% 0;
  background:linear-gradient(90deg, #E08E24, #F6B84E 45%, #E99B30);
  box-shadow:inset 2px 0 0 rgba(255,244,210,.65); animation:hhDrip 5s ease-in-out infinite; }
.hh-drip::after{ content:""; position:absolute; left:-2px; right:-2px; bottom:-5px; height:13px; border-radius:50%;
  background:#EEA43A; box-shadow:inset 2px -1px 0 rgba(255,244,210,.6); }
.hh-drip.d1{ left:38%; height:16px; animation-delay:.6s; }
.hh-drip.d2{ left:57%; height:26px; animation-delay:1.8s; }
.hh-drip.d3{ left:76%; height:12px; animation-delay:1.1s; }
.hh-drip.d4{ right:18px; height:44px; }
@keyframes hhDrip{ 0%, 100%{ transform:scaleY(.82); } 50%{ transform:scaleY(1.12); } }
.hh-drop{ position:absolute; right:19px; top:62px; width:9px; height:12px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:#EDA23A; box-shadow:inset 2px -1px 0 rgba(255,244,210,.6); opacity:0; animation:hhFall 5s ease-in infinite; }
@keyframes hhFall{ 0%, 55%{ opacity:0; transform:translateY(-10px) scale(.6); } 60%{ opacity:1; transform:translateY(0) scale(1); }
  100%{ opacity:0; transform:translateY(120px) scale(.9); } }
.hh-glint{ position:absolute; width:12px; height:12px; opacity:0; animation:hhGlint 4.5s ease-in-out infinite; }
.hh-glint path{ fill:#fff; }
.hh-glint.g1{ left:20%; top:34%; }
.hh-glint.g2{ left:66%; top:54%; width:9px; height:9px; animation-delay:1.5s; }
.hh-glint.g3{ right:12%; bottom:24%; animation-delay:3s; }
@keyframes hhGlint{ 0%, 100%{ opacity:0; transform:scale(.3) rotate(0); } 50%{ opacity:.9; transform:scale(1) rotate(45deg); } }

@media (prefers-reduced-motion:reduce){
  .bear-deco *, .hc-honey, .hc-honey *, .hh-gloss::after{ animation:none !important; }
  .mp-tongue, .mp-snore, .mp-zz, .mp-drop, .hh-drop, .hh-glint{ display:none; }
}

/* ============================================================
   THE TOP BAR - a floating island
   Clear at the top of a screen; once the page moves under it, it becomes
   a frosted island with a thin line of the theme's accent beneath. Where
   you are sits on the left with room of its own, so a long group name
   shortens with "…" instead of disappearing under a button. Everything
   about the app - connection, refresh, the group menu - shares one
   capsule on the right, beside your picture. On a computer it is always an
   island, above the page, with the screen's name large and a label above.
   Every colour comes from the theme, so Warm and Purple each get their own.
   ============================================================ */
.bar, .bar.scrolled{ display:block; min-height:0; padding:calc(6px + var(--safe-t)) 10px 6px;
  background:transparent; box-shadow:none; border:0; backdrop-filter:none; -webkit-backdrop-filter:none;
  pointer-events:none; }
.bar [hidden]{ display:none !important; }
.bar-in{ pointer-events:auto; position:relative; display:flex; align-items:center; gap:10px;
  max-width:620px; margin:0 auto; min-height:52px; padding:6px 6px 6px 8px; border-radius:24px;
  border:1px solid transparent; background:transparent;
  transition:background .3s ease, border-color .3s ease, box-shadow .3s ease; }
.bar.scrolled .bar-in{
  background:color-mix(in srgb, var(--cream) 80%, transparent);
  -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%);
  border-color:color-mix(in srgb, var(--line) 85%, transparent);
  box-shadow:0 14px 34px -18px rgba(30,32,28,.38), inset 0 1px 0 rgba(255,255,255,.75); }
/* the accent under the island: grows out from the middle as it lifts */
.bar-in::after{ content:""; position:absolute; left:26px; right:26px; bottom:-1px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--apricot) 28%, var(--apricot-dk) 50%, var(--apricot) 72%, transparent);
  opacity:0; transform:scaleX(.3); pointer-events:none;
  transition:opacity .35s ease, transform .5s cubic-bezier(.22,.61,.36,1); }
.bar.scrolled .bar-in::after{ opacity:.6; transform:scaleX(1); }

.bar-lead{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px; }
.bar .brandwrap{ padding-left:4px; }
.bar-titles{ min-width:0; display:flex; flex-direction:column; justify-content:center; gap:1px; }
.bar-eyebrow{ display:none; font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--apricot-dk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar h1{ position:static; left:auto; transform:translateY(4px); max-width:100%; margin:0; text-align:left;
  font-family:var(--serif); font-size:18px; font-weight:600; letter-spacing:-.01em; line-height:1.2; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transition:opacity .25s ease, transform .3s ease; }
.bar.scrolled h1{ opacity:1; transform:none; }
.bar.is-home h1{ display:none; }

.bar .bar-back{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; padding:0; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  box-shadow:0 6px 14px -9px rgba(30,32,28,.45); -webkit-tap-highlight-color:transparent;
  transition:background .2s, transform .15s ease, box-shadow .25s; }
.bar .bar-back .ms{ font-size:21px; transition:transform .2s ease; }
.bar .bar-back:hover{ background:var(--apricot-lt); }
.bar .bar-back:hover .ms, .bar .bar-back:active .ms{ transform:translateX(-2px); }
.bar .bar-back:active{ transform:scale(.92); }
.bar.scrolled .bar-back{ box-shadow:none; }

.bar-tools{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
.bar-cap{ display:flex; align-items:center; gap:1px; height:38px; padding:0 3px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line); box-shadow:0 8px 18px -12px rgba(30,32,28,.4); }
.bar.scrolled .bar-cap{ background:color-mix(in srgb, var(--surface) 72%, transparent); box-shadow:none; }
.bar-cap .netlight, .bar.scrolled .bar-cap .netlight{ height:30px; border:0; background:transparent;
  padding:0 10px 0 9px; border-radius:999px; }
.bar-cap .netlight:hover{ background:var(--fill-1); }
.bar-cap .netlight[data-state="off"], .bar.scrolled .bar-cap .netlight[data-state="off"]{
  background:color-mix(in srgb, #E0443E 11%, transparent); }
.bar-sep{ flex:none; width:1px; height:18px; margin:0 2px; background:var(--line); }
.bar-cap .netlight[hidden] + .bar-sep{ display:none; }
.cap-btn{ flex:none; width:32px; height:32px; padding:0; border:0; border-radius:50%; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--ink-2);
  -webkit-tap-highlight-color:transparent; transition:background .2s, color .2s, transform .15s ease; }
.cap-btn .ms{ font-size:20px; }
.cap-btn:hover{ background:var(--fill-1); color:var(--ink); }
.cap-btn:active{ transform:scale(.9); }
.cap-btn:focus:not(:focus-visible), .bar .bar-back:focus:not(:focus-visible), .bar .me:focus:not(:focus-visible){ outline:none; }
.cap-btn:focus-visible, .bar .bar-back:focus-visible, .bar .me:focus-visible{ outline:2px solid var(--apricot-dk); outline-offset:2px; }
/* inside a group the name needs the room: the light alone says it */
.bar.in-group .bar-cap .netlight{ width:30px; padding:0; justify-content:center; }
.bar.in-group .bar-cap .net-l{ display:none; }

/* your picture, ringed in the theme's accent */
.bar .me{ flex:0 0 auto; width:38px; height:38px;
  box-shadow:0 0 0 2px var(--cream), 0 0 0 3.5px color-mix(in srgb, var(--apricot) 85%, transparent);
  transition:transform .2s ease, box-shadow .3s ease; }
.bar .me:hover{ transform:translateY(-1px);
  box-shadow:0 0 0 2px var(--cream), 0 0 0 3.5px var(--apricot-dk); }
.bar .me:active{ transform:scale(.94); }

@media (max-width:370px){
  .bar-in{ gap:6px; padding-left:6px; }
  .bar .brand{ font-size:20px; }
  .bar .byline{ display:none; }
}

/* Sheets: the title and the close button always where they can be seen */
.sheet .shead{ padding:8px 12px 12px; }
.sheet #sheetClose{ width:36px; height:36px; border:0; border-radius:50%; background:var(--ink); color:var(--cream);
  box-shadow:0 6px 14px -8px rgba(0,0,0,.45); cursor:pointer; transition:background .2s, transform .15s ease; }
.sheet #sheetClose .ms{ font-size:20px; }
.sheet #sheetClose:hover{ background:var(--apricot-dk); }
.sheet #sheetClose:active{ transform:scale(.9); }
@media (max-width:619px){
  /* --vvh is the part of the screen actually visible - less the keyboard */
  .sheet{ max-height:min(93vh, calc(var(--vvh, 100vh) - var(--safe-t) - 12px)); transition:bottom .2s ease; }
}

/* ---- on a computer: always an island, above the page ---- */
@media (min-width:1000px){
  .bar, .bar.scrolled{ display:block; position:sticky; top:0; z-index:30; max-width:980px;

/* ============================================================
   THEMES

   A theme is a palette and nothing else. Every colour in the app
   comes from the tokens below, so a theme can only change how it
   looks - never what anything says, where anything sits, or what
   a colour means. Green is still money coming to you and red is
   still money going out, in every one of them.

   The default palette lives on :root above. Anything here only
   overrides tokens.
   ============================================================ */

/* Purple - for the ARMY. Borahae. */
:root[data-theme="purple"]{
  --cream:#F8F5FD;
  --surface:#FFFFFF;
  --ink:#2A1F3D;
  --ink-2:#6B6080;
  --ink-3:#A29CB5;
  --line:#E9E2F5;
  --line-2:#F2EDFA;

  /* the accent, in the three weights every surface needs */
  --apricot:#C4AEEF;          /* the feature panel */
  --apricot-dk:#6D3FBF;       /* links, icons, anything that must read as text */
  --apricot-lt:#EDE4FB;       /* tints behind icons and input surfaces */

  --good:#2E7D62;
  --bad:#C24A6A;

  --shadow:0 1px 2px rgba(42,31,61,.05), 0 6px 18px rgba(42,31,61,.07);
  --green-lt:rgba(46,125,98,.12);
  --fill-1:rgba(107,96,128,.06);
  --fill-2:rgba(107,96,128,.10);
  --fill-3:rgba(107,96,128,.16);
}
/* The panel is a light purple, so its text stays the deep plum rather than
   the near-black the warm theme uses on apricot. */
:root[data-theme="purple"] .hero{ color:#2A1F3D; }
:root[data-theme="purple"] .hero p{ color:#584A72; }
:root[data-theme="purple"] .hero .net small{ color:#584A72; }
:root[data-theme="purple"] .hero::after{ border-color:rgba(42,31,61,.20); }
:root[data-theme="purple"] .hero::before{ border-color:rgba(42,31,61,.13); }
:root[data-theme="purple"] .nav .add{ color:#2A1F3D;
  --glow: rgba(186,146,255,.70); --glow-soft: rgba(186,146,255,.24); }
:root[data-theme="purple"] .side button[aria-current="page"]{ color:#2A1F3D; }
:root[data-theme="purple"] .me{ background:var(--apricot-lt); color:var(--apricot-dk); }
:root[data-theme="purple"] .summary .split .v.pos{ color:#7FD0B0; }
:root[data-theme="purple"] .summary .split .v.neg{ color:#F0A0B6; }
:root[data-theme="purple"] .sync{ background:var(--apricot-lt); color:#4A317F; }
:root[data-theme="purple"] .notice.warn{ background:rgba(196,174,239,.28); color:#4A317F;
  border-color:rgba(109,63,191,.26); }
:root[data-theme="purple"] .tag.warn, :root[data-theme="purple"] .tag.admin{
  background:rgba(196,174,239,.44); color:#4A317F; }
:root[data-theme="purple"] .card.addform{ border-color:rgba(109,63,191,.20); }
:root[data-theme="purple"] .card.addform .field label{ color:#584A72; }
:root[data-theme="purple"] .card.addform h3,
:root[data-theme="purple"] .card.addform .t1{ color:#2A1F3D; }
:root[data-theme="purple"] .card.addform .lead,
:root[data-theme="purple"] .card.addform .sub{ color:#584A72; }

/* ---- the chooser ----------------------------------------------------- */
.themes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:var(--s3); padding:var(--s4); }
.theme{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s3); text-align:left; font:inherit; cursor:pointer; }
.theme[aria-pressed="true"]{ border-color:var(--apricot-dk);
  box-shadow:0 0 0 2px var(--apricot-lt); }
.theme .swatch{ display:flex; gap:5px; margin-bottom:var(--s2); }
.theme .swatch i{ width:22px; height:22px; border-radius:7px; display:block;
  border:1px solid rgba(0,0,0,.06); }
.theme .n{ font-size:14px; font-weight:600; color:var(--ink); }
.theme .m{ font-size:12px; color:var(--ink-3); margin-top:2px; }

/* An engraved motif, purple only. Drawn here rather than photographed: the
   seven of them are real people and their pictures are not ours to ship, so
   this says the same thing in line art - a heart, seven dots, two notes. It
   sits under the words at low opacity and never competes with them. */
:root[data-theme="purple"] .hero{
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20320%20240'%20fill='none'%20stroke='%232A1F3D'%20stroke-width='1.5'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%20%3Cg%20opacity='.30'%3E%20%3Cpath%20d='M196%2074c-9-13-31-9-31%207%200%2015%2018%2026%2031%2037%2013-11%2031-22%2031-37%200-16-22-20-31-7z'/%3E%20%3Cpath%20d='M188%2084c-3-5-11-3-11%203%200%205%206%209%2011%2013'%20opacity='.55'/%3E%20%3C/g%3E%20%3Cg%20opacity='.26'%3E%20%3Ccircle%20cx='142'%20cy='150'%20r='3.4'/%3E%3Ccircle%20cx='160'%20cy='143'%20r='3.4'/%3E%20%3Ccircle%20cx='179'%20cy='139'%20r='3.4'/%3E%3Ccircle%20cx='198'%20cy='138'%20r='3.4'/%3E%20%3Ccircle%20cx='217'%20cy='139'%20r='3.4'/%3E%3Ccircle%20cx='236'%20cy='143'%20r='3.4'/%3E%20%3Ccircle%20cx='254'%20cy='150'%20r='3.4'/%3E%20%3C/g%3E%20%3Cg%20opacity='.22'%3E%20%3Cpath%20d='M262%2056v34'/%3E%3Cpath%20d='M262%2056c9%202%2015%206%2017%2012'/%3E%20%3Cellipse%20cx='256'%20cy='92'%20rx='7'%20ry='5.4'%20transform='rotate(-18%20256%2092)'/%3E%20%3Cpath%20d='M292%2092v26'/%3E%3Cpath%20d='M292%2092c7%202%2012%205%2013%209'/%3E%20%3Cellipse%20cx='287'%20cy='120'%20rx='5.6'%20ry='4.4'%20transform='rotate(-18%20287%20120)'/%3E%20%3C/g%3E%20%3C/svg%3E"), linear-gradient(140deg, var(--hero-a) 0%, var(--apricot) 46%, var(--hero-b) 100%);
  background-repeat:no-repeat, no-repeat;
  background-position:right -18px top -10px, 0 0;
  background-size:250px auto, 100% 100%;
}
@media (max-width:560px){
  :root[data-theme="purple"] .hero{ background-size:176px auto, 100% 100%;
    background-position:right -26px top -6px, 0 0; }
}

/* ---- a colour for each group -----------------------------------------
   Cycled down the list, so two groups next to each other never share one.
   The colour marks a group's icon and a stripe down its left edge - never its
   amount, which keeps the green and red that mean money. No red-leaning hue in
   either set, for the same reason. Each theme brings its own six, so the
   colours sit with the palette around them rather than on top of it. */
.row.gc0, .row.gc1, .row.gc2, .row.gc3, .row.gc4, .row.gc5{
  box-shadow:inset 4px 0 0 var(--gc);
}
.row[class*=" gc"] .cat{ background:var(--gc-lt); color:var(--gc); }

.gc0{ --gc:#B4703E; --gc-lt:#F8E3CF; }   /* apricot */
.gc1{ --gc:#4F7A5C; --gc-lt:#DDEBDF; }   /* sage */
.gc2{ --gc:#4A6A8A; --gc-lt:#DCE6F0; }   /* dusty blue */
.gc3{ --gc:#3F7F7A; --gc-lt:#D8ECEA; }   /* teal */
.gc4{ --gc:#86691A; --gc-lt:#F2E6BF; }   /* mustard */
.gc5{ --gc:#7A5A86; --gc-lt:#E8DDEE; }   /* mauve */

:root[data-theme="purple"] .gc0{ --gc:#6D3FBF; --gc-lt:#EDE4FB; }   /* violet */
:root[data-theme="purple"] .gc1{ --gc:#A2457E; --gc-lt:#F6DDEC; }   /* orchid pink */
:root[data-theme="purple"] .gc2{ --gc:#4F5BB8; --gc-lt:#E0E3F8; }   /* periwinkle */
:root[data-theme="purple"] .gc3{ --gc:#2D7A7A; --gc-lt:#D9EFEE; }   /* teal */
:root[data-theme="purple"] .gc4{ --gc:#946A1E; --gc-lt:#F4E7C8; }   /* honey gold - grape sat too
                                                                   close to violet and lavender */
:root[data-theme="purple"] .gc5{ --gc:#6A5F8F; --gc-lt:#E6E2F1; }   /* lavender grey */

/* The Today panel in purple: a lilac gradient under the engraved motif. */
:root[data-theme="purple"]{
  --hero-a:#E4D7F9; --hero-b:#A98BE3; --hero-ink:#2A1F3D; --hero-soft:#584A72;
  --hero-owe:#9B2C55; --hero-get:#1D5F4F; --hero-line:rgba(42,31,61,.14);
  --hero-track:rgba(42,31,61,.18); --hero-glow:rgba(74,40,140,.55);
}


/* ---- the live activity feed: small, top right, one line each ---- */
.notif-stack{ position:fixed; top:calc(var(--safe-t) + 76px); right:var(--s3); z-index:60;
  display:flex; flex-direction:column; align-items:flex-end; gap:6px;
  max-width:min(272px, calc(100vw - 24px)); pointer-events:none; }
.notif-card{ pointer-events:auto; display:flex; align-items:center; gap:6px; max-width:100%;
  padding:6px 6px 6px 9px; border-radius:999px; background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line), 0 8px 20px -12px rgba(0,0,0,.35);
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  animation:notifIn .3s cubic-bezier(.22,.61,.36,1) backwards; }
@keyframes notifIn{ from{ opacity:0; transform:translateX(14px) scale(.96); } }
.notif-ic{ flex:none; width:20px; height:20px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; background:var(--apricot-lt); color:var(--apricot-dk); }
.notif-ic .ms{ font-size:13px; }
/* One colour per kind: blue new, amber edited, red removed, green paid,
   violet a group - so the stack reads at a glance without the words. */
.notif-card.k-add{ --nc:#2F6FE0; } .notif-card.k-edit{ --nc:#B4740A; } .notif-card.k-del{ --nc:#D3352E; }
.notif-card.k-pay{ --nc:#1E8F55; } .notif-card.k-group{ --nc:#7A4FD1; }
.notif-card[class*="k-"]{ box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--nc) 30%, var(--line)), 0 8px 20px -12px rgba(0,0,0,.35); }
.notif-card[class*="k-"] .notif-ic{ background:color-mix(in srgb, var(--nc) 16%, var(--surface)); color:var(--nc); }
.notif-t{ flex:1; min-width:0; font-size:11.5px; font-weight:600; line-height:1.25; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.notif-x{ flex:none; width:19px; height:19px; border:0; border-radius:50%;
  display:flex; align-items:center; justify-content:center; background:transparent; color:var(--ink-3); cursor:pointer;
  -webkit-tap-highlight-color:transparent; transition:background .15s, color .15s; }
.notif-x .ms{ font-size:13px; }
.notif-x:hover{ background:var(--fill-1); color:var(--ink); }
.notif-x:active{ transform:scale(.9); }
.notif-x:focus:not(:focus-visible){ outline:none; }
.notif-x:focus-visible{ outline:2px solid var(--apricot-dk); outline-offset:1px; }
@media (hover:hover){ .notif-card:hover{ box-shadow:inset 0 0 0 1px var(--line), 0 12px 24px -12px rgba(0,0,0,.4); } }
@media (max-width:460px){ .notif-stack{ top:calc(var(--safe-t) + 8px); right:var(--s3); } }
@media (prefers-reduced-motion:reduce){ .notif-card{ animation:none; } }
:root[data-theme="purple"] .notif-ic{ background:rgba(109,63,191,.14); color:#6D3FBF; }

/* ---- a message from the administrator: blocks the screen ---- */
.announce{ position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center; padding:22px; }
.announce-scrim{ position:absolute; inset:0; background:rgba(20,18,14,.62); backdrop-filter:blur(3px); animation:anIn .3s; }
.announce-hold{ position:relative; width:100%; max-width:400px; }
/* Two soft, slow-drifting glows behind the card - light, not showy. */
.announce-orb{ position:absolute; z-index:0; border-radius:50%; filter:blur(38px); opacity:.55; pointer-events:none; }
.announce-orb.o1{ width:220px; height:220px; left:-60px; top:-70px; background:radial-gradient(circle, var(--apricot), transparent 70%);
  animation:anDrift1 9s ease-in-out infinite; }
.announce-orb.o2{ width:180px; height:180px; right:-50px; bottom:-60px; background:radial-gradient(circle, var(--apricot-dk), transparent 70%);
  animation:anDrift2 11s ease-in-out infinite; }
@keyframes anDrift1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(14px,10px); } }
@keyframes anDrift2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-12px,-14px); } }
.announce-card{ position:relative; z-index:1; padding:32px 24px 24px; border-radius:26px; text-align:center; color:#FCFAF5;
  overflow:hidden; background:radial-gradient(120% 90% at 22% 0%, color-mix(in srgb, var(--apricot) 30%, transparent), transparent 56%),
             linear-gradient(160deg, #2F332D 0%, #1E211B 100%);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
  animation:anCardIn .45s cubic-bezier(.22,.61,.36,1); transition:transform .3s ease; }
.announce-card.sealed{ transform:scale(1.015); }

/* The icon: a pulsing ring behind it, a little starfield around it. */
.announce-icwrap{ position:relative; width:72px; height:72px; margin:0 auto 16px; }
.announce-ring{ position:absolute; inset:0; border-radius:50%; border:2px solid color-mix(in srgb, var(--apricot) 75%, transparent);
  animation:anRing 2.4s ease-out infinite; }
.announce-ring::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid color-mix(in srgb, var(--apricot) 75%, transparent);
  animation:anRing 2.4s ease-out infinite 1.2s; }
@keyframes anRing{ 0%{ transform:scale(.72); opacity:.8; } 100%{ transform:scale(1.28); opacity:0; } }
.announce-ic{ position:absolute; inset:10px; display:flex; align-items:center; justify-content:center; border-radius:50%;
  background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); animation:anPop .55s cubic-bezier(.34,1.6,.64,1) .1s backwards; }
.announce-ic .ms{ font-size:26px; }
.announce-card.sealed .announce-ic{ background:color-mix(in srgb, var(--apricot) 42%, transparent); }
@keyframes anPop{ from{ transform:scale(.4); opacity:0; } }
.an-spark{ position:absolute; width:3px; height:3px; border-radius:50%; background:var(--apricot); opacity:0;
  animation:anTwinkle 2.6s ease-in-out infinite; }
@keyframes anTwinkle{ 0%,100%{ opacity:0; transform:scale(.4); } 45%{ opacity:.95; transform:scale(1.15); } 60%{ opacity:0; } }

.an-rise{ animation:anRise .5s cubic-bezier(.22,.61,.36,1) backwards; animation-delay:calc(.12s + var(--i,0) * .09s); }
@keyframes anRise{ from{ opacity:0; transform:translateY(8px); } }
.announce-card h2{ margin:0 0 12px; font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.3; }
.announce-text{ margin:0 0 10px; font-size:15px; line-height:1.55; color:rgba(252,250,245,.94); text-wrap:balance; }
.announce-when{ margin:0 0 20px; font-size:12px; color:rgba(252,250,245,.5); }

.announce-ack{ position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:52px; border:0; border-radius:14px; background:var(--apricot); color:#3A2414;
  font:inherit; font-size:15px; font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:transform .15s, background .3s; }
.announce-ack .ms{ font-size:19px; }
.announce-ack-shine{ position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 48%, transparent 66%);
  transform:translateX(-130%); animation:anShine 3.2s ease-in-out infinite 1s; }
@keyframes anShine{ 0%,30%{ transform:translateX(-130%); } 55%,100%{ transform:translateX(130%); } }
.announce-ack:active{ transform:scale(.97); }
.announce-ack:disabled{ cursor:default; }
.announce-card.sealed .announce-ack{ background:#22A45D; color:#fff; }
.announce-card.sealed .announce-ack-shine{ display:none; }
.announce-ack:focus-visible{ outline:2px solid #FCFAF5; outline-offset:2px; }

@keyframes anIn{ from{ opacity:0; } }
@keyframes anCardIn{ from{ opacity:0; transform:translateY(18px) scale(.95); } }
.announce.out .announce-scrim, .announce.out .announce-card{ animation:anOut .28s ease forwards; }
@keyframes anOut{ to{ opacity:0; transform:translateY(10px) scale(.96); } }
@media (prefers-reduced-motion:reduce){
  .announce-scrim, .announce-card, .announce-ring, .announce-ring::after, .announce-ic,
  .an-spark, .an-rise, .announce-ack-shine, .announce-orb{ animation:none; }
  .announce-card{ transition:none; }
}

/* ---- admin: Team Pulse ---- */
.tp-hero{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 var(--s4); }
.tp-stat{ padding:16px 10px 14px; border-radius:18px; background:var(--surface); text-align:center;
  box-shadow:inset 0 0 0 1px var(--line); }

.tp-face{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px; width:62px; }

.tp-ring::before{ content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid #22A45D; opacity:.55;

.tp-empty{ display:flex; align-items:center; gap:8px; margin:0; padding:14px 4px; font-size:13px; color:var(--ink-3); }

.tp-pill{ flex:none; padding:4px 10px; border-radius:999px; background:var(--fill-1); color:var(--ink-2);

@media (prefers-reduced-motion:reduce){ .tp-ring::before{ animation:none; opacity:.4; transform:none; } }

.gt-cur{ display:inline-block; margin-left:8px; padding:1px 8px; border-radius:999px; background:rgba(252,250,245,.14);

/* ---- the flag switch: Canada or India ---- */
.flagflip{ position:relative; flex:none; display:flex; align-items:center; gap:2px; height:38px; margin:0; padding:3px; border:0;
  border-radius:999px; background:color-mix(in srgb, var(--surface) 88%, transparent); cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--line), 0 6px 16px -12px rgba(0,0,0,.35); -webkit-tap-highlight-color:transparent;
  transition:transform .15s; }
.flagflip[hidden]{ display:none; }
.flagflip::before{ content:""; position:absolute; top:3px; left:3px; width:32px; height:32px; border-radius:50%;
  background:var(--ink); box-shadow:0 4px 10px -4px rgba(0,0,0,.45); transition:transform .42s cubic-bezier(.34,1.45,.64,1); }
.flagflip[data-side="INR"]::before{ transform:translateX(34px); }
.sf-opt{ position:relative; width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
.sf-flag{ display:block; width:22px; height:22px; border-radius:50%; overflow:hidden; background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.14); transition:transform .42s cubic-bezier(.34,1.45,.64,1), opacity .3s, filter .3s; }
.sf-flag svg{ display:block; width:100%; height:100%; }
.flagflip[data-side="CAD"] [data-s="INR"] .sf-flag, .flagflip[data-side="INR"] [data-s="CAD"] .sf-flag{ transform:scale(.8); opacity:.62; filter:saturate(.55); }
.flagflip[data-side="CAD"] [data-s="CAD"] .sf-flag, .flagflip[data-side="INR"] [data-s="INR"] .sf-flag{ box-shadow:0 0 0 2px rgba(255,255,255,.9); }
@media (hover:hover){ .flagflip:hover .sf-flag{ opacity:1; filter:none; } }
.flagflip:active{ transform:scale(.95); }
.flagflip:focus:not(:focus-visible){ outline:none; }
.flagflip:focus-visible{ outline:2px solid var(--apricot-dk); outline-offset:2px; }
.sf-badge{ position:absolute; top:-4px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#E0443E; color:#fff;
  font-style:normal; font-size:10.5px; font-weight:800; line-height:18px; text-align:center; box-shadow:0 0 0 2px var(--surface);
  animation:sfPop .5s cubic-bezier(.34,1.6,.64,1); pointer-events:none; }
.sf-badge[hidden]{ display:none; }

.sf-badge[data-on="CAD"]{ left:-5px; }
@keyframes sfPop{ from{ transform:scale(0); } }
