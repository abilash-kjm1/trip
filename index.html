   with coins running between the two faces; a torn edge with a notch either
   side; the light stub under it asks the question. ---- */
.arr{ position:fixed; inset:0; z-index:390; pointer-events:none; }
.arr-scrim{ position:absolute; inset:0; pointer-events:auto;
  background:linear-gradient(to bottom, color-mix(in srgb, var(--ink) 58%, transparent), color-mix(in srgb, var(--ink) 26%, transparent));
  -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); animation:arrFade .3s ease-out both; }
.arr.out .arr-scrim{ animation:arrFadeOut .38s ease-in both; }
@keyframes arrFade{ from{ opacity:0; } }
@keyframes arrFadeOut{ to{ opacity:0; } }
.arr-hold{ position:absolute; left:0; right:0; top:calc(12px + var(--safe-t)); display:flex; justify-content:center;
  padding:0 12px; pointer-events:none; transform-origin:50% 0;
  filter:drop-shadow(0 24px 30px rgba(0,0,0,.26)) drop-shadow(0 2px 5px rgba(0,0,0,.12));
  animation:arrDrop .75s cubic-bezier(.2,1.2,.4,1) both; }
.arr.out .arr-hold{ animation:arrLift .4s cubic-bezier(.6,0,.8,.4) both; }
@keyframes arrDrop{ 0%{ opacity:0; transform:translateY(-110%) rotate(-3deg); } 45%{ opacity:1; } 70%{ transform:translateY(4px) rotate(.6deg); } 100%{ transform:none; } }
@keyframes arrLift{ to{ opacity:0; transform:translateY(-120%); } }

.arr-slip{ --tear:220px; --notch:11px; position:relative; width:min(400px, 100%); max-height:calc(100vh - 24px - var(--safe-t));
  overflow:auto; pointer-events:auto; border-radius:26px; background:var(--surface); color:var(--ink);
  -webkit-mask:radial-gradient(circle var(--notch) at 0 var(--tear), #0000 96%, #000) 0 0 / 51% 100% no-repeat,

/* "Received", pressed on like a rubber stamp. */

.arr-stub{ position:relative; padding:22px 20px 14px; text-align:center; background:var(--surface); }

@keyframes arrBreathe{ 50%{ box-shadow:0 10px 26px -6px color-mix(in srgb, var(--apricot) 95%, transparent), inset 0 1px 0 rgba(255,255,255,.35); } }
.arr-later, .arr-back{ background:var(--fill-1); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }

.arr button:focus:not(:focus-visible){ outline:none; }

/* It has not arrived: the same slip, warmed towards red, the coins stopping short. */

  display:flex; align-items:center; justify-content:center; background:var(--bad); color:#fff; font-size:15px; }

/* The payer's news that it landed: a note that drops in and goes. */
.arr-quiet .arr-hold{ filter:drop-shadow(0 14px 22px rgba(0,0,0,.24)); }

  border:0; border-radius:22px; background:var(--ink); color:#FCFAF5; font:inherit; text-align:left; cursor:pointer; }

  background:var(--good); color:#fff; box-shadow:0 0 18px 2px color-mix(in srgb, var(--good) 55%, transparent);

/* ---- Phone notifications: the ask on Today, and the sheet ---- */
.pn-card{ display:grid; grid-template-columns:auto 1fr; gap:12px 14px; align-items:center; margin-top:16px; padding:14px 16px;

/* ---- Online / offline, in the top bar beside refresh ----
   Its own class name: plain .net already belongs to the balance on the Today
   card, and sharing it restyled that too. */
.netlight{ --dot:#A0A398; --ring:rgba(160,163,152,.35);
  flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px 0 10px;
  border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  font:inherit; font-size:12.5px; font-weight:650; letter-spacing:-.005em; line-height:1; white-space:nowrap;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:background .25s, border-color .25s, color .25s, transform .15s ease; }
.netlight:active{ transform:scale(.95); }
.netlight:focus:not(:focus-visible){ outline:none; }
.netlight:focus-visible{ outline:2px solid var(--apricot-dk); outline-offset:2px; }
.net-dot{ position:relative; flex:none; width:8px; height:8px; border-radius:50%; background:var(--dot);
  transition:background .3s; }
.net-dot::after{ content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--ring); opacity:0; }
.net-l{ font-variant-numeric:tabular-nums; }
/* Online: green, breathing slowly. */
.netlight[data-state="on"]{ --dot:#22A45D; --ring:rgba(34,164,93,.45); color:var(--ink); }
.netlight[data-state="on"] .net-dot::after{ animation:netPulse 2.6s ease-out infinite; }
/* Offline: red and still, on a faint red wash so it is seen. */
.netlight[data-state="off"]{ --dot:#E0443E; color:#B3261E; border-color:rgba(224,68,62,.35);
  background:color-mix(in srgb, #E0443E 8%, var(--surface)); }
/* Saving is taking a moment: amber, quicker. */
.netlight[data-state="sync"]{ --dot:#E8A317; --ring:rgba(232,163,23,.5); color:var(--ink); }
.netlight[data-state="sync"] .net-dot::after{ animation:netPulse 1.1s ease-out infinite; }
.netlight[data-state="wait"] .net-dot{ animation:netBlink 1.2s ease-in-out infinite; }
@keyframes netPulse{ 0%{ opacity:.9; transform:scale(.6); } 100%{ opacity:0; transform:scale(1.9); } }
@keyframes netBlink{ 50%{ opacity:.35; } }
.bar.scrolled .netlight{ background:var(--fill-2, rgba(118,118,128,.12)); border-color:transparent; }
.bar.scrolled .netlight[data-state="off"]{ background:color-mix(in srgb, #E0443E 12%, transparent); }
/* Inside a group the bar also carries back and the group menu, and on the
   narrowest phones there is no room for words: the light alone says it. */
#backBtn:not([hidden]) ~ .netlight{ padding:0; width:32px; justify-content:center; }
#backBtn:not([hidden]) ~ .netlight .net-l{ display:none; }
@media (max-width:360px){ .bar .netlight{ padding:0; width:32px; justify-content:center; } .bar .net-l{ display:none; } }
@media (prefers-reduced-motion:reduce){
  .netlight[data-state] .net-dot::after, .netlight[data-state="wait"] .net-dot{ animation:none; }
}


/* ---- Refresh, in the top bar: turns while it reloads ---- */
#refreshBtn .ms{ display:block; transform-origin:50% 50%; }

.pn-linked button{ min-height:34px; padding:0 14px; border:0; border-radius:10px; background:var(--ink); color:var(--cream);

/* Slide to record: the handle has to travel most of the way. */
.pf-slide{ position:relative; height:58px; margin-top:4px; border-radius:999px; overflow:hidden; isolation:isolate;
  background:var(--ink); color:var(--cream); -webkit-user-select:none; user-select:none; touch-action:pan-y; }

  background:linear-gradient(90deg, rgba(238,181,134,.25), rgba(238,181,134,.85)); }
.pf-slide-text{ position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; overflow:hidden;
  padding:0 62px; font-size:15px; font-weight:600; letter-spacing:.01em; white-space:nowrap; text-overflow:ellipsis;
  color:rgba(252,250,245,.92); opacity:calc(1 - var(--p, 0) * 1.5); pointer-events:none; font-variant-numeric:tabular-nums; }

  animation:pfShimmer 2.6s ease-in-out infinite; }
@keyframes pfShimmer{ 60%, 100%{ transform:translateX(100%); } }
.pf-slide-knob{ position:absolute; left:4px; top:4px; z-index:2; width:50px; height:50px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; background:var(--apricot); color:#3A2414; cursor:grab;
  box-shadow:0 0 0 3px rgba(238,181,134,.25), 0 6px 16px -6px rgba(0,0,0,.55); touch-action:none;
  -webkit-tap-highlight-color:transparent; }

.pf-slide.done .pf-slide-knob .ms{ transform:scale(1.15); }

.pf-slide.anim .pf-slide-fill{ transition:width .32s cubic-bezier(.22,.61,.36,1); }
.pf-slide-knob:focus{ outline:none; }
.pf-slide-knob:focus-visible{ outline:3px solid var(--apricot); outline-offset:3px; }
.pf-slide-hint{ margin:8px 0 0; text-align:center; font-size:12px; color:var(--ink-3); }
@media (prefers-reduced-motion:reduce){

}
:root[data-theme="purple"] .pf-slide-knob{ background:#C9B3F2; color:#2A1F3D;
  box-shadow:0 0 0 3px rgba(186,146,255,.25), 0 6px 16px -6px rgba(0,0,0,.55); }
:root[data-theme="purple"] .pf-slide-fill{ background:linear-gradient(90deg, rgba(186,146,255,.2), rgba(201,179,242,.85)); }
:root[data-theme="purple"] .pf-slide-knob:focus-visible{ outline-color:#C9B3F2; }
.pf-del{ display:block; width:100%; margin:10px 0 0; padding:10px; border:0; background:transparent; font:inherit;

@media (prefers-reduced-motion:reduce){ .pf-arrow .ms{ animation:none; } }
:root[data-theme="purple"] .pf{ background:color-mix(in srgb, #C9B3F2 18%, var(--surface)); }

/* ---- Groups tab: a balance meter and a grid of group tiles --------------- */
.gx-bal{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);

.extune[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--cream); }

.exfilters{ margin:0 0 6px; }

/* ---- Suggestions from Settle while a name is typed ---------------------- */

/* ---- Add an expense on a group's page: amount first, one line of choices -- */

.af-sum{ display:flex; flex-wrap:wrap; gap:8px; margin:var(--s3) 0 0; }
.af-pill{ display:inline-flex; align-items:center; gap:4px; padding:7px 9px 7px 12px; border-radius:999px;
  border:1px solid rgba(180,112,62,.22); background:rgba(255,255,255,.72); font:inherit; font-size:13.5px;
  color:var(--ink-2); cursor:pointer; -webkit-tap-highlight-color:transparent;

span.af-pill{ cursor:default; padding-right:12px; }
.af-pill b{ font-weight:700; color:var(--ink); }
.af-pill .ms{ font-size:18px; color:var(--ink-3); transition:transform .2s; }
.af-pill[aria-expanded="true"]{ background:var(--ink); border-color:var(--ink); color:rgba(252,250,245,.72); }
.af-pill[aria-expanded="true"] b, .af-pill[aria-expanded="true"] .ms{ color:var(--cream); }

:root[data-theme="purple"] .af-amt, :root[data-theme="purple"] .af-desc,

  border-color:#6D3FBF; box-shadow:0 0 0 3px rgba(160,120,240,.28); }

/* ---- Balances: you first, then most owed back down to most owing ---------- */
.ballist{ padding:4px 0; overflow:hidden; }
.balrow{ gap:12px; }
.balrow.mine{ background:color-mix(in srgb, var(--apricot) 11%, transparent); }
/* A soft tint and a "You" tag mark your row; the old edge bar is not needed. */
.balrow.mine::after, .owe-row.mine::after{ display:none; }
.balrow .t1{ display:flex; align-items:center; gap:6px; min-width:0; }
.balrow .t1 .nm{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bal-tag{ flex:0 0 auto; padding:1px 8px; border-radius:999px; font-size:10.5px; font-weight:600;
  letter-spacing:.02em; line-height:1.6; background:var(--fill-1); color:var(--ink-3); }

/* ---- Who owes whom: one plain sentence per payment ---------------------- */
.owelist{ padding:4px 0; overflow:hidden; }
.owe-row{ position:relative; display:flex; align-items:center; gap:12px; padding:13px var(--s4); }
.owe-row + .owe-row::before{ content:""; position:absolute; top:0; left:var(--s4); right:var(--s4);
  height:1px; background:var(--line-2); }

.owe-pair{ flex:0 0 auto; display:flex; align-items:center; gap:2px; }
.owe-pair > .ms{ font-size:15px; color:var(--ink-3); }
.owe-b{ flex:1; min-width:0; }
.owe-t{ display:block; font-size:14.5px; line-height:1.3; color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.owe-t b{ font-weight:700; color:var(--ink); }
.owe-m{ display:block; margin-top:2px; font-size:12px; color:var(--ink-3); }
.owe-r{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.owe-amt{ font-size:15.5px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.owe-amt.neg{ color:var(--bad); } .owe-amt.pos{ color:var(--good); } .owe-amt.zero{ color:var(--ink); }
.owe-btn{ border:0; border-radius:999px; padding:5px 13px; font:inherit; font-size:12px; font-weight:600;
  cursor:pointer; background:var(--ink); color:var(--cream); -webkit-tap-highlight-color:transparent; }
.owe-btn.soft{ background:var(--fill-1); color:var(--ink); }
.owe-btn:disabled{ opacity:.6; cursor:default; }
.owe-btn:focus:not(:focus-visible){ outline:none; }

/* ---- Today card: a breathing glow, and light across it on each new card ----
   The glow matches the + in the bar, so the two read as one family. It pauses
   while a hand is on the card, and stands still for reduced motion. */
.hero.carousel{ --hc-glow: rgba(233,150,92,.55);
  animation:hcBreathe 3.6s ease-in-out infinite; }
.hero.carousel.mood-get{  --hc-glow: rgba(72,164,118,.45); }
.hero.carousel.mood-done{ --hc-glow: rgba(238,181,134,.60); }
@keyframes hcBreathe{
  0%,100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 22px 44px -26px var(--hero-glow), 0 0 0 0 transparent; }
  50%    { box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 22px 44px -26px var(--hero-glow), 0 0 32px 5px var(--hc-glow); }
}
.hero.carousel.held{ animation-play-state:paused; }
.hc-sheen{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; border-radius:inherit; }
.hc-sheen::before{ content:""; position:absolute; top:-20%; bottom:-20%; left:0; width:45%;
  background:linear-gradient(100deg, rgba(255,255,255,0) 15%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 85%);
  transform:translateX(-120%) skewX(-14deg); opacity:0; }
.hc-sheen.go::before{ animation:hcSweep 1.4s cubic-bezier(.4,0,.2,1) .2s 1 both; }
@keyframes hcSweep{
  0%  { transform:translateX(-120%) skewX(-14deg); opacity:0; }
  15% { opacity:1; }
  85% { opacity:1; }
  100%{ transform:translateX(330%) skewX(-14deg); opacity:0; }
}
:root[data-theme="purple"] .hero.carousel{ --hc-glow: rgba(160,120,240,.58); }
:root[data-theme="purple"] .hero.carousel.mood-get{ --hc-glow: rgba(96,190,160,.45); }
@media (prefers-reduced-motion: reduce){
  .hero.carousel{ animation:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 22px 44px -26px var(--hero-glow), 0 0 26px 3px var(--hc-glow); }
  .hc-sheen{ display:none; }
}
.hc-track{ position:relative; display:flex; touch-action:pan-y;
  -webkit-user-select:none; user-select:none;
  transition:transform .6s cubic-bezier(.22,.61,.36,1); }
.hc-slide{ flex:0 0 100%; min-width:0; opacity:.2; transition:opacity .6s ease; }
.hc-slide.on{ opacity:1; }

.hc-top{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); }
.hc-av{ flex:0 0 auto; width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.64); color:var(--hero-ink);
  font-size:13px; font-weight:700; letter-spacing:.03em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), 0 4px 10px -6px rgba(0,0,0,.35); }
.hc-av .ms{ font-size:20px; }
.hc-chip{ display:inline-flex; align-items:center; gap:7px; min-width:0; max-width:72%;
  padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.5);
  color:var(--hero-soft); font-size:10.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hc-chip i{ flex:0 0 auto; width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.7; }

.hero p.hc-line{ margin:var(--s4) 0 0; max-width:none; font-size:15px; color:var(--hero-soft); }
.hc-line b{ color:var(--hero-ink); font-weight:700; }
.hero h2.hc-amt{ margin:2px 0 0; max-width:none; font-family:var(--serif); font-weight:600;
  font-size:clamp(42px,12vw,56px); line-height:1; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums; }
.hc-slide.owe .hc-amt{ color:var(--hero-owe); }
.hc-slide.get .hc-amt{ color:var(--hero-get); }
.hc-slide.done .hero, .hc-slide.done .hc-amt{ margin-top:var(--s4); font-size:clamp(26px,7.4vw,34px);
  line-height:1.1; color:var(--hero-ink); }

  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.hero .act{ margin-top:var(--s4); }
.hc-btn{ display:inline-flex; align-items:center; gap:8px; padding:11px 18px 11px 14px;
  box-shadow:0 10px 20px -12px rgba(0,0,0,.6); }
.hc-btn .ms{ font-size:18px; }
.hc-btn:disabled{ opacity:1; cursor:default; background:rgba(255,255,255,.58);
  color:var(--hero-get); box-shadow:none; }

.hc-foot{ position:relative; display:flex; align-items:center; justify-content:space-between;
  gap:var(--s4); margin-top:var(--s5); padding-top:var(--s3); border-top:1px solid var(--hero-line); }
/* Overall balance: a soft pill on one line - label, then the signed figure. */
.hero .hc-foot .net{ display:inline-flex; align-items:baseline; gap:8px; margin-left:auto;
  padding:6px 13px 6px 12px; border-radius:999px; background:rgba(255,255,255,.5);
  text-align:left; font-size:13px; letter-spacing:0; white-space:nowrap; }
.hero .hc-foot .net small{ display:inline; margin:0; font-size:12.5px; font-weight:500;
  letter-spacing:0; text-transform:none; color:var(--hero-soft); }
.hero .hc-foot .net b{ font-size:15px; font-weight:700; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums; color:var(--hero-ink); }
.hero .hc-foot .net.pos b{ color:var(--hero-get); }
.hero .hc-foot .net.neg b{ color:var(--hero-owe); }

/* Slim bars rather than dots. The tappable area is taller than the bar. */
.hc-segs{ display:flex; align-items:center; gap:6px; min-height:24px; }
.hc-seg{ position:relative; box-sizing:content-box; width:16px; height:4px; padding:10px 0;
  border:0; background:transparent; cursor:pointer; transition:width .35s ease; }
.hc-seg i{ position:absolute; left:0; right:0; top:10px; height:4px; border-radius:999px;
  background:var(--hero-track); overflow:hidden; }
.hc-seg i::after{ content:""; position:absolute; top:0; bottom:0; left:0; width:0;
  border-radius:inherit; background:var(--hero-ink); }
.hc-seg[aria-current="true"]{ width:36px; }
.hc-seg[aria-current="true"] i::after{ width:100%; }
.hc-seg.run i::after{ width:0; animation:hcfill 5s linear forwards; }
.hero.held .hc-seg.run i::after{ animation-play-state:paused; }
@keyframes hcfill{ from{ width:0; } to{ width:100%; } }

@media (min-width:1000px){
  .hero.carousel{ padding:var(--s6) var(--s6) var(--s5); }
  .hero.carousel h2.hc-amt{ font-size:64px; }
  .hero.carousel .hc-foot .net b{ font-size:16px; }
}
@media (prefers-reduced-motion: reduce){ .hc-track, .hc-slide, .hc-seg{ transition:none; } }


/* ---- Expenses: by month, then by day ----------------------------------- */
/* The month is a quiet divider - a small label, a hairline and its total - not
   a second heading competing with the page title above it. */
.act-month{ display:flex; align-items:center; gap:var(--s3); margin:var(--s6) 4px 0; }
.ltitle + .act-month{ margin-top:var(--s4); }

.act-month::after{ content:""; order:1; flex:1; height:1px; background:var(--line); }

  font-variant-numeric:tabular-nums; }
/* A day is named plainly, in ordinary case, with its figure beside it. */

.act-card{ padding:4px 0; }
.act-row{ position:relative; display:flex; align-items:center; gap:var(--s3); width:100%;
  padding:13px var(--s4); border:0; background:transparent; color:inherit; font:inherit;
  text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:background .15s ease; }
.act-row + .act-row::before{ content:""; position:absolute; top:0; left:66px; right:var(--s4);
  height:1px; background:var(--line-2); }
.act-row:active{ background:var(--fill-1); }
@media (hover:hover){ .act-row:hover{ background:var(--fill-1); } }
.act-row:focus:not(:focus-visible){ outline:none; }
.act-ic{ flex:0 0 auto; width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--gc-lt, var(--apricot-lt)); color:var(--gc, var(--apricot-dk)); }
.act-ic .ms{ font-size:20px; }
.act-row.pay .act-ic{ border-radius:50%; background:rgba(44,106,79,.12); color:var(--good); }
.act-b{ flex:1; min-width:0; display:flex; flex-direction:column; }
.act-t{ font-size:15px; font-weight:600; letter-spacing:-.01em; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.act-m{ margin-top:3px; font-size:12.5px; color:var(--ink-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.act-r{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; text-align:right; }
.act-amt{ font-size:15px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.act-amt.pos{ color:var(--good); } .act-amt.neg{ color:var(--bad); } .act-amt.zero{ color:var(--ink); }
.act-cap{ margin-top:2px; font-size:11.5px; color:var(--ink-3); white-space:nowrap; }
.act-more{ margin:var(--s4) 0 0; text-align:center; font-size:12.5px; color:var(--ink-3); }


/* ---- Delete group: say what goes, then make them type the name ---------- */
.delwarn{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; margin:0 0 14px;
  border-radius:14px; background:color-mix(in srgb, var(--bad) 9%, transparent);

/* ---- desktop --------------------------------------------------------- */

  .side .grp{ font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:rgba(252,250,245,.34); padding:var(--s4) 10px var(--s2); }
  .side button{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:transparent; border:0; color:inherit; font-size:14px; font-weight:500;
    padding:10px 11px; border-radius:var(--r1); cursor:pointer;
  }
  .side button .ms{ font-size:20px; }
  .side button:hover{ background:rgba(255,255,255,.07); color:var(--cream); }
  .side button[aria-current="page"]{ background:var(--apricot); color:#3A2414; font-weight:600; }
  .side .foot{ margin-top:auto; border-top:1px solid rgba(255,255,255,.10); padding-top:var(--s3); }

  .shell{ margin-left:244px; min-height:100vh; }
  .panel{ background:transparent; padding:var(--s6) var(--s7) 64px; }
  .wrap{ max-width:980px; margin:0 auto; padding:0; }
  .bar, .nav{ display:none; }

  .sums{ grid-template-columns:repeat(3,1fr); }
  .cols2{ display:grid; grid-template-columns:1.25fr 1fr; gap:var(--s5); align-items:start; }

  .shell{ margin:0; padding:0; }

}






/* ============================================================
   THE TOP BAR - a floating island
   Clear at the top of a screen; once the page moves under it, it becomes
   a frosted island with a thin line of the theme's accent beneath. Where
   you are sits on the left with room of its own, so a long group name
   shortens with "…" instead of disappearing under a button. Everything
   about the app - connection, refresh, the group menu - shares one
   capsule on the right, beside your picture. On a computer it is always an
   island, above the page, with the screen's name large and a label above.
   Every colour comes from the theme, so Warm and Purple each get their own.
   ============================================================ */
.bar, .bar.scrolled{ display:block; min-height:0; padding:calc(6px + var(--safe-t)) 10px 6px;
  background:transparent; box-shadow:none; border:0; backdrop-filter:none; -webkit-backdrop-filter:none;
  pointer-events:none; }
.bar [hidden]{ display:none !important; }
.bar-in{ pointer-events:auto; position:relative; display:flex; align-items:center; gap:10px;
  max-width:620px; margin:0 auto; min-height:52px; padding:6px 6px 6px 8px; border-radius:24px;
  border:1px solid transparent; background:transparent;
  transition:background .3s ease, border-color .3s ease, box-shadow .3s ease; }
.bar.scrolled .bar-in{
  background:color-mix(in srgb, var(--cream) 80%, transparent);
  -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%);
  border-color:color-mix(in srgb, var(--line) 85%, transparent);
  box-shadow:0 14px 34px -18px rgba(30,32,28,.38), inset 0 1px 0 rgba(255,255,255,.75); }
/* the accent under the island: grows out from the middle as it lifts */
.bar-in::after{ content:""; position:absolute; left:26px; right:26px; bottom:-1px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--apricot) 28%, var(--apricot-dk) 50%, var(--apricot) 72%, transparent);
  opacity:0; transform:scaleX(.3); pointer-events:none;
  transition:opacity .35s ease, transform .5s cubic-bezier(.22,.61,.36,1); }
.bar.scrolled .bar-in::after{ opacity:.6; transform:scaleX(1); }

.bar-lead{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px; }
.bar .brandwrap{ padding-left:4px; }
.bar-titles{ min-width:0; display:flex; flex-direction:column; justify-content:center; gap:1px; }
.bar-eyebrow{ display:none; font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--apricot-dk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar h1{ position:static; left:auto; transform:translateY(4px); max-width:100%; margin:0; text-align:left;
  font-family:var(--serif); font-size:18px; font-weight:600; letter-spacing:-.01em; line-height:1.2; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transition:opacity .25s ease, transform .3s ease; }
.bar.scrolled h1{ opacity:1; transform:none; }
.bar.is-home h1{ display:none; }

.bar .bar-back{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; padding:0; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  box-shadow:0 6px 14px -9px rgba(30,32,28,.45); -webkit-tap-highlight-color:transparent;
  transition:background .2s, transform .15s ease, box-shadow .25s; }
.bar .bar-back .ms{ font-size:21px; transition:transform .2s ease; }
.bar .bar-back:hover{ background:var(--apricot-lt); }
.bar .bar-back:hover .ms, .bar .bar-back:active .ms{ transform:translateX(-2px); }
.bar .bar-back:active{ transform:scale(.92); }
.bar.scrolled .bar-back{ box-shadow:none; }

.bar-tools{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
.bar-cap{ display:flex; align-items:center; gap:1px; height:38px; padding:0 3px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line); box-shadow:0 8px 18px -12px rgba(30,32,28,.4); }
.bar.scrolled .bar-cap{ background:color-mix(in srgb, var(--surface) 72%, transparent); box-shadow:none; }
.bar-cap .netlight, .bar.scrolled .bar-cap .netlight{ height:30px; border:0; background:transparent;
  padding:0 10px 0 9px; border-radius:999px; }
.bar-cap .netlight:hover{ background:var(--fill-1); }
.bar-cap .netlight[data-state="off"], .bar.scrolled .bar-cap .netlight[data-state="off"]{
  background:color-mix(in srgb, #E0443E 11%, transparent); }
.bar-sep{ flex:none; width:1px; height:18px; margin:0 2px; background:var(--line); }
.bar-cap .netlight[hidden] + .bar-sep{ display:none; }
.cap-btn{ flex:none; width:32px; height:32px; padding:0; border:0; border-radius:50%; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--ink-2);
  -webkit-tap-highlight-color:transparent; transition:background .2s, color .2s, transform .15s ease; }
.cap-btn .ms{ font-size:20px; }
.cap-btn:hover{ background:var(--fill-1); color:var(--ink); }
.cap-btn:active{ transform:scale(.9); }
.cap-btn:focus:not(:focus-visible), .bar .bar-back:focus:not(:focus-visible), .bar .me:focus:not(:focus-visible){ outline:none; }
.cap-btn:focus-visible, .bar .bar-back:focus-visible, .bar .me:focus-visible{ outline:2px solid var(--apricot-dk); outline-offset:2px; }
/* inside a group the name needs the room: the light alone says it */
.bar.in-group .bar-cap .netlight{ width:30px; padding:0; justify-content:center; }
.bar.in-group .bar-cap .net-l{ display:none; }

/* your picture, ringed in the theme's accent */
.bar .me{ flex:0 0 auto; width:38px; height:38px;
  box-shadow:0 0 0 2px var(--cream), 0 0 0 3.5px color-mix(in srgb, var(--apricot) 85%, transparent);
  transition:transform .2s ease, box-shadow .3s ease; }
.bar .me:hover{ transform:translateY(-1px);
  box-shadow:0 0 0 2px var(--cream), 0 0 0 3.5px var(--apricot-dk); }
.bar .me:active{ transform:scale(.94); }

@media (max-width:370px){
  .bar-in{ gap:6px; padding-left:6px; }
  .bar .brand{ font-size:20px; }
  .bar .byline{ display:none; }
}

/* Sheets: the title and the close button always where they can be seen */
.sheet .shead{ padding:8px 12px 12px; }
.sheet #sheetClose{ width:36px; height:36px; border:0; border-radius:50%; background:var(--ink); color:var(--cream);
  box-shadow:0 6px 14px -8px rgba(0,0,0,.45); cursor:pointer; transition:background .2s, transform .15s ease; }
.sheet #sheetClose .ms{ font-size:20px; }
.sheet #sheetClose:hover{ background:var(--apricot-dk); }
.sheet #sheetClose:active{ transform:scale(.9); }
@media (max-width:619px){
  /* --vvh is the part of the screen actually visible - less the keyboard */
  .sheet{ max-height:min(93vh, calc(var(--vvh, 100vh) - var(--safe-t) - 12px)); transition:bottom .2s ease; }
}

/* ---- on a computer: always an island, above the page ---- */
@media (min-width:1000px){
  .bar, .bar.scrolled{ display:block; position:sticky; top:0; z-index:30; max-width:980px;
    margin:calc(-1 * var(--s6)) auto var(--s4); padding:var(--s4) 0 var(--s2); }
  .bar-in, .bar.scrolled .bar-in{ max-width:none; min-height:64px; padding:10px 12px 10px 14px; border-radius:22px;
    background:color-mix(in srgb, var(--surface) 80%, transparent); border-color:var(--line);
    -webkit-backdrop-filter:blur(16px) saturate(160%); backdrop-filter:blur(16px) saturate(160%);
    box-shadow:0 1px 2px rgba(30,32,28,.04), 0 16px 36px -24px rgba(30,32,28,.4); }
  .bar-in::after{ opacity:.5; transform:scaleX(1); }
  .bar .brandwrap{ display:none !important; }
  .bar-eyebrow{ display:block; }
  .bar h1, .bar.scrolled h1, .bar.is-home h1{ display:block; opacity:1; transform:none; font-size:24px; }
  .bar .bar-back{ width:42px; height:42px; }
  .bar-cap{ height:42px; padding:0 4px; }
  .cap-btn{ width:34px; height:34px; }
  .bar .me{ width:40px; height:40px; }
  /* room enough on a computer for the light to keep its word, even in a group */
  .bar.in-group .bar-cap .netlight{ width:auto; padding:0 10px 0 9px; }
  .bar.in-group .bar-cap .net-l{ display:inline; }
  /* the bar carries the screen's name, back and group settings now */
  .ltitle, .pagehead{ display:none; }
}

/* ============================================================
   THEMES

   A theme is a palette and nothing else. Every colour in the app
   comes from the tokens below, so a theme can only change how it
   looks - never what anything says, where anything sits, or what
   a colour means. Green is still money coming to you and red is
   still money going out, in every one of them.

   The default palette lives on :root above. Anything here only
   overrides tokens.
   ============================================================ */

/* Purple - for the ARMY. Borahae. */
:root[data-theme="purple"]{
  --cream:#F8F5FD;
  --surface:#FFFFFF;
  --ink:#2A1F3D;
  --ink-2:#6B6080;
  --ink-3:#A29CB5;
  --line:#E9E2F5;
  --line-2:#F2EDFA;

  /* the accent, in the three weights every surface needs */
  --apricot:#C4AEEF;          /* the feature panel */
  --apricot-dk:#6D3FBF;       /* links, icons, anything that must read as text */
  --apricot-lt:#EDE4FB;       /* tints behind icons and input surfaces */

  --good:#2E7D62;
  --bad:#C24A6A;

  --shadow:0 1px 2px rgba(42,31,61,.05), 0 6px 18px rgba(42,31,61,.07);
  --green-lt:rgba(46,125,98,.12);
  --fill-1:rgba(107,96,128,.06);
  --fill-2:rgba(107,96,128,.10);
  --fill-3:rgba(107,96,128,.16);
}
/* The panel is a light purple, so its text stays the deep plum rather than
   the near-black the warm theme uses on apricot. */
:root[data-theme="purple"] .hero{ color:#2A1F3D; }
:root[data-theme="purple"] .hero p{ color:#584A72; }
:root[data-theme="purple"] .hero .net small{ color:#584A72; }
:root[data-theme="purple"] .hero::after{ border-color:rgba(42,31,61,.20); }
:root[data-theme="purple"] .hero::before{ border-color:rgba(42,31,61,.13); }
:root[data-theme="purple"] .nav .add{ color:#2A1F3D;
  --glow: rgba(186,146,255,.70); --glow-soft: rgba(186,146,255,.24); }
:root[data-theme="purple"] .side button[aria-current="page"]{ color:#2A1F3D; }
:root[data-theme="purple"] .me{ background:var(--apricot-lt); color:var(--apricot-dk); }
:root[data-theme="purple"] .summary .split .v.pos{ color:#7FD0B0; }
:root[data-theme="purple"] .summary .split .v.neg{ color:#F0A0B6; }
:root[data-theme="purple"] .sync{ background:var(--apricot-lt); color:#4A317F; }
:root[data-theme="purple"] .notice.warn{ background:rgba(196,174,239,.28); color:#4A317F;
  border-color:rgba(109,63,191,.26); }
:root[data-theme="purple"] .tag.warn, :root[data-theme="purple"] .tag.admin{
  background:rgba(196,174,239,.44); color:#4A317F; }
:root[data-theme="purple"] .card.addform{ border-color:rgba(109,63,191,.20); }
:root[data-theme="purple"] .card.addform .field label{ color:#584A72; }
:root[data-theme="purple"] .card.addform h3,
:root[data-theme="purple"] .card.addform .t1{ color:#2A1F3D; }
:root[data-theme="purple"] .card.addform .lead,
:root[data-theme="purple"] .card.addform .sub{ color:#584A72; }

/* ---- the chooser ----------------------------------------------------- */
.themes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:var(--s3); padding:var(--s4); }
.theme{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  padding:var(--s3); text-align:left; font:inherit; cursor:pointer; }
.theme[aria-pressed="true"]{ border-color:var(--apricot-dk);
  box-shadow:0 0 0 2px var(--apricot-lt); }
.theme .swatch{ display:flex; gap:5px; margin-bottom:var(--s2); }
.theme .swatch i{ width:22px; height:22px; border-radius:7px; display:block;
  border:1px solid rgba(0,0,0,.06); }
.theme .n{ font-size:14px; font-weight:600; color:var(--ink); }
.theme .m{ font-size:12px; color:var(--ink-3); margin-top:2px; }

/* An engraved motif, purple only. Drawn here rather than photographed: the
   seven of them are real people and their pictures are not ours to ship, so
   this says the same thing in line art - a heart, seven dots, two notes. It
   sits under the words at low opacity and never competes with them. */
:root[data-theme="purple"] .hero{
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20320%20240'%20fill='none'%20stroke='%232A1F3D'%20stroke-width='1.5'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%20%3Cg%20opacity='.30'%3E%20%3Cpath%20d='M196%2074c-9-13-31-9-31%207%200%2015%2018%2026%2031%2037%2013-11%2031-22%2031-37%200-16-22-20-31-7z'/%3E%20%3Cpath%20d='M188%2084c-3-5-11-3-11%203%200%205%206%209%2011%2013'%20opacity='.55'/%3E%20%3C/g%3E%20%3Cg%20opacity='.26'%3E%20%3Ccircle%20cx='142'%20cy='150'%20r='3.4'/%3E%3Ccircle%20cx='160'%20cy='143'%20r='3.4'/%3E%20%3Ccircle%20cx='179'%20cy='139'%20r='3.4'/%3E%3Ccircle%20cx='198'%20cy='138'%20r='3.4'/%3E%20%3Ccircle%20cx='217'%20cy='139'%20r='3.4'/%3E%3Ccircle%20cx='236'%20cy='143'%20r='3.4'/%3E%20%3Ccircle%20cx='254'%20cy='150'%20r='3.4'/%3E%20%3C/g%3E%20%3Cg%20opacity='.22'%3E%20%3Cpath%20d='M262%2056v34'/%3E%3Cpath%20d='M262%2056c9%202%2015%206%2017%2012'/%3E%20%3Cellipse%20cx='256'%20cy='92'%20rx='7'%20ry='5.4'%20transform='rotate(-18%20256%2092)'/%3E%20%3Cpath%20d='M292%2092v26'/%3E%3Cpath%20d='M292%2092c7%202%2012%205%2013%209'/%3E%20%3Cellipse%20cx='287'%20cy='120'%20rx='5.6'%20ry='4.4'%20transform='rotate(-18%20287%20120)'/%3E%20%3C/g%3E%20%3C/svg%3E"), linear-gradient(140deg, var(--hero-a) 0%, var(--apricot) 46%, var(--hero-b) 100%);
  background-repeat:no-repeat, no-repeat;
  background-position:right -18px top -10px, 0 0;
  background-size:250px auto, 100% 100%;
}
@media (max-width:560px){
  :root[data-theme="purple"] .hero{ background-size:176px auto, 100% 100%;
    background-position:right -26px top -6px, 0 0; }
}

/* ---- a colour for each group -----------------------------------------
   Cycled down the list, so two groups next to each other never share one.
   The colour marks a group's icon and a stripe down its left edge - never its
   amount, which keeps the green and red that mean money. No red-leaning hue in
   either set, for the same reason. Each theme brings its own six, so the
   colours sit with the palette around them rather than on top of it. */
.row.gc0, .row.gc1, .row.gc2, .row.gc3, .row.gc4, .row.gc5{
  box-shadow:inset 4px 0 0 var(--gc);
}
.row[class*=" gc"] .cat{ background:var(--gc-lt); color:var(--gc); }

.gc0{ --gc:#B4703E; --gc-lt:#F8E3CF; }   /* apricot */
.gc1{ --gc:#4F7A5C; --gc-lt:#DDEBDF; }   /* sage */
.gc2{ --gc:#4A6A8A; --gc-lt:#DCE6F0; }   /* dusty blue */
.gc3{ --gc:#3F7F7A; --gc-lt:#D8ECEA; }   /* teal */
.gc4{ --gc:#86691A; --gc-lt:#F2E6BF; }   /* mustard */
.gc5{ --gc:#7A5A86; --gc-lt:#E8DDEE; }   /* mauve */

:root[data-theme="purple"] .gc0{ --gc:#6D3FBF; --gc-lt:#EDE4FB; }   /* violet */
:root[data-theme="purple"] .gc1{ --gc:#A2457E; --gc-lt:#F6DDEC; }   /* orchid pink */
:root[data-theme="purple"] .gc2{ --gc:#4F5BB8; --gc-lt:#E0E3F8; }   /* periwinkle */
:root[data-theme="purple"] .gc3{ --gc:#2D7A7A; --gc-lt:#D9EFEE; }   /* teal */
:root[data-theme="purple"] .gc4{ --gc:#946A1E; --gc-lt:#F4E7C8; }   /* honey gold - grape sat too
                                                                   close to violet and lavender */
:root[data-theme="purple"] .gc5{ --gc:#6A5F8F; --gc-lt:#E6E2F1; }   /* lavender grey */

/* The Today panel in purple: a lilac gradient under the engraved motif. */
:root[data-theme="purple"]{
  --hero-a:#E4D7F9; --hero-b:#A98BE3; --hero-ink:#2A1F3D; --hero-soft:#584A72;
  --hero-owe:#9B2C55; --hero-get:#1D5F4F; --hero-line:rgba(42,31,61,.14);
  --hero-track:rgba(42,31,61,.18); --hero-glow:rgba(74,40,140,.55);
}


/* ---------- printing (kept last so it wins the cascade) ---------- */

<script src="firebase-config.js"></script>
<script type="module">
/* ===========================================================================
   SETTLE — shared expense app
   Data model (Firebase Realtime Database):
     trips/{gid}/meta          {name, type, at, by}
     trips/{gid}/people/{k}    {n, c, uid?, email?, photo?, invite?}
     invites/{emailKey}/{gid}  {name, at, by}   <- so an invited person sees it
     trips/{gid}/expenses/{k}  {desc, amount, payer, mode, between[], vals{}, cat, note, at, by}
     trips/{gid}/payments/{k}  {from, to, amount, note, at, by}
     users/{uid}/profile       {name, email, photo, at}
     users/{uid}/prefs         {weekly, newExpense, updates, payments, tz, lastWeekly}
     config/reminders          {enabled, days[], hour, windowHours}  <- admin only
     access/{uid}              {status, name, email, at, decidedAt, decidedBy}
     directory/{uid}           {name, email, photo, at}  <- so people can be picked
     mail/queue/{k}            {kind, gid, actorUid, actor, desc, amount, at}
                               <- write-only for the app, drained by the cron
     users/{uid}/groups/{gid}  {name, at}      <- which groups this person is in
   Who you are comes from Google sign-in. Which groups you belong to lives in
   the database under your own uid, so it follows you to any device.
   =========================================================================== */
const $  = (id) => document.getElementById(id);
const el = (t, c, h) => { const n=document.createElement(t); if(c) n.className=c; if(h!=null) n.innerHTML=h; return n; };

// The tracker's own palette. People created by the original app carry a colour
// from this list, so any colour handed out later has to come from the same one
// or the avatars and the bars stop matching each other.
const PALETTE = ["#006b5d","#1565c0","#6a1b9a","#c62828","#ef6c00","#2e7d32",
                 "#ad1457","#4527a0","#00838f","#558b2f","#5d4037","#37474f"];
const CATS = [
  {k:"general",  i:"receipt_long",   n:"General"},
  {k:"food",     i:"restaurant",     n:"Food & drink"},
  {k:"grocery",  i:"shopping_cart",  n:"Groceries"},
  {k:"transport",i:"directions_car", n:"Transport"},
  {k:"fuel",     i:"local_gas_station", n:"Fuel"},
  {k:"home",     i:"home",           n:"Home & rent"},
  {k:"utilities",i:"bolt",           n:"Utilities"},
  {k:"travel",   i:"flight",         n:"Travel"},
  {k:"lodging",  i:"hotel",          n:"Lodging"},
  {k:"fun",      i:"celebration",    n:"Entertainment"},
  {k:"shopping", i:"shopping_bag",   n:"Shopping"},
  {k:"health",   i:"medical_services",n:"Health"}
];
const catOf = (k) => CATS.find(c=>c.k===k) || CATS[0];
const FULLVIEW = /[?&]full=1/.test(location.search);
const ADMIN_EMAIL = (window.ADMIN_EMAIL || "").toLowerCase();
const PEOPLE_LINKS = (function(){
  const src=window.PEOPLE_LINKS||{}, out={};
  Object.keys(src).forEach(k=> out[k.toLowerCase()]=src[k] );
  return out;
})();
// The name this account always goes by, if it has been pinned to one.
const linkedName = (email) => PEOPLE_LINKS[String(email||"").toLowerCase()] || null;

/* ---------------- local state ---------------- */
const LS = {
  grp: "settle.groups.v2",   // cached copy of users/{uid}/groups, for offline
  cur: "settle.cur.v2",
  who: "settle.uid.v2",      // whose cache the other two are
  theme: "settle.theme.v1"   // a look, kept on the device so it applies at once
};
function lsGet(k, d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let USER     = null;                        // {uid, name, email, photo} from Google
let PREFS    = {};                          // users/{uid}/prefs - notification settings
let SCHED    = {};                          // config/reminders - when the email goes out
let ACCESS   = undefined;                   // access/{uid} - undefined until it has loaded
let REQUESTS = {};                          // access/* - everybody, admin only
let ALLUSERS = {};                          // users/* - admin only, to find who never asked
let DIRECTORY= {};                          // directory/* - everybody in Settle, to pick from
let ME       = null;                        // my person-name inside CURRENT group
let JOINED   = lsGet(LS.grp, []);           // [{id,name}]
let CURRENT  = null;                        // active group id
let TAB      = "home";                      // home | groups | activity | interac | account
let DATA     = {};                          // gid -> {meta, people, expenses, payments}
let remote   = null;                        // firebase handles
const subs   = {};                          // gid -> unsubscribe

/* ---------------- how it looks ----------------
   A theme is a palette. It changes no wording, no layout and no meaning:
   green is money coming to you and red is money going out in every one of
   them. Kept on the device as well as on the account, so it is already right
   on the first paint rather than flickering once the database answers. */
const THEMES = [
  {k:"warm",   n:"Warm",   m:"Cream and apricot", sw:["#F4EEE6","#EEB586","#2F332D"]},
  {k:"purple", n:"Purple", m:"Borahae \u{1F49C}",  sw:["#F8F5FD","#C4AEEF","#2A1F3D"]}
];
let THEME = lsGet(LS.theme, "warm");
function applyTheme(k){
  THEME = THEMES.some(t=>t.k===k) ? k : "warm";
  if(THEME==="warm") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", THEME);
  lsSet(LS.theme, THEME);
}
applyTheme(THEME);

const isAdmin = () => !!(USER && ADMIN_EMAIL && (USER.email||"").toLowerCase()===ADMIN_EMAIL);

/* ---------------- joining ----------------
   Signing in gets somebody an account, not access. The administrator is
   always in - they are the one who would have to let themselves back in
   otherwise. This is the same condition the database rules enforce; the rules
   are what actually stop anything, and this only decides what to show. */
const accessState = () => {
  if(isAdmin()) return "approved";
  if(ACCESS === undefined) return "loading";
  const s = ACCESS && ACCESS.status;
  return (s==="approved" || s==="pending" || s==="declined") ? s : "none";
};
const mayUse = () => accessState()==="approved";

function requestAccess(){
  if(!remote || !USER) return Promise.resolve();
  const rec = {status:"pending", name:USER.name, email:(USER.email||"").toLowerCase(),
               photo:USER.photo||null, at:Date.now()};
  // The record has to exist before the note, or the mailer will look it up,
  // find nothing waiting, and quietly throw the request away.
  return set("access/"+USER.uid, rec).then(()=>{
    ACCESS = rec;
    notify("access.request", null, {});
    render();
  });
}

/* ---------------- helpers ---------------- */
function money(n){ const v=Math.round((n+Number.EPSILON)*100)/100; return (v<0?"-$":"$")+Math.abs(v).toFixed(2); }
function plain(n){ return (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); }
function trim(n){ return String(Math.round((n+Number.EPSILON)*100)/100); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(n){ const p=String(n||"?").trim().split(/\s+/); return (p[0].charAt(0)+(p[1]?p[1].charAt(0):"")).toUpperCase(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), 2600); }
function fmtDate(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d)) return "";
  const o={day:"numeric", month:"short"};
  if(d.getFullYear()!==new Date().getFullYear()) o.year="numeric";
  return d.toLocaleDateString(undefined,o);
}
function fmtWhen(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d)) return "";
  return fmtDate(ts)+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function dayKey(ts){ const d=new Date(ts||0);
  return isNaN(d) ? "" : d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function dayLabel(ts){
  const d=new Date(ts||0); if(isNaN(d)) return "Undated";
  const t=new Date();
  if(dayKey(ts)===dayKey(t)) return "Today";
  if(dayKey(ts)===dayKey(Date.now()-864e5)) return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"long"});
}
function avatarHTML(cls, name, colour, photo){
  if(photo) return '<img class="av '+cls+'" src="'+esc(photo)+'" alt="" referrerpolicy="no-referrer">';
  return '<span class="av '+cls+'" style="background:'+(colour||"#8e99a6")+'">'+esc(initials(name))+'</span>';
}

/* ---------------- group data accessors ---------------- */
function membersOf(gid){
  const g=DATA[gid]||{}, raw=g.people||{};
  const keys=Object.keys(raw).sort();
  const taken=new Set(); keys.forEach(k=>{ const c=raw[k] && raw[k].c; if(c) taken.add(c.toLowerCase()); });
  let next=0;
  return keys.map(k=>{
    const v=raw[k]; const obj=(v&&typeof v==="object")?v:{n:String(v)};
    const name=obj.n||"";
    let color=obj.c||null;
    if(!color){
      while(next<PALETTE.length && taken.has(PALETTE[next].toLowerCase())) next++;
      color=PALETTE[next%PALETTE.length]; taken.add(color.toLowerCase()); next++;
    }
    return {k, name, color, uid:obj.uid||null, email:obj.email||null,
            photo:obj.photo||null, invite:(obj.invite||"").toLowerCase()||null};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
const names   = (gid) => membersOf(gid||CURRENT).map(m=>m.name);
const memberOf= (n, gid) => membersOf(gid||CURRENT).find(x=>x.name===n) || null;
const colorOf = (n, gid) => { const m=memberOf(n, gid); return m?m.color:"#8e99a6"; };
function listOf(gid, what){
  const raw=(DATA[gid]||{})[what]||{};
  return Object.entries(raw).map(([k,v])=>Object.assign({k},v)).sort((a,b)=>(b.at||0)-(a.at||0));
}
const expensesOf = (gid) => listOf(gid||CURRENT, "expenses");
const paymentsOf = (gid) => listOf(gid||CURRENT, "payments");

// Which person in this group is me? Null until I have claimed a slot.
function meIn(gid){
  if(!USER) return null;
  const m=membersOf(gid).find(x=>x.uid===USER.uid);
  return m ? m.name : null;
}
const loaded = (gid) => !!(DATA[gid] && (DATA[gid].meta || DATA[gid].people || DATA[gid].expenses));

/* Nobody goes into a group twice. A second seat for the same account or
   address splits one person's balance in two; a second seat with the same
   name is worse, because the ledger is keyed by name and the two quietly
   become one. Names are compared the way people read them - "Kavya",
   "kavya" and " Kavya  " are the same - and so are addresses.
   Account first, then address, then name, so the message names the real
   reason. `exceptKey` leaves out the seat being edited. */
const normName = (s)=> String(s||"").trim().replace(/\s+/g," ").toLowerCase();
const normMail = (s)=> String(s||"").trim().toLowerCase();
const tidyName = (s)=> String(s||"").trim().replace(/\s+/g," ");
function inGroupAlready(gid, p, exceptKey){
  const list = membersOf(gid).filter(m=> m.k!==exceptKey);
  const n = normName(p.name), mail = normMail(p.email);
  let m = p.uid && list.find(x=> x.uid===p.uid);
  if(m) return {m, by:"account", text: m.name+" is already in this group"};
  m = mail && list.find(x=> normMail(x.email)===mail || normMail(x.invite)===mail);
  if(m) return {m, by:"email", text: mail+" is already in this group, as "+m.name};
  if(!n) return null;
  m = list.find(x=> normName(x.name)===n);
  if(m) return {m, by:"name", text: "Someone in this group is already called "+m.name};
  // A name that has left the members list but is still on expenses holds a
  // balance; a new seat with that name would inherit it.
  const self = exceptKey ? (membersOf(gid).find(x=>x.k===exceptKey)||{}).name : null;
  const old = everyoneIn(gid).find(x=> x!==self && normName(x)===n);
  if(old) return {m:{name:old}, by:"name", text: old+" is still on this group's expenses. Use that name, or merge"};
  return null;
}

/* A name typed for somebody who is already in Settle should be their account,
   not a label their app knows nothing about - otherwise the group never shows
   up for them. An address is proof. A whole name counts only when exactly one
   account has it: two people can share a name, and guessing wrong would hand
   one of them a stranger's group. Returns the directory entry, or null. */
/* ---------------- Interac e-Transfer details ----------------
   Kept on a person's own directory entry, so only approved Settle users can
   read them and only that person can change them. Checked on the way out as
   well as on the way in: whatever is in the database, only a plausible name
   and a real-looking address or phone number is ever shown. */
/* iPhone: every bank opens its App Store page, which shows Open when the app
   is installed - one more tap, but it always lands in the app. CIBC's
   sign-in page is listed as a universal link for its app, yet in practice it
   loaded the website instead, so it is not used. */
const ETX_BANKS = [
  {id:"cibc",       name:"CIBC",       pkg:"com.cibc.android.mobi",   appstore:"351448953",
   web:"https://www.cibc.com/en/personal-banking.html"},
  {id:"rbc",        name:"RBC",        pkg:"com.rbc.mobile.android",  appstore:"407597290", web:"https://www.rbcroyalbank.com/"},
  {id:"td",         name:"TD",         pkg:"com.td",                  appstore:"358790776", web:"https://www.td.com/ca/en/personal-banking"},
  {id:"scotiabank", name:"Scotiabank", pkg:"com.scotiabank.banking",  appstore:"341151570", web:"https://www.scotiabank.com/ca/en/personal.html"},
  {id:"bmo",        name:"BMO",        pkg:"com.bmo.mobile",          appstore:"429080319", web:"https://www.bmo.com/en-ca/main/personal/"}
];
const etxEmailOk = (s)=> /^[^\s@<>"']{1,64}@[^\s@<>"']{1,190}\.[a-z]{2,24}$/i.test(String(s||""));
const etxPhone   = (s)=> { const d=String(s||"").replace(/[^\d]/g,""); return d.length===11 && d[0]==="1" ? d.slice(1) : d; };
const etxPhoneOk = (s)=> /^\d{10}$/.test(etxPhone(s)) && !/[a-z@]/i.test(String(s||""));
function etxClean(p){
  if(!p || typeof p!=="object") return null;
  const name=tidyName(p.name).slice(0,60);
  const raw=String(p.handle||"").trim();
  let handle=null;
  if(etxEmailOk(raw)) handle=raw.toLowerCase();
  else if(etxPhoneOk(raw)){ const d=etxPhone(raw); handle="("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6); }
  return name && handle ? {name, handle} : null;
}
// What gets saved, or why it cannot be. Used for my own details and for the
// administrator filling in somebody else's, so the two cannot drift apart.
function etxRecord(name, handle){
  const n=tidyName(name).slice(0,60), h=String(handle||"").trim();
  if(!n) return "Enter the name on the Interac account";
  if(!etxEmailOk(h) && !etxPhoneOk(h)) return "Enter a valid email, or a 10-digit phone number";
  return {name:n, handle: etxEmailOk(h) ? h.toLowerCase() : etxPhone(h), at:Date.now()};
}
function etxFor(uid){ return uid && DIRECTORY && DIRECTORY[uid] ? etxClean(DIRECTORY[uid].pay) : null; }
function myBank(){ const id=(PREFS&&PREFS.bank)||""; return ETX_BANKS.find(b=>b.id===id) || null; }
/* Where "Open <bank>" goes, per phone. It is a real link the person taps -
   iOS only hands a web link to an app when it is tapped, not when a script
   navigates. Android asks Chrome for the app by its store id and falls back
   to the store page. iPhone uses the bank's universal link if it has one,
   otherwise its App Store page. A computer gets the bank's site. No personal
   detail ever goes into these addresses. */
const etxIsIOS = ()=> /iPhone|iPad|iPod/i.test(navigator.userAgent||"") ||
  (/Macintosh/i.test(navigator.userAgent||"") && (navigator.maxTouchPoints||0) > 1);
function etxBankLink(bank){
  if(!bank) return null;
  const ua=navigator.userAgent||"";
  if(/Android/i.test(ua)){
    const store="https://play.google.com/store/apps/details?id="+bank.pkg;
    return "intent://#Intent;package="+bank.pkg+";S.browser_fallback_url="+encodeURIComponent(store)+";end";
  }
  if(etxIsIOS()) return bank.ios || ("https://apps.apple.com/ca/app/id"+bank.appstore);
  return bank.web;
}
function etxCopy(text, label){
  const done=()=> toast((label||"Copied")+" copied");
  const fallback=()=>{
    const t=document.createElement("textarea"); t.value=text; t.setAttribute("readonly","");
    t.style.cssText="position:fixed;left:-9999px;top:0"; document.body.appendChild(t);
    t.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("Could not copy"); }
    document.body.removeChild(t);
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function settleAccountFor(name, email){
  const people = Object.keys(DIRECTORY||{}).map(u=> Object.assign({uid:u}, DIRECTORY[u]||{}));
  const mail = normMail(email);
  if(mail){ const p = people.find(x=> normMail(x.email)===mail); if(p) return p; }
  const n = normName(name); if(!n) return null;
  const same = people.filter(x=> normName(x.name)===n);
  return same.length===1 ? same[0] : null;
}
/* Accounts a partly typed name could mean - "kav" for "Kavya R" - offered as
   a tap, never linked on their own. Leaves out me and anyone already in the
   group. */
function settleSuggestions(name, gid){
  const n = normName(name); if(n.length<2) return [];
  const inGroup = gid ? membersOf(gid).map(m=>m.uid).filter(Boolean) : [];
  return Object.keys(DIRECTORY||{}).map(u=> Object.assign({uid:u}, DIRECTORY[u]||{}))
    .filter(p=> p.name && inGroup.indexOf(p.uid)<0 && !(USER && p.uid===USER.uid))
    .filter(p=>{ const full=normName(p.name); return full.indexOf(n)===0 || full.split(" ").some(w=> w.indexOf(n)===0); })
    .slice(0,4);
}

// Everyone the money actually involves. An expense can name someone who is no
// longer on the members list; they still hold a balance, so any screen that
// claims to show "everyone" has to include them or the figures will not add up.
function everyoneIn(gid){
  const out=names(gid).slice();
  Object.keys(balances(gid)).forEach(n=>{ if(out.indexOf(n)<0) out.push(n); });
  return out;
}

/* ---------------- who may change what ----------------
   Only whoever paid may record it. Only whoever added a line may change or remove
   it - except the administrator, who may touch anything. Older rows predate
   uid stamping, so they fall back to matching the recorded name. */
function addedByMe(rec){
  if(!USER || !rec) return false;
  if(rec.byUid) return rec.byUid===USER.uid;
  return !!ME && rec.by===ME;
}
const canEdit = (rec) => isAdmin() || addedByMe(rec);

/* Who may be named as the payer when recording something. Money goes into the
   ledger under the name of whoever paid, so only they may put it there - if
   Kelvin paid, Kelvin records it. The administrator may record for anyone.
   Everybody else gets their own name only, and nobody at all until they have
   said which name in the group is theirs. Used by every place that asks who
   paid, so they cannot drift apart. */
function payersAllowed(gid, ppl){
  if(isAdmin()) return ppl.slice();
  const me = meIn(gid);
  return me && ppl.indexOf(me) > -1 ? [me] : [];
}
function ownerOf(rec){
  if(!rec) return "someone else";
  return rec.by || "someone else";
}

// Emails are keys under invites/, and RTDB keys cannot contain a dot.
// The database rule performs the same substitution, so this must match it.
function emailKey(e){ return String(e||"").trim().toLowerCase().replace(/\./g, ","); }
const emailOk = (e) => /^[^\s@#$\[\]/]+@[^\s@#$\[\]/]+\.[^\s@#$\[\]/]+$/.test(String(e||"").trim());

/* ---------------- split maths ---------------- */
// Returns {name: amountOwed}. Modes: equal | exact | percent | shares
function sharesOf(e){
  const out={};
  const between=(e.between&&e.between.length)?e.between:[e.payer];
  const vals=e.vals||{};
  const amt=Number(e.amount)||0;
  if(e.mode==="exact"){
    between.forEach(n=> out[n]=Number(vals[n])||0 );
  } else if(e.mode==="percent"){
    between.forEach(n=> out[n]= amt*((Number(vals[n])||0)/100) );
  } else if(e.mode==="shares"){
    const tot=between.reduce((a,n)=>a+(Number(vals[n])||0),0) || 1;
    between.forEach(n=> out[n]= amt*((Number(vals[n])||0)/tot) );
  } else {
    const per=amt/between.length;
    between.forEach(n=> out[n]=per );
  }
  return out;
}
// Net position per person: positive = they are owed, negative = they owe
function balances(gid){
  const b={};
  names(gid).forEach(n=> b[n]=0 );
  expensesOf(gid).forEach(e=>{
    if(!(e.payer in b)) b[e.payer]=0;
    b[e.payer]+=Number(e.amount)||0;
    const sh=sharesOf(e);
    Object.keys(sh).forEach(n=>{ if(!(n in b)) b[n]=0; b[n]-=sh[n]; });
  });
  paymentsOf(gid).forEach(p=>{
    if(!(p.from in b)) b[p.from]=0;
    if(!(p.to   in b)) b[p.to]=0;
    b[p.from]+=Number(p.amount)||0;   // paying down what you owe
    b[p.to]  -=Number(p.amount)||0;
  });
  return b;
}
// Fewest transfers that clear everyone
function settlements(gid){
  const b=balances(gid), cred=[], deb=[];
  Object.keys(b).forEach(n=>{ const v=Math.round(b[n]*100)/100;
    if(v>0.004) cred.push({n, v}); else if(v<-0.004) deb.push({n, v:-v}); });
  cred.sort((a,c)=>c.v-a.v); deb.sort((a,c)=>c.v-a.v);
  const out=[]; let i=0,j=0,guard=0;
  while(i<deb.length && j<cred.length && guard++<9999){
    const pay=Math.min(deb[i].v, cred[j].v);
    if(pay>0.004) out.push({from:deb[i].n, to:cred[j].n, amt:pay});
    deb[i].v-=pay; cred[j].v-=pay;
    if(deb[i].v<=0.004) i++;
    if(cred[j].v<=0.004) j++;
  }
  return out;
}
// Net between two people, positive when `a` still owes `b`. Counts each
// person's share of what the other paid for, then the payments already made
// between the two.
function pairNet(gid, a, b){
  let net=0;
  expensesOf(gid).forEach(e=>{
    const sh=sharesOf(e);
    if(e.payer===b && sh[a]) net += sh[a];
    if(e.payer===a && sh[b]) net -= sh[b];
  });
  paymentsOf(gid).forEach(p=>{
    if(p.from===a && p.to===b) net -= Number(p.amount)||0;
    if(p.from===b && p.to===a) net += Number(p.amount)||0;
  });
  return Math.round(net*100)/100;
}

// What to put in the amount box for a given pair, and why.
function suggestSettle(gid, from, to){
  if(from===to) return {amt:0, why:"Pick two different people."};
  const plan=settlements(gid).find(t=>t.from===from && t.to===to);
  if(plan) return {amt:Math.round(plan.amt*100)/100,
                   why:"This clears "+(from===ME?"you":from)+" in the settle-up plan."};
  const net=pairNet(gid, from, to);
  if(net>0.004)  return {amt:net, why:(from===ME?"You owe":from+" owes")+" "+to+" this much between the two of them."};
  if(net<-0.004) return {amt:0,   why:"The other way round \u2014 "+to+" owes "+
                                      (from===ME?"you":from)+" "+money(-net)+"."};
  return {amt:0, why:"Nothing outstanding between these two."};
}

const myBalance = (gid) => { const n=meIn(gid); if(!n) return 0; const b=balances(gid); return b[n]||0; };
function totalOf(gid){ let t=0; expensesOf(gid).forEach(e=> t+=Number(e.amount)||0 ); return t; }

/* ---------------- writes ---------------- */
function ref(path){ return remote.ref(remote.db, path); }
function push(path, val){
  if(!remote){ toast("Not signed in yet"); return Promise.resolve(); }
  return remote.push(ref(path), val).catch(e=>toast("Could not save: "+e.message));
}
function set(path, val){
  if(!remote) return Promise.resolve();
  return remote.set(ref(path), val).catch(e=>toast("Could not save: "+e.message));
}
function del(path){
  if(!remote) return Promise.resolve();
  return remote.remove(ref(path)).catch(e=>toast("Could not remove: "+e.message));
}
function upd(path, obj){
  if(!remote) return Promise.resolve();
  return remote.update(ref(path), obj).catch(e=>toast("Could not save: "+e.message));
}
/* The same write, but a refusal stays a refusal. upd() above reports an error
   and then carries on as if it had worked - fine for background writes, wrong
   for a form that goes on to say "saved": the screen showed details the
   database had turned down, and a refresh took them away. */
function updStrict(path, obj){
  if(!remote) return Promise.reject(new Error("Not signed in yet"));
  return remote.update(ref(path), obj);
}
function writeError(e){
  const why=String((e && (e.code || e.message)) || "");
  return /permission/i.test(why)
    ? "The database refused this. Publish the updated rules in Firebase, then try again."
    : "Could not save: "+((e && e.message) || "try again");
}

/* ---------------- the activity outbox ----------------
   The browser holds no mail key and can send nothing. It leaves a note here
   instead; the scheduler reads it on its next pass, works out from the
   group's own membership who ought to hear, and sends. So the note says what
   happened and never who to tell - picking recipients stays on the server,
   where a tampered note cannot reach anyone it could not already reach.
   Best effort throughout: a note that fails to save must never stop the
   thing it describes from being saved. */
function notify(kind, gid, what){
  if(!remote || !USER || !USER.uid) return;
  const rec = {
    kind: kind, actorUid: USER.uid,
    actor: String(ME || USER.name || "Someone").slice(0,80),
    desc: String((what && what.desc) || "").slice(0,120),
    at: Date.now()
  };
  if(gid) rec.gid = gid;              // a request to join names no group
  const amt = Number(what && what.amount);
  if(isFinite(amt) && amt > 0) rec.amount = Math.round(amt*100)/100;
  // Which payment it is about, so a phone can be asked about exactly that one.
  const r = what && what.ref;
  if(typeof r === "string" && /^[A-Za-z0-9_-]{1,64}$/.test(r)) rec.ref = r;
  try {
    const saved = remote.push(ref("mail/queue"), rec);
    Promise.resolve(saved).catch(()=>{});
    if(PUSH_NOW_KINDS[kind]) pushNow(saved);
  } catch(e){}
}

/* Phone notifications straight away. Once the note is saved, the server is
   asked to look at this account's own notes now rather than on its next pass.
   It is only a nudge: the server checks who is asking, reads the notes itself
   and decides who hears, and if this call never lands the pass sends them
   anyway. Several saves in a moment make one call. */
const PUSH_NOW_URL = "https://trip-xi-flax.vercel.app/api/notify";
const PUSH_NOW_KINDS = {"payment.add":1, "payment.ask":1, "payment.got":1,
                        "expense.add":1, "expense.edit":1, "expense.del":1};
let pushNowT = null;
const pushNowWait = [];
function pushNow(saved){
  pushNowWait.push(Promise.resolve(saved).catch(()=>{}));
  clearTimeout(pushNowT);
  pushNowT = setTimeout(()=>{
    const waits = pushNowWait.splice(0);
    Promise.all(waits)
      .then(()=> (fb && fb.auth && fb.auth.currentUser) ? fb.auth.currentUser.getIdToken() : null)
      .then(tok=> tok ? fetch(PUSH_NOW_URL, {method:"POST", headers:{Authorization:"Bearer "+tok}}) : null)
      .catch(()=>{});
  }, 600);
}

/* ---------------- linking an account to a name ---------------- */
/* trips/{gid}/uids is the membership list the database rules read. The people
   records already carry a uid, but rules cannot scan a list, so the same fact
   is kept in a shape a rule can ask about in one step. Anything that attaches
   an account to a name has to keep this in step, or that person can no longer
   open the group. */
function joinUid(gid, uid){
  return uid ? set("trips/"+gid+"/uids/"+uid, true) : Promise.resolve();
}
function dropUid(gid, uid){
  return uid ? del("trips/"+gid+"/uids/"+uid) : Promise.resolve();
}

function linkPerson(gid, key){
  return upd("trips/"+gid+"/people/"+key,
    {uid:USER.uid, email:USER.email, photo:USER.photo||null})
    .then(()=> joinUid(gid, USER.uid) );
}
function unlinkPerson(gid, key){
  const m = membersOf(gid).find(x=>x.k===key);
  const gone = m && m.uid;
  return upd("trips/"+gid+"/people/"+key, {uid:null, email:null, photo:null})
    .then(()=> dropUid(gid, gone) );
}

// Fold one person into another: everything `from` paid, owed or was split
// into becomes `to`, and `from` disappears. Used to repair a duplicate — the
// same human entered twice — which otherwise skews every split they are in.
// One atomic update, because a half-applied merge would silently change what
// people owe.
function mergePeople(gid, from, to){
  const u={};
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) u["expenses/"+e.k+"/payer"]=to;
    const b=e.between||[];
    if(b.indexOf(from)>-1){
      const vals=Object.assign({}, e.vals||{});
      if(vals[from]!=null){
        // both halves of the duplicate contributed, so their shares add up
        vals[to]=(Number(vals[to])||0)+(Number(vals[from])||0);
        delete vals[from];
      }
      const nb=[];
      b.forEach(n=>{ const m=(n===from)?to:n; if(nb.indexOf(m)<0) nb.push(m); });
      u["expenses/"+e.k+"/between"]=nb;
      u["expenses/"+e.k+"/vals"]=vals;
    }
  });
  paymentsOf(gid).forEach(p=>{
    const f=(p.from===from)?to:p.from, t=(p.to===from)?to:p.to;
    if(f===t) u["payments/"+p.k]=null;             // paying yourself means nothing
    else{
      if(f!==p.from) u["payments/"+p.k+"/from"]=f;
      if(t!==p.to)   u["payments/"+p.k+"/to"]=t;
    }
  });
  const gone   = membersOf(gid).find(x=>x.name===from);
  const target = membersOf(gid).find(x=>x.name===to);
  if(gone){
    // If the target is only a name carried on the expenses and has no record
    // of its own, deleting the source would throw away the account, the email
    // and the colour attached to it - and leave the name orphaned exactly as
    // before. Rename the record onto that name instead: same effect on the
    // money, and the orphan is absorbed rather than perpetuated.
    if(target) u["people/"+gone.k]=null;
    else       u["people/"+gone.k+"/n"]=to;
  }
  return upd("trips/"+gid, u);
}
// What a merge would touch, so it can be described before it happens.
function mergePreview(gid, from){
  let paid=0, inSplit=0, pays=0;
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) paid++;
    if((e.between||[]).indexOf(from)>-1) inSplit++;
  });
  paymentsOf(gid).forEach(p=>{ if(p.from===from||p.to===from) pays++; });
  return {paid, inSplit, pays};
}

// Renaming has to move the name everywhere it is used as a key, or the
// balances stop adding up. One atomic update so it cannot half-apply.
function renamePerson(gid, key, from, to){
  const u={}; u["people/"+key+"/n"]=to;
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) u["expenses/"+e.k+"/payer"]=to;
    if(e.between && e.between.indexOf(from)>-1)
      u["expenses/"+e.k+"/between"]=e.between.map(n=> n===from?to:n );
    if(e.vals && Object.prototype.hasOwnProperty.call(e.vals, from)){
      const v={}; Object.keys(e.vals).forEach(n=> v[n===from?to:n]=e.vals[n] );
      u["expenses/"+e.k+"/vals"]=v;
    }
  });
  paymentsOf(gid).forEach(p=>{
    if(p.from===from) u["payments/"+p.k+"/from"]=to;
    if(p.to===from)   u["payments/"+p.k+"/to"]=to;
  });
  return upd("trips/"+gid, u);
}

/* Two people share a phone, or one person has two accounts. Everything held
   locally - the group list, the group last open, the group named in the
   address bar - belongs to whoever was signed in before, and none of it is
   the next person's to see. Signing out clears it; signing straight in as
   somebody else did not, and that is how one account came to be looking at
   another's group. Returns true when it wiped something. */
function forgetPreviousAccount(uid){
  if(!uid) return false;
  if(lsGet(LS.who, null) === uid) return false;
  JOINED = []; CURRENT = null; DATA = {};
  try{ localStorage.removeItem(LS.grp); localStorage.removeItem(LS.cur); }catch(e){}
  forgetCachedGroups();     // the last account's groups are not this one's to see
  if(typeof location !== "undefined" && location.hash) location.hash = "";
  lsSet(LS.who, uid);
  return true;
}

/* ---------------- which groups I am in ---------------- */
function rememberGroup(id, name){
  if(!JOINED.some(g=>g.id===id)) JOINED.push({id, name});
  else JOINED = JOINED.map(g=> g.id===id ? {id, name:name||g.name} : g);
  lsSet(LS.grp, JOINED);
  if(remote && USER) set("users/"+USER.uid+"/groups/"+id, {name:name||id, at:Date.now()});
}
function forgetGroup(id){
  JOINED = JOINED.filter(g=>g.id!==id); lsSet(LS.grp, JOINED);
  if(subs[id]){ subs[id](); delete subs[id]; }
  delete DATA[id];
  if(remote && USER){
    del("users/"+USER.uid+"/groups/"+id);
    // And the invite that brought it here. Left behind, the app read it on the
    // next load and put the group straight back on the list - so leaving a
    // group, or losing a deleted one, never stuck.
    if(USER.email) del("invites/"+emailKey(USER.email)+"/"+id);
  }
}
function groupName(id){
  const g=DATA[id]&&DATA[id].meta&&DATA[id].meta.name;
  if(g) return g;
  const j=JOINED.find(x=>x.id===id);
  return j? j.name : "Group";
}

const autoLinked = {};       // gid -> the silent link has been attempted

// An account pinned to a name in PEOPLE_LINKS takes that name without being
// asked, as long as it is on the list and nobody else has it.
function autoLink(gid){
  if(!USER || !remote || autoLinked[gid] || meIn(gid)) return false;
  const mine=(USER.email||"").toLowerCase();
  // Somebody added them by email, so the seat is already theirs.
  let m = membersOf(gid).find(x=> !x.uid && x.invite && x.invite===mine );
  if(!m){
    const want = linkedName(USER.email);
    if(!want) return false;
    m = membersOf(gid).find(x=> !x.uid && x.name.toLowerCase()===want.toLowerCase() );
  }
  if(!m) return false;
  autoLinked[gid]=true; claimAsked[gid]=true;
  linkPerson(gid, m.k);
  return true;
}
