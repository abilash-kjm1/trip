/* Every debt in every group, with each person known across groups - by their
   account where they have one, by name where they do not - and then netted
   between each pair: owing Kavya $30 in one group and being owed $20 by her
   in another becomes one $10 payment. Only pairs are netted, never routed
   through a third person, so nobody is asked to pay somebody they never
   shared anything with. */
function vzLedger(){
  const meKey = USER ? "u:"+USER.uid : null;
  const people = {};
  const touch=(gid, name)=>{
    const m=membersOf(gid).find(x=>x.name===name);
    const key = m && m.uid ? "u:"+m.uid : "n:"+normName(name);
    if(!people[key]){
      const d = m && m.uid && DIRECTORY[m.uid];
      people[key]={key, uid:(m&&m.uid)||null, name: key===meKey ? "You" : ((d&&d.name)||name),
        color: vzColor((m&&m.color)||colorOf(name, gid)), photo:(m&&m.photo)||null, net:0};
    }
    return people[key];
  };
  const edges=[];
  JOINED.forEach(g=>{
    if(!loaded(g.id)) return;
    settlements(g.id).forEach(s=>{
      const a=touch(g.id, s.from), b=touch(g.id, s.to);
      if(a.key===b.key) return;
      a.net-=s.amt; b.net+=s.amt;
      edges.push({gid:g.id, from:a.key, to:b.key, fromName:s.from, toName:s.to, amt:s.amt});
    });
  });
  const pairs={};
  edges.forEach(e=>{
    const lo = e.from<e.to ? e.from : e.to, hi = e.from<e.to ? e.to : e.from;
    const k=lo+"|"+hi;
    (pairs[k]=pairs[k]||{lo, hi, sum:0, parts:[]});
    pairs[k].sum += (e.from===lo ? 1 : -1) * e.amt;
    pairs[k].parts.push(e);
  });
  const transfers=Object.keys(pairs).map(k=>{
    const p=pairs[k], s=Math.round(p.sum*100)/100;
    return {from: s>=0 ? p.lo : p.hi, to: s>=0 ? p.hi : p.lo, amt: Math.abs(s), parts: p.parts};
  });
  return {meKey, people, edges, transfers};
}

/* ---------- 1. settle everything ---------- */
function vzSettleEverything(main, L){
  const sec=vzSection(main, "hub", "Settle everything", "Every debt across your groups, netted into the fewest payments.");
  const moves=L.transfers.filter(t=>t.amt>0.004);
  const card=el("div","card vz-card");
  sec.appendChild(card);
  if(!moves.length){
    card.innerHTML='<div class="vz-empty"><span class="ms" aria-hidden="true">celebration</span><b>Everyone is square</b>'+
      '<p>Nobody owes anybody in any of your groups.</p></div>';
  } else {
    const before=L.edges.length;
    card.innerHTML=
      '<div class="vz-headline"><span class="vz-big">'+moves.length+'</span><span>payment'+(moves.length===1?'':'s')+
        ' clear'+(moves.length===1?'s':'')+' everything'+(before>moves.length ? ' <em>instead of '+before+'</em>' : '')+'</span></div>'+
      vzNetSvg(L, moves)+
      '<p class="vz-legendline"><span class="vz-key out"></span>you pay <span class="vz-key in"></span>paid to you '+
        '<span class="vz-key other"></span>between others</p>';
    const list=el("div","vz-list");
    const rank=t=> t.from===L.meKey ? 0 : t.to===L.meKey ? 1 : 2;
    const ini=p=> p.key===L.meKey && USER ? USER.name : p.name;   // your own initials, not "Y" for You
    moves.slice().sort((a,b)=> rank(a)-rank(b) || b.amt-a.amt).forEach(t=>{
      const A=L.people[t.from], B=L.people[t.to], out=t.from===L.meKey, inn=t.to===L.meKey;
      const gnames=[]; t.parts.forEach(p=>{ const n=groupName(p.gid); if(gnames.indexOf(n)<0) gnames.push(n); });
      const r=el("div","vz-move"+(out||inn?" vz-mine":""));
      r.innerHTML=
        '<span class="vz-pair">'+avatarHTML("", ini(A), A.color, A.photo)+'<span class="ms" aria-hidden="true">arrow_forward</span>'+
          avatarHTML("", ini(B), B.color, B.photo)+'</span>'+
        '<span class="vz-b"><span class="vz-t"><b>'+esc(A.name)+'</b> '+(out?'pay':'pays')+' <b>'+esc(inn?'you':B.name)+'</b></span>'+
          '<span class="vz-m">'+(t.parts.length>1 ? 'Nets '+t.parts.length+' debts · ' : '')+esc(gnames.join(", "))+'</span></span>'+
        '<span class="vz-r"><span class="vz-val '+(out?'neg':inn?'pos':'')+'">'+esc(money(t.amt))+'</span></span>';
      const right=r.querySelector(".vz-r");
      if(out) right.appendChild(vzPayBtn(()=> sheetNetSettle(t, L)));
      else if(inn){
        const p=t.parts.filter(x=>x.to===L.meKey).sort((a,b)=>b.amt-a.amt)[0];
        if(p) right.appendChild(vzRemindBtn(p.gid, p.fromName, t.amt));
      }
      list.appendChild(r);
    });
    card.appendChild(list);
  }
  // Even with somebody overall, while each group still shows a debt.
  L.transfers.filter(t=>t.amt<=0.004 && (t.from===L.meKey || t.to===L.meKey)).forEach(t=>{
    const other=L.people[t.from===L.meKey ? t.to : t.from];
    const n=el("div","vz-even");
    n.innerHTML='<span class="ms" aria-hidden="true">balance</span><span>Even with <b>'+esc(other.name)+
      '</b> across groups, but each group still shows a debt.</span>';
    const b=el("button","vz-btn soft","Mark even"); b.type="button";
    b.addEventListener("click", ()=> sheetNetSettle(t, L));
    n.appendChild(b);
    card.appendChild(n);
  });
}

function vzNetSvg(L, moves){
  const keys=[];
  moves.forEach(t=>[t.from, t.to].forEach(k=>{ if(keys.indexOf(k)<0) keys.push(k); }));
  const W=340, H=300, cx=170, cy=142;
  const hasMe=keys.indexOf(L.meKey)>-1, ring=keys.filter(k=>!(hasMe && k===L.meKey)), n=ring.length;
  const pos={};
  if(hasMe) pos[L.meKey]={x:cx, y:cy};
  const rx = (hasMe || n>1) ? 120 : 0, ry = (hasMe || n>1) ? 98 : 0;
  ring.forEach((k,i)=>{
    const a=-Math.PI/2 + i*2*Math.PI/Math.max(1,n) + (hasMe ? 0 : Math.PI/Math.max(2,n));
    pos[k]={x:cx+rx*Math.cos(a), y:cy+ry*Math.sin(a)};
  });
  const f=v=>Math.round(v*10)/10;
  const maxAmt=Math.max.apply(null, moves.map(t=>t.amt)) || 1;
  const maxNet=Math.max.apply(null, keys.map(k=>Math.abs(L.people[k].net))) || 1;
  const rad={}; keys.forEach(k=>{ rad[k]=17+9*Math.min(1, Math.abs(L.people[k].net)/maxNet); });
  let flows="", labels="", nodes="";
  moves.forEach(t=>{
    const a=pos[t.from], b=pos[t.to];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const bend=Math.min(30, len*.2), qx=(a.x+b.x)/2 - dy/len*bend, qy=(a.y+b.y)/2 + dx/len*bend;
    const trim=(p, r)=>{ const vx=qx-p.x, vy=qy-p.y, d=Math.hypot(vx,vy)||1; return {x:p.x+vx/d*r, y:p.y+vy/d*r}; };
    const s=trim(a, rad[t.from]+3), e=trim(b, rad[t.to]+8);
    const tone = t.from===L.meKey ? "out" : t.to===L.meKey ? "in" : "other";
    flows+='<path class="vz-flow '+tone+'" d="M'+f(s.x)+' '+f(s.y)+' Q'+f(qx)+' '+f(qy)+' '+f(e.x)+' '+f(e.y)+
      '" stroke-width="'+f(1.8+3.2*t.amt/maxAmt)+'" marker-end="url(#vzA-'+tone+')"/>';
    // On the curve itself, halfway along - clear of the circles at either end.
    const mx=.25*a.x+.5*qx+.25*b.x, my=.25*a.y+.5*qy+.25*b.y;
    labels+='<text class="vz-amt" x="'+f(mx)+'" y="'+f(my+4)+'">'+esc(money(t.amt))+'</text>';
  });
  keys.forEach(k=>{
    const p=L.people[k], q=pos[k], r=rad[k], me=k===L.meKey;
    const nm = p.name.length>12 ? p.name.slice(0,11)+"…" : p.name;
    nodes+='<g class="vz-node'+(me?' me':'')+'"><circle cx="'+f(q.x)+'" cy="'+f(q.y)+'" r="'+f(r)+'" style="fill:'+p.color+'"/>'+
      '<text class="ini" x="'+f(q.x)+'" y="'+f(q.y)+'">'+esc(initials(me && USER ? USER.name : p.name))+'</text>'+
      // You sit in the middle with arrows on every side; the ring says it is you.
      (me ? '' : '<text class="nm" x="'+f(q.x)+'" y="'+f(q.y < cy-10 ? q.y-r-7 : q.y+r+14)+'">'+esc(nm)+'</text>')+'</g>';
  });
  const marker=tone=>'<marker id="vzA-'+tone+'" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">'+
    '<path class="vz-arrow '+tone+'" d="M0 0L10 5L0 10z"/></marker>';
  return '<svg class="vz-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Who pays whom across your groups">'+
    '<defs>'+marker("out")+marker("in")+marker("other")+'</defs>'+flows+nodes+labels+'</svg>';
}

/* One payment to somebody that clears what you owe them in every group, less
   what they owe you. Written as a payment in each group so every group's own
   balances come out right: what you owed is paid, and what they owed you is
   marked as netted against it - not as money you received. */
function sheetNetSettle(t, L){
  const iSend = t.from===L.meKey && t.amt>0.004;
  if(!iSend && t.amt>0.004) return;              // only whoever pays records it
  const other=L.people[t.from===L.meKey ? t.to : t.from];
  const groups=[]; t.parts.forEach(p=>{ if(groups.indexOf(p.gid)<0) groups.push(p.gid); });
  const lines=t.parts.map(p=>{
    const mineOut=p.from===L.meKey;
    return '<div class="ns-line"><span>'+esc(groupName(p.gid))+'</span><span class="'+(mineOut?'neg':'pos')+'">'+
      (mineOut ? 'You owe ' : 'Owes you ')+esc(money(p.amt))+'</span></div>';
  }).join("");
  openSheet(iSend ? "Settle with "+other.name : "Even with "+other.name, (b)=>{
    b.innerHTML=
      '<p class="pf-sub">'+(t.parts.length>1
        ? 'One payment clears '+t.parts.length+' debts in '+groups.length+' group'+(groups.length===1?'':'s')+'.'
        : 'This clears the debt.')+'</p>'+
      '<div class="ns-lines">'+lines+
        '<div class="ns-line total"><span>'+(iSend ? 'You send' : 'Nothing to send')+'</span><b>'+esc(money(t.amt))+'</b></div></div>'+
      '<div id="nsEtx"></div>'+
      vzSlideHTML("nsSlide", iSend ? "Slide to record "+money(t.amt) : "Slide to mark even")+
      '<p class="pf-slide-hint">'+(t.parts.some(p=>p.to===L.meKey)
        ? 'What '+esc(other.name)+' owed you is marked as netted, not as money received.'
        : 'Slide all the way across to record it.')+'</p>';
    if(iSend){
      const p0=t.parts.find(p=>p.from===L.meKey) || t.parts[0];
      drawEtx($("nsEtx"), p0.gid, p0.fromName, p0.toName, t.amt, null);
    }
    const save=()=>{
      const at=Date.now(), multi=t.parts.length>1;
      t.parts.forEach(p=>{
        const mineOut=p.from===L.meKey, amt=Math.round(p.amt*100)/100;
        const rec={from:p.fromName, to:p.toName, amount:amt, at:at, by:meIn(p.gid)||USER.name, byUid:USER.uid,
          note: mineOut ? (multi ? "Net settle-up across groups" : "") : "Netted against other groups"};
        if(!mineOut) rec.netted=true;
        else rec.ask=true;                 // real money moved: its receiver is asked
        const key="p"+uid();
        set("trips/"+p.gid+"/payments/"+key, rec);
        notify("payment.add", p.gid, {desc: mineOut ? rec.from+" paid "+rec.to : rec.from+"'s debt to "+rec.to+" netted",
                                      amount:amt, ref:key});
      });
      closeSheet();
      setTimeout(()=> iSend ? celebratePayment(t.amt, other.name) : toast("Marked even with "+other.name), 260);
      return true;
    };
    slideToConfirm($("nsSlide"), save);
  });
}

/* ---------- 2. who should pay next ---------- */
function vzWhoNext(main){
  const sec=vzSection(main, "autorenew", "Who should pay next", "Who has fronted more than their share - and whose turn it is.");
  const groups=JOINED.filter(g=> loaded(g.id) && expensesOf(g.id).length && names(g.id).length>1)
    .sort((a,b)=> vzLastAt(b.id)-vzLastAt(a.id));
  if(!groups.length){
    sec.appendChild(el("p","vz-note","Add a couple of expenses to a group of two or more to see whose turn it is."));
    return;
  }
  if(!VZ_GROUP || !groups.some(g=>g.id===VZ_GROUP)) VZ_GROUP=groups[0].id;
  const card=el("div","card vz-card"); sec.appendChild(card);
  if(groups.length>1){
    const chips=el("div","vz-chips");
    groups.forEach(g=>{
      const c=el("button","chip"); c.type="button"; c.textContent=groupName(g.id);
      c.setAttribute("aria-pressed", g.id===VZ_GROUP ? "true" : "false");
      c.addEventListener("click", ()=>{ VZ_GROUP=g.id; render(); });
      chips.appendChild(c);
    });
    card.appendChild(chips);
  }
  const gid=VZ_GROUP, ppl=names(gid), me=meIn(gid);
  const paid={}, share={}; ppl.forEach(n=>{ paid[n]=0; share[n]=0; });
  let total=0;
  expensesOf(gid).forEach(e=>{
    const a=Number(e.amount)||0; total+=a;
    if(paid[e.payer]!=null) paid[e.payer]+=a;
    const sh=sharesOf(e); Object.keys(sh).forEach(n=>{ if(share[n]!=null) share[n]+=sh[n]; });
  });
  const rows=ppl.map(n=>({n, paid:paid[n], share:share[n], gap:Math.round((paid[n]-share[n])*100)/100, color:vzColor(colorOf(n, gid))}));
  const next=rows.slice().sort((a,b)=> a.gap-b.gap)[0];
  const lead=rows.slice().sort((a,b)=> b.paid-a.paid)[0];
  const who=n=> n===me ? "You" : n;

  const R=56, C=2*Math.PI*R; let off=0;
  const segs=rows.filter(r=>r.paid>0.004).map(r=>{
    const len=total ? r.paid/total*C : 0;
    const s='<circle class="vz-seg" cx="75" cy="75" r="'+R+'" style="stroke:'+r.color+'" stroke-dasharray="'+
      Math.max(0, len-2.5).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"/>';
    off+=len; return s;
  }).join("");
  const behind = next.gap < -0.004;
  const turn=el("div","vz-turn");
  turn.innerHTML=
    '<div class="vz-donut"><svg viewBox="0 0 150 150" aria-hidden="true"><circle class="trk" cx="75" cy="75" r="'+R+'"/>'+segs+'</svg>'+
      '<div class="vz-donut-c"><small>Next up</small><b>'+esc(behind ? who(next.n) : "Anyone")+'</b></div></div>'+
    '<div class="vz-turn-txt"><p>'+(behind
        ? (next.n===me
            ? 'It’s <b>your turn</b> - you’re '+esc(money(-next.gap))+' behind your share in '+esc(groupName(gid))+'.'
            : '<b>'+esc(next.n)+'</b> is furthest behind ('+esc(money(-next.gap))+'), so it’s their turn to pay.')
        : 'Everyone has fronted about their share - anyone can take the next one.')+'</p>'+
      (total>0.004 && lead ? '<p class="vz-small">'+esc(who(lead.n))+(lead.n===me?' have':' has')+' covered '+
        Math.round(lead.paid/total*100)+'% of the '+esc(money(total))+' spent.</p>' : '')+
    '</div>';
  card.appendChild(turn);
  if(behind && next.n===me){
    const b=el("button","btn p vz-next","+  Add the next expense"); b.type="button";
    b.addEventListener("click", ()=>{ QA_LAST=gid; sheetQuickAdd(); });
    turn.querySelector(".vz-turn-txt").appendChild(b);
  }
  const maxV=Math.max.apply(null, rows.map(r=>Math.max(r.paid, r.share))) || 1;
  const bars=el("div","vz-bars");
  rows.slice().sort((a,b)=> b.gap-a.gap).forEach(r=>{
    const tone=r.gap>0.004 ? "pos" : r.gap<-0.004 ? "neg" : "zero";
    const row=el("div","vz-bar-row");
    row.innerHTML=
      '<span class="vz-bar-n"><span class="vz-dot" style="background:'+r.color+'"></span>'+esc(who(r.n))+'</span>'+
      '<span class="vz-gap '+tone+'">'+(tone==="pos" ? esc(money(r.gap))+" ahead" : tone==="neg" ? esc(money(-r.gap))+" behind" : "even")+'</span>'+
      '<span class="vz-track"><span class="vz-fill" style="width:'+(r.paid/maxV*100).toFixed(1)+'%;background:'+r.color+'"></span>'+
        '<span class="vz-mark" style="left:calc('+(r.share/maxV*100).toFixed(1)+'% - 1px)"></span></span>'+
      '<span class="vz-sub">Fronted '+esc(money(r.paid))+' · fair share '+esc(money(r.share))+'</span>';
    bars.appendChild(row);
  });
  card.appendChild(bars);
  card.appendChild(el("p","vz-note","The bar is what each person paid; the line is their fair share."));
}

/* ---------- 3. what this really cost you ---------- */
function vzRealCost(main){
  const sec=vzSection(main, "pie_chart", "What this really cost you", "Your own share of the spending - not the group’s total.");
  const cats={}; let share=0, paid=0, groupTotal=0; const per=[];
  JOINED.forEach(g=>{
    if(!loaded(g.id)) return;
    const me=meIn(g.id); if(!me) return;
    const gc={}; let gs=0;
    expensesOf(g.id).forEach(e=>{
      const a=Number(e.amount)||0; groupTotal+=a;
      if(e.payer===me) paid+=a;
      const s=sharesOf(e)[me]||0;
      if(s>0.004){ const k=catOf(e.cat).k; gc[k]=(gc[k]||0)+s; cats[k]=(cats[k]||0)+s; gs+=s; }
    });
    if(gs>0.004) per.push({gid:g.id, share:gs, cats:gc});
    share+=gs;
  });
  const card=el("div","card vz-card"); sec.appendChild(card);
  if(share<0.005){
    card.innerHTML='<div class="vz-empty"><span class="ms" aria-hidden="true">receipt_long</span><b>Nothing on you yet</b>'+
      '<p>Once you’re part of an expense, your share shows up here.</p></div>';
    return;
  }
  const order=Object.keys(cats).sort((a,b)=> cats[b]-cats[a]);
  const stack=(cmap, tot)=> '<div class="vz-stack">'+order.filter(k=>cmap[k]).map(k=>
    '<i style="width:'+(cmap[k]/tot*100).toFixed(2)+'%;background:'+(VZ_CAT_TINT[k]||"#8A8F84")+'" title="'+esc(catOf(k).n)+'"></i>').join("")+'</div>';
  const diff=Math.round((paid-share)*100)/100;
  card.innerHTML=
    '<div class="vz-headline"><span class="vz-big">'+esc(money(share))+'</span><span>your share of '+esc(money(groupTotal))+' spent</span></div>'+
    '<p class="vz-note vz-tight">You fronted '+esc(money(paid))+(diff>0.004 ? ' - '+esc(money(diff))+' more than your share.'
      : diff<-0.004 ? ' - '+esc(money(-diff))+' less than your share.' : ', exactly your share.')+'</p>'+
    stack(cats, share)+
    '<div class="vz-legend">'+order.map(k=>
      '<span class="vz-leg"><span class="ms" aria-hidden="true" style="background:'+(VZ_CAT_TINT[k]||"#8A8F84")+'">'+catOf(k).i+'</span>'+
      '<span class="vz-leg-n">'+esc(catOf(k).n)+'</span><b>'+esc(money(cats[k]))+'</b></span>').join("")+'</div>'+
    (per.length>1 ? '<div class="vz-gl">'+per.sort((a,b)=> b.share-a.share).map(p=>
      '<div class="vz-gl-row"><span>'+esc(groupName(p.gid))+'</span><b>'+esc(money(p.share))+'</b>'+stack(p.cats, p.share)+'</div>').join("")+'</div>' : '');
}

/* ---------- 4. old debts ---------- */
function vzOldDebts(main, L){
  const sec=vzSection(main, "hourglass_bottom", "Old debts", "How long each balance has been waiting.");
  const now=Date.now(), items=[];
  L.edges.forEach(e=>{
    if(e.from!==L.meKey && e.to!==L.meKey) return;
    const gid=e.gid, a=e.fromName, b=e.toName;
    // From the last time money moved between the two, or the first expense
    // they shared after it.
    let since=0;
    paymentsOf(gid).forEach(p=>{
      if((p.from===a && p.to===b) || (p.from===b && p.to===a)){ const t=Number(p.at)||0; if(t>since) since=t; }
    });
    let start=null;
    expensesOf(gid).forEach(x=>{
      const at=Number(x.at)||0; if(!at || at<=since) return;
      const sh=sharesOf(x);
      if(((x.payer===a && sh[b]) || (x.payer===b && sh[a])) && (start===null || at<start)) start=at;
    });
    if(start===null) expensesOf(gid).forEach(x=>{ const at=Number(x.at)||0; if(at>since && (start===null || at<start)) start=at; });
    items.push({e, days: start ? Math.max(0, Math.floor((now-start)/864e5)) : 0});
  });
  const card=el("div","card vz-card"); sec.appendChild(card);
  if(!items.length){
    card.innerHTML='<div class="vz-empty"><span class="ms" aria-hidden="true">task_alt</span><b>No debts waiting</b>'+
      '<p>Nothing is owed to you or by you right now.</p></div>';
    return;
  }
  items.sort((x,y)=> y.days-x.days || y.e.amt-x.e.amt);
  const span=Math.max(45, items[0].days);
  items.forEach(it=>{
    const e=it.e, days=it.days, out=e.from===L.meKey;
    const other=L.people[out ? e.to : e.from], otherName=out ? e.toName : e.fromName;
    const tone=days>30 ? "old" : days>=14 ? "warm" : "fresh";
    const r=el("div","vz-debt");
    r.innerHTML=
      '<div class="vz-debt-top">'+avatarHTML("", other.name, other.color, other.photo)+
        '<span class="vz-b"><span class="vz-t">'+(out ? 'You owe <b>'+esc(other.name)+'</b>' : '<b>'+esc(other.name)+'</b> owes you')+
          ' <b>'+esc(money(e.amt))+'</b></span><span class="vz-m">'+esc(groupName(e.gid))+'</span></span>'+
        '<span class="vz-days '+tone+'">'+(days===0 ? "today" : days===1 ? "1 day" : days+" days")+'</span></div>'+
      '<div class="vz-agebar"><i class="'+tone+'" style="width:'+Math.max(4, Math.min(100, days/span*100)).toFixed(1)+'%"></i></div>';
    r.querySelector(".vz-debt-top").appendChild(out
      ? vzPayBtn(()=> vzPay(e.gid, e.fromName, e.toName, e.amt))
      : vzRemindBtn(e.gid, otherName, e.amt));
    card.appendChild(r);
  });
  card.appendChild(el("p","vz-note","Amber after two weeks, red after a month. A gentle reminder now is easier than an awkward one later."));
}

/* ---------- 5. leave clean ---------- */
function vzLeaveClean(main, L){
  const sec=vzSection(main, "door_open", "Leave clean", "What stands between you and walking away from each group owing nothing.");
  const gs=JOINED.filter(g=> loaded(g.id) && meIn(g.id)).map(g=>({
    gid:g.id, mine:L.edges.filter(e=> e.gid===g.id && (e.from===L.meKey || e.to===L.meKey))
  })).sort((a,b)=> b.mine.length-a.mine.length || groupName(a.gid).localeCompare(groupName(b.gid)));
  if(!gs.length){ sec.appendChild(el("p","vz-note","Say which name is yours in a group to see this.")); return; }
  const wrap=el("div","vz-leave"); sec.appendChild(wrap);
  gs.forEach(g=>{
    const mine=g.mine;
    const pay=mine.filter(e=>e.from===L.meKey).reduce((s,e)=>s+e.amt, 0);
    const get=mine.filter(e=>e.to===L.meKey).reduce((s,e)=>s+e.amt, 0);
    const c=el("div","card vz-lc"+(mine.length ? "" : " clean"));
    c.innerHTML=
      '<div class="vz-lc-h"><b>'+esc(groupName(g.gid))+'</b>'+(mine.length
        ? '<span class="vz-todo">'+mine.length+' to do</span>'
        : '<span class="vz-ok"><span class="ms" aria-hidden="true">check_circle</span>Clean</span>')+'</div>'+
      '<p class="vz-lc-sum">'+(mine.length
        ? (pay>0.004 ? 'Pay <b>'+esc(money(pay))+'</b>' : '')+(pay>0.004 && get>0.004 ? ' · ' : '')+
          (get>0.004 ? 'Collect <b>'+esc(money(get))+'</b>' : '')
        : 'You owe nothing here and nobody owes you. You can leave any time.')+'</p>';
    mine.forEach(e=>{
      const out=e.from===L.meKey, name=out ? e.toName : e.fromName;
      const line=el("div","vz-lc-line");
      line.innerHTML='<span class="ms" aria-hidden="true">'+(out ? 'north_east' : 'south_west')+'</span>'+
        '<span class="vz-lc-t">'+(out ? 'Pay <b>'+esc(name)+'</b>' : 'Collect from <b>'+esc(name)+'</b>')+'</span>'+
        '<b class="vz-val '+(out ? 'neg' : 'pos')+'">'+esc(money(e.amt))+'</b>';
      line.appendChild(out ? vzPayBtn(()=> vzPay(g.gid, e.fromName, e.toName, e.amt)) : vzRemindBtn(g.gid, name, e.amt));
      c.appendChild(line);
    });
    wrap.appendChild(c);
  });
}

/* ======================= DID THE MONEY ARRIVE? =======================
   Recording a payment is the payer's word. The person it went to is asked,
   on their own phone, to check their bank and say whether it landed:

     payments/{k}.ask  true          - set when the payment is recorded
     payments/{k}.got  {ok, at, uid, name}
                                     - written by the receiver: ok true when
                                       it arrived, false when it has not

   The ask arrives as a slip that drops from the top of the screen and stays
   until they answer. "Not yet" puts it away for a few hours on this device
   and writes nothing. The payer hears back either way: a short note when it
   is confirmed, and a slip of their own when it has not arrived.

   Balances do not wait for the answer. The payer's record still counts, as
   it always has; this adds a second pair of eyes, not a second gate.
   Payments from before this existed carry no `ask` and are never asked
   about, and nobody is asked about money netted across groups, because none
   moved. */

const ARR_SNOOZE_KEY = "settle.arrive.snooze.v1";   // "gid/k" -> ask again after
const ARR_SEEN_KEY   = "settle.arrive.seen.v1";     // "gid/k@at" -> when it was seen
const ARR_SNOOZE_MS  = 3 * 3600e3;
const ARR_NEWS_DAYS  = 14;
let ARR = null;                                     // {id, kind, node, busy}

// A little bookkeeping for the two lists on the device, pruned as it goes.
// Held in memory as well, so a browser that refuses storage (a private
// window) still does not ask the same question again straight after "Not yet".
const ARR_MEM = {};
function arrMap(key){
  const m=lsGet(key, {});
  return Object.assign({}, ARR_MEM[key]||{}, (m && typeof m==="object") ? m : {});
}
function arrKeep(key, id, value, maxAge){
  const m=arrMap(key), now=Date.now();
  Object.keys(m).forEach(k=>{ if(!(Number(m[k]) > now - maxAge)) delete m[k]; });
  m[id]=value; ARR_MEM[key]=m; lsSet(key, m);
}

/* Where a payment stands, from where I am sitting. Null when there is nothing
   to say: an old payment, money netted across groups, or a name with no
   account behind it, who could never be asked. */
function payState(p, gid){
  if(!p || p.netted) return null;
  const me = meIn(gid), toMe = !!me && p.to===me;
  const who = toMe ? "you" : p.to;
  if(p.got && p.got.ok===true)  return {k:"ok",   i:"verified",   t: toMe ? "You confirmed it" : p.to+" got it"};
  if(p.got && p.got.ok===false) return {k:"no",   i:"error",      t: toMe ? "You said it hasn't arrived" : "Not arrived yet"};
  if(!p.ask) return null;
  const m = memberOf(p.to, gid);
  if(!m || !m.uid) return null;
  return {k:"wait", i:"schedule", t:"Waiting for "+who};
}
function payStateHTML(p, gid){
  const s=payState(p, gid);
  return s ? '<span class="pst '+s.k+'"><span class="ms" aria-hidden="true">'+s.i+'</span>'+esc(s.t)+'</span>' : '';
}

// Payments waiting on me to say whether they arrived, oldest first.
function arrivalsDue(){
  if(!USER) return [];
  const snooze=arrMap(ARR_SNOOZE_KEY), now=Date.now(), out=[];
  JOINED.forEach(g=>{
    const me=meIn(g.id); if(!me) return;
    paymentsOf(g.id).forEach(p=>{
      if(!p.ask || p.netted || p.got || p.to!==me || p.from===me) return;
      if(p.byUid && p.byUid===USER.uid) return;          // the admin recording their own
      const id=g.id+"/"+p.k;
      if((Number(snooze[id])||0) > now) return;
      out.push({id, gid:g.id, p});
    });
  });
  return out.sort((a,b)=> (Number(a.p.at)||0) - (Number(b.p.at)||0));
}

// Answers to payments I recorded that I have not seen yet.
function arrivalsNews(){
  if(!USER) return [];
  const seen=arrMap(ARR_SEEN_KEY), now=Date.now(), out=[];
  JOINED.forEach(g=> paymentsOf(g.id).forEach(p=>{
    if(!p.got || p.netted || p.byUid!==USER.uid) return;
    const at=Number(p.got.at)||0;
    if(now - at > ARR_NEWS_DAYS*864e5) return;
    const id=g.id+"/"+p.k+"@"+at;
    if(seen[id]) return;
    out.push({id, gid:g.id, p, kind: p.got.ok ? "ok" : "no"});
  }));
  // The ones that need doing something about come first.
  return out.sort((a,b)=> (a.kind==="no"?0:1)-(b.kind==="no"?0:1) || (Number(a.p.got.at)||0)-(Number(b.p.got.at)||0));
}

/* Called at the end of every render. Cheap when nothing has changed: the slip
   on screen is left alone - no restarted animation, no lost focus - unless
   what it is showing has been answered somewhere else. */
function arrivals(){
  if(!USER || !mayUse()){ arrClose(true); return; }
  if(ARR && ARR.busy) return;
  const due=arrivalsDue();
  if(due.length){
    if(ARR && ARR.kind==="in" && ARR.id===due[0].id){ arrCount(due.length); return; }
    arrClose(true); arrIncoming(due[0], due.length); return;
  }
  // A "got it" note is marked seen the moment it shows, so it is no longer on
  // the list - it goes by itself, and asks for the next one when it does.
  if(ARR && ARR.kind==="ok") return;
  const news=arrivalsNews();
  if(news.length){
    const n=news[0];
    if(ARR && ARR.id===n.id) return;
    arrClose(true);
    if(n.kind==="ok") arrConfirmed(n); else arrNotArrived(n);
    return;
  }
  if(ARR) arrClose();
}

function arrClose(now){
  if(!ARR) return;
  const node=ARR.node; ARR=null;
  if(now){ node.remove(); return; }
  node.classList.add("out");
  setTimeout(()=> node.remove(), 420);
}
// Put away this slip - and only this one. By the time a save comes back the
// redraw it caused may already have put the next slip up, which must stay.
function arrDone(node){
  if(ARR && ARR.node===node) arrClose();
  else if(node.isConnected){ node.classList.add("out"); setTimeout(()=> node.remove(), 420); }
  setTimeout(arrivals, 460);
}
function arrCount(n){
  if(!ARR || !ARR.node) return;
  const c=ARR.node.querySelector(".arr-count");
  if(c){ c.hidden = n<2; c.textContent = "1 of "+n; }
}

// A face: their picture, or initials on their colour.
function arrFace(name, gid, cls){
  const m=memberOf(name, gid);
  const bg=(m && m.color) || colorOf(name, gid);
  return m && m.photo
    ? '<span class="arr-av '+(cls||"")+'"><img src="'+esc(m.photo)+'" alt="" referrerpolicy="no-referrer"></span>'
    : '<span class="arr-av '+(cls||"")+'" style="background:'+esc(bg)+'">'+esc(initials(name))+'</span>';
}
function arrAgo(ts){
  const s=Math.max(0, (Date.now()-(Number(ts)||0))/1000);
  if(s < 60) return "just now";
  if(s < 3600) return Math.round(s/60)+" min ago";
  if(s < 86400) return Math.round(s/3600)+" h ago";
  return fmtDate(ts);
}

/* A soft two-note knock when a slip arrives. Browsers only play sound after
   the page has been touched, so on a fresh open this is silent - which is
   the right way round for something that appears unasked. */
function arrKnock(){
  try{ SFX.knock(); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([10, 90, 10]); }catch(e){}
}

/* ---------- the receiver: did it land? ---------- */
function arrIncoming(item, total){
  const {gid, p}=item, amt=Number(p.amount)||0, me=meIn(gid);
  const bank=myBank(), bankHref=bank && etxBankLink(bank);
  const node=el("div","arr");
  node.innerHTML=
    '<div class="arr-scrim" aria-hidden="true"></div>'+
    '<div class="arr-hold">'+
    '<div class="arr-slip" role="alertdialog" aria-modal="true" aria-labelledby="arrQ" aria-describedby="arrWhat">'+
      '<div class="arr-top">'+
        '<div class="arr-eyebrow"><span class="arr-ping" aria-hidden="true"></span>'+
          '<span class="arr-grp">'+esc(groupName(gid))+'</span>'+
          '<span class="arr-count"'+(total<2?' hidden':'')+'>1 of '+total+'</span></div>'+
        '<div class="arr-flow" aria-hidden="true">'+arrFace(p.from, gid)+
          '<span class="arr-track"><i></i><i></i><i></i></span>'+arrFace(me, gid, "me")+'</div>'+
        '<div class="arr-amt">'+esc(money(amt))+'</div>'+
        '<p class="arr-what" id="arrWhat"><b>'+esc(p.from)+'</b> says this is on its way to you'+
          ' <span class="arr-dot">·</span> '+esc(arrAgo(p.at))+
          (p.note ? '<span class="arr-note">“'+esc(String(p.note).slice(0,60))+'”</span>' : '')+'</p>'+
        '<div class="arr-stamp" aria-hidden="true"><span>Received</span></div>'+
      '</div>'+
      '<div class="arr-stub">'+
        '<div class="arr-ask">'+
          '<h2 id="arrQ">Did it reach your bank?</h2>'+
          '<p>Check your account first, then tell '+esc(p.from)+'.</p>'+
          (bankHref ? '<a class="arr-bank" href="'+esc(bankHref)+'" target="_blank" rel="noopener">'+
                        '<span class="ms" aria-hidden="true">account_balance</span>Open '+esc(bank.name)+'</a>' : '')+
          '<div class="arr-acts">'+
            '<button class="arr-yes" type="button"><span class="ms" aria-hidden="true">check</span>Yes, it’s in</button>'+
            '<button class="arr-later" type="button">Not yet</button>'+
          '</div>'+
          '<button class="arr-no" type="button">It didn’t arrive</button>'+
        '</div>'+
        '<div class="arr-sure" hidden>'+
          '<h2>Tell '+esc(p.from)+' it hasn’t arrived?</h2>'+
          '<p>They’ll be asked to check where they sent it. Nothing changes in the balances.</p>'+
          '<div class="arr-acts">'+
            '<button class="arr-tell" type="button">Tell '+esc(p.from)+'</button>'+
            '<button class="arr-back" type="button">Back</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div></div>';
  document.body.appendChild(node);
  ARR={id:item.id, kind:"in", node, busy:false};
  arrTear(node);
  arrKnock();
  const q=(s)=> node.querySelector(s);
  setTimeout(()=>{ const b=q(".arr-yes"); if(b && ARR && ARR.node===node) b.focus({preventScroll:true}); }, 480);
  arrTrap(node);

  const path="trips/"+gid+"/payments/"+p.k;
  // Saved, then the payer's phone is told - by the server, from this record.
  const answer=(ok)=> updStrict(path, {got:{ok, at:Date.now(), uid:USER.uid, name:me||USER.name}})
    .then(()=> notify("payment.got", gid, {ref:p.k}));

  q(".arr-yes").addEventListener("click", ()=>{
    if(ARR && ARR.node===node) ARR.busy=true;
    SFX.unlock();
    q(".arr-slip").classList.add("stamped");
    node.querySelectorAll("button, a").forEach(b=>{ b.disabled=true; b.tabIndex=-1; });
    setTimeout(()=>{ SFX.success(); try{ if(navigator.vibrate) navigator.vibrate([14, 50, 22]); }catch(e){} }, 180);
    answer(true).then(()=>{
      setTimeout(()=>{ if(ARR && ARR.node===node) ARR.busy=false; arrDone(node); }, 1500);
    }).catch(e=>{
      if(ARR && ARR.node===node) ARR.busy=false;
      q(".arr-slip").classList.remove("stamped");
      node.querySelectorAll("button, a").forEach(b=>{ b.disabled=false; b.tabIndex=0; });
      toast(writeError(e));
    });
  });
  q(".arr-later").addEventListener("click", ()=>{
    arrKeep(ARR_SNOOZE_KEY, item.id, Date.now()+ARR_SNOOZE_MS, 30*864e5);
    arrClose();
    toast("We’ll ask again in a few hours");
    setTimeout(arrivals, 460);
  });
  q(".arr-no").addEventListener("click", ()=>{
    q(".arr-ask").hidden=true; q(".arr-sure").hidden=false;
    q(".arr-slip").classList.add("doubt"); arrTear(node);
    q(".arr-tell").focus({preventScroll:true});
  });
  q(".arr-back").addEventListener("click", ()=>{
    q(".arr-sure").hidden=true; q(".arr-ask").hidden=false;
    q(".arr-slip").classList.remove("doubt"); arrTear(node);
    q(".arr-no").focus({preventScroll:true});
  });
  q(".arr-tell").addEventListener("click", ()=>{
    q(".arr-tell").disabled=true;
    answer(false).then(()=>{
      arrDone(node); toast(p.from+" will see it hasn’t arrived");
    }).catch(e=>{ q(".arr-tell").disabled=false; toast(writeError(e)); });
  });
}

/* ---------- the payer: it landed ----------
   A note, not a question: it drops in, says so, and goes by itself. */
function arrConfirmed(item){
  const {gid, p}=item;
  const node=el("div","arr arr-quiet");
  node.innerHTML=
    '<div class="arr-hold"><button class="arr-pill" type="button" role="status" aria-live="polite">'+
      '<span class="arr-pseal"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 21l7 7 14-15"/></svg></span>'+
      '<span class="arr-ptext"><b>'+esc(p.to)+' got your '+esc(money(Number(p.amount)||0))+'</b>'+
        '<span>Confirmed '+esc(arrAgo(p.got.at))+' · '+esc(groupName(gid))+'</span></span>'+
    '</button></div>';
  document.body.appendChild(node);
  ARR={id:item.id, kind:"ok", node, busy:false};
  arrKeep(ARR_SEEN_KEY, item.id, Date.now(), 60*864e5);
  SFX.success();
  const done=()=>{ if(ARR && ARR.node===node){ arrClose(); setTimeout(arrivals, 460); } };
  node.querySelector(".arr-pill").addEventListener("click", done);
  setTimeout(done, 4800);
}

/* ---------- the payer: it has not arrived ---------- */
function arrNotArrived(item){
  const {gid, p}=item, amt=Number(p.amount)||0;
  const node=el("div","arr");
  node.innerHTML=
    '<div class="arr-scrim" aria-hidden="true"></div>'+
    '<div class="arr-hold">'+
    '<div class="arr-slip doubt" role="alertdialog" aria-modal="true" aria-labelledby="arrQ" aria-describedby="arrWhat">'+
      '<div class="arr-top">'+
        '<div class="arr-eyebrow"><span class="arr-ping" aria-hidden="true"></span>'+
          '<span class="arr-grp">'+esc(groupName(gid))+'</span></div>'+
        '<div class="arr-flow broken" aria-hidden="true">'+arrFace(p.from, gid)+
          '<span class="arr-track"><i></i><i></i><i></i><b class="ms">question_mark</b></span>'+arrFace(p.to, gid)+'</div>'+
        '<div class="arr-amt">'+esc(money(amt))+'</div>'+
        '<p class="arr-what" id="arrWhat"><b>'+esc(p.to)+'</b> checked and can’t see your payment'+
          ' <span class="arr-dot">·</span> sent '+esc(fmtDate(p.at))+'</p>'+
      '</div>'+
      '<div class="arr-stub">'+
        '<h2 id="arrQ">Worth a second look</h2>'+

  document.body.appendChild(node);

function arrTear(node){

// Tab stays on the slip while it is asking something.
function arrTrap(node){
  node.addEventListener("keydown", e=>{
    if(e.key!=="Tab") return;
    const f=[].filter.call(node.querySelectorAll("button, a[href]"), b=> !b.disabled && b.offsetParent!==null);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  });

/* ======================= PHONE NOTIFICATIONS =======================
   Web Push, so a phone hears about a payment without Settle being open.

   This device says yes once. Its subscription - an address at Google's,
   Apple's or Mozilla's push service and two public keys - is kept at
   users/{uid}/push/{id}, which only this account can write. The browser
   never sends a notification: it records what happened in the outbox, and
   the scheduler decides who hears, from the payment record itself, and signs
   the notification with a private key only the server holds.

   Android: works in Chrome as it is.
   iPhone: only once Settle is on the Home Screen (iOS 16.4 and later) -
   Safari offers no notifications to an ordinary tab - so the iPhone gets the
   steps to add it instead of a button that could not work. */

// The public half of the key pair. Safe to publish; it only lets a push
// service check that a notification really came from this app's server.
const VAPID_PUBLIC_KEY = "BP6vyGBCPEhg3ZO3SEtWm8lnymnaA9AlitfolLa8x9tt3igs-pRmF2Hvi97PvtXMsWjceBYqATo7dj44Qiio5Kw";
const PUSH_LATER_KEY = "settle.push.later.v1";   // when "Not now" was tapped on this device
let PUSH_STATE = "unknown";      // unknown | on | off | ios-install | denied | none

const pushStandalone = ()=>{
  try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }
  catch(e){ return false; }
};
function pushDevice(){
  const ua=navigator.userAgent||"";
  if(etxIsIOS()) return /iPad/.test(ua) ? "iPad" : "iPhone";
  if(/Android/i.test(ua)) return "phone";
  return "browser";
}
// What this device can do before asking anything of anybody.
function pushSupport(){
  if(window.__NO_SW || !("serviceWorker" in navigator)) return "none";
  if(!("PushManager" in window) || !("Notification" in window))
    return etxIsIOS() && !pushStandalone() ? "ios-install" : "none";
  if(Notification.permission==="denied") return "denied";
  return "ok";
}
function swReady(ms){
  return Promise.race([
    navigator.serviceWorker.ready,
    new Promise((_, no)=> setTimeout(()=> no(new Error("the app is still starting — reload and try again")), ms||8000))
  ]);
}
function b64uBytes(s){
  const b=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from(b, c=>c.charCodeAt(0));
}
// One record per device, named after its push address, so turning it on
// twice updates the same record instead of adding another.
async function pushId(endpoint){
  try{
    const h=new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(endpoint)));
    return btoa(String.fromCharCode.apply(null, h)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"").slice(0,32);
  }catch(e){
    let n=0; for(let i=0;i<endpoint.length;i++) n=(n*31+endpoint.charCodeAt(i))|0;
    return "d"+(n>>>0).toString(36);
  }
}
async function pushSave(sub){
  const j=sub && sub.toJSON ? sub.toJSON() : null;
  if(!j || !j.endpoint || !j.keys || !j.keys.p256dh || !j.keys.auth) throw new Error("the browser did not finish setting it up");
  const id=await pushId(j.endpoint);
  return updStrict("users/"+USER.uid+"/push/"+id, {
    endpoint:j.endpoint, keys:{p256dh:j.keys.p256dh, auth:j.keys.auth},
    device:pushDevice(), at:Date.now()
  });
}

// Where this device stands. Re-saves a live subscription on every open, so a
// push address the browser quietly renewed is never left stale.
async function pushRefresh(){
  let s=pushSupport();
  if(s==="ok"){
    try{
      const reg=await swReady(5000), sub=await reg.pushManager.getSubscription();
      s = sub && Notification.permission==="granted" ? "on" : "off";
      if(s==="on" && USER) pushSave(sub).catch(()=>{});
    }catch(e){ s="off"; }
  }
  if(s!==PUSH_STATE){ PUSH_STATE=s; render(); }
  return s;
}

function pushEnable(btn){
  const s=pushSupport();
  if(s!=="ok"){ PUSH_STATE = s; sheetPush(); return; }
  if(btn) btn.disabled=true;
  // Asked at once, inside the tap. Safari turns down a request that waits on
  // anything else first, and older Safari answers by callback, not promise.
  const asked=new Promise(done=>{
    try{ const p=Notification.requestPermission(done); if(p && p.then) p.then(done); }
    catch(e){ done("default"); }
  });
  return asked.then(async perm=>{
    if(perm!=="granted"){
      PUSH_STATE = perm==="denied" ? "denied" : "off";
      render();
      if(perm==="denied") sheetPush(); else toast("Notifications are still off");
      return false;
    }
    const reg=await swReady();
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const opts={userVisibleOnly:true, applicationServerKey:b64uBytes(VAPID_PUBLIC_KEY)};
      try{ sub=await reg.pushManager.subscribe(opts); }
      catch(e){
        // Left over from a different key: start again once.
        const old=await reg.pushManager.getSubscription(); if(old) await old.unsubscribe();
        sub=await reg.pushManager.subscribe(opts);
      }
    }
    await pushSave(sub);
    PUSH_STATE="on"; lsSet(PUSH_LATER_KEY, null);
    render();
    toast("Notifications are on for this "+pushDevice());
    try{ reg.showNotification("You’re all set", {body:"Settle will tell you here when money moves.",
                                                 icon:"icon-192.png", tag:"settle-welcome"}); }catch(e){}
    return true;
  }).catch(e=>{
    toast("Could not turn them on: "+((e && e.message) || "try again"));
    pushRefresh();
    return false;
  }).finally(()=>{ if(btn) btn.disabled=false; });
}

async function pushDisable(){
  try{
    const reg=await swReady(5000), sub=await reg.pushManager.getSubscription();
    if(sub){
      const id=await pushId(sub.endpoint);
      await sub.unsubscribe();
      if(USER) await del("users/"+USER.uid+"/push/"+id);
    }
  }catch(e){}
  PUSH_STATE="off"; render();
  toast("Notifications are off on this "+pushDevice());
}

/* ======================= NOTHING LOST OFFLINE =======================
   The database library queues changes made with no signal - but only in
   memory. Close the app, or let it reload for an update, before the signal
   comes back, and those changes are gone.

   So every write is also written down on this device, and crossed off only
   when the database confirms it. Whatever is still written down the next
   time Settle opens is sent again, in the order it was made. Payments and
   expenses are saved under keys made on this device, so sending one twice
   writes the same place twice rather than making a second copy.

   While anything is still on its way, or there is no signal, Settle will not
   reload itself for an update; it waits until everything has synced.

   The last copy of each group is kept on the device too, with whether this
   account has been let in, so Settle opens with no signal and can be used. */
const OUTBOX_KEY = "settle.outbox.v1";
const DATA_KEY   = "settle.data.v1";
const ACCESS_KEY = "settle.access.v1";
let OUTBOX = [];         // this account's writes the database has not confirmed
let OUTBOX_OTHER = [];   // left on this device by another account: kept, never sent as this one
let PENDING = 0;         // writes still waiting on the database, this session
let ONLINE = null;       // .info/connected: null until it first answers
let SYNC_T = null, SYNC_MINE = false;

function outboxRead(){
  const v=lsGet(OUTBOX_KEY, []);
  return Array.isArray(v) ? v.filter(x=> x && typeof x.path==="string" && typeof x.uid==="string") : [];
}
function outboxWrite(){
  try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(OUTBOX_OTHER.concat(OUTBOX))); }
  catch(e){ /* storage full or refused: the database library still holds it for this session */ }
}
function forgetOutbox(){ OUTBOX=[]; outboxWrite(); }

// "https://project.firebaseio.com/trips/g1/expenses/e1" -> "trips/g1/expenses/e1"
function refPath(r){
  try{ return new URL(String(r)).pathname.split("/").filter(Boolean).map(decodeURIComponent).join("/"); }
  catch(e){ return null; }
}

/* The database handle the app uses, with every write written down first. */
function durableRemote(dbMod, db){
  function track(op, r, value, run){
    const path=refPath(r);
    let item=null;
    if(USER && path){
      let copy=null;
      try{ copy = value==null ? null : JSON.parse(JSON.stringify(value)); }catch(e){}
      item={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),
            uid:USER.uid, op, path, value:copy, at:Date.now()};
      OUTBOX.push(item);
      if(OUTBOX.length>800) OUTBOX.splice(0, OUTBOX.length-800);
      outboxWrite();
    }
    PENDING++; syncShow();
    let p;
    try{ p=run(); }catch(err){ p=Promise.reject(err); }
    // Confirmed, or refused for good (a rule said no): either way it is
    // finished, and the caller already says so if it failed.
    const done=()=>{
      PENDING=Math.max(0, PENDING-1);
      if(item){ OUTBOX=OUTBOX.filter(x=>x.id!==item.id); outboxWrite(); }
      syncShow();
    };
    Promise.resolve(p).then(done, done);
    return p;
  }
  return {
    db, ref:dbMod.ref, onValue:dbMod.onValue, off:dbMod.off, get:dbMod.get,
    set:    (r, v)=> track("set", r, v, ()=> dbMod.set(r, v)),
    update: (r, v)=> track("update", r, v, ()=> dbMod.update(r, v)),
    remove: (r)=>    track("remove", r, null, ()=> dbMod.remove(r)),
    // The key is made here, on the device, before anything is sent - so the
    // same note sent again lands on the same key.
    push:   (r, v)=>{
      const child=dbMod.push(r);
      if(v===undefined) return child;
      const p=track("set", child, v, ()=> dbMod.set(child, v));
      p.key=child.key; p.ref=child;
      return p;
    }
  };
}

/* On opening: send again whatever a previous session left unconfirmed. */
function outboxReplay(){
  if(!remote || !USER) return;
  const all=outboxRead();
  OUTBOX_OTHER=all.filter(x=> x.uid!==USER.uid);
  const mine=all.filter(x=> x.uid===USER.uid && /^(set|update|remove)$/.test(x.op))
                .sort((a,b)=> (a.at||0)-(b.at||0));
  OUTBOX=[];                 // each is written down again as it goes
  outboxWrite();
  if(!mine.length) return;
  const writes=mine.map(x=>{
    const r=remote.ref(remote.db, x.path);
    const w = x.op==="set" ? remote.set(r, x.value)
            : x.op==="update" ? remote.update(r, x.value||{})
            : remote.remove(r);
    return Promise.resolve(w).then(()=>true, ()=>false);
  });
  const all2=Promise.all(writes);
  all2.then(res=>{
    const ok=res.filter(Boolean).length, lost=res.length-ok;
    if(ok) toast(ok===1 ? "A change you made offline is now saved" : ok+" changes you made offline are now saved");
    if(lost) setTimeout(()=> toast(lost===1
      ? "One change made offline could not be saved — you may no longer be in that group"
      : lost+" changes made offline could not be saved"), 2800);
  });
  // Notes for phones that never went out: ask for them now.
  if(mine.some(x=> x.path.indexOf("mail/queue/")===0) && typeof pushNow==="function") pushNow(all2);
}

/* The bar under the header: offline, syncing, or nothing at all. Short
   blips while connecting are not worth a banner, so both wait a moment. */
function syncShow(){
  if(typeof setSync!=="function" || !USER) return;
  clearTimeout(SYNC_T);
  const say=(state, msg)=>{ setSync(state, msg); SYNC_MINE=true; };
  const many=(n)=> n===1 ? "1 change" : n+" changes";
  if(ONLINE===false){
    SYNC_T=setTimeout(()=>{
      if(ONLINE!==false) return;
      say("warn", PENDING
        ? "Offline · "+many(PENDING)+" saved on this device — "+(PENDING===1?"it syncs":"they sync")+" when you’re back online"
        : "Offline — anything you add is kept and syncs when you’re back online");
    }, PENDING ? 0 : 1500);
  } else if(PENDING>0){
    SYNC_T=setTimeout(()=>{
      if(PENDING>0 && ONLINE!==false){ say("", "Syncing "+many(PENDING)+"…"); NET_SLOW=true; netShow(); }
    }, 1500);
  } else if(SYNC_MINE){
    setSync(null); SYNC_MINE=false;
  }
  if(!PENDING) NET_SLOW=false;
  netShow();
}
// Connected or not, from the database itself.
function syncConnected(on){
  ONLINE=!!on;
  netShow();
  if(!USER) return;
  if(ONLINE){ setSync(null); SYNC_MINE=false; }
  syncShow();
}

/* The little light beside the refresh button: green online, red offline,
   amber while changes take a moment to save, grey while connecting. A tap
   says what it means. "Syncing" only shows when saving is slow, so an
   ordinary save does not make it flicker. */
let NET_SLOW=false;
function netState(){
  if(ONLINE===false) return "off";
  if(ONLINE===true) return PENDING>0 && NET_SLOW ? "sync" : "on";
  return "wait";
}
function netWords(){
  const n=PENDING, many = n===1 ? "1 change" : n+" changes";
  switch(netState()){
    case "off":  return n ? "Offline · "+many+" saved on this device, "+(n===1?"it syncs":"they sync")+" when you’re back online"
                          : "Offline · anything you add is kept and syncs when you’re back online";
    case "sync": return "Syncing "+many+"…";
    case "on":   return "Online · everything is saved";
    default:     return "Connecting to Settle…";
  }
}
// Every light on the page: the top bar on a phone, the sidebar on a computer.
const netLights=()=> typeof document==="undefined" ? [] : [].slice.call(document.querySelectorAll("[data-net]"));
function netShow(){
  const lights=netLights();
  if(!lights.length) return;

let DATA_SAVE_T=null;
function cacheGroups(){
  if(!USER) return;
  clearTimeout(DATA_SAVE_T);
  DATA_SAVE_T=setTimeout(()=>{
    if(!USER) return;
    const groups={};
    JOINED.forEach(g=>{ if(DATA[g.id] && typeof DATA[g.id]==="object" && Object.keys(DATA[g.id]).length) groups[g.id]=DATA[g.id]; });
    try{ localStorage.setItem(DATA_KEY, JSON.stringify({uid:USER.uid, at:Date.now(), groups})); }
    catch(e){ try{ localStorage.removeItem(DATA_KEY); }catch(_){} }
  }, 800);
}
function hydrateGroups(){
  if(!USER) return false;
  const c=lsGet(DATA_KEY, null);
  if(!c || c.uid!==USER.uid || !c.groups || typeof c.groups!=="object") return false;
  let any=false;
  Object.keys(c.groups).forEach(gid=>{
    const v=c.groups[gid];
    if(!DATA[gid] && v && typeof v==="object"){ DATA[gid]=v; any=true; }
  });
  return any;
}
function cacheAccess(){ if(USER) lsSet(ACCESS_KEY, {uid:USER.uid, status:(ACCESS && ACCESS.status) || null}); }
function hydrateAccess(){
  if(!USER || ACCESS!==undefined) return;
  const a=lsGet(ACCESS_KEY, null);
  if(a && a.uid===USER.uid && typeof a.status==="string") ACCESS={status:a.status};
}
function forgetCachedGroups(){
  try{ localStorage.removeItem(DATA_KEY); localStorage.removeItem(ACCESS_KEY); }catch(e){}
}

/* ======================= STAYING UP TO DATE =======================
   Everybody runs the newest Settle without having to refresh.

   Every build stamps its id into this file and into version.json beside the
   page. While Settle is on screen it asks for version.json once a minute, and
   whenever it comes back into view. When the id there is not this one, a new
   release is live: the new service worker is fetched and the app reloads onto
   it - at once if nothing is happening, or as soon as the person stops typing,
   closes a sheet or answers a question. Whichever tab they were on, they are
   still on after. */
const APP_BUILD = "20260914225622";
const UPDATE_EVERY_MS = 60e3;
const UPDATE_KEY = "settle.updated.v1";     // sessionStorage: the reload was ours
const UPDATE_TRIED = "settle.updateTried.v1";
let UPDATE_WAITING = false, UPDATE_RELOADING = false, UPDATE_MANUAL = false;

function updateBusy(){
  // Never while changes are still on their way to the database, and never
  // with no signal. They are kept on the device either way, but a reload
  // offline could leave Settle unable to reach its data until signal returns.
  if(PENDING > 0 || ONLINE === false) return true;
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  const sheet=$("sheet");
  if(sheet && !sheet.hidden) return true;
  return !!document.querySelector(".arr:not(.arr-quiet), .paid-pop");
}

function updateNow(build){
  if(UPDATE_RELOADING) return;
  if(updateBusy()){ UPDATE_WAITING=true; return; }
  // A page the browser still holds from before the release would come back
  // just as old, and ask again, and reload again. One try per build every
  // ten minutes stops that ever becoming a loop.
  try{
    const t=JSON.parse(sessionStorage.getItem(UPDATE_TRIED)||"null");
    if(build && t && t.build===build && Date.now()-t.at < 10*60e3) return;
    if(build) sessionStorage.setItem(UPDATE_TRIED, JSON.stringify({build, at:Date.now()}));
    sessionStorage.setItem(UPDATE_KEY, JSON.stringify({tab:TAB, at:Date.now(), manual:UPDATE_MANUAL}));
  }catch(e){}
  UPDATE_RELOADING=true;
  location.reload();
}

async function updateCheck(){
  if(window.__NO_SW || document.hidden || UPDATE_RELOADING) return;
  if(UPDATE_WAITING){ UPDATE_WAITING=false; return updateNow(); }
  try{
    const r=await fetch("version.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const v=await r.json();
    if(!v || typeof v.build!=="string" || !v.build || v.build===APP_BUILD) return;
    if("serviceWorker" in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){ try{ await reg.update(); }catch(e){} }
    }
    updateNow(v.build);
  }catch(e){ /* offline, or the site is mid-deploy: try again next time */ }
}

if(!window.__NO_SW){
  // A new service worker taking over is a release arriving by the other road.
  if("serviceWorker" in navigator){
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(hadController) updateNow(); });
  }
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) updateCheck(); });
  window.addEventListener("pageshow", e=>{ if(e.persisted) updateCheck(); });   // iPhone returning from the background
  window.addEventListener("online", updateCheck);
  setInterval(updateCheck, UPDATE_EVERY_MS);
  // Waiting for somebody to finish: look again every few seconds.
  setInterval(()=>{ if(UPDATE_WAITING && !updateBusy()){ UPDATE_WAITING=false; updateNow(); } }, 4000);
  setTimeout(updateCheck, 8000);
}

/* The refresh button in the top bar. An app on the iPhone Home Screen has no
   address bar and no pull-to-refresh, so this is the only way to reload it
   short of closing it. It fetches the newest service worker first, so the
   reload lands on the latest release, and comes back to the same tab. */
async function manualRefresh(btn){
  if(UPDATE_RELOADING) return;
  const stop=()=>{ if(btn){ btn.classList.remove("spin"); btn.disabled=false; } };
  const later=()=>{
    // Refreshes by itself once the signal is back and everything has synced.
    UPDATE_WAITING=true; UPDATE_MANUAL=true; stop();
    toast(PENDING
      ? "You’re offline. Your changes are saved on this device — Settle refreshes once they sync."
      : "You’re offline. Settle will refresh when you’re back online.");
  };
  if(ONLINE===false) return later();
  if(btn){ btn.classList.add("spin"); btn.disabled=true; }
  // Changes still on their way go first. They would survive a reload - they
  // are written down on the device - but finishing them now is quicker.
  if(PENDING>0){
    toast("Saving your changes first…");
    const t0=Date.now();
    while(PENDING>0 && ONLINE!==false && Date.now()-t0 < 12000) await new Promise(r=> setTimeout(r, 250));
    if(ONLINE===false) return later();
  }
  try{ sessionStorage.setItem(UPDATE_KEY, JSON.stringify({tab:TAB, at:Date.now(), manual:true})); }catch(e){}
  try{
    if(!window.__NO_SW && "serviceWorker" in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg) await Promise.race([reg.update(), new Promise(r=> setTimeout(r, 2500))]);
    }
  }catch(e){}
  UPDATE_RELOADING=true;
  setTimeout(()=> location.reload(), 300);
}
// Every refresh button: the top bar on a phone, the sidebar on a computer.
document.querySelectorAll("[data-refresh]").forEach(b=> b.addEventListener("click", ()=> manualRefresh(b)));

// Straight after an update or a refresh: back on the same tab, and say so.
function updateRestore(){
  try{
    const u=JSON.parse(sessionStorage.getItem(UPDATE_KEY)||"null");
    sessionStorage.removeItem(UPDATE_KEY);
    if(!u || Date.now()-Number(u.at) > 60e3) return;
    if(["home","groups","activity","account","interac","insights"].indexOf(u.tab)>-1) TAB=u.tab;
    setTimeout(()=> toast(u.manual ? "Refreshed" : "Settle is up to date"), 1400);
  }catch(e){}
}

// "Version 14 Sep, 18:30" - so anyone can see they have the latest.
function buildLabel(){
  const m=/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(APP_BUILD);
  if(!m) return "Development copy";
  const d=new Date(Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5]));
  return d.toLocaleDateString(undefined, {day:"numeric", month:"short"})+", "+
         d.toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit"});
}

function doPrint(){
  const gid=CURRENT; if(!gid) return;
  const old=document.getElementById("printArea"); if(old) old.remove();
  const area=el("div"); area.id="printArea";
  const b=balances(gid), st=settlements(gid), ppl=everyoneIn(gid);
  const total=totalOf(gid);

  let h='<h1>'+esc(groupName(gid))+'</h1>'+
    '<p class="pmeta">Statement printed '+esc(fmtWhen(Date.now()))+' · '+ppl.length+
    ' member'+(ppl.length===1?"":"s")+' · '+expensesOf(gid).length+' expense'+
    (expensesOf(gid).length===1?"":"s")+' · '+money(total)+' in total</p>';

  h+='<h2>Balances</h2><table><thead><tr><th>Person</th><th class="r">Paid</th>'+
     '<th class="r">Share</th><th class="r">Balance</th></tr></thead><tbody>';
  ppl.forEach(n=>{
    let paid=0, share=0;
    expensesOf(gid).forEach(e=>{ if(e.payer===n) paid+=Number(e.amount)||0;
      const sh=sharesOf(e); if(sh[n]) share+=sh[n]; });
    const v=b[n]||0;
    h+='<tr><td>'+esc(n)+'</td><td class="r">'+money(paid)+'</td><td class="r">'+money(share)+
       '</td><td class="r"><strong>'+(Math.abs(v)<0.005?"settled":money(v))+'</strong></td></tr>';
  });
  h+='</tbody></table>';

  if(st.length){
    h+='<h2>Who owes whom — the fewest payments that clear everyone</h2><ul>';
    st.forEach(t=> h+='<li><strong>'+esc(t.from)+'</strong> pays <strong>'+esc(t.to)+
      '</strong> '+money(t.amt)+'</li>' );
    h+='</ul>';
  } else {
    h+='<h2>Who owes whom</h2><p>All square - nobody owes anybody.</p>';
  }

  h+='<h2>Every expense</h2><table><thead><tr><th>Date</th><th>What</th><th>Paid by</th>'+
     '<th>Split between</th><th class="r">Amount</th></tr></thead><tbody>';
  expensesOf(gid).slice().sort((a,c)=>(a.at||0)-(c.at||0)).forEach(e=>{
    const sh=sharesOf(e);
    const who=Object.keys(sh).map(n=>esc(n)+" "+money(sh[n])).join(", ");
    h+='<tr><td>'+esc(fmtDate(e.at))+'</td><td>'+esc(e.desc)+
       (e.note?'<br><span class="note">'+esc(e.note)+'</span>':'')+
       '</td><td>'+esc(e.payer)+'</td><td class="who">'+who+'</td><td class="r">'+money(e.amount)+'</td></tr>';
  });
  h+='</tbody></table>';

  const pays=paymentsOf(gid);
  if(pays.length){
    h+='<h2>Payments already made</h2><table><thead><tr><th>Date</th><th>From</th><th>To</th>'+
       '<th>Note</th><th class="r">Amount</th></tr></thead><tbody>';
    pays.slice().sort((a,c)=>(a.at||0)-(c.at||0)).forEach(p=>{
      h+='<tr><td>'+esc(fmtDate(p.at))+'</td><td>'+esc(p.from)+'</td><td>'+esc(p.to)+
         '</td><td>'+esc(p.note||"")+'</td><td class="r">'+money(p.amount)+'</td></tr>';
    });
    h+='</tbody></table>';
  }

  area.innerHTML=h;
  document.body.appendChild(area);
  document.body.classList.add("printing");
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{ document.body.classList.remove("printing"); area.remove(); }, 400);
  }, 120);
}

function watchGroup(gid){
  if(!remote || subs[gid]) return;
  const r=ref("trips/"+gid);
  const cb=remote.onValue(r, snap=>{
    const v=snap.val();
    if(v===null){
      // Gone. It comes off the list whether or not it had loaded - otherwise
      // a group deleted before this device saw it sits there forever, empty.
      const had = DATA[gid] && Object.keys(DATA[gid]).length, nm = groupName(gid);
      forgetGroup(gid); if(CURRENT===gid) closeGroup();
      delete DATA[gid]; cacheGroups();
      if(had) toast("“"+nm+"” was deleted");
      render(); return;
    }
    DATA[gid]=v;
    cacheGroups();
    if(v.meta && v.meta.name){
      const j=JOINED.find(x=>x.id===gid);
      if(j && j.name!==v.meta.name){ j.name=v.meta.name; lsSet(LS.grp, JOINED); }
    }
    render();
  }, err=>{
    // The rules refuse it: the group was deleted, or this account is not in
    // it. Either way there is nothing here to open, so it stops being listed
    // instead of showing as a group with nobody in it. If they are added back,
    // the group returns to their list on its own.
    const why = String((err && (err.code || err.message)) || "");
    if(/permission/i.test(why)){
      // Not readable - not yet, or not any more. Off the list for now, but the
      // invitation that brought it stays: the moment they are given a seat,
      // straight away or by the scheduler within one pass, the group comes back
      // on its own. Deleting the invitation here is how somebody added a
      // moment too early never saw the group at all.
      JOINED = JOINED.filter(x=>x.id!==gid); lsSet(LS.grp, JOINED);
      if(subs[gid]){ subs[gid](); delete subs[gid]; }
      delete DATA[gid]; cacheGroups();
      if(USER) del("users/"+USER.uid+"/groups/"+gid);
      if(CURRENT===gid) closeGroup();
      render(); return;
    }
    setSync("bad","Cannot read this group — "+(err&&err.message?err.message:"check the database rules"));
  });
  subs[gid]=()=>{ try{ remote.off(r,"value",cb); }catch(e){} };
}
function watchAll(){ JOINED.slice().forEach(g=>watchGroup(g.id)); }

const DEFAULT_GROUP = window.DEFAULT_TRIP || "stlawrence-sep2026";

/* =========================== AUTH =========================== */
let fb = null;             // {app, auth, authMod, dbMod}
let signingIn = false;

// Ask Google whether this project actually offers Google sign-in. Doing this
// first means a project with the provider switched off says so plainly,
// instead of failing silently behind a blocked popup.
function providerReady(){
  const key=(window.FIREBASE_CONFIG||{}).apiKey;
  if(!key) return Promise.resolve(true);
  return fetch("https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key="+key, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({providerId:"google.com", continueUri: location.origin+location.pathname})
  }).then(r=>r.json()).then(j=>{
    const m=(j && j.error && j.error.message) || "";
    if(m.indexOf("OPERATION_NOT_ALLOWED")>-1) return "auth/operation-not-allowed";
    if(m.indexOf("UNAUTHORIZED_DOMAIN")>-1 || m.indexOf("INVALID_CONTINUE")>-1) return "auth/unauthorized-domain";
    return true;
  }).catch(()=>true);   // offline or blocked: let the SDK have its go anyway
}

function signIn(){
  if(!fb){ toast("Still starting up — try again in a second"); return; }
  if(signingIn) return;
  signingIn = true;
  const btn=$("gIn"); if(btn){ btn.disabled=true; btn.classList.add("busy"); }
  const done=()=>{ signingIn=false; const b=$("gIn"); if(b){ b.disabled=false; b.classList.remove("busy"); } };

  providerReady().then(ready=>{
    if(ready!==true){ authFailed({code:ready}); done(); return; }
    const provider = new fb.authMod.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    return fb.authMod.signInWithPopup(fb.auth, provider).catch(err=>{
      const code = (err && err.code) || "";
      // Popups are blocked in plenty of in-app and mobile browsers; fall back.
      if(code.indexOf("popup")>-1 || code.indexOf("operation-not-supported")>-1){
        if(code==="auth/popup-closed-by-user" || code==="auth/cancelled-popup-request"){ authFailed(err); return; }
        return fb.authMod.signInWithRedirect(fb.auth, provider).catch(authFailed);
      }
      authFailed(err);
    }).finally(done);
  });
}
function authFailed(err){
  const code=(err&&err.code)||"", msg=(err&&err.message)||"Sign-in failed";
  if(code==="auth/popup-closed-by-user" || code==="auth/cancelled-popup-request"){
    toast("Sign-in cancelled"); return;
  }
  if(code==="auth/operation-not-allowed")
    setSync("bad","Google sign-in is switched off for this Firebase project. Turn it on under Authentication → Sign-in method.");
  else if(code==="auth/unauthorized-domain")
    setSync("bad","“"+location.hostname+"” is not in the Firebase authorised domains list.");
  else if(code==="auth/network-request-failed")
    setSync("bad","No connection — sign-in needs to reach Google.");
  else
    setSync("bad", msg);
  toast("Could not sign in");
}
function signOutNow(){
  if(!fb) return;
  // Signing out forgets what this device is holding - including changes that
  // have not reached the database. Say so first.
  const waiting=Math.max(PENDING, OUTBOX.length);
  if(!confirm(waiting
      ? (waiting===1 ? "1 change you made has not synced yet" : waiting+" changes you made have not synced yet")+
        ". Signing out now will lose "+(waiting===1?"it":"them")+". Sign out anyway?"
      : "Sign out of Settle on this device?")) return;
  Object.keys(subs).forEach(k=>{ subs[k](); delete subs[k]; });
  fb.authMod.signOut(fb.auth).then(()=>{
    try{ localStorage.removeItem(LS.grp); localStorage.removeItem(LS.cur);
         localStorage.removeItem(LS.who); }catch(e){}
    forgetCachedGroups(); forgetOutbox();
    location.hash=""; location.reload();
  });
}

function onSignedIn(u){
  // Two people share a phone, or one person has two accounts. Everything held
  // locally - the group list, the group last open, the group named in the
  // address bar - belongs to whoever was signed in before, and none of it is
  // this person's to see. Signing out clears it, but signing straight in as
  // somebody else does not, and that is exactly how one account ended up
  // looking at another's group.
  forgetPreviousAccount(u.uid);

  USER = { uid:u.uid, name:u.displayName || (u.email||"").split("@")[0] || "You",
           email:u.email || "", photo:u.photoURL || null };
  setSync(null);

  // What this device was holding when it last closed: the groups as they
  // were, whether this account is let in, and any change not yet confirmed -
  // sent again now, in order. With no signal, Settle still opens and works.
  hydrateAccess();
  hydrateGroups();
  outboxReplay();
  syncShow();

  // Keep a profile record so the admin can see who is who.
  set("users/"+USER.uid+"/profile", {name:USER.name, email:USER.email, photo:USER.photo||null, at:Date.now()});

  // My entry in the directory, so other people can add me to a group by
  // picking my name instead of typing it and hoping they spell it the same.
  // Name and picture only beyond the address - never preferences or balances.
  // Updated, not replaced: the entry also carries Interac details the person
  // saved, and replacing it on every sign-in would throw them away.
  upd("directory/"+USER.uid, {name:USER.name, email:(USER.email||"").toLowerCase(),
                              photo:USER.photo||null, at:Date.now()});

  // Everybody else's. Readable only once you have been approved, so it is a
  // list of people who are already in this Settle together.
  remote.onValue(ref("directory"), snap=>{ DIRECTORY = snap.val() || {}; render(); },
    ()=>{ DIRECTORY = {}; });

  // Am I allowed in? Watched rather than read once, so somebody sitting on the
  // waiting screen is let through the moment they are approved, without
  // reloading and without being told to.
  remote.onValue(ref("access/"+USER.uid), snap=>{ ACCESS = snap.val() || null; cacheAccess(); render(); },
    ()=>{ ACCESS = null; render(); });

  // Everybody's request, for the administrator's list.
  if(isAdmin()){
    remote.onValue(ref("access"), snap=>{ REQUESTS = snap.val() || {}; render(); },
      ()=>{ REQUESTS = {}; });
    // Everybody who has ever signed in. People who were using Settle before
    // there was anything to approve have no access record at all, and would
    // otherwise be invisible on the requests screen right up until the gate
    // shut them out.
    remote.onValue(ref("users"), snap=>{ ALLUSERS = snap.val() || {}; render(); },
      ()=>{ ALLUSERS = {}; });
  }

  // My groups live in the database, so they follow me to any device.
  remote.onValue(ref("users/"+USER.uid+"/groups"), snap=>{
    const v=snap.val()||{};
    const ids=Object.keys(v);
    JOINED = ids.map(id=>({id, name:(v[id]&&v[id].name)||id}));
    lsSet(LS.grp, JOINED);
    Object.keys(subs).forEach(gid=>{ if(ids.indexOf(gid)<0 && gid!==CURRENT){ subs[gid](); delete subs[gid]; delete DATA[gid]; } });
    watchAll();
    render();
  }, err=>{
    setSync("bad","Cannot read your groups — "+(err&&err.message?err.message:"check the database rules"));
    render();
  });

  // Notification settings, and the timezone the weekly reminder is worked out
  // against. Recorded once so the cron has something to read even if this
  // account never opens the settings sheet.
  remote.onValue(ref("users/"+USER.uid+"/prefs"), snap=>{
    PREFS = snap.val() || {};
    // The look follows the account. Only redraw when it actually differs,
    // or every preference write would repaint the whole app.
    if(typeof PREFS.theme === "string" && PREFS.theme !== THEME){ applyTheme(PREFS.theme); render(); }
    if(PREFS.tz === undefined){
      let tz="America/Toronto";
      try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; }catch(e){}
      PREFS.tz = tz;
      set("users/"+USER.uid+"/prefs/tz", tz);
    }
  }, ()=>{});

  // The reminder schedule. Readable by anyone signed in, so the settings sheet
  // can say when the next one is due; only the administrator may change it.
  remote.onValue(ref("config/reminders"), snap=>{ SCHED = snap.val() || {}; render(); }, ()=>{});

  // Groups somebody has added me to by email turn up on their own.
  if(USER.email){
    remote.onValue(ref("invites/"+emailKey(USER.email)), snap=>{
      const v=snap.val()||{};
      Object.keys(v).forEach(gid=>{
        if(!JOINED.some(g=>g.id===gid)) rememberGroup(gid, (v[gid]&&v[gid].name)||gid);
        watchGroup(gid);
      });
      render();
    }, ()=>{});   // no invites index, or rules not updated yet: carry on
  }

  if(isAdmin()){
    remote.onValue(ref("trips"), snap=>{ ADMIN_GROUPS = snap.val() || {}; if(ADMIN_VIEW) render(); },
      ()=>{ ADMIN_GROUPS = {}; if(ADMIN_VIEW) render(); });
  }

  // Whether this device can hear about payments, and keep its record fresh.
  pushRefresh();

  openFromURL();
  render();
}

function openFromURL(){
  const m = location.hash.match(/g=([A-Za-z0-9_-]+)/) || location.search.match(/[?&]g=([A-Za-z0-9_-]+)/);
  if(m){
    const gid=m[1], known=JOINED.some(g=>g.id===gid);
    remote.get(ref("trips/"+gid+"/meta")).then(snap=>{
      if(!snap.exists() && !known){ toast("That group link no longer works"); location.hash=""; return; }
      const meta=snap.val()||{};
      // Following a link used to join you on the spot, with nothing but a
      // toast to say so. It no longer joins anybody. Reading a group needs a
      // place on its membership list, and only somebody already in it can
      // put you there - which is the whole point. Say so plainly rather
      // than opening a group that will fail to load.
      if(!known){
        toast("Ask someone in that group to add you");
        location.hash=""; render(); return;
      }
      rememberGroup(gid, meta.name||"Group");
      watchGroup(gid);
      openGroup(gid);
    }).catch(()=>{ if(known) openGroup(gid); });
    return;
  }
  const last=lsGet(LS.cur,null);
  if(last && JOINED.some(g=>g.id===last)) openGroup(last);
}

// The original single-sheet app wrote people + expenses under this same path
// with no meta node. It only needs a name, added once.
function adoptLegacy(){
  return remote.get(ref("trips/"+DEFAULT_GROUP)).then(s=>{
    if(!s.exists()) return false;
    const v=s.val()||{};
    if(!v.people && !v.expenses) return false;
    if(v.meta && v.meta.name) return true;
    return set("trips/"+DEFAULT_GROUP+"/meta",
      {name:"St Lawrence trip", type:"trip", at:Date.now(), by:"the original sheet"}).then(()=>true);
  }).catch(()=>false);
}

/* =========================== BOOT =========================== */
(function boot(){
  updateRestore();          // just updated: back on the tab they were on
  render();
  const cfg=window.FIREBASE_CONFIG;
  const ok = cfg && cfg.apiKey && cfg.apiKey.indexOf("PASTE_")!==0 && cfg.databaseURL;
  if(!ok){ setSync("bad","Firebase is not configured — sign-in and syncing are unavailable."); return; }
  setSync("","Starting…");
  (async function(){
    try{
      const appMod  = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
      const authMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js");
      const dbMod   = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js");
      const app=appMod.initializeApp(cfg);
      const auth=authMod.getAuth(app);
      const db=dbMod.getDatabase(app);
      fb = {app, auth, authMod, dbMod};
      // Every write is written down on the device until the database confirms
      // it, so nothing made offline is lost to a reload or a closed app.
      remote=durableRemote(dbMod, db);

      // If we came back from a redirect sign-in, surface any failure.
      // With no signal there is nothing to finish, and "could not sign in" to
      // somebody who is signed in would only alarm them.
      authMod.getRedirectResult(auth).catch(err=>{
        if(err && err.code==="auth/network-request-failed") return;
        authFailed(err);
      });

      authMod.onAuthStateChanged(auth, u=>{
        // Earlier versions of this app signed people in anonymously. Those
        // sessions are not a Google identity, so clear them out.
        if(u && u.isAnonymous){ authMod.signOut(auth); return; }
        if(u){
          if(!USER || USER.uid!==u.uid){
            onSignedIn(u);
            adoptLegacy().then(exists=>{ LEGACY_OK = exists; render(); });
          }
        } else {
          USER=null; CURRENT=null; JOINED=[]; DATA={};
          Object.keys(subs).forEach(k=>{ subs[k](); delete subs[k]; });
          setSync(null); render();
        }
      });

      dbMod.onValue(dbMod.ref(db,".info/connected"), s=> syncConnected(s.val()===true));
    }catch(err){
      setSync("bad","Could not start — "+((err&&err.message)?err.message:"check your connection"));
    }
  })();
})();

if(!window.__NO_SW && "serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).catch(()=>{}); });
}

</script>
