<script src="firebase-config.js"></script>
<script type="module">
/* ===========================================================================
   SETTLE — shared expense app
   Data model (Firebase Realtime Database):
     trips/{gid}/meta          {name, type, at, by}
     trips/{gid}/people/{k}    {n, c, uid?, email?, photo?, invite?}
     invites/{emailKey}/{gid}  {name, at, by}   <- so an invited person sees it
     trips/{gid}/expenses/{k}  {desc, amount, payer, mode, between[], vals{}, cat, note, at, by}
     trips/{gid}/payments/{k}  {from, to, amount, note, at, by}
     users/{uid}/profile       {name, email, photo, at}
     users/{uid}/prefs         {weekly, newExpense, updates, payments, tz, lastWeekly}
     config/reminders          {enabled, days[], hour, windowHours}  <- admin only
     access/{uid}              {status, name, email, at, decidedAt, decidedBy}
     directory/{uid}           {name, email, photo, at}  <- so people can be picked
     mail/queue/{k}            {kind, gid, actorUid, actor, desc, amount, at}
                               <- write-only for the app, drained by the cron
     users/{uid}/groups/{gid}  {name, at}      <- which groups this person is in
   Who you are comes from Google sign-in. Which groups you belong to lives in
   the database under your own uid, so it follows you to any device.
   =========================================================================== */
const $  = (id) => document.getElementById(id);
const el = (t, c, h) => { const n=document.createElement(t); if(c) n.className=c; if(h!=null) n.innerHTML=h; return n; };

// The tracker's own palette. People created by the original app carry a colour
// from this list, so any colour handed out later has to come from the same one
// or the avatars and the bars stop matching each other.
const PALETTE = ["#006b5d","#1565c0","#6a1b9a","#c62828","#ef6c00","#2e7d32",
                 "#ad1457","#4527a0","#00838f","#558b2f","#5d4037","#37474f"];
const CATS = [
  {k:"general",  i:"receipt_long",   n:"General"},
  {k:"food",     i:"restaurant",     n:"Food & drink"},
  {k:"grocery",  i:"shopping_cart",  n:"Groceries"},
  {k:"transport",i:"directions_car", n:"Transport"},
  {k:"fuel",     i:"local_gas_station", n:"Fuel"},
  {k:"home",     i:"home",           n:"Home & rent"},
  {k:"utilities",i:"bolt",           n:"Utilities"},
  {k:"travel",   i:"flight",         n:"Travel"},
  {k:"lodging",  i:"hotel",          n:"Lodging"},
  {k:"fun",      i:"celebration",    n:"Entertainment"},
  {k:"shopping", i:"shopping_bag",   n:"Shopping"},
  {k:"health",   i:"medical_services",n:"Health"}
];
const catOf = (k) => CATS.find(c=>c.k===k) || CATS[0];
const FULLVIEW = /[?&]full=1/.test(location.search);
const ADMIN_EMAIL = (window.ADMIN_EMAIL || "").toLowerCase();
const PEOPLE_LINKS = (function(){
  const src=window.PEOPLE_LINKS||{}, out={};
  Object.keys(src).forEach(k=> out[k.toLowerCase()]=src[k] );
  return out;
})();
// The name this account always goes by, if it has been pinned to one.
const linkedName = (email) => PEOPLE_LINKS[String(email||"").toLowerCase()] || null;

/* ---------------- local state ---------------- */
const LS = {
  grp: "settle.groups.v2",   // cached copy of users/{uid}/groups, for offline
  cur: "settle.cur.v2",
  who: "settle.uid.v2",      // whose cache the other two are
  theme: "settle.theme.v1"   // a look, kept on the device so it applies at once
};
function lsGet(k, d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let USER     = null;                        // {uid, name, email, photo} from Google
let PREFS    = {};                          // users/{uid}/prefs - notification settings
let SCHED    = {};                          // config/reminders - when the email goes out
let ACCESS   = undefined;                   // access/{uid} - undefined until it has loaded
let REQUESTS = {};                          // access/* - everybody, admin only
let ALLUSERS = {};                          // users/* - admin only, to find who never asked
let DIRECTORY= {};                          // directory/* - everybody in Settle, to pick from
let ME       = null;                        // my person-name inside CURRENT group
let JOINED   = lsGet(LS.grp, []);           // [{id,name}]
let CURRENT  = null;                        // active group id
let TAB      = "home";                      // home | groups | activity | account
let DATA     = {};                          // gid -> {meta, people, expenses, payments}
let remote   = null;                        // firebase handles
const subs   = {};                          // gid -> unsubscribe

/* ---------------- how it looks ----------------
   A theme is a palette. It changes no wording, no layout and no meaning:
   green is money coming to you and red is money going out in every one of
   them. Kept on the device as well as on the account, so it is already right
   on the first paint rather than flickering once the database answers. */
const THEMES = [
  {k:"warm",   n:"Warm",   m:"Cream and apricot", sw:["#F4EEE6","#EEB586","#2F332D"]},
  {k:"purple", n:"Purple", m:"Borahae \u{1F49C}",  sw:["#F8F5FD","#C4AEEF","#2A1F3D"]}
];
let THEME = lsGet(LS.theme, "warm");
function applyTheme(k){
  THEME = THEMES.some(t=>t.k===k) ? k : "warm";
  if(THEME==="warm") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", THEME);
  lsSet(LS.theme, THEME);
}
applyTheme(THEME);

const isAdmin = () => !!(USER && ADMIN_EMAIL && (USER.email||"").toLowerCase()===ADMIN_EMAIL);

/* ---------------- joining ----------------
   Signing in gets somebody an account, not access. The administrator is
   always in - they are the one who would have to let themselves back in
   otherwise. This is the same condition the database rules enforce; the rules
   are what actually stop anything, and this only decides what to show. */
const accessState = () => {
  if(isAdmin()) return "approved";
  if(ACCESS === undefined) return "loading";
  const s = ACCESS && ACCESS.status;
  return (s==="approved" || s==="pending" || s==="declined") ? s : "none";
};
const mayUse = () => accessState()==="approved";

function requestAccess(){
  if(!remote || !USER) return Promise.resolve();
  const rec = {status:"pending", name:USER.name, email:(USER.email||"").toLowerCase(),
               photo:USER.photo||null, at:Date.now()};
  // The record has to exist before the note, or the mailer will look it up,
  // find nothing waiting, and quietly throw the request away.
  return set("access/"+USER.uid, rec).then(()=>{
    ACCESS = rec;
    notify("access.request", null, {});
    render();
  });
}

/* ---------------- helpers ---------------- */
function money(n){ const v=Math.round((n+Number.EPSILON)*100)/100; return (v<0?"-$":"$")+Math.abs(v).toFixed(2); }
function plain(n){ return (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); }
function trim(n){ return String(Math.round((n+Number.EPSILON)*100)/100); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(n){ const p=String(n||"?").trim().split(/\s+/); return (p[0].charAt(0)+(p[1]?p[1].charAt(0):"")).toUpperCase(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), 2600); }
function fmtDate(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d)) return "";
  const o={day:"numeric", month:"short"};
  if(d.getFullYear()!==new Date().getFullYear()) o.year="numeric";
  return d.toLocaleDateString(undefined,o);
}
function fmtWhen(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d)) return "";
  return fmtDate(ts)+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function dayKey(ts){ const d=new Date(ts||0);
  return isNaN(d) ? "" : d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function dayLabel(ts){
  const d=new Date(ts||0); if(isNaN(d)) return "Undated";
  const t=new Date();
  if(dayKey(ts)===dayKey(t)) return "Today";
  if(dayKey(ts)===dayKey(Date.now()-864e5)) return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"long"});
}
function avatarHTML(cls, name, colour, photo){
  if(photo) return '<img class="av '+cls+'" src="'+esc(photo)+'" alt="" referrerpolicy="no-referrer">';
  return '<span class="av '+cls+'" style="background:'+(colour||"#8e99a6")+'">'+esc(initials(name))+'</span>';
}

/* ---------------- group data accessors ---------------- */
function membersOf(gid){
  const g=DATA[gid]||{}, raw=g.people||{};
  const keys=Object.keys(raw).sort();
  const taken=new Set(); keys.forEach(k=>{ const c=raw[k] && raw[k].c; if(c) taken.add(c.toLowerCase()); });
  let next=0;
  return keys.map(k=>{
    const v=raw[k]; const obj=(v&&typeof v==="object")?v:{n:String(v)};
    const name=obj.n||"";
    let color=obj.c||null;
    if(!color){
      while(next<PALETTE.length && taken.has(PALETTE[next].toLowerCase())) next++;
      color=PALETTE[next%PALETTE.length]; taken.add(color.toLowerCase()); next++;
    }
    return {k, name, color, uid:obj.uid||null, email:obj.email||null,
            photo:obj.photo||null, invite:(obj.invite||"").toLowerCase()||null};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
const names   = (gid) => membersOf(gid||CURRENT).map(m=>m.name);
const memberOf= (n, gid) => membersOf(gid||CURRENT).find(x=>x.name===n) || null;
const colorOf = (n, gid) => { const m=memberOf(n, gid); return m?m.color:"#8e99a6"; };
function listOf(gid, what){
  const raw=(DATA[gid]||{})[what]||{};
  return Object.entries(raw).map(([k,v])=>Object.assign({k},v)).sort((a,b)=>(b.at||0)-(a.at||0));
}
const expensesOf = (gid) => listOf(gid||CURRENT, "expenses");
const paymentsOf = (gid) => listOf(gid||CURRENT, "payments");

// Which person in this group is me? Null until I have claimed a slot.
function meIn(gid){
  if(!USER) return null;
  const m=membersOf(gid).find(x=>x.uid===USER.uid);
  return m ? m.name : null;
}
const loaded = (gid) => !!(DATA[gid] && (DATA[gid].meta || DATA[gid].people || DATA[gid].expenses));

/* Nobody goes into a group twice. A second seat for the same account or
   address splits one person's balance in two; a second seat with the same
   name is worse, because the ledger is keyed by name and the two quietly
   become one. Names are compared the way people read them - "Kavya",
   "kavya" and " Kavya  " are the same - and so are addresses.
   Account first, then address, then name, so the message names the real
   reason. `exceptKey` leaves out the seat being edited. */
const normName = (s)=> String(s||"").trim().replace(/\s+/g," ").toLowerCase();
const normMail = (s)=> String(s||"").trim().toLowerCase();
const tidyName = (s)=> String(s||"").trim().replace(/\s+/g," ");
function inGroupAlready(gid, p, exceptKey){
  const list = membersOf(gid).filter(m=> m.k!==exceptKey);
  const n = normName(p.name), mail = normMail(p.email);
  let m = p.uid && list.find(x=> x.uid===p.uid);
  if(m) return {m, by:"account", text: m.name+" is already in this group"};
  m = mail && list.find(x=> normMail(x.email)===mail || normMail(x.invite)===mail);
  if(m) return {m, by:"email", text: mail+" is already in this group, as "+m.name};
  if(!n) return null;
  m = list.find(x=> normName(x.name)===n);
  if(m) return {m, by:"name", text: "Someone in this group is already called "+m.name};
  // A name that has left the members list but is still on expenses holds a
  // balance; a new seat with that name would inherit it.
  const self = exceptKey ? (membersOf(gid).find(x=>x.k===exceptKey)||{}).name : null;
  const old = everyoneIn(gid).find(x=> x!==self && normName(x)===n);
  if(old) return {m:{name:old}, by:"name", text: old+" is still on this group's expenses. Use that name, or merge"};
  return null;
}

/* A name typed for somebody who is already in Settle should be their account,
   not a label their app knows nothing about - otherwise the group never shows
   up for them. An address is proof. A whole name counts only when exactly one
   account has it: two people can share a name, and guessing wrong would hand
   one of them a stranger's group. Returns the directory entry, or null. */
function settleAccountFor(name, email){
  const people = Object.keys(DIRECTORY||{}).map(u=> Object.assign({uid:u}, DIRECTORY[u]||{}));
  const mail = normMail(email);
  if(mail){ const p = people.find(x=> normMail(x.email)===mail); if(p) return p; }
  const n = normName(name); if(!n) return null;
  const same = people.filter(x=> normName(x.name)===n);
  return same.length===1 ? same[0] : null;
}
/* Accounts a partly typed name could mean - "kav" for "Kavya R" - offered as
   a tap, never linked on their own. Leaves out me and anyone already in the
   group. */
function settleSuggestions(name, gid){
  const n = normName(name); if(n.length<2) return [];
  const inGroup = gid ? membersOf(gid).map(m=>m.uid).filter(Boolean) : [];
  return Object.keys(DIRECTORY||{}).map(u=> Object.assign({uid:u}, DIRECTORY[u]||{}))
    .filter(p=> p.name && inGroup.indexOf(p.uid)<0 && !(USER && p.uid===USER.uid))
    .filter(p=>{ const full=normName(p.name); return full.indexOf(n)===0 || full.split(" ").some(w=> w.indexOf(n)===0); })
    .slice(0,4);
}

// Everyone the money actually involves. An expense can name someone who is no
// longer on the members list; they still hold a balance, so any screen that
// claims to show "everyone" has to include them or the figures will not add up.
function everyoneIn(gid){
  const out=names(gid).slice();
  Object.keys(balances(gid)).forEach(n=>{ if(out.indexOf(n)<0) out.push(n); });
  return out;
}

/* ---------------- who may change what ----------------
   Only whoever paid may record it. Only whoever added a line may change or remove
   it - except the administrator, who may touch anything. Older rows predate
   uid stamping, so they fall back to matching the recorded name. */
function addedByMe(rec){
  if(!USER || !rec) return false;
  if(rec.byUid) return rec.byUid===USER.uid;
  return !!ME && rec.by===ME;
}
const canEdit = (rec) => isAdmin() || addedByMe(rec);

/* Who may be named as the payer when recording something. Money goes into the
   ledger under the name of whoever paid, so only they may put it there - if
   Kelvin paid, Kelvin records it. The administrator may record for anyone.
   Everybody else gets their own name only, and nobody at all until they have
   said which name in the group is theirs. Used by every place that asks who
   paid, so they cannot drift apart. */
function payersAllowed(gid, ppl){
  if(isAdmin()) return ppl.slice();
  const me = meIn(gid);
  return me && ppl.indexOf(me) > -1 ? [me] : [];
}
function ownerOf(rec){
  if(!rec) return "someone else";
  return rec.by || "someone else";
}

// Emails are keys under invites/, and RTDB keys cannot contain a dot.
// The database rule performs the same substitution, so this must match it.
function emailKey(e){ return String(e||"").trim().toLowerCase().replace(/\./g, ","); }
const emailOk = (e) => /^[^\s@#$\[\]/]+@[^\s@#$\[\]/]+\.[^\s@#$\[\]/]+$/.test(String(e||"").trim());

/* ---------------- split maths ---------------- */
// Returns {name: amountOwed}. Modes: equal | exact | percent | shares
function sharesOf(e){
  const out={};
  const between=(e.between&&e.between.length)?e.between:[e.payer];
  const vals=e.vals||{};
  const amt=Number(e.amount)||0;
  if(e.mode==="exact"){
    between.forEach(n=> out[n]=Number(vals[n])||0 );
  } else if(e.mode==="percent"){
    between.forEach(n=> out[n]= amt*((Number(vals[n])||0)/100) );
  } else if(e.mode==="shares"){
    const tot=between.reduce((a,n)=>a+(Number(vals[n])||0),0) || 1;
    between.forEach(n=> out[n]= amt*((Number(vals[n])||0)/tot) );
  } else {
    const per=amt/between.length;
    between.forEach(n=> out[n]=per );
  }
  return out;
}
// Net position per person: positive = they are owed, negative = they owe
function balances(gid){
  const b={};
  names(gid).forEach(n=> b[n]=0 );
  expensesOf(gid).forEach(e=>{
    if(!(e.payer in b)) b[e.payer]=0;
    b[e.payer]+=Number(e.amount)||0;
    const sh=sharesOf(e);
    Object.keys(sh).forEach(n=>{ if(!(n in b)) b[n]=0; b[n]-=sh[n]; });
  });
  paymentsOf(gid).forEach(p=>{
    if(!(p.from in b)) b[p.from]=0;
    if(!(p.to   in b)) b[p.to]=0;
    b[p.from]+=Number(p.amount)||0;   // paying down what you owe
    b[p.to]  -=Number(p.amount)||0;
  });
  return b;
}
// Fewest transfers that clear everyone
function settlements(gid){
  const b=balances(gid), cred=[], deb=[];
  Object.keys(b).forEach(n=>{ const v=Math.round(b[n]*100)/100;
    if(v>0.004) cred.push({n, v}); else if(v<-0.004) deb.push({n, v:-v}); });
  cred.sort((a,c)=>c.v-a.v); deb.sort((a,c)=>c.v-a.v);
  const out=[]; let i=0,j=0,guard=0;
  while(i<deb.length && j<cred.length && guard++<9999){
    const pay=Math.min(deb[i].v, cred[j].v);
    if(pay>0.004) out.push({from:deb[i].n, to:cred[j].n, amt:pay});
    deb[i].v-=pay; cred[j].v-=pay;
    if(deb[i].v<=0.004) i++;
    if(cred[j].v<=0.004) j++;
  }
  return out;
}
// Net between two people, positive when `a` still owes `b`. Counts each
// person's share of what the other paid for, then the payments already made
// between the two.
function pairNet(gid, a, b){
  let net=0;
  expensesOf(gid).forEach(e=>{
    const sh=sharesOf(e);
    if(e.payer===b && sh[a]) net += sh[a];
    if(e.payer===a && sh[b]) net -= sh[b];
  });
  paymentsOf(gid).forEach(p=>{
    if(p.from===a && p.to===b) net -= Number(p.amount)||0;
    if(p.from===b && p.to===a) net += Number(p.amount)||0;
  });
  return Math.round(net*100)/100;
}

// What to put in the amount box for a given pair, and why.
function suggestSettle(gid, from, to){
  if(from===to) return {amt:0, why:"Pick two different people."};
  const plan=settlements(gid).find(t=>t.from===from && t.to===to);
  if(plan) return {amt:Math.round(plan.amt*100)/100,
                   why:"This clears "+(from===ME?"you":from)+" in the settle-up plan."};
  const net=pairNet(gid, from, to);
  if(net>0.004)  return {amt:net, why:(from===ME?"You owe":from+" owes")+" "+to+" this much between the two of them."};
  if(net<-0.004) return {amt:0,   why:"The other way round \u2014 "+to+" owes "+
                                      (from===ME?"you":from)+" "+money(-net)+"."};
  return {amt:0, why:"Nothing outstanding between these two."};
}

const myBalance = (gid) => { const n=meIn(gid); if(!n) return 0; const b=balances(gid); return b[n]||0; };
function totalOf(gid){ let t=0; expensesOf(gid).forEach(e=> t+=Number(e.amount)||0 ); return t; }

/* ---------------- writes ---------------- */
function ref(path){ return remote.ref(remote.db, path); }
function push(path, val){
  if(!remote){ toast("Not signed in yet"); return Promise.resolve(); }
  return remote.push(ref(path), val).catch(e=>toast("Could not save: "+e.message));
}
function set(path, val){
  if(!remote) return Promise.resolve();
  return remote.set(ref(path), val).catch(e=>toast("Could not save: "+e.message));
}
function del(path){
  if(!remote) return Promise.resolve();
  return remote.remove(ref(path)).catch(e=>toast("Could not remove: "+e.message));
}
function upd(path, obj){
  if(!remote) return Promise.resolve();
  return remote.update(ref(path), obj).catch(e=>toast("Could not save: "+e.message));
}

/* ---------------- the activity outbox ----------------
   The browser holds no mail key and can send nothing. It leaves a note here
   instead; the scheduler reads it on its next pass, works out from the
   group's own membership who ought to hear, and sends. So the note says what
   happened and never who to tell - picking recipients stays on the server,
   where a tampered note cannot reach anyone it could not already reach.
   Best effort throughout: a note that fails to save must never stop the
   thing it describes from being saved. */
function notify(kind, gid, what){
  if(!remote || !USER || !USER.uid) return;
  const rec = {
    kind: kind, actorUid: USER.uid,
    actor: String(ME || USER.name || "Someone").slice(0,80),
    desc: String((what && what.desc) || "").slice(0,120),
    at: Date.now()
  };
  if(gid) rec.gid = gid;              // a request to join names no group
  const amt = Number(what && what.amount);
  if(isFinite(amt) && amt > 0) rec.amount = Math.round(amt*100)/100;
  try { remote.push(ref("mail/queue"), rec).catch(()=>{}); } catch(e){}
}

/* ---------------- linking an account to a name ---------------- */
/* trips/{gid}/uids is the membership list the database rules read. The people
   records already carry a uid, but rules cannot scan a list, so the same fact
   is kept in a shape a rule can ask about in one step. Anything that attaches
   an account to a name has to keep this in step, or that person can no longer
   open the group. */
function joinUid(gid, uid){
  return uid ? set("trips/"+gid+"/uids/"+uid, true) : Promise.resolve();
}
function dropUid(gid, uid){
  return uid ? del("trips/"+gid+"/uids/"+uid) : Promise.resolve();
}

function linkPerson(gid, key){
  return upd("trips/"+gid+"/people/"+key,
    {uid:USER.uid, email:USER.email, photo:USER.photo||null})
    .then(()=> joinUid(gid, USER.uid) );
}
function unlinkPerson(gid, key){
  const m = membersOf(gid).find(x=>x.k===key);
  const gone = m && m.uid;
  return upd("trips/"+gid+"/people/"+key, {uid:null, email:null, photo:null})
    .then(()=> dropUid(gid, gone) );
}

// Fold one person into another: everything `from` paid, owed or was split
// into becomes `to`, and `from` disappears. Used to repair a duplicate — the
// same human entered twice — which otherwise skews every split they are in.
// One atomic update, because a half-applied merge would silently change what
// people owe.
function mergePeople(gid, from, to){
  const u={};
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) u["expenses/"+e.k+"/payer"]=to;
    const b=e.between||[];
    if(b.indexOf(from)>-1){
      const vals=Object.assign({}, e.vals||{});
      if(vals[from]!=null){
        // both halves of the duplicate contributed, so their shares add up
        vals[to]=(Number(vals[to])||0)+(Number(vals[from])||0);
        delete vals[from];
      }
      const nb=[];
      b.forEach(n=>{ const m=(n===from)?to:n; if(nb.indexOf(m)<0) nb.push(m); });
      u["expenses/"+e.k+"/between"]=nb;
      u["expenses/"+e.k+"/vals"]=vals;
    }
  });
  paymentsOf(gid).forEach(p=>{
    const f=(p.from===from)?to:p.from, t=(p.to===from)?to:p.to;
    if(f===t) u["payments/"+p.k]=null;             // paying yourself means nothing
    else{
      if(f!==p.from) u["payments/"+p.k+"/from"]=f;
      if(t!==p.to)   u["payments/"+p.k+"/to"]=t;
    }
  });
  const gone   = membersOf(gid).find(x=>x.name===from);
  const target = membersOf(gid).find(x=>x.name===to);
  if(gone){
    // If the target is only a name carried on the expenses and has no record
    // of its own, deleting the source would throw away the account, the email
    // and the colour attached to it - and leave the name orphaned exactly as
    // before. Rename the record onto that name instead: same effect on the
    // money, and the orphan is absorbed rather than perpetuated.
    if(target) u["people/"+gone.k]=null;
    else       u["people/"+gone.k+"/n"]=to;
  }
  return upd("trips/"+gid, u);
}
// What a merge would touch, so it can be described before it happens.
function mergePreview(gid, from){
  let paid=0, inSplit=0, pays=0;
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) paid++;
    if((e.between||[]).indexOf(from)>-1) inSplit++;
  });
  paymentsOf(gid).forEach(p=>{ if(p.from===from||p.to===from) pays++; });
  return {paid, inSplit, pays};
}

// Renaming has to move the name everywhere it is used as a key, or the
// balances stop adding up. One atomic update so it cannot half-apply.
function renamePerson(gid, key, from, to){
  const u={}; u["people/"+key+"/n"]=to;
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) u["expenses/"+e.k+"/payer"]=to;
    if(e.between && e.between.indexOf(from)>-1)
      u["expenses/"+e.k+"/between"]=e.between.map(n=> n===from?to:n );
    if(e.vals && Object.prototype.hasOwnProperty.call(e.vals, from)){
      const v={}; Object.keys(e.vals).forEach(n=> v[n===from?to:n]=e.vals[n] );
      u["expenses/"+e.k+"/vals"]=v;
    }
  });
  paymentsOf(gid).forEach(p=>{
    if(p.from===from) u["payments/"+p.k+"/from"]=to;
    if(p.to===from)   u["payments/"+p.k+"/to"]=to;
  });
  return upd("trips/"+gid, u);
}

/* Two people share a phone, or one person has two accounts. Everything held
   locally - the group list, the group last open, the group named in the
   address bar - belongs to whoever was signed in before, and none of it is
   the next person's to see. Signing out clears it; signing straight in as
   somebody else did not, and that is how one account came to be looking at
   another's group. Returns true when it wiped something. */
function forgetPreviousAccount(uid){
  if(!uid) return false;
  if(lsGet(LS.who, null) === uid) return false;
  JOINED = []; CURRENT = null; DATA = {};
  try{ localStorage.removeItem(LS.grp); localStorage.removeItem(LS.cur); }catch(e){}
  if(typeof location !== "undefined" && location.hash) location.hash = "";
  lsSet(LS.who, uid);
  return true;
}

/* ---------------- which groups I am in ---------------- */
function rememberGroup(id, name){
  if(!JOINED.some(g=>g.id===id)) JOINED.push({id, name});
  else JOINED = JOINED.map(g=> g.id===id ? {id, name:name||g.name} : g);
  lsSet(LS.grp, JOINED);
  if(remote && USER) set("users/"+USER.uid+"/groups/"+id, {name:name||id, at:Date.now()});
}
function forgetGroup(id){
  JOINED = JOINED.filter(g=>g.id!==id); lsSet(LS.grp, JOINED);
  if(subs[id]){ subs[id](); delete subs[id]; }
  delete DATA[id];
  if(remote && USER){
    del("users/"+USER.uid+"/groups/"+id);
    // And the invite that brought it here. Left behind, the app read it on the
    // next load and put the group straight back on the list - so leaving a
    // group, or losing a deleted one, never stuck.
    if(USER.email) del("invites/"+emailKey(USER.email)+"/"+id);
  }
}
function groupName(id){
  const g=DATA[id]&&DATA[id].meta&&DATA[id].meta.name;
  if(g) return g;
  const j=JOINED.find(x=>x.id===id);
  return j? j.name : "Group";
}

let FILT = {q:"", payer:"", ways:0};   // expense filters, reset per group
const claimAsked = {};       // gid -> we have already offered the claim sheet
const autoLinked = {};       // gid -> the silent link has been attempted

// An account pinned to a name in PEOPLE_LINKS takes that name without being
// asked, as long as it is on the list and nobody else has it.
function autoLink(gid){
  if(!USER || !remote || autoLinked[gid] || meIn(gid)) return false;
  const mine=(USER.email||"").toLowerCase();
  // Somebody added them by email, so the seat is already theirs.
  let m = membersOf(gid).find(x=> !x.uid && x.invite && x.invite===mine );
  if(!m){
    const want = linkedName(USER.email);
    if(!want) return false;
    m = membersOf(gid).find(x=> !x.uid && x.name.toLowerCase()===want.toLowerCase() );
  }
  if(!m) return false;
  autoLinked[gid]=true; claimAsked[gid]=true;
  linkPerson(gid, m.k);
  return true;
}

    if(b.dataset.tab===TAB && !CURRENT && !ADMIN_VIEW) b.setAttribute("aria-current","page");

  if(USER && CURRENT && loaded(CURRENT) && !ME && autoLink(CURRENT)) return;

    claimAsked[CURRENT]=true;

function viewAccess(main){
  const state = accessState();

    c.innerHTML='<div class="mark quiet" aria-hidden="true"><span class="ms">hourglass_empty</span></div>'+

      '<h2>Waiting to be let in</h2>'+

      'email at <strong>'+esc(USER.email)+'</strong> as soon as they decide.</p>'+
      '<p class="fine">This page updates by itself — there is nothing to refresh. '+
      'The request reaches them '+esc(callGap())+'.</p>';

    c.innerHTML=
      '<div class="mark quiet" aria-hidden="true"><span class="ms">block</span></div>'+

      '<p>This account has not been given access. If you think that is a mistake, '+

    '<span class="body"><span class="t1">Sign out</span>'+

  out.appendChild(r);

}

function sectionAdd(main, gid){
  const ppl=names(gid);

  if(FORM && FORM.sig===sig){ main.appendChild(FORM.node); FORM.refresh(); return; }

  /* Amount first, then what it was for, then one line saying who paid and who
     it is split between. The usual case - I paid, split with everyone - needs
     two fields and one tap. Changing either choice opens a small panel under
     that line, and only then. */
  const allowed = payersAllowed(gid, ppl);   // only whoever paid adds it; the admin may add for anyone
  let payer = allowed.indexOf(ME)>-1 ? ME : (allowed[0] || "");
  const sel={}; ppl.forEach(n=> sel[n]=true );
  let open = null;                            // "payer" | "split" | null

  const card=el("div","card addform qa2");
  card.innerHTML=
    '<div class="af-head"><h2 class="ah">Add an expense</h2>'+
      '<button class="af-more" id="afMore" type="button">More options</button></div>'+

        'placeholder="0.00" aria-label="Amount in CAD"></label>'+
      '<input id="afDesc" class="af-desc" type="text" autocomplete="off" '+
        'placeholder="What was it for?" aria-label="What was it for?">'+
    '</div>'+
    '<div class="af-sum" id="afSum"></div>'+
    '<div class="af-panel" id="afPanel" hidden></div>'+
    '<div class="af-foot"><span class="af-each" id="afEach"></span>'+
      '<button class="btn p" id="afAdd" type="button">Add expense</button></div>';
  main.appendChild(card);
  const q=(id)=> card.querySelector("#"+id);

  const nameOf=(n)=> n===ME ? "you" : n;
  function splitLabel(){
    const k=ppl.filter(n=>sel[n]).length;
    if(!k) return "nobody yet";
    if(k===ppl.length) return ppl.length>1 ? "everyone" : nameOf(ppl[0]);
    if(k===1){ const only=ppl.filter(n=>sel[n])[0]; return "just "+nameOf(only); }
    return k+" of "+ppl.length;
  }

  function draw(){
    // The line of choices.
    const sum=q("afSum"); sum.innerHTML="";
    if(!allowed.length){
      const b=el("button","af-pill"); b.type="button";
      b.innerHTML=(ppl.length ? "Say which name is <b>yours</b>" : "Add <b>people</b> first");
      b.addEventListener("click", ()=> ppl.length ? sheetClaim(gid) : sheetMembers() );
      sum.appendChild(b);
    } else if(allowed.length===1){
      sum.appendChild(el("span","af-pill", "Paid by <b>"+esc(nameOf(payer))+"</b>"));
    } else {
      const b=el("button","af-pill"); b.type="button";
      b.innerHTML='Paid by <b>'+esc(nameOf(payer))+'</b><span class="ms" aria-hidden="true">expand_more</span>';
      b.setAttribute("aria-expanded", open==="payer" ? "true" : "false");
      b.addEventListener("click", ()=>{ open = open==="payer" ? null : "payer"; draw(); });
      sum.appendChild(b);
    }
    if(ppl.length){
      const b=el("button","af-pill"); b.type="button";
      b.innerHTML='Split between <b>'+esc(splitLabel())+'</b><span class="ms" aria-hidden="true">expand_more</span>';
      b.setAttribute("aria-expanded", open==="split" ? "true" : "false");
      b.addEventListener("click", ()=>{ open = open==="split" ? null : "split"; draw(); });
      sum.appendChild(b);
    }

    // The panel for whichever choice is open.
    const panel=q("afPanel"); panel.innerHTML=""; panel.hidden = !open;
    if(open==="payer"){
      panel.appendChild(el("p","af-hint","Who paid?"));
      const chips=el("div","chips");
      allowed.forEach(n=>{
        const c=el("button","chip"); c.type="button";
        c.innerHTML='<span class="dot" style="background:'+colorOf(n,gid)+'"></span>'+esc(n)+(n===ME?" (you)":"");
        c.setAttribute("aria-pressed", n===payer ? "true" : "false");
        c.addEventListener("click", ()=>{ payer=n; open=null; draw(); });
        chips.appendChild(c);
      });
      panel.appendChild(chips);
    } else if(open==="split"){
      const all = ppl.every(n=>sel[n]);
      const hint=el("p","af-hint");
      hint.innerHTML='Who was it for? <button class="af-link" type="button">'+(all ? "Clear" : "Everyone")+'</button>';
      hint.querySelector("button").addEventListener("click", ()=>{ ppl.forEach(n=> sel[n]=!all ); draw(); });
      panel.appendChild(hint);
      const chips=el("div","chips");
      ppl.forEach(n=>{
        const c=el("button","chip"); c.type="button";
        c.innerHTML='<span class="dot" style="background:'+colorOf(n,gid)+'"></span>'+esc(n)+(n===ME?" (you)":"");
        c.setAttribute("aria-pressed", sel[n] ? "true" : "false");
        c.addEventListener("click", ()=>{ sel[n]=!sel[n]; draw(); });
        chips.appendChild(c);
      });
      panel.appendChild(chips);
    }
    each();
  }

  // What each person's share comes to, as the amount is typed.
  function each(){
    const a=Number(q("afAmt").value)||0, k=ppl.filter(n=>sel[n]).length;
    q("afEach").textContent = a>0 && k ? money(Math.round(a/k*100)/100)+" each · "+k+(k===1?" person":" people") : "";
  }

  function add(){
    const d=q("afDesc").value.trim();
    const a=Math.round((Number(q("afAmt").value)||0)*100)/100;
    const between=ppl.filter(n=>sel[n]);
    if(!ppl.length) return toast("Add people to the group first");
    if(!payer || allowed.indexOf(payer)<0){
      toast("Say which name in this group is yours first");
      return sheetClaim(gid);
    }
    if(!(a>0)){ q("afAmt").focus(); return toast("Enter an amount"); }
    if(!d){ q("afDesc").focus(); return toast("Say what it was for"); }
    if(!between.length){ open="split"; draw(); return toast("Pick at least one person to split between"); }
    q("afAdd").disabled=true;
    push("trips/"+gid+"/expenses", {desc:d, amount:a, payer:payer, mode:"equal",
      between:between, vals:{}, cat:"general", note:"", at:Date.now(),
      by:ME||USER.name, byUid:USER.uid})
      .then(()=>{
        notify("expense.add", gid, {desc:d, amount:a});
        q("afDesc").value=""; q("afAmt").value="";
        ppl.forEach(n=> sel[n]=true ); open=null; draw();
        toast("Expense added");
      })
      .finally(()=>{ q("afAdd").disabled=false; });
  }

  q("afAmt").addEventListener("input", each);
  [q("afAmt"), q("afDesc")].forEach(i=> i.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); add(); }
  }));
  q("afAdd").addEventListener("click", add);
  q("afMore").addEventListener("click", ()=> sheetExpense(null) );
  draw();

  FORM={sig:sig, node:card, refresh:draw};
}

/* ---------- expenses, with the filters the tracker had ---------- */
const EXP_ALL = {};     // gid -> the whole list is showing, not just the latest
let EXP_TUNE = false;   // the split-size filters are open

/* One search box, one row of "who paid", and calm rows: what it was, who
   paid and when on one line, the amount and my share on the right. Who it
   was split between is one tap away on the expense itself, rather than a
   chip for every person on every row. The latest few show; the rest are a
   button away instead of a box that scrolls inside the page. */
function groupExpenses(main, gid){
  const all=expensesOf(gid), ppl=names(gid);

  const bar=el("div","exbar");
  bar.innerHTML=
    '<label class="exsearch"><span class="ms" aria-hidden="true">search</span>'+
      '<input id="fq" type="search" placeholder="Search expenses" aria-label="Search expenses" autocomplete="off"></label>'+
    '<button class="extune" id="fTune" type="button" aria-label="Filter by how it was split">'+
      '<span class="ms" aria-hidden="true">tune</span></button>';
  main.appendChild(bar);
  const rowsWrap=el("div","exfilters");
  rowsWrap.innerHTML=
    '<div class="frow" id="fPayer" role="group" aria-label="Who paid"></div>'+
    '<div class="frow" id="fWays" role="group" aria-label="How many ways it was split"></div>';
  main.appendChild(rowsWrap);

  const q=$("fq"); q.value=FILT.q;
  let t;
  q.addEventListener("input", ()=>{ clearTimeout(t); t=setTimeout(()=>{ FILT.q=q.value; draw(); }, 140); });

  const payers=[""].concat(ppl);
  payers.forEach(n=>{
    const c=el("button","chip"); c.type="button";
    c.textContent = !n ? "Everyone" : n===ME ? "You" : n;
    c.addEventListener("click", ()=>{ FILT.payer=(FILT.payer===n && n)?"":n; refreshChips(); draw(); });
    $("fPayer").appendChild(c);
  });
  const maxWays=Math.max(2, ppl.length);
  const ways=[0]; for(let i=2;i<=maxWays;i++) ways.push(i);
  ways.forEach(w=>{
    const c=el("button","chip"); c.type="button";
    c.textContent = w ? ("Split "+w+" ways") : "Any split";
    c.addEventListener("click", ()=>{ FILT.ways=(FILT.ways===w && w)?0:w; refreshChips(); draw(); });
    $("fWays").appendChild(c);
  });
  $("fTune").addEventListener("click", ()=>{ EXP_TUNE=!EXP_TUNE; refreshChips(); });
  function refreshChips(){
    [].forEach.call($("fPayer").children,(c,i)=> c.setAttribute("aria-pressed", FILT.payer===payers[i]?"true":"false"));
    [].forEach.call($("fWays").children,(c,i)=> c.setAttribute("aria-pressed", FILT.ways===ways[i]?"true":"false"));
    const open = EXP_TUNE || !!FILT.ways;
    $("fWays").hidden = !open;
    $("fTune").setAttribute("aria-pressed", open ? "true" : "false");
  }
  refreshChips();

  const host=el("div"); host.id="expList"; main.appendChild(host);
  draw();

  function matches(e){
    if(FILT.payer && e.payer!==FILT.payer) return false;
    const b=(e.between&&e.between.length)?e.between:[e.payer];
    if(FILT.ways && b.length!==FILT.ways) return false;
    const needle=FILT.q.trim().toLowerCase();
    if(needle){
      const hay=(e.desc+" "+e.payer+" "+(e.note||"")+" "+b.join(" ")).toLowerCase();
      if(hay.indexOf(needle)<0) return false;
    }
    return true;
  }

  function draw(){
    const list=all.filter(matches);
    host.innerHTML="";
    const filtering = !!(FILT.q.trim() || FILT.payer || FILT.ways);
    if(filtering){
      let sum=0; list.forEach(e=> sum+=Number(e.amount)||0 );
      const line=el("div","fcount");
      line.innerHTML='<span><b>'+list.length+'</b> of '+all.length+' &middot; '+money(sum)+'</span>';
      const clr=el("button",null,"Clear"); clr.type="button";
      clr.addEventListener("click", ()=>{
        FILT.q=""; FILT.payer=""; FILT.ways=0; $("fq").value=""; refreshChips(); draw();
      });
      line.appendChild(clr); host.appendChild(line);
    }
    if(!all.length){
      host.appendChild(el("div","empty",
        '<span class="ms" aria-hidden="true">receipt</span><h3>Nothing logged yet.</h3>'));
      return;
    }
    if(!list.length){
      host.appendChild(el("div","empty",
        '<span class="ms" aria-hidden="true">search_off</span><h3>Nothing matches</h3>'+
        '<p>Try a different search, or clear the filters.</p>'));
      return;
    }
    const headcount=ppl.length, CAP=6;
    const showAll = FULLVIEW || EXP_ALL[gid] || filtering;
    const shown = showAll ? list : list.slice(0, CAP);
    const card=el("div","card exlist");
    shown.forEach(e=>{
      const between=(e.between&&e.between.length)?e.between:[e.payer];
      const n=between.length, c=catOf(e.cat), amt=Number(e.amount)||0;
      const who = e.payer===ME ? "You" : e.payer;
      const split = n===1 ? "for "+(between[0]===ME ? "you" : between[0])
                  : (headcount>1 && n===headcount) ? "everyone"
                  : n+" people";
      const day = e.at ? new Date(e.at).toLocaleDateString(undefined,{day:"numeric", month:"short"}) : "";
      const mine = ME ? (sharesOf(e)[ME]||0) : 0;
      const equal = !e.mode || e.mode==="equal";
      const cap = mine>0.004 && n>1 ? "your share "+money(mine)
                : (equal && n>1) ? money(amt/n)+" each" : "";
      const r=el("button","ex2row"); r.type="button";
      r.innerHTML=
        '<span class="ex-ic" style="--c:'+colorOf(e.payer,gid)+'"><span class="ms" aria-hidden="true">'+c.i+'</span></span>'+
        '<span class="ex-b"><span class="ex-t">'+esc(e.desc)+'</span>'+
          '<span class="ex-m">'+esc(who)+' paid &middot; '+esc(split)+(day ? ' &middot; '+esc(day) : '')+'</span></span>'+
        '<span class="ex-r"><span class="ex-amt">'+money(amt)+'</span>'+
          (cap ? '<span class="ex-cap">'+cap+'</span>' : '')+'</span>';
      r.addEventListener("click", ()=>sheetExpense(e));
      card.appendChild(r);
    });
    host.appendChild(card);

    const foot=el("div","exfoot");
    if(!showAll && list.length>CAP){
      const more=el("button","exmore","Show all "+list.length+" expenses"); more.type="button";
      more.addEventListener("click", ()=>{ EXP_ALL[gid]=true; draw(); });
      foot.appendChild(more);
    } else if(EXP_ALL[gid] && !filtering && !FULLVIEW && list.length>CAP){
      const less=el("button","exmore","Show fewer"); less.type="button";
      less.addEventListener("click", ()=>{ EXP_ALL[gid]=false; draw(); });
      foot.appendChild(less);
    }
    if(!FULLVIEW){
      const link=el("a","exlink",'Open full list<span class="ms" aria-hidden="true">open_in_new</span>');
      link.href=location.pathname+"?full=1#g="+gid; link.target="_blank"; link.rel="noopener";
      foot.appendChild(link);
    }
    if(foot.children.length) host.appendChild(foot);
  }
}
function fmtAdded(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d.getTime())) return "";
  const o={weekday:"short", day:"numeric", month:"short"};
  if(d.getFullYear()!==new Date().getFullYear()) o.year="numeric";
  const date=d.toLocaleDateString(undefined,o).replace(/,/g,"");
  const time=d.toLocaleTimeString(undefined,{hour:"2-digit", minute:"2-digit"});
  return date+" · "+time;
}

function groupBalances(main, gid){
  const b=balances(gid), all=everyoneIn(gid);
  if(!all.length || !expensesOf(gid).length){
    main.appendChild(el("div","empty",
      '<span class="ms" aria-hidden="true">balance</span><h3>Add people and expenses first.</h3>'));
    if(!all.length) return;
  }
  /* You first, then whoever gets back the most down to whoever owes the most,
     so the list reads top to bottom. Each figure says in words what it means,
     so the colours never need explaining. */
  const me=meIn(gid);
  const val=(n)=> Math.round((b[n]||0)*100)/100;
  const order=all.slice().sort((x,y)=>
    (x===me ? -1 : y===me ? 1 : 0) || val(y)-val(x) || x.localeCompare(y));
  const card=el("div","card ballist");
  order.forEach(n=>{
    const m=memberOf(n, gid), v=val(n);
    const tone = v>0.004 ? "pos" : v<-0.004 ? "neg" : "zero";
    const figure = tone==="pos" ? "+"+money(v) : tone==="neg" ? "−"+money(-v) : money(0);
    const cap = tone==="pos" ? "gets back" : tone==="neg" ? "owes" : "settled";
    const r=el("button","row balrow"+(n===me?" mine":""));
    r.type="button";
    r.innerHTML=
      avatarHTML("", n, m&&m.color, m&&m.photo)+
      '<span class="body"><span class="t1"><span class="nm">'+esc(n)+'</span>'+
        (n===me?'<span class="bal-tag you">You</span>':'')+
        (!m?'<span class="bal-tag">not on the list</span>':'')+'</span>'+
      '<span class="t2">'+paidShareLine(n,gid)+'</span></span>'+
      '<span class="right"><span class="amt '+tone+'">'+figure+'</span>'+
        '<span class="cap">'+cap+'</span></span>'+
      '<span class="chev"><span class="ms" aria-hidden="true">chevron_right</span></span>';
    r.addEventListener("click", ()=>sheetPerson(n));
    card.appendChild(r);
  });
  main.appendChild(card);
}

function sectionWhoOwes(main, gid){
  const st=settlements(gid);
  if(!st.length){
    main.appendChild(el("div","empty",
      '<span class="ms" aria-hidden="true">check_circle</span>'+
      '<h3>All square - nobody owes anybody.</h3>'));
    return;
  }
  /* One plain sentence per payment - "You pay Kavya", "Kavya pays you",
     "Kelvin pays Kalai" - with both faces and an arrow between them. Grouping
     by who gets paid, with bars, made you work out the direction yourself.
     Yours come first, then everybody else's, biggest first. */
  const me=meIn(gid);
  const rank=(t)=> t.from===me ? 0 : t.to===me ? 1 : 2;
  const rows=st.slice().sort((a,c)=> rank(a)-rank(c) || c.amt-a.amt);
  const card=el("div","card owelist");
  rows.forEach(t=>{
    const iPay=!!me && t.from===me, iGet=!!me && t.to===me;
    const fm=memberOf(t.from,gid), tm=memberOf(t.to,gid);
    const line = iPay ? '<b>You</b> pay <b>'+esc(t.to)+'</b>'
               : iGet ? '<b>'+esc(t.from)+'</b> pays <b>you</b>'
               :        '<b>'+esc(t.from)+'</b> pays <b>'+esc(t.to)+'</b>';
    const note = iPay ? "You owe this" : iGet ? "Owed to you" : "Between them";
    const r=el("div","owe-row"+(iPay||iGet ? " mine" : ""));
    r.innerHTML=
      '<span class="owe-pair">'+avatarHTML("sm", t.from, fm&&fm.color, fm&&fm.photo)+
        '<span class="ms" aria-hidden="true">arrow_forward</span>'+
        avatarHTML("sm", t.to, tm&&tm.color, tm&&tm.photo)+'</span>'+
      '<span class="owe-b"><span class="owe-t">'+line+'</span>'+
        '<span class="owe-m">'+note+'</span></span>'+
      '<span class="owe-r"><span class="owe-amt '+(iPay?"neg":iGet?"pos":"zero")+'">'+
        money(t.amt)+'</span></span>';
    const right=r.querySelector(".owe-r");
    const btn=(label, soft)=>{
      const b=el("button","owe-btn"+(soft?" soft":""), label); b.type="button";
      right.appendChild(b); return b;
    };
    // The same two actions the Today card offers, where they belong.
    if(iPay){
      btn("Pay").addEventListener("click", ()=> sheetSettle(t.from, t.to, t.amt) );
    } else if(iGet){
      const key=gid+"|"+t.from, b=btn(NUDGED[key] ? "Reminder sent" : "Remind", true);
      b.disabled=!!NUDGED[key];
      b.addEventListener("click", ()=>{ if(sendNudge(gid, t.from, t.amt, b)) NUDGED[key]=true; });
    } else if(isAdmin()){
      btn("Record", true).addEventListener("click", ()=> sheetSettle(t.from, t.to, t.amt) );
    }
    card.appendChild(r);
  });
  main.appendChild(card);
}

/* ---------- global activity ---------- */
function viewActivity(main){
  setTitle(main, "Activity");
  const items=[];
  JOINED.forEach(g=>{
    expensesOf(g.id).forEach(e=> items.push({t:"e", at:Number(e.at)||0, e, gid:g.id}) );
    paymentsOf(g.id).forEach(p=> items.push({t:"p", at:Number(p.at)||0, p, gid:g.id}) );
  });
  items.sort((a,b)=> b.at-a.at);
  if(!items.length){
    const e=el("div","empty");
    e.innerHTML='<span class="ms" aria-hidden="true">receipt_long</span><h3>No activity yet</h3>'+
      '<p>Everything added across your groups shows up here.</p>';
    main.appendChild(e); return;
  }

  /* By month, then by day, newest first. Each day is its own card under a
     label saying which day it is and what was spent, so finding "that dinner
     last Tuesday" means scanning a handful of headings, not two hundred rows. */

  // A group's icon takes the same colour it has on the Groups screen.
  const order = JOINED.slice().sort((a,b)=>groupName(a.id).localeCompare(groupName(b.id))).map(g=>g.id);
  const tint = (gid)=> "gc"+(Math.max(0, order.indexOf(gid)) % 6);
  const monthKey = (ts)=>{ const d=new Date(ts||0); return d.getFullYear()+"-"+d.getMonth(); };
  const monthName = (ts)=> ts ? new Date(ts).toLocaleDateString(undefined,{month:"long", year:"numeric"}) : "Undated";
  const spent = (n)=> money(n)+" spent";

  const shown = items.slice(0,200);
  let month=null, day=null, card=null, dayTotal=0, dayOut=null, monthTotal=0, monthOut=null;

  shown.forEach(it=>{
    const mk=monthKey(it.at), dk=dayKey(it.at);
    if(mk!==month){
      month=mk; monthTotal=0; day=null;
      const mh=el("div","act-month");
      mh.innerHTML='<h2>'+esc(monthName(it.at))+'</h2><span class="act-mtotal"></span>';
      main.appendChild(mh);
      monthOut=mh.querySelector(".act-mtotal");
    }
    if(dk!==day){
      day=dk; dayTotal=0;
      const dh=el("div","act-day");
      dh.innerHTML='<span>'+esc(dayLabel(it.at))+'</span><span class="act-dtotal"></span>';
      main.appendChild(dh);
      dayOut=dh.querySelector(".act-dtotal");
      card=el("div","card act-card");
      main.appendChild(card);
    }

    const me=meIn(it.gid);
    const r=el("button","act-row "+tint(it.gid));
    r.type="button";
    if(it.t==="e"){
      const e=it.e, c=catOf(e.cat), amt=Number(e.amount)||0;
      const mine = me ? (sharesOf(e)[me]||0) : 0;
      const iPaid = !!me && e.payer===me;
      let figure, tone, what;
      // What this expense means for me, said plainly.
      if(iPaid && amt-mine > 0.004){ figure="+"+money(amt-mine); tone="pos"; what="you get back"; }
      else if(iPaid){                figure=money(amt);          tone="zero"; what="you paid"; }
      else if(mine > 0.004){         figure="−"+money(mine); tone="neg"; what="your share"; }
      else {                         figure=money(amt);          tone="zero"; what="not yours"; }
      r.innerHTML=
        '<span class="act-ic"><span class="ms" aria-hidden="true">'+c.i+'</span></span>'+
        '<span class="act-b"><span class="act-t">'+esc(e.desc)+'</span>'+
          '<span class="act-m">'+esc(iPaid ? "You" : e.payer)+' paid · '+esc(groupName(it.gid))+'</span></span>'+
        '<span class="act-r"><span class="act-amt '+tone+'">'+figure+'</span>'+

/* ---------- Today ----------
   Answers "do I owe anybody anything" before it shows anything else: the one
   payment worth making, two figures, then what has been happening. Every row
   is real data; nothing on this screen is a placeholder. */

/* Every settling-up payment I am part of, across every group. Smallest first,
   because clearing a whole person for the least money is the one worth doing
   today. */
function toDoNext(){
  const out = [];
  JOINED.forEach(g=>{
    const me = meIn(g.id);
    if(!me) return;
    settlements(g.id).forEach(t=>{
      if(t.from===me)    out.push({dir:"pay", who:t.to,   amt:t.amt, gid:g.id});
      else if(t.to===me) out.push({dir:"get", who:t.from, amt:t.amt, gid:g.id});
    });
  });
  return out.sort((a,b)=> a.amt-b.amt );
}

/* The most recent expenses anywhere, with what each one means for me. */
function latestMoments(n){
  const out = [];
  JOINED.forEach(g=>{
    const me = meIn(g.id);
    expensesOf(g.id).forEach(e=>{
      const share = sharesOf(e)[me] || 0;
      out.push({ gid:g.id, desc:e.desc, amount:Number(e.amount)||0, cat:e.cat,
                 at:Number(e.at)||0,
                 mine: (me && e.payer===me) ? (Number(e.amount)||0) - share : -share });
    });
  });
  return out.sort((a,b)=> b.at-a.at ).slice(0, n);
}

/* Everyone I share anything with, and where we stand across every group. */
function friendsAcross(){
  const by = {};
  JOINED.forEach(g=>{
    const me = meIn(g.id);
    if(!me) return;
    const seat = (n)=> membersOf(g.id).find(x=>x.name===n);
    everyoneIn(g.id).forEach(n=>{
      if(n===me) return;
      const m = seat(n);
      by[n] = by[n] || {name:n, bills:0, net:0, colour:(m&&m.colour)||"#A0A398", photo:(m&&m.photo)||null};
    });
    expensesOf(g.id).forEach(e=>{
      const sh = sharesOf(e);
      Object.keys(sh).forEach(n=>{ if(n!==me && by[n]) by[n].bills++; });
    });
    settlements(g.id).forEach(t=>{
      if(t.from===me && by[t.to])      by[t.to].net   -= t.amt;
      else if(t.to===me && by[t.from]) by[t.from].net += t.amt;
    });
  });
  return Object.keys(by).map(k=>by[k])
    .sort((a,b)=> Math.abs(b.net)-Math.abs(a.net) || a.name.localeCompare(b.name));
}

/* What am I paying them for? The newest thing we both share, so the panel can
   name it instead of saying "a balance". */
function whatFor(gid, who){
  const me = meIn(gid);
  const both = expensesOf(gid).filter(e=>{
    const sh = sharesOf(e);
    return sh[me] && (sh[who] || e.payer===who);
  }).sort((a,b)=> (b.at||0)-(a.at||0) );
  return both.length ? both[0].desc : null;
}

/* Ask somebody to settle up. The email goes out on the scheduler's next pass,
   like everything else the app sends, and the button says so rather than
   claiming the message has already arrived. */
function sendNudge(gid, who, amount, btn){
  const seat = membersOf(gid).find(x=>x.name===who);
  if(!seat || !seat.uid){
    toast(who+" has not signed in yet, so there is nowhere to send it");
    return false;
  }
  if(btn){ btn.disabled=true; btn.textContent="Reminder sent"; }
  notify("nudge", gid, {desc: who, amount: amount});
  toast("Reminder on its way to "+who+" · "+callGap());
  return true;
}

/* The Today panel turns through everything there is to settle, across every
   group, for whoever is signed in. The database redraws the screen whenever
   anything changes, so which card is showing, and who has already been
   reminded, live out here - or every redraw would jump back to the first card
   and forget the reminder. */
let HERO_I = 0;
let HERO_SWEPT = null;   // the card the light last passed over, so a redraw does not replay it
const NUDGED = {};             // "gid|name" -> reminded this session

// What I owe first, biggest first; then what I am owed, biggest first.
function heroSlides(){
  const plan = toDoNext();
  const big = (a,b)=> b.amt-a.amt;
  return plan.filter(t=>t.dir==="pay").sort(big)
    .concat(plan.filter(t=>t.dir==="get").sort(big));
}

function addExpenseAnywhere(){
  if(!JOINED.length) return sheetGroupNew();
  if(JOINED.length===1){ openGroup(JOINED[0].id); setTimeout(()=>sheetExpense(null), 260); return; }
  sheetPickGroup();
}

function viewHome(main){
  $("barTitle").hidden = true;
  $("barBrand").hidden = false;
  $("fab").hidden = true;

  const head = el("div","topline");
  head.innerHTML =
    '<div><h1 class="display">Money feels lighter when it’s clear.</h1>'+
    '<p class="eyebrow">'+esc(new Date().toLocaleDateString(undefined,
      {weekday:"long", month:"long", day:"numeric"}))+'</p></div>';
  // On a phone this button would sit beside the raised one in the bar below,
  // so it only appears where there is no bar.
  const addBtn = el("button","btn dark","+  Add expense");
  addBtn.addEventListener("click", sheetQuickAdd);
  head.appendChild(addBtn);
  main.appendChild(head);

  if(!JOINED.length){
    const e=el("div","empty");
    e.innerHTML='<span class="ms" aria-hidden="true">group</span><h3>No groups yet</h3>'+
      '<p>Create one for a trip, a flat or a couple — then add the people you split with.</p>';
    const b=el("button","btn p","Create a group"); b.addEventListener("click", sheetGroupNew);
    e.appendChild(b);
    e.style.marginTop="var(--s5)";
    main.appendChild(e);
    return;
  }

  let owed=0, owe=0;
  JOINED.forEach(g=>{ const v=myBalance(g.id); if(v>0.004) owed+=v; else if(v<-0.004) owe+=-v; });
  const plan = toDoNext();
  const oweWho = {}, owedWho = {};
  plan.forEach(t=> (t.dir==="pay" ? oweWho : owedWho)[t.who]=true );
  const net = owed-owe;

  /* ---- the feature panel: everything to settle, one card at a time ----
     The amount is the point of each card, so it is the biggest thing on it;
     who, which group and what for sit around it. */
  const slides = heroSlides();
  if(HERO_I >= slides.length) HERO_I = 0;
  const still = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  const hero = el("section","hero carousel"+(still ? " still" : ""));
  hero.setAttribute("aria-roledescription","carousel");
  hero.setAttribute("aria-label","What there is to settle");
  // The cards slide inside their own window. The panel clips at its border,
  // not inside its padding, so without this the next card showed at the edge.
  const view = el("div","hc-view");
  const track = el("div","hc-track");
  view.appendChild(track);
  hero.appendChild(view);
  // Light passes across the card once each time a new one comes up. It is its
  // own layer because the panel's two drawn circles already use ::before and
  // ::after.
  const sheen = el("span","hc-sheen");
  sheen.setAttribute("aria-hidden","true");
  hero.appendChild(sheen);

  const face = (icon, text)=> '<span class="ms" aria-hidden="true">'+icon+'</span>'+esc(text);

  if(!slides.length){
    const s0 = el("div","hc-slide done on");
    s0.innerHTML =
      '<div class="hc-top"><span class="hc-av" aria-hidden="true"><span class="ms">check</span></span>'+
        '<span class="hc-chip">All clear</span></div>'+
      '<h2 class="hc-amt">Everything is settled.</h2>'+
      '<p class="hc-for">Nobody owes anybody in any of your groups.</p>';
    track.appendChild(s0);
  }
  slides.forEach((t,i)=>{
    const pay = t.dir==="pay", forWhat = whatFor(t.gid, t.who), key = t.gid+"|"+t.who;
    const sl = el("div","hc-slide "+(pay ? "owe" : "get"));
    sl.setAttribute("role","group");
    sl.setAttribute("aria-roledescription","slide");
    sl.setAttribute("aria-label", (i+1)+" of "+slides.length);
    sl.innerHTML =
      '<div class="hc-top">'+
        '<span class="hc-av" aria-hidden="true">'+esc(initials(t.who))+'</span>'+
        '<span class="hc-chip">'+(pay ? "You owe" : "Owed to you")+'<i aria-hidden="true"></i>'+esc(groupName(t.gid))+'</span>'+
      '</div>'+
      '<p class="hc-line">'+(pay ? 'You owe <b>'+esc(t.who)+'</b>' : '<b>'+esc(t.who)+'</b> owes you')+'</p>'+
      '<h2 class="hc-amt">'+money(t.amt)+'</h2>'+
      '<p class="hc-for">'+(forWhat ? 'for '+esc(forWhat) : 'in '+esc(groupName(t.gid)))+'</p>'+
      '<div class="act"></div>';
    const b = el("button","btn dark hc-btn");
    const label = (pay ? "Pay " : "Remind ")+t.who;
    b.setAttribute("aria-label", label+" "+money(t.amt));
    if(!pay && NUDGED[key]){
      b.innerHTML = face("done","Reminder sent"); b.disabled = true;
      b.setAttribute("aria-label","Reminder sent to "+t.who);
    } else {
      b.innerHTML = face(pay ? "north_east" : "notifications_active", label);
    }
    b.addEventListener("click", ()=>{
      if(pay){
        // I owe them: record that I paid.
        const me = meIn(t.gid);
        openGroup(t.gid);
        setTimeout(()=> sheetSettle(me, t.who, t.amt, null), 260);
        return;
      }
      // They owe me: ask them for it. Recording a payment they have not made
      // would put a falsehood in the ledger.
      if(sendNudge(t.gid, t.who, t.amt, b)){
        NUDGED[key] = true;
        b.innerHTML = face("done","Reminder sent");
        b.setAttribute("aria-label","Reminder sent to "+t.who);
      }
    });
    sl.querySelector(".act").appendChild(b);
    track.appendChild(sl);
  });

  const foot = el("div","hc-foot");
  const segs = el("div","hc-segs");
  foot.appendChild(segs);
  // One quiet line: the words, then the figure with its sign and colour, so it
  // reads "you are up" or "you are down" at a glance.
  const tone = net > 0.004 ? "pos" : net < -0.004 ? "neg" : "zero";
  const figure = tone==="pos" ? "+"+money(net) : tone==="neg" ? "\u2212"+money(-net) : money(0);
  foot.insertAdjacentHTML("beforeend",
    '<span class="net '+tone+'"><small>Overall balance</small><b>'+figure+'</b></span>');
  hero.appendChild(foot);
  main.appendChild(hero);

  if(slides.length > 1){
    slides.forEach((t,j)=>{
      const d = el("button","hc-seg"); d.type = "button";
      d.setAttribute("aria-label", "Show "+(j+1)+" of "+slides.length);
      d.innerHTML = "<i></i>";
      d.addEventListener("click", ()=> show(j) );
      // The bar filling on the showing segment is the clock: when it runs out
      // the next card comes up. Holding the card pauses the fill, so the time
      // left can never drift from what the bar shows. No timer to leak, and a
      // background tab pauses it by itself.
      d.firstChild.addEventListener("animationend", ()=>{ if(j===HERO_I) show(HERO_I + 1); });
      segs.appendChild(d);
    });
  }

  function show(i){
    if(!slides.length){
      // All clear: nothing to page through, but it still glows and gets its
      // one pass of light.
      hero.classList.add("mood-done");
      if(!still && HERO_SWEPT!=="done"){ sheen.classList.add("go"); }
      HERO_SWEPT = "done";
      return;
    }
    HERO_I = (i + slides.length) % slides.length;
    track.style.transform = "translateX("+(-HERO_I*100)+"%)";
    // Cards off to the side are out of reach of the keyboard and screen
    // readers, so Tab never lands on a button that cannot be seen.
    [].forEach.call(track.children, (c,j)=>{ c.inert = j!==HERO_I; c.classList.toggle("on", j===HERO_I); });
    // The glow takes the colour of what is showing: warm for money you owe,
    // green for money coming back to you.
    const cur = track.children[HERO_I];
    ["owe","get","done"].forEach(m=> hero.classList.toggle("mood-"+m, !!cur && cur.classList.contains(m)) );
    if(!still && HERO_I!==HERO_SWEPT){
      sheen.classList.remove("go"); void sheen.offsetWidth; sheen.classList.add("go");
    }
    HERO_SWEPT = HERO_I;
    [].forEach.call(segs.children, (d,j)=>{
      d.setAttribute("aria-current", j===HERO_I ? "true" : "false");
      d.classList.remove("run");
      if(j===HERO_I && !still){ void d.offsetWidth; d.classList.add("run"); }
    });
  }

  // Hold still while a hand is on it, or while it has keyboard focus - but not
  // merely because a tap left focus on a button, or it would stay stopped
  // after every tap.
  const hold = (on)=> hero.classList.toggle("held", on);
  hero.addEventListener("pointerenter", ()=> hold(true));
  hero.addEventListener("pointerleave", ()=> hold(false));
  hero.addEventListener("focusin", (e)=>{ if(e.target.matches && e.target.matches(":focus-visible")) hold(true); });
  hero.addEventListener("focusout", ()=> hold(false));

  // Swipe between cards.
  let x0 = null;
  track.addEventListener("pointerdown", e=>{ x0 = e.clientX; });
  track.addEventListener("pointerup", e=>{
    if(x0 === null) return;
    const dx = e.clientX - x0; x0 = null;
    if(Math.abs(dx) > 40) show(HERO_I + (dx < 0 ? 1 : -1));
  });

  // Put the card that was showing back without sliding to it from the first.
  track.style.transition = "none";
  show(HERO_I);
  void track.offsetWidth;
  track.style.transition = "";

  /* ---- summary cards ---- */

  /* ---- the groups themselves ---- */

    c.addEventListener("click", ()=> openGroup(g.id) );
    cards.appendChild(c);

  main.appendChild(cards);
}
