<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settle — shared expenses</title>
<meta name="description" content="Split expenses with friends, flatmates and trips. Everyone adds from their own phone and it syncs live.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f9d76">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Settle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
/* ============================================================
   SETTLE — shared expense app
   Theme locked light so phone dark mode cannot alter it.
   ============================================================ */
:root{
  color-scheme: light;
  --teal:#0f9d76; --teal-dk:#0a7a5b; --teal-lt:#e6f6f1; --teal-mid:#57c4a5;
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6;
  --ink:#1b2430; --ink-soft:#5b6775; --ink-faint:#8e99a6; --line:#e6e9ee;
  --owed:#0f9d76;   /* they owe you   */
  --owe:#e06236;    /* you owe them   */
  --danger:#d4453b;
  --sh1:0 1px 2px rgba(20,30,45,.06), 0 1px 3px rgba(20,30,45,.05);
  --sh2:0 4px 12px rgba(20,30,45,.10);
  --sh3:0 12px 34px rgba(20,30,45,.18);
  --f:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){ :root{
  color-scheme: light;
  --teal:#0f9d76; --teal-dk:#0a7a5b; --teal-lt:#e6f6f1; --teal-mid:#57c4a5;
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6;
  --ink:#1b2430; --ink-soft:#5b6775; --ink-faint:#8e99a6; --line:#e6e9ee;
  --owed:#0f9d76; --owe:#e06236; --danger:#d4453b;
}}
:root[data-theme]{ color-scheme: light; }

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--f);
  font-size:15px; line-height:1.5; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.ms{ font-family:"Material Symbols Outlined"; font-weight:normal; font-style:normal;
  font-size:22px; line-height:1; letter-spacing:normal; text-transform:none;
  display:inline-block; white-space:nowrap; direction:ltr;
  font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; vertical-align:middle; }
:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
button, input, select, textarea{ font:inherit; font-family:var(--f); }
[hidden]{ display:none !important; }

/* ---------- app bar ---------- */
.bar{
  position:sticky; top:0; z-index:30; background:var(--teal);
  color:#fff; padding:14px 12px; display:flex; align-items:center; gap:6px;
  box-shadow:var(--sh1);
}
.bar h1{ font-size:18px; font-weight:700; margin:0; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.2px; }
.bar .sub{ display:block; font-size:12px; font-weight:500; opacity:.9; margin-top:1px; }
.ibtn{
  width:42px; height:42px; border-radius:50%; border:0; background:transparent; color:inherit;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
  text-decoration:none;
}
.ibtn:hover{ background:rgba(255,255,255,.16); }
.bar.plain{ background:var(--surface); color:var(--ink); border-bottom:1px solid var(--line); }
.bar.plain .ibtn:hover{ background:var(--surface-2); }

.wrap{ max-width:760px; margin:0 auto; padding:14px 14px calc(90px + var(--safe-b)); }

/* ---------- generic surfaces ---------- */
.card{ background:var(--surface); border-radius:14px; box-shadow:var(--sh1); margin-bottom:14px; overflow:hidden; }
.card.pad{ padding:16px; }
.sechead{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-faint); margin:20px 4px 8px; }

/* ---------- rows ---------- */
.row{ display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-bottom:1px solid var(--line); background:var(--surface); width:100%;
  text-align:left; border-left:0; border-right:0; border-top:0; cursor:pointer; }
.row:last-child{ border-bottom:0; }
.row:hover{ background:var(--surface-2); }
.row .body{ flex:1; min-width:0; }
.row .t1{ font-weight:600; font-size:15px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .t2{ font-size:12.5px; color:var(--ink-soft); display:block; margin-top:2px; }
.row .right{ text-align:right; flex:0 0 auto; }
.row .amt{ font-weight:700; font-size:14.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.row .cap{ font-size:11px; color:var(--ink-faint); display:block; }
.pos{ color:var(--owed); } .neg{ color:var(--owe); } .zero{ color:var(--ink-faint); }

/* avatars */
.av{ width:42px; height:42px; border-radius:50%; flex:0 0 auto; color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
  text-transform:uppercase; letter-spacing:-.3px; }
.av.sm{ width:28px; height:28px; font-size:11px; }
.av.lg{ width:54px; height:54px; font-size:19px; }
.cat{ width:42px; height:42px; border-radius:12px; flex:0 0 auto; background:var(--surface-2);
  color:var(--ink-soft); display:flex; align-items:center; justify-content:center; }
.cat .ms{ font-size:22px; }

/* ---------- summary banner ---------- */
.summary{ background:var(--surface); border-radius:14px; box-shadow:var(--sh1); padding:18px 16px; margin-bottom:14px; }
.summary .big{ font-size:26px; font-weight:800; letter-spacing:-.6px; font-variant-numeric:tabular-nums; }
.summary .lab{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
.split{ display:flex; gap:10px; margin-top:14px; }
.split > div{ flex:1; background:var(--surface-2); border-radius:10px; padding:10px 12px; }
.split .k{ font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.split .v{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }

/* ---------- buttons ---------- */
.btn{ min-height:44px; padding:11px 18px; border-radius:10px; border:0; cursor:pointer;
  font-size:14.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn.p{ background:var(--teal); color:#fff; }
.btn.p:hover{ background:var(--teal-dk); }
.btn.s{ background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
.btn.s:hover{ background:var(--surface-2); }
.btn.d{ background:#fdecea; color:var(--danger); }
.btn.wide{ width:100%; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btnrow{ display:flex; gap:10px; }
.btnrow .btn{ flex:1; }

/* FAB */
.fab{
  position:fixed; right:16px; bottom:calc(78px + var(--safe-b)); z-index:35;
  height:52px; padding:0 20px; border-radius:26px; border:0; cursor:pointer;
  background:var(--teal); color:#fff; font-weight:700; font-size:15px;
  display:inline-flex; align-items:center; gap:8px; box-shadow:var(--sh2);
}
.fab:hover{ background:var(--teal-dk); }

/* ---------- bottom nav ---------- */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface);
  border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b);
}
.nav button{
  flex:1; border:0; background:transparent; cursor:pointer; padding:8px 4px 10px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:600; color:var(--ink-faint);
}
.nav button .ms{ font-size:23px; }
.nav button[aria-current="page"]{ color:var(--teal); }

/* ---------- forms ---------- */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
.field input, .field select, .field textarea{
  width:100%; min-height:48px; padding:12px 14px; font-size:16px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:10px; appearance:none;
}
.field textarea{ min-height:72px; resize:vertical; }
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-lt); }
.field .help{ font-size:12px; color:var(--ink-faint); margin-top:5px; }
.amtbig{ display:flex; align-items:center; gap:10px; }
.amtbig .cur{ font-size:26px; font-weight:700; color:var(--ink-faint); }
.amtbig input{ font-size:30px !important; font-weight:700; min-height:60px; letter-spacing:-.5px;
  font-variant-numeric:tabular-nums; }

/* chips */
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:7px 13px;
  border-radius:19px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-soft); font-size:13.5px; font-weight:600; cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--teal); color:#fff; border-color:var(--teal); }
.chip[aria-pressed="true"] .dot{ box-shadow:0 0 0 1.5px rgba(255,255,255,.9); }
.chip .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
.seg{ display:flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:3px; }
.seg button{ flex:1; border:0; background:transparent; cursor:pointer; padding:9px 6px;
  border-radius:8px; font-size:13px; font-weight:600; color:var(--ink-soft); }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--sh1); }

/* split editor rows */
.splitrow{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.splitrow:last-child{ border-bottom:0; }
.splitrow .nm{ flex:1; min-width:0; font-size:14px; font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.splitrow input{ width:92px; min-height:40px; padding:8px 10px; text-align:right;
  border:1px solid var(--line); border-radius:8px; font-size:15px; font-variant-numeric:tabular-nums; }
.splitrow .unit{ width:22px; font-size:13px; color:var(--ink-faint); }
.splitrow .calc{ width:82px; text-align:right; font-size:13px; color:var(--ink-soft);
  font-variant-numeric:tabular-nums; }
.splitsum{ display:flex; justify-content:space-between; padding:12px 0 0; font-size:13px; font-weight:600; }
.splitsum.bad{ color:var(--danger); }
.splitsum.ok{ color:var(--owed); }

/* ---------- sheets & dialogs ---------- */
.scrim{ position:fixed; inset:0; background:rgba(16,24,32,.45); z-index:50; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51; max-height:92vh; overflow-y:auto;
  background:var(--surface); border-radius:18px 18px 0 0; box-shadow:var(--sh3);
  padding:0 0 calc(18px + var(--safe-b));
}
@media(min-width:620px){
  .sheet{ left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%);
    width:560px; border-radius:16px; max-height:88vh; }
}
.sheet .shead{
  position:sticky; top:0; background:var(--surface); z-index:2; display:flex; align-items:center;
  gap:8px; padding:14px 12px; border-bottom:1px solid var(--line);
}
.sheet .shead h2{ font-size:17px; font-weight:700; margin:0; flex:1; }
.sheet .sbody{ padding:16px; }
.grab{ width:38px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 0; }
@media(min-width:620px){ .grab{ display:none; } }

/* ---------- misc ---------- */
.empty{ text-align:center; padding:44px 20px; color:var(--ink-faint); }
.empty .ms{ font-size:48px; opacity:.4; display:block; margin-bottom:10px; }
.empty h3{ font-size:16px; font-weight:700; color:var(--ink-soft); margin:0 0 6px; }
.empty p{ font-size:13.5px; margin:0 0 16px; }
.daygroup{ font-size:12px; font-weight:700; color:var(--ink-faint); padding:14px 16px 6px;
  background:var(--surface); letter-spacing:.04em; text-transform:uppercase; }
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + var(--safe-b)); z-index:70;
  background:#20303f; color:#fff; padding:12px 18px; border-radius:10px; font-size:14px;
  box-shadow:var(--sh2); opacity:0; pointer-events:none; transition:opacity .18s; max-width:90vw;
}
.toast.on{ opacity:1; }
.sync{ font-size:12px; padding:7px 14px; text-align:center; font-weight:600; }
.sync.ok{ background:var(--teal-lt); color:var(--teal-dk); }
.sync.warn{ background:#fff6e0; color:#8a6a12; }
.sync.bad{ background:#fdecea; color:var(--danger); }
.mine{ box-shadow:inset 3px 0 0 var(--teal); }
.tag{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--surface-2);
  color:var(--ink-faint); }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

/* ---------- printing (kept last so it wins the cascade) ---------- */
#printArea{ display:none; }
@media print{
  @page{ margin:14mm; }
  body{ background:#fff; }
  body.printing > *{ display:none !important; }
  body.printing #printArea{ display:block !important; }
  #printArea{ font-size:11pt; color:#000; }
  #printArea h1{ font-size:19pt; margin:0 0 2px; letter-spacing:-.4px; }
  #printArea h2{ font-size:12.5pt; margin:22px 0 6px; padding-bottom:4px;
    border-bottom:1.5px solid #000; page-break-after:avoid; }
  #printArea .pmeta{ font-size:9.5pt; color:#444; margin:0 0 4px; }
  #printArea table{ width:100%; border-collapse:collapse; margin:0; font-size:9.5pt; }
  #printArea th, #printArea td{ border-bottom:1px solid #ccc; padding:5px 6px;
    text-align:left; vertical-align:top; }
  #printArea th{ font-size:8pt; text-transform:uppercase; letter-spacing:.05em;
    color:#333; border-bottom:1px solid #000; }
  #printArea .r{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  #printArea .who{ font-size:8.5pt; color:#444; }
  #printArea .note{ font-size:8.5pt; color:#555; font-style:italic; }
  #printArea ul{ margin:0; padding-left:18px; }
  #printArea li{ margin-bottom:3px; }
  #printArea tr{ page-break-inside:avoid; }
}
</style>
</head>
<body>

<header class="bar" id="bar">
  <button class="ibtn" id="backBtn" aria-label="Back" hidden><span class="ms" aria-hidden="true">arrow_back</span></button>
  <h1 id="barTitle">Groups<span class="sub" id="barSub" hidden></span></h1>
  <button class="ibtn" id="shareBtn" aria-label="Share this group" hidden><span class="ms" aria-hidden="true">person_add</span></button>
  <button class="ibtn" id="printBtn" aria-label="Print or save as PDF" hidden><span class="ms" aria-hidden="true">print</span></button>
  <button class="ibtn" id="gmenuBtn" aria-label="Group settings" hidden><span class="ms" aria-hidden="true">more_vert</span></button>
</header>
<div class="sync" id="syncBar" hidden></div>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" hidden><span class="ms" aria-hidden="true">add</span><span id="fabLabel">Add expense</span></button>

<nav class="nav" id="nav" aria-label="Sections">
  <button data-tab="groups" aria-current="page"><span class="ms" aria-hidden="true">groups</span>Groups</button>
  <button data-tab="activity"><span class="ms" aria-hidden="true">receipt_long</span>Activity</button>
  <button data-tab="account"><span class="ms" aria-hidden="true">account_circle</span>Account</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grab"></div>
  <div class="shead">
    <h2 id="sheetTitle">…</h2>
    <button class="ibtn" id="sheetClose" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button>
  </div>
  <div class="sbody" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="firebase-config.js"></script>
<script type="module">
/* ===========================================================================
   SETTLE — shared expense app
   Data model (Firebase Realtime Database):
     trips/{gid}/meta      {name, type, at}
     trips/{gid}/people/{k}    {n, c}
     trips/{gid}/expenses/{k}  {desc, amount, payer, mode, between[], vals{}, cat, note, at, by}
     trips/{gid}/payments/{k}  {from, to, amount, note, at, by}
   Identity and the list of joined groups live on the device.
   =========================================================================== */
const $  = (id) => document.getElementById(id);
const el = (t, c, h) => { const n=document.createElement(t); if(c) n.className=c; if(h!=null) n.innerHTML=h; return n; };

const PALETTE = ["#0f9d76","#1565c0","#6a1b9a","#c62828","#ef6c00","#2e7d32",
                 "#ad1457","#4527a0","#00838f","#558b2f","#5d4037","#37474f"];
const CATS = [
  {k:"general",  i:"receipt_long",   n:"General"},
  {k:"food",     i:"restaurant",     n:"Food & drink"},
  {k:"grocery",  i:"shopping_cart",  n:"Groceries"},
  {k:"transport",i:"directions_car", n:"Transport"},
  {k:"fuel",     i:"local_gas_station", n:"Fuel"},
  {k:"home",     i:"home",           n:"Home & rent"},
  {k:"utilities",i:"bolt",           n:"Utilities"},
  {k:"travel",   i:"flight",         n:"Travel"},
  {k:"lodging",  i:"hotel",          n:"Lodging"},
  {k:"fun",      i:"celebration",    n:"Entertainment"},
  {k:"shopping", i:"shopping_bag",   n:"Shopping"},
  {k:"health",   i:"medical_services",n:"Health"}
];
const catOf = (k) => CATS.find(c=>c.k===k) || CATS[0];

/* ---------------- local state ---------------- */
const LS = {
  me:  "settle.me.v1",
  grp: "settle.groups.v1",
  cur: "settle.cur.v1"
};
function lsGet(k, d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let ME       = lsGet(LS.me, null);          // my display name
let JOINED   = lsGet(LS.grp, []);           // [{id,name}]
let CURRENT  = null;                        // active group id
let TAB      = "groups";                    // groups | activity | account
let GTAB     = "expenses";                  // expenses | balances | activity
let DATA     = {};                          // gid -> {meta, people, expenses, payments}
let remote   = null;                        // firebase handles
const subs   = {};                          // gid -> unsubscribe

/* ---------------- helpers ---------------- */
function money(n){ const v=Math.round((n+Number.EPSILON)*100)/100; return (v<0?"-$":"$")+Math.abs(v).toFixed(2); }
function plain(n){ return (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); }
function trim(n){ return String(Math.round((n+Number.EPSILON)*100)/100); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(n){ const p=String(n||"?").trim().split(/\s+/); return (p[0].charAt(0)+(p[1]?p[1].charAt(0):"")).toUpperCase(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), 2400); }
function fmtDate(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d)) return "";
  const o={day:"numeric", month:"short"};
  if(d.getFullYear()!==new Date().getFullYear()) o.year="numeric";
  return d.toLocaleDateString(undefined,o);
}
function fmtWhen(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d)) return "";
  return fmtDate(ts)+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function dayKey(ts){ const d=new Date(ts||0);
  return isNaN(d) ? "" : d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function dayLabel(ts){
  const d=new Date(ts||0); if(isNaN(d)) return "Undated";
  const t=new Date(), y=new Date(Date.now()-864e5);
  if(dayKey(ts)===dayKey(t)) return "Today";
  if(dayKey(ts)===dayKey(y)) return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"long"});
}

/* ---------------- group data accessors ---------------- */
const G = () => DATA[CURRENT] || {};
function membersOf(gid){
  const g=DATA[gid]||{}, raw=g.people||{};
  const keys=Object.keys(raw).sort();
  const taken=new Set(); keys.forEach(k=>{ const c=raw[k] && raw[k].c; if(c) taken.add(c.toLowerCase()); });
  let next=0;
  return keys.map(k=>{
    const v=raw[k]; const name=(v&&typeof v==="object")?(v.n||""):String(v);
    let color=(v&&typeof v==="object"&&v.c)?v.c:null;
    if(!color){
      while(next<PALETTE.length && taken.has(PALETTE[next].toLowerCase())) next++;
      color=PALETTE[next%PALETTE.length]; taken.add(color.toLowerCase()); next++;
    }
    return {k, name, color};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
const names   = (gid) => membersOf(gid||CURRENT).map(m=>m.name);
const colorOf = (n, gid) => { const m=membersOf(gid||CURRENT).find(x=>x.name===n); return m?m.color:"#8e99a6"; };
function listOf(gid, what){
  const raw=(DATA[gid]||{})[what]||{};
  return Object.entries(raw).map(([k,v])=>Object.assign({k},v)).sort((a,b)=>(b.at||0)-(a.at||0));
}
const expensesOf = (gid) => listOf(gid||CURRENT, "expenses");
const paymentsOf = (gid) => listOf(gid||CURRENT, "payments");

/* ---------------- split maths ---------------- */
// Returns {name: amountOwed}. Modes: equal | exact | percent | shares
function sharesOf(e){
  const out={};
  const between=(e.between&&e.between.length)?e.between:[e.payer];
  const vals=e.vals||{};
  const amt=Number(e.amount)||0;
  if(e.mode==="exact"){
    between.forEach(n=> out[n]=Number(vals[n])||0 );
  } else if(e.mode==="percent"){
    between.forEach(n=> out[n]= amt*((Number(vals[n])||0)/100) );
  } else if(e.mode==="shares"){
    const tot=between.reduce((a,n)=>a+(Number(vals[n])||0),0) || 1;
    between.forEach(n=> out[n]= amt*((Number(vals[n])||0)/tot) );
  } else {
    const per=amt/between.length;
    between.forEach(n=> out[n]=per );
  }
  return out;
}
// Net position per person: positive = they are owed, negative = they owe
function balances(gid){
  const b={};
  names(gid).forEach(n=> b[n]=0 );
  expensesOf(gid).forEach(e=>{
    if(!(e.payer in b)) b[e.payer]=0;
    b[e.payer]+=Number(e.amount)||0;
    const sh=sharesOf(e);
    Object.keys(sh).forEach(n=>{ if(!(n in b)) b[n]=0; b[n]-=sh[n]; });
  });
  paymentsOf(gid).forEach(p=>{
    if(!(p.from in b)) b[p.from]=0;
    if(!(p.to   in b)) b[p.to]=0;
    b[p.from]+=Number(p.amount)||0;   // paying down what you owe
    b[p.to]  -=Number(p.amount)||0;
  });
  return b;
}
// Fewest transfers that clear everyone
function settlements(gid){
  const b=balances(gid), cred=[], deb=[];
  Object.keys(b).forEach(n=>{ const v=Math.round(b[n]*100)/100;
    if(v>0.004) cred.push({n, v}); else if(v<-0.004) deb.push({n, v:-v}); });
  cred.sort((a,c)=>c.v-a.v); deb.sort((a,c)=>c.v-a.v);
  const out=[]; let i=0,j=0,guard=0;
  while(i<deb.length && j<cred.length && guard++<9999){
    const pay=Math.min(deb[i].v, cred[j].v);
    if(pay>0.004) out.push({from:deb[i].n, to:cred[j].n, amt:pay});
    deb[i].v-=pay; cred[j].v-=pay;
    if(deb[i].v<=0.004) i++;
    if(cred[j].v<=0.004) j++;
  }
  return out;
}
const myBalance = (gid) => { if(!ME) return 0; const b=balances(gid); return b[ME]||0; };

/* ---------------- writes ---------------- */
function ref(path){ return remote.ref(remote.db, path); }
function push(path, val){
  if(!remote){ toast("Not connected yet"); return Promise.resolve(); }
  return remote.push(ref(path), val).catch(e=>toast("Could not save: "+e.message));
}
function set(path, val){
  if(!remote) return Promise.resolve();
  return remote.set(ref(path), val).catch(e=>toast("Could not save: "+e.message));
}
function del(path){
  if(!remote) return Promise.resolve();
  return remote.remove(ref(path)).catch(e=>toast("Could not remove: "+e.message));
}

/* ---------------- groups on this device ---------------- */
function rememberGroup(id, name){
  if(!JOINED.some(g=>g.id===id)) JOINED.push({id, name});
  else JOINED = JOINED.map(g=> g.id===id ? {id, name:name||g.name} : g);
  lsSet(LS.grp, JOINED);
}
function forgetGroup(id){
  JOINED = JOINED.filter(g=>g.id!==id); lsSet(LS.grp, JOINED);
  if(subs[id]){ subs[id](); delete subs[id]; }
  delete DATA[id];
}
function groupName(id){
  const g=DATA[id]&&DATA[id].meta&&DATA[id].meta.name;
  if(g) return g;
  const j=JOINED.find(x=>x.id===id);
  return j? j.name : "Group";
}

function render(){
  const main=$("main"); main.innerHTML="";
  $("fab").hidden=true; $("backBtn").hidden=true;
  $("shareBtn").hidden=true; $("printBtn").hidden=true; $("gmenuBtn").hidden=true;
  $("barSub").hidden=true; $("bar").classList.remove("plain");

  document.querySelectorAll(".nav button").forEach(b=>{
    if(b.dataset.tab===TAB && !CURRENT) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });

  const y=window.scrollY;
  if(!ME)                   viewWelcome(main);
  else if(CURRENT)          viewGroup(main);
  else if(TAB==="groups")   viewGroups(main);

  else if(TAB==="account")  viewAccount(main);

}

function groupExpenses(main, gid){
  const list=expensesOf(gid);

    const e=el("div","empty");
    e.innerHTML='<span class="ms" aria-hidden="true">receipt_long</span><h3>No expenses yet</h3>'+
      '<p>Add the first one and everyone in the group will see it.</p>';
    main.appendChild(e); return;
  }
  const card=el("div","card"); let day=null;
  list.forEach(e=>{
    const k=dayKey(e.at);
    if(k!==day){ day=k; card.appendChild(el("div","daygroup", esc(dayLabel(e.at)))); }
    const sh=sharesOf(e), mine=ME?(sh[ME]||0):0;
    const iPaid=e.payer===ME;
    const lent=iPaid ? (Number(e.amount)||0)-mine : 0;
    const c=catOf(e.cat);
    const r=el("button","row"+(iPaid?" mine":""));
    let right;
    if(!ME || (!iPaid && !mine)) right='<span class="amt zero">not involved</span>';
    else if(iPaid) right='<span class="amt pos">'+money(lent)+'</span><span class="cap">you lent</span>';
    else right='<span class="amt neg">'+money(mine)+'</span><span class="cap">you borrowed</span>';
    r.innerHTML=
      '<span class="cat"><span class="ms" aria-hidden="true">'+c.i+'</span></span>'+
      '<span class="body"><span class="t1">'+esc(e.desc)+'</span>'+
      '<span class="t2">'+esc(iPaid?"You":e.payer)+' paid '+money(e.amount)+'</span></span>'+
      '<span class="right">'+right+'</span>';
    r.addEventListener("click", ()=>sheetExpense(e));
    card.appendChild(r);
  });

}

  const st=settlements(gid);
  if(st.length){
    main.appendChild(el("div","sechead","Settle up"));
    const c=el("div","card");
    st.forEach(t=>{
      const involves = t.from===ME || t.to===ME;

        '<span class="av" style="background:'+colorOf(t.from,gid)+'">'+esc(initials(t.from))+'</span>'+

      '<span class="right"><span class="amt '+(v>0.004?"pos":v<-0.004?"neg":"zero")+'">'+
        (Math.abs(v)<0.005?"settled":money(Math.abs(v)))+'</span>'+
      '<span class="cap">'+(v>0.004?"is owed":v<-0.004?"owes":"")+'</span></span>';
    r.addEventListener("click", ()=>sheetPerson(n));
    c2.appendChild(r);
  });
  main.appendChild(c2);
}
function paidShareLine(n, gid){
  let paid=0, share=0;
  expensesOf(gid).forEach(e=>{
    if(e.payer===n) paid+=Number(e.amount)||0;
    const sh=sharesOf(e); if(sh[n]) share+=sh[n];
  });
  return "paid "+money(paid)+" · share "+money(share);
}

function fieldHTML(id, label, type, value, extra){
  return '<div class="field"><label for="'+id+'">'+label+'</label>'+
    '<input id="'+id+'" type="'+type+'" value="'+esc(value==null?"":value)+'" '+(extra||"")+'></div>';

function dateVal(ts){
  const d=new Date(ts||Date.now()); if(isNaN(d)) return "";
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function tsFromDate(v, old){
  if(!v) return old||Date.now();
  const parts=v.split("-").map(Number);
  const o=new Date(old||Date.now());
  const d=new Date(parts[0], parts[1]-1, parts[2], o.getHours(), o.getMinutes(), o.getSeconds());
  return isNaN(d)?(old||Date.now()):d.getTime();
}

/* ---------- add / edit an expense ---------- */
function sheetExpense(existing){
  const gid=CURRENT, ppl=names(gid);
  if(!ppl.length){ toast("Add people to the group first"); return sheetMembers(); }

  let mode = existing ? (existing.mode||"equal") : "equal";
  let between = existing && existing.between && existing.between.length
      ? existing.between.filter(n=>ppl.indexOf(n)>-1) : ppl.slice();
  if(!between.length) between=ppl.slice();
  let vals = Object.assign({}, (existing&&existing.vals)||{});
  let cat  = existing ? (existing.cat||"general") : "general";
  const payerDefault = existing ? existing.payer : (ppl.indexOf(ME)>-1 ? ME : ppl[0]);

  openSheet(existing?"Edit expense":"Add an expense", (b)=>{
    b.innerHTML =
      '<div class="field"><label for="exDesc">What was it for?</label>'+
      '<input id="exDesc" type="text" placeholder="Dinner, fuel, groceries…" value="'+esc(existing?existing.desc:"")+'"></div>'+
      '<div class="field"><label for="exAmt">Amount</label><div class="amtbig"><span class="cur">$</span>'+
      '<input id="exAmt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="'+
        (existing?esc(plain(Number(existing.amount)||0)):"")+'"></div></div>'+
      '<div class="field"><label for="exPayer">Paid by</label><select id="exPayer">'+
        ppl.map(n=>'<option value="'+esc(n)+'"'+(n===payerDefault?' selected':'')+'>'+esc(n)+(n===ME?" (you)":"")+'</option>').join("")+
      '</select></div>'+
      '<div class="field"><label>Category</label><div class="chips" id="exCats"></div></div>'+
      '<div class="field"><label>How to split</label><div class="seg" id="exMode">'+
        '<button type="button" data-m="equal">Equally</button>'+
        '<button type="button" data-m="exact">Exact</button>'+
        '<button type="button" data-m="percent">%</button>'+
        '<button type="button" data-m="shares">Shares</button>'+
      '</div><div class="help" id="exModeHelp"></div></div>'+
      '<div class="field"><label>Between</label><div id="exSplit"></div>'+
        '<div class="splitsum" id="exSum"><span></span><span></span></div></div>'+
      fieldHTML("exDate","Date","date", dateVal(existing?existing.at:null))+
      '<div class="field"><label for="exNote">Note (optional)</label>'+
      '<textarea id="exNote" placeholder="Anything worth remembering">'+esc(existing?(existing.note||""):"")+'</textarea></div>'+
      '<div class="btnrow"><button class="btn p" id="exSave">'+(existing?"Save changes":"Add expense")+'</button></div>'+
      (existing?'<button class="btn d wide" id="exDel" style="margin-top:10px">Delete this expense</button>':'')+
      (existing?'<p class="help" style="text-align:center;margin-top:12px;color:var(--ink-faint);font-size:12px">Added by '+
        esc(existing.by||existing.payer)+' · '+esc(fmtWhen(existing.at))+'</p>':'');

    const cats=$("exCats");
    CATS.forEach(c=>{
      const ch=el("button","chip"); ch.type="button";
      ch.innerHTML='<span class="ms" aria-hidden="true" style="font-size:18px">'+c.i+'</span>'+c.n;
      ch.setAttribute("aria-pressed", c.k===cat?"true":"false");
      ch.addEventListener("click",()=>{ cat=c.k;
        [].forEach.call(cats.children,x=>x.setAttribute("aria-pressed","false"));
        ch.setAttribute("aria-pressed","true"); });
      cats.appendChild(ch);
    });

    [].forEach.call($("exMode").children, btn=>{
      btn.addEventListener("click", ()=>{ mode=btn.dataset.m; drawMode(); drawSplit(); });
    });
    $("exAmt").addEventListener("input", drawSplit);
    drawMode(); drawSplit();

    $("exSave").addEventListener("click", save);
    if(existing) $("exDel").addEventListener("click", ()=>{
      if(!confirm('Delete "'+existing.desc+'"? This removes it for everyone.')) return;
      del("trips/"+gid+"/expenses/"+existing.k); closeSheet(); toast("Expense deleted");
    });

    function drawMode(){
      [].forEach.call($("exMode").children, b2=>
        b2.setAttribute("aria-pressed", b2.dataset.m===mode?"true":"false"));
      $("exModeHelp").textContent = mode==="equal" ? "Split evenly between everyone ticked below."
        : mode==="exact" ? "Type exactly what each person owes. It must add up to the total."
        : mode==="percent" ? "Type each person's percentage. It must add up to 100%."
        : "Give each person a number of shares — 2 shares pays twice as much as 1.";
    }
    function drawSplit(){
      const host=$("exSplit"); host.innerHTML="";
      const amt=Number($("exAmt").value)||0;
      if(mode==="equal"){
        const chips=el("div","chips");
        ppl.forEach(n=>{
          const on=between.indexOf(n)>-1;
          const ch=el("button","chip"); ch.type="button";
          ch.innerHTML='<span class="dot" style="background:'+colorOf(n,gid)+'"></span>'+esc(n)+(n===ME?" (you)":"");
          ch.setAttribute("aria-pressed", on?"true":"false");
          ch.addEventListener("click",()=>{
            const i=between.indexOf(n);
            if(i>-1){ if(between.length===1) return toast("At least one person"); between.splice(i,1); }
            else between.push(n);
            drawSplit();
          });
          chips.appendChild(ch);
        });
        host.appendChild(chips);
        const all=el("button","btn s","Everyone"); all.type="button";
        all.style.cssText="margin-top:10px;height:36px;min-height:36px;padding:6px 14px;font-size:13px";
        all.addEventListener("click",()=>{ between=ppl.slice(); drawSplit(); });
        host.appendChild(all);
        const per=between.length?amt/between.length:0;
        setSum(between.length+(between.length===1?" person":" people")+" · "+money(per)+" each", "", true);
        return;
      }
      ppl.forEach(n=>{
        const on=between.indexOf(n)>-1;
        const r=el("div","splitrow");
        r.innerHTML=
          '<span class="av sm" style="background:'+(on?colorOf(n,gid):"#c9ced6")+'">'+esc(initials(n))+'</span>'+
          '<span class="nm" style="'+(on?"":"opacity:.5")+'">'+esc(n)+(n===ME?" (you)":"")+'</span>'+
          '<span class="calc" data-calc></span>'+
          '<input type="number" inputmode="decimal" step="'+(mode==="shares"?"1":"0.01")+'" min="0" '+
            'value="'+(on&&vals[n]!=null?esc(String(vals[n])):"")+'" aria-label="'+esc(n)+'">'+
          '<span class="unit">'+(mode==="percent"?"%":mode==="shares"?"sh":"$")+'</span>';
        const inp=r.querySelector("input");
        inp.addEventListener("input", ()=>{
          const v=inp.value.trim();
          if(v===""){ delete vals[n]; const i=between.indexOf(n); if(i>-1) between.splice(i,1); }
          else { vals[n]=Number(v)||0; if(between.indexOf(n)<0) between.push(n); }
          recalc();
        });
        host.appendChild(r);
      });
      recalc();
    }
    function recalc(){
      const amt=Number($("exAmt").value)||0;
      const rows=$("exSplit").querySelectorAll(".splitrow");
      const eff=between.filter(n=>ppl.indexOf(n)>-1);
      let tot=0; eff.forEach(n=> tot+=Number(vals[n])||0 );
      [].forEach.call(rows,(r,i)=>{
        const n=ppl[i], c=r.querySelector("[data-calc]"), on=eff.indexOf(n)>-1;
        r.querySelector(".nm").style.opacity = on?"1":".5";
        r.querySelector(".av").style.background = on?colorOf(n,gid):"#c9ced6";
        if(!on || !amt){ c.textContent=""; return; }
        const v=Number(vals[n])||0;
        c.textContent = mode==="exact" ? "" :
          mode==="percent" ? money(amt*v/100) :
          money(tot? amt*v/tot : 0);
      });
      if(mode==="exact"){
        const left=Math.round((amt-tot)*100)/100;
        setSum(money(tot)+" of "+money(amt),
               Math.abs(left)<0.005?"all accounted for":(left>0?money(left)+" left":money(-left)+" over"),
               Math.abs(left)<0.005);
      } else if(mode==="percent"){
        const left=Math.round((100-tot)*100)/100;
        setSum(trim(tot)+"% of 100%",
               Math.abs(left)<0.005?"adds up":(left>0?trim(left)+"% left":trim(-left)+"% over"),
               Math.abs(left)<0.005);
      } else {
        setSum(trim(tot)+" share"+(tot===1?"":"s")+" between "+eff.length,
               eff.length?"":"pick at least one", eff.length>0 && tot>0);
      }
    }
    function setSum(a, bTxt, ok){
      const s=$("exSum"); s.className="splitsum"+(ok?" ok":bTxt?" bad":"");
      s.children[0].textContent=a; s.children[1].textContent=bTxt;
    }
    function save(){
      const desc=$("exDesc").value.trim();
      const amt=Math.round((Number($("exAmt").value)||0)*100)/100;
      if(!desc) return toast("Give it a description");
      if(!(amt>0)) return toast("Enter an amount");
      const eff=between.filter(n=>ppl.indexOf(n)>-1);
      if(!eff.length) return toast("Pick who it is split between");
      const v={};
      if(mode!=="equal"){
        let tot=0; eff.forEach(n=>{ v[n]=Number(vals[n])||0; tot+=v[n]; });
        if(mode==="exact"   && Math.abs(tot-amt)>0.011) return toast("The amounts must add up to "+money(amt));
        if(mode==="percent" && Math.abs(tot-100)>0.011) return toast("The percentages must add up to 100");
        if(mode==="shares"  && tot<=0)                  return toast("Give someone at least one share");
      }
      const rec={
        desc: desc, amount: amt, payer: $("exPayer").value, mode: mode,
        between: eff, vals: v, cat: cat, note: $("exNote").value.trim(),
        at: tsFromDate($("exDate").value, existing?existing.at:null),
        by: existing ? (existing.by||ME) : ME
      };
      if(existing) set("trips/"+gid+"/expenses/"+existing.k, rec);
      else push("trips/"+gid+"/expenses", rec);
      closeSheet(); toast(existing?"Expense updated":"Expense added");
    }
  });
  setTimeout(()=>{ const d=$("exDesc"); if(d && !existing) d.focus(); }, 90);
}

/* ---------- record a payment ---------- */
function sheetSettle(from, to, amt){
  const gid=CURRENT, ppl=names(gid);
  if(ppl.length<2){ toast("You need at least two people"); return; }
  from = from || (ppl.indexOf(ME)>-1?ME:ppl[0]);
  to   = to   || ppl.filter(n=>n!==from)[0] || ppl[0];
  openSheet("Record a payment", (b)=>{
    b.innerHTML=
      '<p class="help" style="margin:-4px 0 16px;color:var(--ink-soft);font-size:13.5px">'+
      'Use this when cash or a transfer has actually changed hands.</p>'+
      '<div class="field"><label for="stFrom">Who paid</label><select id="stFrom">'+
        ppl.map(n=>'<option value="'+esc(n)+'"'+(n===from?' selected':'')+'>'+esc(n)+(n===ME?" (you)":"")+'</option>').join("")+
      '</select></div>'+
      '<div class="field"><label for="stTo">Who received it</label><select id="stTo">'+
        ppl.map(n=>'<option value="'+esc(n)+'"'+(n===to?' selected':'')+'>'+esc(n)+(n===ME?" (you)":"")+'</option>').join("")+
      '</select></div>'+
      '<div class="field"><label for="stAmt">Amount</label><div class="amtbig"><span class="cur">$</span>'+
      '<input id="stAmt" type="number" inputmode="decimal" step="0.01" min="0" value="'+(amt?esc(plain(amt)):"")+'"></div></div>'+
      fieldHTML("stDate","Date","date", dateVal(null))+
      '<div class="field"><label for="stNote">Note (optional)</label>'+
      '<input id="stNote" type="text" placeholder="e-transfer, cash…"></div>'+
      '<button class="btn p wide" id="stSave">Record payment</button>';
    $("stSave").addEventListener("click", ()=>{
      const f=$("stFrom").value, t=$("stTo").value;
      const a=Math.round((Number($("stAmt").value)||0)*100)/100;
      if(f===t) return toast("Pick two different people");
      if(!(a>0)) return toast("Enter an amount");
      push("trips/"+gid+"/payments", {from:f, to:t, amount:a,
        note:$("stNote").value.trim(), at:tsFromDate($("stDate").value,null), by:ME});
      closeSheet(); toast("Payment recorded");
    });
  });
}

/* ---------- one person's detail ---------- */
function sheetPerson(n){
  const gid=CURRENT, b0=balances(gid), v=b0[n]||0;
  openSheet(n===ME?"You":n, (b)=>{
    let paid=0, share=0; const lines=[];
    expensesOf(gid).forEach(e=>{
      const sh=sharesOf(e), mine=sh[n]||0, isPayer=e.payer===n;
      if(!isPayer && !mine) return;
      if(isPayer) paid+=Number(e.amount)||0;
      share+=mine;
      lines.push('<div class="splitrow"><span class="nm">'+esc(e.desc)+
        '<span style="display:block;font-size:11.5px;color:var(--ink-faint)">'+esc(fmtDate(e.at))+
        (isPayer?" · paid "+money(e.amount):"")+'</span></span>'+
        '<span class="calc" style="width:96px">'+(mine?"share "+money(mine):"—")+'</span></div>');
    });
    const pays=paymentsOf(gid).filter(p=>p.from===n||p.to===n).map(p=>
      '<div class="splitrow"><span class="nm">'+(p.from===n?"Paid "+esc(p.to):"Received from "+esc(p.from))+
      '<span style="display:block;font-size:11.5px;color:var(--ink-faint)">'+esc(fmtDate(p.at))+'</span></span>'+
      '<span class="calc" style="width:96px">'+money(p.amount)+'</span></div>');

    b.innerHTML=
      '<div class="summary" style="margin-bottom:16px;box-shadow:none;background:var(--surface-2)">'+
      '<div class="big '+(v>0.004?"pos":v<-0.004?"neg":"zero")+'">'+
        (Math.abs(v)<0.005?"All settled up":money(Math.abs(v)))+'</div>'+
      '<div class="lab">'+(v>0.004?(n===ME?"you are owed":esc(n)+" is owed"):v<-0.004?(n===ME?"you owe":esc(n)+" owes"):"nothing outstanding")+'</div>'+
      '<div class="split"><div style="background:var(--surface)"><div class="k">Paid out</div><div class="v">'+money(paid)+'</div></div>'+
      '<div style="background:var(--surface)"><div class="k">Share of costs</div><div class="v">'+money(share)+'</div></div></div></div>'+
      '<div class="sechead" style="margin-top:0">Expenses involved in</div>'+
      (lines.length?lines.join(""):'<p class="help">None yet.</p>')+
      (pays.length?'<div class="sechead">Payments</div>'+pays.join(""):"")+
      '<button class="btn p wide" id="pSettle" style="margin-top:18px">Settle up</button>';
    $("pSettle").addEventListener("click", ()=>{
      const amt=Math.abs(Math.round(v*100)/100);
      closeSheet();
      setTimeout(()=>{
        if(v<-0.004) sheetSettle(n, null, amt);
        else if(v>0.004) sheetSettle(null, n, amt);
        else sheetSettle();
      }, 220);
    });
  });
}

/* ---------- members ---------- */
function sheetMembers(){
  const gid=CURRENT;
  openSheet("People in this group", (b)=>{
    const draw=()=>{
      const list=membersOf(gid), bal=balances(gid);
      b.innerHTML=
        '<div class="field"><label for="mName">Add someone</label>'+
        '<div style="display:flex;gap:8px"><input id="mName" type="text" placeholder="Their name">'+
        '<button class="btn p" id="mAdd" style="flex:0 0 auto">Add</button></div>'+
        '<div class="help">Names only — nobody needs an account.</div></div>'+
        (list.length?'<div class="sechead" style="margin-top:18px">'+list.length+' member'+(list.length===1?"":"s")+'</div>':"")+
        '<div id="mList"></div>';
      const host=$("mList");
      list.forEach(m=>{
        const v=bal[m.name]||0;
        const r=el("div","splitrow");
        r.innerHTML='<span class="av sm" style="background:'+m.color+'">'+esc(initials(m.name))+'</span>'+
          '<span class="nm">'+esc(m.name)+(m.name===ME?' <span class="tag">you</span>':'')+'</span>'+
          '<span class="calc">'+(Math.abs(v)<0.005?"settled":money(v))+'</span>';
        const x=el("button","ibtn");
        x.style.cssText="color:var(--danger);width:38px;height:38px";
        x.setAttribute("aria-label","Remove "+m.name);
        x.innerHTML='<span class="ms" aria-hidden="true" style="font-size:20px">close</span>';
        x.addEventListener("click", ()=>{
          const used=expensesOf(gid).some(e=>e.payer===m.name||(e.between||[]).indexOf(m.name)>-1)
                  || paymentsOf(gid).some(p=>p.from===m.name||p.to===m.name);
          if(used) return toast("Remove or edit their expenses first");
          del("trips/"+gid+"/people/"+m.k).then(()=>setTimeout(draw,150));
        });
        r.appendChild(x);
        host.appendChild(r);
      });
      const add=()=>{
        const v=$("mName").value.trim();
        if(!v) return toast("Enter a name");
        if(names(gid).some(n=>n.toLowerCase()===v.toLowerCase())) return toast(v+" is already in this group");
        const used={}; membersOf(gid).forEach(m=>{ used[m.color.toLowerCase()]=1; });
        let c=null;
        for(let i=0;i<PALETTE.length;i++){ if(!used[PALETTE[i].toLowerCase()]){ c=PALETTE[i]; break; } }
        if(!c) c=PALETTE[membersOf(gid).length%PALETTE.length];
        push("trips/"+gid+"/people", {n:v, c:c}).then(()=>setTimeout(draw,150));
      };
      $("mAdd").addEventListener("click", add);
      $("mName").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });
    };
    draw();
  }, render);
}

/* ---------- create / join / share a group ---------- */
function slug(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,28) || "group";
}
function sheetGroupNew(){
  openSheet("New group", (b)=>{
    b.innerHTML=
      '<div class="field"><label for="gName">Group name</label>'+
      '<input id="gName" type="text" placeholder="Montréal trip, Flat 4B, Sunday football…"></div>'+
      '<div class="field"><label>What is it for?</label><div class="chips" id="gType"></div></div>'+
      '<div class="field"><label for="gPeople">People (one per line)</label>'+
      '<textarea id="gPeople" rows="5" placeholder="One name per line"></textarea>'+
      '<div class="help">You can add more later.</div></div>'+
      '<button class="btn p wide" id="gGo">Create group</button>';
    $("gPeople").value = ME ? ME+"\n" : "";
    let type="trip";
    const types=[["trip","Trip","luggage"],["home","Home","home"],["couple","Couple","favorite"],["other","Other","group"]];
    types.forEach(t=>{
      const ch=el("button","chip"); ch.type="button";
      ch.innerHTML='<span class="ms" aria-hidden="true" style="font-size:18px">'+t[2]+'</span>'+t[1];
      ch.setAttribute("aria-pressed", t[0]===type?"true":"false");
      ch.addEventListener("click",()=>{ type=t[0];
        [].forEach.call($("gType").children,x=>x.setAttribute("aria-pressed","false"));
        ch.setAttribute("aria-pressed","true"); });
      $("gType").appendChild(ch);
    });
    $("gGo").addEventListener("click", ()=>{
      const nm=$("gName").value.trim();
      if(!nm) return toast("Give the group a name");
      const gid=slug(nm)+"-"+Math.random().toString(36).slice(2,6);
      const typed=$("gPeople").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const seen={}, people={};
      typed.forEach((n,i)=>{
        const key=n.toLowerCase(); if(seen[key]) return; seen[key]=1;
        people["m"+i+uid().slice(-4)]={n:n, c:PALETTE[i%PALETTE.length]};
      });
      set("trips/"+gid, {meta:{name:nm, type:type, at:Date.now(), by:ME}, people:people}).then(()=>{
        rememberGroup(gid, nm); watchGroup(gid); closeSheet();
        setTimeout(()=>{ openGroup(gid); toast("Group created — share the link to invite people"); }, 260);
      });
    });
    setTimeout(()=>$("gName").focus(), 90);
  });
}
function sheetGroupJoin(){
  openSheet("Join a group", (b)=>{
    b.innerHTML=
      '<p class="help" style="margin:-4px 0 16px;color:var(--ink-soft);font-size:13.5px">'+
      'Paste the link someone shared, or type the group code from the end of it.</p>'+
      '<div class="field"><label for="jCode">Link or code</label>'+
      '<input id="jCode" type="text" placeholder="https://…/#g=montreal-trip-4f2a" autocapitalize="off" autocorrect="off"></div>'+
      '<button class="btn p wide" id="jGo">Join</button>';
    $("jGo").addEventListener("click", ()=>{
      let v=$("jCode").value.trim();
      const m=v.match(/[#?&]g=([A-Za-z0-9_-]+)/);
      if(m) v=m[1];
      v=v.replace(/^.*\//,"").replace(/[^A-Za-z0-9_-]/g,"");
      if(!v) return toast("Paste a link or code");
      if(!remote) return toast("Not connected yet — try again in a moment");
      remote.get(ref("trips/"+v+"/meta")).then(snap=>{
        if(!snap.exists()) return toast("No group with that code");
        const meta=snap.val()||{};
        rememberGroup(v, meta.name||"Group"); watchGroup(v); closeSheet();
        setTimeout(()=>{ openGroup(v); toast("Joined "+(meta.name||"the group")); }, 260);
      }).catch(()=>toast("Could not check that code"));
    });
    setTimeout(()=>$("jCode").focus(), 90);
  });
}
function shareURL(gid){ return location.origin+location.pathname+"#g="+gid; }
function sheetShare(){
  const gid=CURRENT, url=shareURL(gid);
  openSheet("Invite people", (b)=>{
    b.innerHTML=
      '<p class="help" style="margin:-4px 0 14px;color:var(--ink-soft);font-size:13.5px">'+
      'Anyone who opens this link joins “'+esc(groupName(gid))+'” and sees the same expenses, live.</p>'+
      '<div class="field"><label for="shUrl">Link</label>'+
      '<input id="shUrl" type="text" readonly value="'+esc(url)+'"></div>'+
      '<div class="btnrow"><button class="btn p" id="shCopy">Copy link</button>'+
      (navigator.share?'<button class="btn s" id="shNative">Share…</button>':'')+'</div>'+
      '<div class="sechead">Group code</div>'+
      '<p style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--surface-2);'+

      }]
    ];
    const c=el("div","card"); c.style.cssText="margin:-16px -16px 0;box-shadow:none";
    items.forEach(it=>{
      const danger = it[2]==="delete_forever";
      const r=el("button","row");
      r.innerHTML='<span class="cat"'+(danger?' style="background:#fdecea;color:var(--danger)"':'')+'>'+
        '<span class="ms" aria-hidden="true">'+it[2]+'</span></span>'+
        '<span class="body"><span class="t1"'+(danger?' style="color:var(--danger)"':'')+'>'+it[0]+'</span>'+
        (it[1]?'<span class="t2">'+it[1]+'</span>':'')+'</span>';
      r.addEventListener("click", ()=>{ closeSheet(); setTimeout(it[3], 240); });
      c.appendChild(r);
    });
    b.appendChild(c);
  });
}
function sheetGroupRename(){
  const gid=CURRENT;
  openSheet("Rename group", (b)=>{
    b.innerHTML=fieldHTML("grName","Group name","text", groupName(gid))+
      '<button class="btn p wide" id="grGo">Save</button>';
    $("grGo").addEventListener("click", ()=>{
      const v=$("grName").value.trim(); if(!v) return toast("Enter a name");
      set("trips/"+gid+"/meta/name", v).then(()=>{ rememberGroup(gid,v); closeSheet(); toast("Renamed"); });
    });
  });
}
function sheetRename(){
  openSheet("Change my name", (b)=>{
    b.innerHTML=fieldHTML("myName","Your name","text", ME)+
      '<div class="help" style="margin:-8px 0 14px">This changes who the app treats as “you” on this device. '+
      'To rename yourself inside a group, use that group’s people list.</div>'+
      '<button class="btn p wide" id="myGo">Save</button>';
    $("myGo").addEventListener("click", ()=>{
      const v=$("myName").value.trim(); if(!v) return toast("Enter a name");
      ME=v; lsSet(LS.me, ME); closeSheet(); render(); toast("Saved");
    });

/* =========================== PRINT =========================== */
function doPrint(){
  const gid=CURRENT; if(!gid) return;
  const old=document.getElementById("printArea"); if(old) old.remove();
  const area=el("div"); area.id="printArea";
  const b=balances(gid), st=settlements(gid), ppl=names(gid);
  let total=0; expensesOf(gid).forEach(e=> total+=Number(e.amount)||0 );

  let h='<h1>'+esc(groupName(gid))+'</h1>'+
    '<p class="pmeta">Statement printed '+esc(fmtWhen(Date.now()))+' · '+ppl.length+
    ' member'+(ppl.length===1?"":"s")+' · '+expensesOf(gid).length+' expense'+
    (expensesOf(gid).length===1?"":"s")+' · '+money(total)+' in total</p>';

  h+='<h2>Who owes what</h2><table><thead><tr><th>Person</th><th class="r">Paid</th>'+
     '<th class="r">Share</th><th class="r">Balance</th></tr></thead><tbody>';
  ppl.forEach(n=>{
    let paid=0, share=0;
    expensesOf(gid).forEach(e=>{ if(e.payer===n) paid+=Number(e.amount)||0;
      const sh=sharesOf(e); if(sh[n]) share+=sh[n]; });
    const v=b[n]||0;
    h+='<tr><td>'+esc(n)+'</td><td class="r">'+money(paid)+'</td><td class="r">'+money(share)+
       '</td><td class="r"><strong>'+(Math.abs(v)<0.005?"settled":money(v))+'</strong></td></tr>';
  });
  h+='</tbody></table>';

  if(st.length){
    h+='<h2>Settling up — the fewest payments that clear everyone</h2><ul>';
    st.forEach(t=> h+='<li><strong>'+esc(t.from)+'</strong> pays <strong>'+esc(t.to)+
      '</strong> '+money(t.amt)+'</li>' );
    h+='</ul>';
  } else {
    h+='<h2>Settling up</h2><p>Everyone is square — no payments needed.</p>';
  }

  h+='<h2>Every expense</h2><table><thead><tr><th>Date</th><th>What</th><th>Paid by</th>'+
     '<th>Split between</th><th class="r">Amount</th></tr></thead><tbody>';
  expensesOf(gid).slice().sort((a,c)=>(a.at||0)-(c.at||0)).forEach(e=>{
    const sh=sharesOf(e);
    const who=Object.keys(sh).map(n=>esc(n)+" "+money(sh[n])).join(", ");
    h+='<tr><td>'+esc(fmtDate(e.at))+'</td><td>'+esc(e.desc)+
       (e.note?'<br><span class="note">'+esc(e.note)+'</span>':'')+
       '</td><td>'+esc(e.payer)+'</td><td class="who">'+who+'</td><td class="r">'+money(e.amount)+'</td></tr>';
  });
  h+='</tbody></table>';

  const pays=paymentsOf(gid);
  if(pays.length){
    h+='<h2>Payments already made</h2><table><thead><tr><th>Date</th><th>From</th><th>To</th>'+
       '<th>Note</th><th class="r">Amount</th></tr></thead><tbody>';
    pays.slice().sort((a,c)=>(a.at||0)-(c.at||0)).forEach(p=>{
      h+='<tr><td>'+esc(fmtDate(p.at))+'</td><td>'+esc(p.from)+'</td><td>'+esc(p.to)+
         '</td><td>'+esc(p.note||"")+'</td><td class="r">'+money(p.amount)+'</td></tr>';
    });
    h+='</tbody></table>';
  }

  area.innerHTML=h;
  document.body.appendChild(area);
  document.body.classList.add("printing");
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{ document.body.classList.remove("printing"); area.remove(); }, 400);
  }, 120);
}

/* =========================== FIREBASE =========================== */
function setSync(state, msg){
  const s=$("syncBar");
  if(!msg){ s.hidden=true; return; }
  s.hidden=false; s.className="sync"+(state?" "+state:""); s.textContent=msg;
}
function watchGroup(gid){
  if(!remote || subs[gid]) return;
  const r=ref("trips/"+gid);
  const cb=remote.onValue(r, snap=>{
    const v=snap.val();
    if(v===null){
      // deleted upstream, or a code that does not exist
      if(DATA[gid]){ toast("“"+groupName(gid)+"” was deleted"); forgetGroup(gid); if(CURRENT===gid) closeGroup(); }
      DATA[gid]={};
      render(); return;
    }
    DATA[gid]=v;
    if(v.meta && v.meta.name) rememberGroup(gid, v.meta.name);
    render();
  }, err=>{
    setSync("bad","Cannot read this group — "+(err&&err.message?err.message:"check the database rules"));
  });
  subs[gid]=()=>{ try{ remote.off(r,"value",cb); }catch(e){} };
}
function watchAll(){ JOINED.slice().forEach(g=>watchGroup(g.id)); }

const DEFAULT_GROUP = window.DEFAULT_TRIP || "stlawrence-sep2026";

// The original single-sheet app wrote people + expenses under this same path but
// with no meta node. Nothing needs moving — it only needs a name, added once.
function adoptLegacy(){
  return remote.get(ref("trips/"+DEFAULT_GROUP)).then(s=>{
    if(!s.exists()) return false;
    const v=s.val()||{};
    if(!v.people && !v.expenses) return false;
    if(v.meta && v.meta.name) return true;
    return remote.set(ref("trips/"+DEFAULT_GROUP+"/meta"),
      {name:"St Lawrence trip", type:"trip", at:Date.now(), by:"the original sheet"}
    ).then(()=>true).catch(()=>true);
  }).catch(()=>false);
}

(function boot(){
  render();
  const cfg=window.FIREBASE_CONFIG;
  const ok = cfg && cfg.apiKey && cfg.apiKey.indexOf("PASTE_")!==0 && cfg.databaseURL;
  if(!ok){ setSync("warn","Not connected — add your Firebase settings to sync between phones."); return; }
  setSync("","Connecting…");
  (async function(){
    try{
      const appMod  = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
      const authMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js");
      const dbMod   = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js");
      const app=appMod.initializeApp(cfg);
      await authMod.signInAnonymously(authMod.getAuth(app));
      const db=dbMod.getDatabase(app);
      remote={ db:db, ref:dbMod.ref, push:dbMod.push, set:dbMod.set, remove:dbMod.remove,
               onValue:dbMod.onValue, off:dbMod.off, get:dbMod.get };

      const exists = await adoptLegacy();
      if(exists && !JOINED.length) rememberGroup(DEFAULT_GROUP, "St Lawrence trip");

      watchAll();

      const m=location.hash.match(/g=([A-Za-z0-9_-]+)/) || location.search.match(/[?&]g=([A-Za-z0-9_-]+)/);
      if(m){
        const gid=m[1];
        const known=JOINED.some(g=>g.id===gid);
        const snap=await remote.get(ref("trips/"+gid+"/meta"));
        if(snap.exists()){
          rememberGroup(gid, (snap.val()||{}).name||"Group");
          watchGroup(gid);
          if(!known) toast("You joined “"+((snap.val()||{}).name||"the group")+"”");
          openGroup(gid);
        } else {
          toast("That group link no longer works");
          location.hash="";
        }
      } else if(lsGet(LS.cur,null) && JOINED.some(g=>g.id===lsGet(LS.cur,null))){
        openGroup(lsGet(LS.cur,null));
      }

      setSync("ok","Live — everyone in your groups sees changes instantly");
      setTimeout(()=>setSync(null), 3500);

      dbMod.onValue(dbMod.ref(db,".info/connected"), s=>{
        if(s.val()===false) setSync("warn","Offline — your changes will sync when signal returns");
        else setSync(null);
      });
      render();
    }catch(err){
      setSync("bad","Sync unavailable — "+((err&&err.message)?err.message:"working on this device only"));
    }
  })();
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
