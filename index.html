<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settle — shared expenses</title>
<meta name="description" content="Split expenses with friends, flatmates and trips. Everyone adds from their own phone and it syncs live.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f2f7">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Settle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
/* ============================================================
   SETTLE — Liquid Glass, applied the way Apple specifies it

   The rule that matters: Liquid Glass is the material of the
   NAVIGATION layer only — the bar buttons, the tab bar, the
   floating action button, the sheet surface. It floats above
   content and refracts the content passing beneath it.

   It is never applied to content: lists, rows, cards, tiles,
   fields, text. And glass is never nested inside glass — so
   the controls inside a glass sheet are solid, and the bar
   buttons flatten once the bar itself turns to glass.

   Content is therefore an ordinary opaque iOS grouped list:
   white cards on a grey ground, hairline separators inset to
   the text. That contrast is what lets the glass read as
   glass at all.
   ============================================================ */
:root{
  color-scheme: light;

  /* iOS system colours, light */
  --green:#34C759; --green-dk:#1E7B34; --green-lt:rgba(52,199,89,.15);
  --blue:#007AFF;  --indigo:#5856D6;   --mint:#00C7BE;
  --red:#FF3B30;   --orange:#FF9500;

  --owed:#1E7B34;  /* they owe you */
  --owe:#C9271E;   /* you owe them */
  --danger:#C9271E;
  --tint:#34C759;

  /* content layer — solid, per iOS grouped-list convention */
  --ground:#f2f2f7;
  --surface:#ffffff;
  --fill-1:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.18);
  --fill-3:rgba(118,118,128,.24);

  --label:#000000;
  --label-2:rgba(60,60,67,.60);
  --label-3:rgba(60,60,67,.34);
  --sep:rgba(60,60,67,.20);

  /* navigation layer — the only place glass is allowed */
  --glass:rgba(255,255,255,.42);
  --glass-thick:rgba(255,255,255,.62);
  --lens: blur(22px) saturate(190%) brightness(1.08);
  --lens-soft: blur(16px) saturate(180%) brightness(1.06);
  --float: 0 1px 2px rgba(16,24,48,.06), 0 10px 28px rgba(16,24,48,.16);
  --float-s: 0 1px 2px rgba(16,24,48,.06), 0 5px 16px rgba(16,24,48,.13);
  --card-sh: 0 1px 2px rgba(16,24,48,.05), 0 6px 18px rgba(16,24,48,.06);

  --spring: cubic-bezier(.34,1.4,.64,1);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Inter", system-ui, "Segoe UI", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){ :root{
  color-scheme: light;
  --green:#34C759; --green-dk:#1E7B34; --green-lt:rgba(52,199,89,.15);
  --blue:#007AFF; --indigo:#5856D6; --mint:#00C7BE; --red:#FF3B30; --orange:#FF9500;
  --owed:#1E7B34; --owe:#C9271E; --danger:#C9271E; --tint:#34C759;
  --ground:#f2f2f7; --surface:#ffffff;
  --fill-1:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.18); --fill-3:rgba(118,118,128,.24);
  --label:#000000; --label-2:rgba(60,60,67,.60); --label-3:rgba(60,60,67,.34);
  --sep:rgba(60,60,67,.20);
  --glass:rgba(255,255,255,.42); --glass-thick:rgba(255,255,255,.62);
}}
:root[data-theme]{ color-scheme: light; }

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--ground); color:var(--label); font-family:var(--f);
  font-size:17px; line-height:1.41; letter-spacing:-.01em; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* A quiet wash on the ground. It shows in the gutters between cards, which is
   what the floating glass samples as content scrolls beneath it. */
.bgmesh{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(58% 40% at 8% 2%,   rgba(52,199,89,.20),  transparent 70%),
    radial-gradient(54% 38% at 96% 8%,  rgba(0,122,255,.16),  transparent 68%),
    radial-gradient(60% 42% at 88% 64%, rgba(88,86,214,.14),  transparent 70%),
    radial-gradient(56% 40% at 4% 82%,  rgba(0,199,190,.16),  transparent 70%),
    var(--ground);
}

.ms{ font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal;
  font-size:22px; line-height:1; letter-spacing:normal; text-transform:none;
  display:inline-block; white-space:nowrap; direction:ltr;
  font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; vertical-align:middle; }
:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }
button, input, select, textarea{ font:inherit; font-family:var(--f); }
[hidden]{ display:none !important; }

/* ============================================================
   THE GLASS — navigation layer only.
   ::before is the lens rim, a gradient ring masked to the border
   alone so the edge reads as the thickness of the material.
   ::after is the specular sweep over the curved surface.
   ============================================================ */
.glass{
  position:relative; isolation:isolate;
  background:var(--glass);
  backdrop-filter:var(--lens); -webkit-backdrop-filter:var(--lens);
}
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.25px;
  background:linear-gradient(142deg,
    rgba(255,255,255,1) 0%, rgba(255,255,255,.45) 20%,
    rgba(255,255,255,.05) 47%, rgba(255,255,255,.32) 75%, rgba(255,255,255,.95) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none; z-index:2;
}
.glass::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(170deg,
    rgba(255,255,255,.42) 0%, rgba(255,255,255,.10) 24%, rgba(255,255,255,0) 48%);
  z-index:1;
}

/* ---------- navigation bar ---------- */
.bar{
  position:sticky; top:0; z-index:30; padding:calc(8px + var(--safe-t)) 12px 8px;
  display:flex; align-items:center; gap:8px; min-height:56px;
  background:transparent; transition:background .25s, box-shadow .25s;
}
.bar.scrolled{
  background:var(--glass);
  backdrop-filter:var(--lens); -webkit-backdrop-filter:var(--lens);
  box-shadow:0 .5px 0 var(--sep), inset 0 1px 0 rgba(255,255,255,.7);
}
.bar h1{
  position:absolute; left:50%; transform:translateX(-50%);
  max-width:calc(100% - 132px); margin:0; text-align:center;
  font-size:17px; font-weight:600; letter-spacing:-.02em; color:var(--label);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transition:opacity .22s;
}
.bar.scrolled h1{ opacity:1; }
.bar .spacer{ flex:1; }

/* Floating glass capsules while the bar itself is clear... */
.ibtn{
  width:40px; height:40px; border-radius:50%; border:0; cursor:pointer; flex:0 0 auto;
  color:var(--label); display:inline-flex; align-items:center; justify-content:center;
  box-shadow:var(--float-s);
  transition:transform .34s var(--spring), background .2s, box-shadow .25s;
}
.ibtn .ms{ font-size:21px; }
.ibtn:active{ transform:scale(.88); }
/* ...and flattened once the bar turns to glass, so glass never sits in glass. */
.bar.scrolled .ibtn{
  background:var(--fill-2); backdrop-filter:none; -webkit-backdrop-filter:none;
  box-shadow:none;
}
.bar.scrolled .ibtn::before, .bar.scrolled .ibtn::after{ display:none; }

/* large title lives in the content and scrolls away */
.ltitle{
  font-size:34px; line-height:1.12; font-weight:700; letter-spacing:-.028em;
  margin:2px 0 18px; text-align:center; color:var(--label);
}
.wrap{ max-width:620px; margin:0 auto; padding:2px 16px calc(180px + var(--safe-b)); }

/* ============================================================
   THE CONTENT — solid, so the glass above it has something to
   refract and the text never sits on a moving backdrop.
   ============================================================ */
.card{
  background:var(--surface); border-radius:22px; margin-bottom:18px; overflow:hidden;
  box-shadow:var(--card-sh);
}
.card.pad{ padding:20px; }
.sechead{
  font-size:13px; font-weight:600; letter-spacing:-.01em; color:var(--label-2);
  margin:24px 0 10px; text-align:center;
}

.row{
  display:flex; align-items:center; gap:13px; padding:13px 17px; width:100%;
  text-align:left; border:0; background:transparent; cursor:pointer; color:inherit;
  position:relative; transition:background .15s;
}
.row + .row::before, .daygroup + .row::before{
  content:""; position:absolute; left:71px; right:0; top:0; height:.5px; background:var(--sep);
}
.row:active{ background:var(--fill-1); }
.row .body{ flex:1; min-width:0; }
.row .t1{ font-size:17px; font-weight:600; letter-spacing:-.02em; display:block;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .t2{ font-size:14px; color:var(--label-2); margin-top:1px; letter-spacing:-.01em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.row .right{ text-align:right; flex:0 0 auto; }
.row .amt{ font-size:17px; font-weight:600; letter-spacing:-.02em; white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.row .cap{ font-size:12px; color:var(--label-3); display:block; margin-top:1px; }
.pos{ color:var(--owed); } .neg{ color:var(--owe); } .zero{ color:var(--label-3); }
.mine::after{
  content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px;
  border-radius:0 3px 3px 0; background:var(--tint);
}

.av{
  width:44px; height:44px; border-radius:50%; flex:0 0 auto; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:16px; letter-spacing:-.02em; text-transform:uppercase;
}
.av.sm{ width:30px; height:30px; font-size:12px; }
.av.lg{ width:62px; height:62px; font-size:24px; }
img.av{ object-fit:cover; background:var(--fill-1); }
.cat{
  width:44px; height:44px; border-radius:12px; flex:0 0 auto;
  background:var(--fill-1); color:var(--label-2);
  display:flex; align-items:center; justify-content:center;
}
.cat .ms{ font-size:23px; }
.cat.teal{ background:var(--green-lt); color:var(--green-dk); }
.cat.bad{ background:rgba(255,59,48,.13); color:var(--danger); }
.cat.warn{ background:rgba(255,149,0,.18); color:#8a5200; }   /* waiting on you */

.summary{
  background:var(--surface); border-radius:26px; padding:26px 20px 20px; margin-bottom:18px;
  box-shadow:var(--card-sh); text-align:center;
}
.summary .big{
  font-size:46px; line-height:1.04; font-weight:700; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.summary .lab{ font-size:15px; color:var(--label-2); margin-top:6px; letter-spacing:-.01em; }
.summary.flat{ background:var(--fill-1); box-shadow:none; }

.split{ display:flex; gap:12px; margin-top:20px; }
.split > div{ flex:1; background:var(--fill-1); border-radius:16px; padding:13px 10px; text-align:center; }
.summary.flat .split > div{ background:var(--surface); }
.split .k{ font-size:12px; color:var(--label-2); font-weight:500; }
.split .v{ font-size:20px; font-weight:600; letter-spacing:-.025em; margin-top:3px;
  font-variant-numeric:tabular-nums; }

/* ---------- controls: solid, they live in the content layer ---------- */
.btn{
  min-height:50px; padding:14px 22px; border-radius:16px; border:0; cursor:pointer;
  font-size:17px; font-weight:600; letter-spacing:-.02em;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .34s var(--spring), filter .18s, background .18s;
}
.btn:active{ transform:scale(.975); }
.btn.p{ background:var(--tint); color:#fff; }
.btn.p:active{ filter:brightness(.92); }
.btn.s, .btn.g{ background:var(--surface); color:var(--label); box-shadow:var(--card-sh); }
.btn.s:active, .btn.g:active{ background:var(--fill-1); }
.btn.g{ color:#3c4043; }
.btn.d{ background:rgba(255,59,48,.12); color:var(--danger); }
.btn.wide{ width:100%; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn.busy{ opacity:.6; }
.btnrow{ display:flex; gap:12px; }
.btnrow .btn{ flex:1; }

/* ---------- floating action button: navigation layer, prominent glass ---------- */
.fab{
  position:fixed; right:16px; bottom:calc(100px + var(--safe-b)); z-index:35;
  height:54px; padding:0 22px; border-radius:27px; border:0; cursor:pointer;
  background:var(--tint); color:#fff; font-size:17px; font-weight:600; letter-spacing:-.02em;
  display:inline-flex; align-items:center; gap:7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 8px 24px rgba(52,199,89,.42),
             0 2px 8px rgba(16,24,48,.18);
  transition:transform .34s var(--spring), filter .18s;
}
.fab .ms{ font-size:24px; }
.fab:active{ transform:scale(.92); filter:brightness(.94); }

/* ---------- tab bar: navigation layer ---------- */
.nav{
  position:fixed; left:12px; right:12px; bottom:calc(14px + var(--safe-b)); z-index:40;
  border-radius:28px; display:flex; padding:7px 6px;
  box-shadow:var(--float); max-width:596px; margin:0 auto;
}
.nav button{
  flex:1; border:0; background:transparent; cursor:pointer; padding:7px 4px 6px;
  border-radius:22px; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:500; color:var(--label-2);
  transition:color .18s, background .18s; position:relative; z-index:3;
}
.nav button .ms{ font-size:25px; }
.nav button[aria-current="page"]{ color:var(--green-dk); background:var(--green-lt); }


/* ---------- section headings, as the original tracker had them ---------- */
.sect{ margin:26px 2px 12px; text-align:center; }
.sect h2{
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:20px; font-weight:700; letter-spacing:-.025em; margin:0; color:var(--label);
}
.sect h2 .ms{ font-size:22px; color:var(--label-2); }
.sect p{ font-size:14px; color:var(--label-2); margin:5px 0 0; letter-spacing:-.01em; }

/* ---------- the inline add form ---------- */
.addform .ah{
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:18px; font-weight:700; letter-spacing:-.025em; margin:0 0 4px;
}
.addform .ah .ms{ font-size:21px; color:var(--label-2); }
.addform .asub{ font-size:14px; color:var(--label-2); margin:0 0 16px; text-align:center; }
.arow{ display:flex; gap:12px; flex-wrap:wrap; }
.arow .field{ margin-bottom:18px; }

/* ---------- who pays whom ---------- */
.owed{ padding:18px 18px 16px; }
.owedhead{ display:flex; align-items:center; gap:13px; margin-bottom:6px; }
.owedhead .txt{ flex:1; min-width:0; }
.owedhead .txt b{ display:block; font-weight:600; font-size:17px; letter-spacing:-.02em; }
.owedhead .txt small{ display:block; font-size:13px; color:var(--label-2); margin-top:1px; }
.owedhead .amt{ font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
.barrow{ display:flex; align-items:center; gap:11px; margin:10px 0 0; }
.barrow .who{
  flex:0 0 78px; font-size:14px; color:var(--label-2); font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.barrow .track{
  flex:1; height:24px; min-width:36px; border-radius:12px; overflow:hidden;
  background:var(--fill-1); display:block;
}
.barrow .fill{ display:block; height:100%; min-width:10px; border-radius:12px; }
.barrow .bamt{
  flex:0 0 auto; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;
  white-space:nowrap; min-width:66px; text-align:right;
}
@media(max-width:359px){
  .barrow .who{ flex-basis:58px; font-size:13px; }
  .barrow .bamt{ min-width:58px; font-size:13px; }
}


/* ---------- expense rows: who it was split between, and when ---------- */
.exrow{ align-items:flex-start; }
.exrow .av{ margin-top:2px; }
.row .who{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.wchip{
  display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500;
  color:var(--label-2); background:var(--fill-1); padding:3px 9px; border-radius:9px;
}
.wdot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
.row .added{
  display:flex; align-items:center; gap:5px; font-size:12px; color:var(--label-3);
  margin-top:6px;
}
.row .added .ms{ font-size:14px; }
.row .chev{ flex:0 0 auto; color:var(--label-3); margin-left:2px; }
.row .chev .ms{ font-size:20px; }
.linkbtn{
  display:block; width:100%; margin-top:14px; border:0; background:transparent;
  color:var(--blue); font-size:15px; font-weight:500; cursor:pointer; padding:6px;
  letter-spacing:-.01em;
}

/* ---------- who owes whom ---------- */
.barrow .val{
  flex:0 0 auto; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;
  white-space:nowrap; min-width:66px; text-align:right;
}

/* ---------- the receipt ---------- */
.rcrole{ text-align:center; font-size:13px; color:var(--label-2); margin:0 0 14px; }
#rcFilters{ margin-bottom:16px; }
.paper{
  background:var(--surface); border-radius:16px; padding:20px 18px;
  font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:13px;
  color:var(--label); box-shadow:var(--card-sh); line-height:1.5;
}
.rc-title{ text-align:center; font-size:17px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; margin-bottom:2px; }
.rc-sub{ text-align:center; font-size:12px; color:var(--label-2); }
.rc-rule{ border-top:1px dashed rgba(60,60,67,.35); margin:11px 0; }
.rc-rule.solid{ border-top:2px solid var(--label); margin:13px 0; }
.rc-grp{ font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--label-2);
  margin:14px 0 7px; }
.rc-line{ display:flex; justify-content:space-between; gap:12px; margin:4px 0; }
.rc-line .d{ flex:1; min-width:0; }
.rc-line .n{ flex:0 0 auto; font-variant-numeric:tabular-nums; }
.rc-line .note{ color:var(--label-3); }
.rc-tot{ display:flex; justify-content:space-between; gap:12px; font-weight:700; }
.rc-tot .n{ font-variant-numeric:tabular-nums; }
.rc-net{
  text-align:center; font-size:14px; font-weight:700; letter-spacing:.04em;
  padding:10px 4px 2px;
}


/* ---------- the expense list is capped and scrolls, as it used to ---------- */
.listwrap{ position:relative; }
.listwrap.capped > .card{
  max-height:58vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:rgba(118,118,128,.4) transparent;
}
.listwrap.capped > .card::-webkit-scrollbar{ width:8px; }
.listwrap.capped > .card::-webkit-scrollbar-thumb{
  background:rgba(118,118,128,.4); border-radius:4px; }
.listwrap.capped > .card::-webkit-scrollbar-track{ background:transparent; }
.listwrap.capped::after{
  content:""; position:absolute; left:0; right:0; bottom:18px; height:36px;
  pointer-events:none; border-radius:0 0 22px 22px;
  background:linear-gradient(180deg, rgba(255,255,255,0), var(--surface) 90%);
}
.scrollnote{
  margin:-6px 0 16px; font-size:13px; color:var(--label-2); font-weight:500;
  display:flex; align-items:center; justify-content:center; gap:6px; text-align:center;
}
.scrollnote .ms{ font-size:16px; }
.fulllink{
  display:flex; align-items:center; justify-content:center; gap:5px;
  font-size:15px; font-weight:500; color:var(--blue); text-decoration:none;
  margin:-4px 0 14px; padding:4px;
}
.fulllink .ms{ font-size:17px; }


.locked{
  display:flex; align-items:center; justify-content:center; gap:8px; text-align:center;
  background:var(--fill-1); border-radius:14px; padding:14px 16px; margin:4px 0 0;
  font-size:14px; color:var(--label-2); line-height:1.4;
}
.locked .ms{ font-size:19px; flex:0 0 auto; }


/* ---------- a switch ---------- */
.switch{
  display:inline-block; width:48px; height:29px; border-radius:15px; position:relative;
  background:var(--fill-3); transition:background .22s; vertical-align:middle;
}
.switch.on{ background:var(--tint); }
.switch i{
  position:absolute; top:2px; left:2px; width:25px; height:25px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(16,24,48,.3); transition:transform .22s;
}
.switch.on i{ transform:translateX(19px); }


.notice.warn{
  background:rgba(255,149,0,.16); color:#7a4a00;
  box-shadow:inset 0 0 0 .5px rgba(255,149,0,.3), inset 0 1px 0 rgba(255,255,255,.5);
  margin-top:14px;
}

/* ---------- expense filters ---------- */
.filters{ margin:0 0 14px; }
.filters input[type="search"]{
  width:100%; min-height:44px; padding:11px 16px; font-size:16px; color:var(--label);
  background:var(--fill-1); border:0; border-radius:13px; appearance:none;
  -webkit-appearance:none; letter-spacing:-.01em; margin-bottom:10px;
}
.filters input[type="search"]::placeholder{ color:var(--label-3); }
.filters input[type="search"]:focus{ outline:none; background:var(--surface); box-shadow:inset 0 0 0 2px var(--tint); }
.frow{
  display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px;
  scrollbar-width:none; -ms-overflow-style:none;
}
.frow::-webkit-scrollbar{ display:none; }
.frow .chip{ min-height:34px; padding:6px 13px; font-size:14px; flex:0 0 auto; border-radius:17px; }
.fcount{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-size:13px; color:var(--label-2); padding:2px 6px 10px;
}
.fcount button{
  border:0; background:transparent; color:var(--blue); font-size:15px; font-weight:600;
  cursor:pointer; padding:4px 2px; letter-spacing:-.01em;
}
.tag.warn{ background:rgba(255,149,0,.2); color:#8a5200; }

/* ---------- forms: content layer ---------- */
.field{ margin-bottom:18px; }
.field label{ display:block; font-size:13px; font-weight:500; color:var(--label-2);
  margin-bottom:7px; padding-left:4px; }
.field input, .field select, .field textarea{
  width:100%; min-height:52px; padding:14px 16px; font-size:17px; color:var(--label);
  background:var(--fill-1); border:0; border-radius:14px; appearance:none;
  letter-spacing:-.02em; transition:box-shadow .18s, background .18s;
}
.field textarea{ min-height:84px; resize:vertical; line-height:1.4; }
.field input::placeholder, .field textarea::placeholder{ color:var(--label-3); }
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; background:var(--surface); box-shadow:inset 0 0 0 2px var(--tint); }
.field .help{ font-size:13px; color:var(--label-2); margin-top:7px; padding-left:4px; line-height:1.45; }
.amtbig{ display:flex; align-items:center; gap:10px; }
.amtbig .cur{ font-size:34px; font-weight:600; color:var(--label-3); letter-spacing:-.03em; }
.amtbig input{ font-size:34px !important; font-weight:600; min-height:68px;
  letter-spacing:-.035em; font-variant-numeric:tabular-nums; }

.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  display:inline-flex; align-items:center; gap:6px; min-height:42px; padding:9px 15px;
  border-radius:21px; border:0; background:var(--fill-1); color:var(--label);
  font-size:15px; font-weight:500; letter-spacing:-.015em; cursor:pointer;
  transition:transform .34s var(--spring), background .18s, color .18s;
}
.chip:active{ transform:scale(.93); }
.chip[aria-pressed="true"]{ background:var(--tint); color:#fff; font-weight:600; }
.chip .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
.chip[aria-pressed="true"] .dot{ box-shadow:0 0 0 1.5px rgba(255,255,255,.95); }

.seg{
  display:flex; background:var(--fill-1); border-radius:14px; padding:3px; gap:3px;
  margin-bottom:18px;
}
.seg button{
  flex:1; border:0; background:transparent; cursor:pointer; padding:9px 6px; border-radius:11px;
  font-size:15px; font-weight:500; letter-spacing:-.015em; color:var(--label);
  transition:background .2s, box-shadow .2s;
}
.seg button[aria-pressed="true"]{
  background:var(--surface); font-weight:600;
  box-shadow:0 1px 2px rgba(16,24,48,.12), 0 3px 8px rgba(16,24,48,.08);
}

.splitrow{ display:flex; align-items:center; gap:10px; padding:11px 0; }
.splitrow + .splitrow{ box-shadow:inset 0 .5px 0 var(--sep); }
.splitrow .nm{ flex:1; min-width:0; font-size:16px; font-weight:500; letter-spacing:-.018em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.splitrow input{
  width:86px; min-height:44px; padding:10px 12px; text-align:right; border:0;
  background:var(--fill-1); border-radius:11px; font-size:17px;
  font-variant-numeric:tabular-nums; }
.splitrow .unit{ width:22px; font-size:14px; color:var(--label-3); }
.splitrow .calc{ width:72px; text-align:right; font-size:14px; color:var(--label-2);
  font-variant-numeric:tabular-nums; }
.splitsum{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  margin-top:14px; padding:12px 16px; border-radius:14px; background:var(--fill-1);
  font-size:14px; font-weight:600; letter-spacing:-.01em; }
.splitsum.bad{ color:var(--danger); }
.splitsum.ok{ color:var(--owed); }

/* ---------- sheet: navigation layer, so the surface is glass ---------- */
.scrim{ position:fixed; inset:0; background:rgba(28,32,48,.32); z-index:50; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51; max-height:93vh; overflow-y:auto;
  border-radius:38px 38px 0 0; padding:0 0 calc(24px + var(--safe-b));
  background:var(--glass-thick);
  backdrop-filter:var(--lens); -webkit-backdrop-filter:var(--lens);
  box-shadow:0 -12px 44px rgba(16,24,48,.24);
  -webkit-overflow-scrolling:touch;
}
@media(min-width:620px){
  .sheet{ left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%);
    width:520px; border-radius:34px; max-height:88vh;
    box-shadow:0 30px 70px rgba(16,24,48,.3); }
}
.sheet .shead{
  position:sticky; top:0; z-index:4; display:flex; align-items:center; gap:8px;
  padding:6px 14px 12px; background:rgba(255,255,255,.84);
  backdrop-filter:blur(20px) saturate(190%); -webkit-backdrop-filter:blur(20px) saturate(190%);
  box-shadow:0 .5px 0 var(--sep);
}
.sheet .shead h2{
  position:absolute; left:50%; transform:translateX(-50%); max-width:calc(100% - 116px);
  margin:0; text-align:center; font-size:17px; font-weight:600; letter-spacing:-.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sheet .shead .spacer{ flex:1; }
/* the close button sits inside glass, so it is flat */
.sheet .shead .ibtn{ background:var(--fill-2); box-shadow:none; }
.sheet .sbody{ padding:4px 20px 8px; position:relative; z-index:3; }
.grab{ width:38px; height:5px; border-radius:3px; background:var(--label-3);
  opacity:.5; margin:9px auto 2px; }
@media(min-width:620px){ .grab{ display:none; } }

/* ---------- misc: content layer ---------- */
.empty{ text-align:center; padding:40px 22px; color:var(--label-2); }
.empty .ms{ font-size:52px; color:var(--label-3); display:block; margin-bottom:12px; }
.empty h3{ font-size:20px; font-weight:600; letter-spacing:-.025em; color:var(--label); margin:0 0 7px; }
.empty p{ font-size:15px; margin:0 0 20px; line-height:1.45; }
.daygroup{ font-size:13px; font-weight:600; color:var(--label-2); padding:14px 17px 7px; text-align:center; }
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(116px + var(--safe-b)); z-index:70;
  background:rgba(28,32,48,.88); color:#fff; padding:13px 20px; border-radius:18px;
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  font-size:15px; font-weight:500; text-align:center;
  box-shadow:0 12px 34px rgba(16,24,48,.3);
  opacity:0; pointer-events:none; transition:opacity .2s; max-width:88vw;
}
.toast.on{ opacity:1; }
.sync{
  font-size:13px; font-weight:500; text-align:center; margin:0 16px 14px;
  padding:11px 16px; border-radius:14px; background:var(--surface); color:var(--label-2);
  box-shadow:var(--card-sh);
}
.sync.ok{ background:rgba(52,199,89,.16); color:var(--green-dk); box-shadow:none; }
.sync.warn{ background:rgba(255,149,0,.18); color:#8a5200; box-shadow:none; }
.sync.bad{ background:rgba(255,59,48,.13); color:var(--danger); box-shadow:none; }
.tag{
  display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:7px;
  vertical-align:middle; background:var(--fill-2); color:var(--label-2);
}
.tag.on{ background:var(--green-lt); color:var(--green-dk); }
.tag.admin{ background:rgba(255,149,0,.2); color:#8a5200; }

.signin{ text-align:center; padding:34px 24px 28px; margin-top:5vh; }
.signin .mark{
  width:84px; height:84px; border-radius:24px; margin:0 auto 22px;
  background:linear-gradient(160deg, #5ee07f, var(--tint) 55%, #00b8a0); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 14px 34px rgba(52,199,89,.36);
}
/* Waiting and refusal do not get the welcoming green. A no-entry sign in the
   colour of a tick reads as an error in the page rather than an answer. */
.signin .mark.quiet{
  background:linear-gradient(160deg, #b9bfca, #8e99a6 55%, #78838f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 14px 34px rgba(60,70,85,.24);
}
.signin .mark .ms{ font-size:44px; }
.signin h2{ font-size:28px; font-weight:700; letter-spacing:-.03em; margin:0 0 10px; line-height:1.15; }
.signin p{ font-size:16px; color:var(--label-2); margin:0 0 26px; line-height:1.45; }
.fine{ font-size:13px; color:var(--label-2); margin:16px 0 0; line-height:1.45; text-align:center; }
.lead{ font-size:15px; color:var(--label-2); margin:0 0 20px; line-height:1.45; text-align:center; }
.code{
  font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:15px;
  text-align:center; background:var(--fill-1); padding:14px 16px; border-radius:14px;
  word-break:break-all; margin:0;
}
.notice{
  display:flex; align-items:center; gap:13px; flex-wrap:wrap;
  background:var(--green-lt); border-radius:20px; padding:16px 18px; margin-bottom:18px;
  font-size:15px; color:var(--green-dk); line-height:1.4;
}
.notice .ms{ font-size:26px; flex:0 0 auto; }
.notice > div{ flex:1; min-width:150px; }
.notice .btn{ min-height:42px; padding:10px 18px; font-size:15px; }

@media(max-width:359px){
  .ltitle{ font-size:30px; }
  .summary .big{ font-size:40px; }
  .row{ padding:12px 14px; gap:11px; }
  .row + .row::before, .daygroup + .row::before{ left:65px; }
  .av, .cat{ width:40px; height:40px; }
  .row .t1{ font-size:16px; }
  .row .t2{ font-size:13px; }
  .splitrow input{ width:74px; }
  .splitrow .calc{ width:58px; font-size:13px; }
  .wrap{ padding-left:13px; padding-right:13px; }
  .sheet .sbody{ padding-left:15px; padding-right:15px; }
}

/* Accessibility: Apple requires glass to stand down for these. */
@media (prefers-reduced-transparency: reduce){
  .glass, .bar.scrolled, .sheet, .sheet .shead, .toast{
    background:rgba(255,255,255,.98) !important;
    backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  }
  .toast{ background:#1c2030 !important; }
  .glass::after{ display:none; }
  .bgmesh{ opacity:.3; }
}
@media (prefers-contrast: more){
  :root{ --label-2:rgba(40,40,46,.86); --label-3:rgba(40,40,46,.62); --sep:rgba(60,60,67,.42); }
  .glass{ background:rgba(255,255,255,.86); }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .glass, .bar.scrolled{ background:rgba(255,255,255,.94); }
  .sheet, .sheet .shead{ background:rgba(255,255,255,.98); }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }



/* ============================================================
   SPLITTER — warm editorial fintech

   One rule decides the typeface: an editorial serif for display
   headings, a modern sans for every label, amount, button and
   scrap of small text. Nothing is set by feel.

   One accent (apricot), one ground (cream), one ink
   (charcoal-green). Money is the only thing allowed another
   colour, so a figure never competes with decoration.
   ============================================================ */
:root{
  --cream:#FCFAF5;
  --surface:#FFFFFF;
  --ink:#2F332D;                 /* charcoal-green: text and the rail */
  --ink-2:#6E7269;
  --ink-3:#A0A398;
  --line:#EDE6DA;                /* subtle beige */
  --line-2:#F4EEE4;

  --apricot:#EEB586;
  --apricot-dk:#B4703E;
  --apricot-lt:#F8E3CF;

  --good:#2C6A4F;                /* deep green: coming to you */
  --bad:#C1604E;                 /* muted coral: going out */

  --f:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;

  --r1:10px; --r2:14px; --r3:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:44px;
  --shadow:0 1px 2px rgba(47,51,45,.04), 0 6px 18px rgba(47,51,45,.05);

  /* aliases the older rules still reach for */
  --ground:var(--cream); --panel:var(--cream);
  --label:var(--ink); --label-2:var(--ink-2); --label-3:var(--ink-3);
  --sep:var(--line); --tint:var(--apricot-dk);
  --owed:var(--good); --owe:var(--bad); --danger:var(--bad);
  --green-dk:var(--good); --green-lt:rgba(44,106,79,.12);
  --fill-1:rgba(110,114,105,.06);
  --fill-2:rgba(110,114,105,.10);
  --fill-3:rgba(110,114,105,.16);
}

body{ background:var(--cream); color:var(--ink); font-family:var(--f);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
.bgmesh{ display:none; }
button, input, select, textarea{ font-family:var(--f); }

/* Amounts line up under one another wherever money appears. */
.amt, .v, .big, .stat .v, .sum .v, .mom .amt b, td.r{
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}

/* ---- type ---------------------------------------------------------- */
/* The serif is for display headings only. Everything a person reads at
   speed - labels, amounts, buttons, navigation - is the sans. */
.display, .ltitle, .hero h2, .empty h3, .sheet .shead h2{
  font-family:var(--serif); font-weight:600; letter-spacing:-.015em;
}
.display{ font-size:clamp(30px,8vw,42px); line-height:1.08; margin:0; }
.ltitle{ font-size:clamp(28px,7vw,38px); line-height:1.1; margin:var(--s2) 0 var(--s4); }
.sheet .shead h2{ font-size:19px; }
.empty h3{ font-size:22px; }

.sechead{ font-family:var(--f); font-size:13px; font-weight:700; letter-spacing:.02em;
  text-transform:none; color:var(--ink); margin:var(--s6) 0 var(--s3); padding:0 2px;
  text-align:left; }
/* The heading and the thing it heads start on the same line as the title. */
.topline{ display:flex; align-items:flex-start; justify-content:space-between;
  gap:var(--s4); flex-wrap:wrap; }
.topline > div{ flex:1 1 260px; min-width:0; }
.topline .btn{ flex:0 0 auto; padding:11px 18px; }
@media (max-width:999px){ .topline .btn{ display:none; } }
.eyebrow{ font-size:12px; font-weight:500; color:var(--ink-3); margin:var(--s2) 0 0; }
.lead{ color:var(--ink-2); font-size:14px; line-height:1.55; }
.fine{ color:var(--ink-3); font-size:12.5px; line-height:1.55; }
.help{ color:var(--ink-3); font-size:12.5px; }

/* ---- app bar (mobile): wordmark left, avatar right ------------------ */
.bar{ background:transparent; backdrop-filter:none; border:0; box-shadow:none;
  padding-left:var(--s4); padding-right:var(--s4); }
.bar.scrolled{ background:rgba(252,250,245,.92); backdrop-filter:blur(12px); }
.bar h1{ font-family:var(--serif); font-weight:600; font-size:18px; }
.ibtn, .ibtn.glass{ background:var(--surface); border:1px solid var(--line);
  backdrop-filter:none; box-shadow:none; color:var(--ink); }

.brand{ display:flex; align-items:center; font-family:var(--serif);
  font-size:22px; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
.brand i{ font-style:normal; color:var(--apricot-dk); }
.me{ width:34px; height:34px; border-radius:50%; border:0; padding:0; cursor:pointer;
  background:var(--apricot-lt); color:var(--apricot-dk); font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center; overflow:hidden; }
.me img{ width:100%; height:100%; object-fit:cover; }
.side{ display:none; }

/* ---- cards --------------------------------------------------------- */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  box-shadow:var(--shadow); overflow:hidden; }
.row{ background:transparent; padding:13px var(--s4); }
.row .t1{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
.row .t2{ font-size:13px; color:var(--ink-2); }
.row + .row::before, .daygroup + .row::before{ background:var(--line-2); }
.cat{ background:var(--apricot-lt); color:var(--apricot-dk); border-radius:var(--r1); }
.cat.teal{ background:rgba(44,106,79,.12); color:var(--good); }
.cat.bad{ background:rgba(193,96,78,.13); color:var(--bad); }
.cat.warn{ background:rgba(238,181,134,.38); color:#8A5220; }
.av{ font-family:var(--f); font-weight:600; }
.empty{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r3);
  box-shadow:var(--shadow); }
.empty .ms{ color:var(--apricot-dk); }
.empty p{ color:var(--ink-2); }

/* ---- the feature panel --------------------------------------------- */
.hero{ position:relative; overflow:hidden; background:var(--apricot); color:#3A2414;
  border-radius:var(--r3); padding:var(--s5) var(--s5) var(--s5); margin:var(--s4) 0 0; }
/* a thin drawn circle, not a filled blob */
.hero::after{
  content:""; position:absolute; right:-70px; top:-64px; width:212px; height:212px;
  border-radius:50%; border:1px solid rgba(58,36,20,.22); pointer-events:none;
}
.hero::before{
  content:""; position:absolute; right:-24px; top:-18px; width:132px; height:132px;
  border-radius:50%; border:1px solid rgba(58,36,20,.14); pointer-events:none;
}
.hero h2{ position:relative; font-size:clamp(21px,5.6vw,26px); line-height:1.14;
  margin:0; max-width:19ch; }
.hero p{ position:relative; margin:var(--s2) 0 0; font-size:13.5px; line-height:1.5;
  color:#6B4527; max-width:38ch; }
.hero .act{ position:relative; margin:var(--s4) 0 0; display:flex; align-items:flex-end;
  justify-content:space-between; gap:var(--s4); flex-wrap:wrap; }
.hero .net{ text-align:right; font-size:24px; font-weight:700; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; }
.hero .net small{ display:block; font-size:11.5px; font-weight:500; color:#6B4527;
  letter-spacing:0; margin-top:3px; }

/* ---- summary cards -------------------------------------------------- */
.sums{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s3); margin:var(--s3) 0 0; }
/* Two figures on a phone: the two that are actually a call to action.
   The third is context, and context can wait for a wider screen. */
@media (max-width:999px){ .sums .sum:nth-child(3){ display:none; } }
.sum{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  box-shadow:var(--shadow); padding:var(--s3) var(--s4) var(--s4); }
.sum .k{ display:block; font-size:10px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); line-height:1.35; }
.sum .v{ display:block; font-size:22px; font-weight:700; letter-spacing:-.02em; margin:var(--s2) 0 2px; }
.sum .s{ display:block; font-size:12px; color:var(--ink-3); }
.sum .v.pos{ color:var(--good); } .sum .v.neg{ color:var(--bad); }

/* ---- compact expense + person cards --------------------------------- */
.mom{ display:flex; align-items:center; gap:var(--s3); padding:13px var(--s4);
  width:100%; background:transparent; border:0; text-align:left; font:inherit; cursor:pointer; }
.mom + .mom{ border-top:1px solid var(--line-2); }
.mom .ic{ flex:0 0 auto; width:36px; height:36px; border-radius:var(--r1);
  background:var(--apricot-lt); color:var(--apricot-dk);
  display:flex; align-items:center; justify-content:center; }
.mom .ic .ms{ font-size:19px; }
.mom .b{ flex:1; min-width:0; }
/* Both are spans inside a span, so without this the name and the line under
   it run together as one sentence - which is what they were doing. */
.mom .b{ display:flex; flex-direction:column; }
.mom .t{ display:block; font-size:14.5px; font-weight:600; letter-spacing:-.01em;
  color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mom .m{ display:block; font-size:12px; color:var(--ink-3); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mom .amt{ text-align:right; white-space:nowrap; }
.mom .amt b{ display:block; font-size:14.5px; font-weight:700; color:var(--ink); }
.mom .amt span{ display:block; font-size:11.5px; font-weight:600; margin-top:2px; }

/* ---- group cards ----------------------------------------------------- */
.gcards{ display:grid; gap:var(--s3); grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  margin:var(--s3) 0 0; }
.gcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  box-shadow:var(--shadow); padding:var(--s4); text-align:left; font:inherit; cursor:pointer; }
.gcard .n{ font-size:15px; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
.gcard .m{ font-size:12px; color:var(--ink-3); margin-top:var(--s1); }
.gcard .v{ font-size:13px; font-weight:700; margin-top:var(--s2); }

/* Back and the group menu, as part of the page. Only on a wide screen: the
   phone already has both in the bar at the top, and two of each would be two. */
.pagehead{ display:none; }
@media (min-width:1000px){
  .pagehead{ display:flex; gap:var(--s2); justify-content:center;
    margin:0 0 var(--s5); flex-wrap:wrap; }
  .pagehead .btn{ padding:10px 18px; }
}

/* A single action under a screen's title. */
.actline{ display:flex; justify-content:center; margin:0 0 var(--s5); }
.actline .btn{ padding:12px 22px; }

/* ---- controls -------------------------------------------------------- */
.btn{ border-radius:999px; font-weight:600; font-size:14.5px; }
.btn.primary, .btn.p, .btn.dark{ background:var(--ink); color:var(--cream); border:0; }
.btn.s, .btn.ghost, .btn.g{ background:var(--surface); border:1px solid var(--line); color:var(--ink); }
.btn.danger{ background:var(--surface); border:1px solid var(--line); color:var(--bad); }

.field label{ font-size:12.5px; font-weight:600; color:var(--ink-2); }
.field input, .field select, .field textarea{
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  border-radius:var(--r1); font-size:15px;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color:var(--apricot-dk); outline:2px solid rgba(180,112,62,.18);
}
.chip{ background:var(--surface); border:1px solid var(--line); color:var(--ink);
  border-radius:999px; font-size:13.5px; }
.chip[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--cream); }
.seg{ background:var(--fill-1); border-radius:999px; }
.seg button{ border-radius:999px; font-size:13.5px; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:none; }
.tag{ border-radius:999px; font-size:11px; font-weight:700; }
.tag.on{ background:rgba(44,106,79,.13); color:var(--good); }
.tag.warn, .tag.admin{ background:rgba(238,181,134,.42); color:#8A5220; }
.switch{ background:var(--fill-3); } .switch.on{ background:var(--good); }
.notice.warn{ background:rgba(238,181,134,.24); color:#6B4527;
  border:1px solid rgba(180,112,62,.26); border-radius:var(--r1); }
.sync{ background:var(--apricot-lt); color:#6B4527; }
.sync.bad{ background:rgba(193,96,78,.13); color:var(--bad); }

/* ---- sheets ---------------------------------------------------------- */
.sheet, .sheet .shead{ background:var(--cream); }
.sheet{ border-radius:var(--s5) var(--s5) 0 0; }
.sheet .shead{ border-bottom:1px solid var(--line); }
.grab{ background:var(--line); }
.scrim{ background:rgba(47,51,45,.34); backdrop-filter:blur(2px); }
.toast{ background:var(--ink); color:var(--cream); border-radius:999px; }

/* ---- bottom navigation, with the add button raised into it ----------- */
.nav{ background:var(--ink); backdrop-filter:none; border:0; border-radius:999px;
  box-shadow:0 10px 28px rgba(47,51,45,.26); padding:6px; overflow:visible; }
.nav button{ color:rgba(252,250,245,.56); font-size:10px; font-weight:500;
  padding:8px 4px 7px; border-radius:999px; }
.nav button .ms{ font-size:22px; }
.nav button[aria-current="page"]{ color:var(--cream); background:rgba(255,255,255,.10); }
.nav{ align-items:center; }
/* Add sits exactly on the bar's centre line, in the middle of the row, and
   glows - a steady halo in the theme's own colour with a slow breath around
   it, so the one thing you come here to do is the thing the eye lands on. */
.nav .add{
  --glow: rgba(238,181,134,.62); --glow-soft: rgba(238,181,134,.20);
  flex:0 0 auto; align-self:center; width:52px; height:52px; margin:0 8px;
  border-radius:50%; background:var(--apricot); color:#3A2414; padding:0; gap:0;
  box-shadow:0 0 0 3px var(--glow-soft), 0 0 20px 3px var(--glow), 0 4px 12px rgba(0,0,0,.22);
}
.nav .add::after{
  content:""; position:absolute; inset:-5px; border-radius:50%; pointer-events:none;
  box-shadow:0 0 18px 6px var(--glow); opacity:.35;
  animation:addGlow 2.8s ease-in-out infinite;
}
@keyframes addGlow{
  0%,100%{ opacity:.25; transform:scale(.94); }
  50%    { opacity:.95; transform:scale(1.08); }
}
.nav .add:active{ transform:scale(.95); }
@media (prefers-reduced-motion:reduce){
  .nav .add::after{ animation:none; opacity:.6; transform:none; }
}
/* The bar's buttons stack icon over label from the top. The + has no label,
   so stacked from the top it sat in the upper half of its own circle. */
.nav .add{ display:flex; flex-direction:column; align-items:center; justify-content:center;
  line-height:1; }
.nav .add .ms{ font-size:26px; line-height:1; display:block; }

/* quick add */
.qa-money{ display:flex; align-items:center; gap:var(--s2); }
.qa-money span{ font-size:26px; font-weight:600; color:var(--ink-3); }
.qa-money input{ font-size:30px; font-weight:700; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; }
.qa-new{ display:flex; gap:var(--s2); margin-top:var(--s2); }
.qa-new[hidden]{ display:none; }
.qa-new input{ flex:1; min-width:0; }
.chip.add{ border-style:dashed; color:var(--apricot-dk); background:transparent; }
.qa-each{ font-size:13px; color:var(--ink-2); margin:var(--s2) 0 0; }
.qa-person{ margin-top:var(--s2); }
.qa-person[hidden], #qaPickWrap[hidden]{ display:none; }
.qa-sub{ font-size:11.5px; font-weight:700; letter-spacing:.03em; color:var(--ink-3);
  margin:var(--s3) 0 var(--s2); }
.nav .add[aria-current="page"]{ background:var(--apricot); color:#3A2414; }
.fab{ display:none; }


/* The total for one group. Deliberately not the apricot of the Today panel:
   that panel is a thing to act on, this is a fact about where you are, and
   two identical surfaces a screen apart make the app feel like it is
   repeating itself. */
.summary{
  background:var(--ink); color:var(--cream); border:0; border-radius:var(--r3);
  box-shadow:var(--shadow); padding:var(--s5) var(--s4);
}
.summary .k, .summary .lab{ color:rgba(252,250,245,.66); }
.summary .big{ font-family:var(--serif); font-weight:600; letter-spacing:-.025em;
  color:var(--cream); }
.summary .big.pos, .summary .big.neg, .summary .big.zero{ color:var(--cream); }
.summary .split{ border-top:1px solid rgba(252,250,245,.16); }
.summary .split .k{ font-size:10px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; color:rgba(252,250,245,.60); }
.summary .split .v{ font-weight:700; letter-spacing:-.02em; color:var(--cream); }
.summary .split .v.pos{ color:#7FD0A8; }
.summary .split .v.neg{ color:#F0A28E; }

/* Somewhere to type, rather than another thing to read. The tint says that
   without a heading having to say it. */
.card.addform{
  background:var(--apricot-lt); border-color:rgba(180,112,62,.22);
}
.card.addform .field input, .card.addform .field select, .card.addform .field textarea{
  background:var(--surface); border-color:rgba(180,112,62,.24);
}
.card.addform .field label{ color:#7A5334; }
.card.addform h3, .card.addform .t1{ color:#3A2414; }
.card.addform .lead, .card.addform .sub{ color:#7A5334; }
.card.addform .chip{ background:rgba(255,255,255,.72); border-color:rgba(180,112,62,.22); }
.card.addform .chip[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink);
  color:var(--cream); }


/* The wordmark, and a small line of credit under it. */
.brandwrap{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.byline{ font-size:10.5px; font-weight:500; letter-spacing:.02em; color:var(--ink-3); }
.side .byline{ color:rgba(252,250,245,.42); padding:0 10px var(--s5); margin-top:-16px; }

/* Anything that used to borrow the iOS blue now takes the accent, so a link
   and a button belong to the same palette as everything around them. */
.linkbtn, a, .more, .textbtn{ color:var(--apricot-dk); }
.linkbtn{ font-weight:600; }
:focus-visible{ outline:3px solid var(--apricot-dk); outline-offset:3px; }


/* ---- Today: the panel ----------------------------------------------------
   One card per thing to settle. The amount is the point of the card, so it is
   the biggest thing on it - deep red for what you owe, deep green for what you
   are owed - and who, where and why sit around it. */
:root{ --hero-a:#F6D3AF; --hero-b:#E7A06A; --hero-ink:#3A2414; --hero-soft:#7A5334;
       --hero-owe:#8E3520; --hero-get:#1F5C41; --hero-line:rgba(58,36,20,.14);
       --hero-track:rgba(58,36,20,.18); --hero-glow:rgba(120,64,24,.55); }
.hero.carousel{
  background-color:var(--apricot);
  background-image:linear-gradient(140deg, var(--hero-a) 0%, var(--apricot) 46%, var(--hero-b) 100%);
  color:var(--hero-ink);
  padding:var(--s5) var(--s5) var(--s4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 22px 44px -26px var(--hero-glow);
}
/* No blue. Swiping across the card used to select its text in the browser's
   blue; tapping flashed the browser's blue tap highlight; a tap left a blue
   ring on the button. The keyboard focus ring stays, in the accent. */
.hero, .hero *{ -webkit-tap-highlight-color:transparent; }
.hero button:focus:not(:focus-visible){ outline:none; }
.hero ::selection{ background:transparent; }
.hc-view{ position:relative; overflow:hidden; }

/* ---- Purple theme: the Today card as a sky, Bora peeking over the edge --- */
.hero-wrap{ position:relative; }
.hero-wrap > .hero{ position:relative; z-index:1; }
.hero-deco{ display:none; }
:root[data-theme="purple"] .hero-wrap{ padding-top:50px; }
:root[data-theme="purple"] .hero-deco{ display:block; position:absolute; inset:0; pointer-events:none; }
:root[data-theme="purple"] .hero-deco.back{ z-index:0; }
:root[data-theme="purple"] .hero-deco.front{ z-index:2; }
.hero-deco svg{ position:absolute; overflow:visible; }
.hd-bora{ left:50%; width:104px; height:73px; margin-left:-52px; top:calc(50px + var(--s4) - 54px);
  animation:hdBob 3s ease-in-out infinite; }
.hd-paw{ width:30px; height:20px; left:calc(50% - 56px); top:calc(50px + var(--s4) - 10px); }
.hd-finger{ width:34px; height:34px; left:calc(50% + 20px); top:calc(50px + var(--s4) - 27px); }
.hd-sky.moon{ width:40px; height:40px; left:20px; top:8px; }
.hd-sky.sun{ width:48px; height:48px; left:14px; top:2px; }
.hd-rays{ transform-box:view-box; transform-origin:50% 50%; animation:hdSpin 16s linear infinite; }
.hd-star{ fill:#B996F2; animation:hdTwinkle 2.4s ease-in-out infinite; }
.hd-star.s1{ width:12px; height:12px; left:72px; top:22px; }
.hd-star.s2{ width:9px; height:9px; right:70px; top:10px; fill:#FFD66B; animation-delay:.8s; }
.hd-star.s3{ width:11px; height:11px; right:30px; top:28px; animation-delay:1.6s; }
.hd-cloud{ width:44px; height:28px; animation:hdDrift 6s ease-in-out infinite; }
.hd-cloud.c1{ right:24px; top:12px; }
.hd-cloud.c2{ left:74px; top:28px; width:30px; height:19px; animation-delay:2s; }
.hd-heart{ width:20px; height:20px; }
.hd-heart.h1{ left:calc(50% + 52px); top:6px; animation:hdFloat 3.2s ease-in-out infinite; }
.hd-heart.h2{ left:calc(50% - 76px); top:16px; width:14px; height:14px; animation:hdFloat 3.2s ease-in-out 1s infinite; }
.hd-heart.h3{ width:24px; height:24px; left:-8px; bottom:-10px; transform:rotate(-14deg); }
.hd-blink{ transform-box:fill-box; transform-origin:center; animation:hdBlink 4.2s infinite; }
.hd-z{ animation:hdZ 2.6s ease-in-out infinite; }
.hd-pop{ transform-box:fill-box; transform-origin:50% 100%; animation:hdPop 1.8s ease-in-out infinite; }
@keyframes hdBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
@keyframes hdFloat{ 0%,100%{ transform:translateY(0) rotate(-8deg); } 50%{ transform:translateY(-6px) rotate(8deg); } }
@keyframes hdTwinkle{ 0%,100%{ opacity:.3; transform:scale(.75); } 50%{ opacity:1; transform:scale(1); } }
@keyframes hdSpin{ to{ transform:rotate(360deg); } }
@keyframes hdDrift{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(6px); } }
@keyframes hdBlink{ 0%,93%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(.1); } }
@keyframes hdZ{ 0%{ opacity:0; transform:translate(0,4px); } 40%{ opacity:1; } 100%{ opacity:0; transform:translate(7px,-12px); } }
@keyframes hdPop{ 0%,100%{ transform:scale(.85); } 50%{ transform:translateY(-2px) scale(1.15); } }
@media (prefers-reduced-motion:reduce){
  .hd-bora, .hd-rays, .hd-star, .hd-cloud, .hd-heart.h1, .hd-heart.h2, .hd-blink, .hd-z, .hd-pop{ animation:none; }
}

/* Day: a soft lilac sky fading to pink. The card's words keep their colours. */
:root[data-theme="purple"] .hero-wrap .hero.carousel::before,
:root[data-theme="purple"] .hero-wrap .hero.carousel::after{ display:none; }
:root[data-theme="purple"] .hero-wrap.sky-day .hero.carousel{
  background-image:linear-gradient(170deg, #D6C7FA 0%, #EBE2FF 52%, #FFE4F1 100%);
  background-size:100% 100%; background-repeat:no-repeat; background-position:0 0; }
/* Night: a deep purple sky. Every word, chip and button on it turns light so
   it reads as easily as the day card. */
:root[data-theme="purple"] .hero-wrap.sky-night .hero.carousel{
  --hero-ink:#F7F3FE; --hero-soft:#D2C2F2; --hero-owe:#FFC6DC; --hero-get:#A6E6C8;
  --hero-line:rgba(247,243,254,.18); --hero-track:rgba(247,243,254,.26); --hero-glow:rgba(30,20,60,.6);
  background-image:
    radial-gradient(1.2px 1.2px at 18% 22%, rgba(255,255,255,.75) 50%, transparent 55%),
    radial-gradient(1px 1px at 72% 14%, rgba(255,255,255,.6) 50%, transparent 55%),
    radial-gradient(1.4px 1.4px at 88% 58%, rgba(255,255,255,.55) 50%, transparent 55%),
    radial-gradient(1px 1px at 40% 88%, rgba(255,255,255,.45) 50%, transparent 55%),
    linear-gradient(160deg, #3A2A58 0%, #563C8A 60%, #7E62BE 100%);
  background-size:100% 100%; background-repeat:no-repeat; background-position:0 0; color:#F7F3FE; }
:root[data-theme="purple"] .hero-wrap.sky-night .hero,
:root[data-theme="purple"] .hero-wrap.sky-night .hero p{ color:#D2C2F2; }
:root[data-theme="purple"] .hero-wrap.sky-night .hero .net small{ color:#D2C2F2; }
:root[data-theme="purple"] .hero-wrap.sky-night .hc-av{ background:rgba(247,243,254,.16); color:#F7F3FE; }
:root[data-theme="purple"] .hero-wrap.sky-night .hc-chip{ background:rgba(247,243,254,.14); color:#E4D7F9; }
:root[data-theme="purple"] .hero-wrap.sky-night .hero .hc-foot .net{ background:rgba(247,243,254,.12); }
:root[data-theme="purple"] .hero-wrap.sky-night .hc-btn:not(:disabled){ background:#F7F3FE; color:#3A2A58; }
:root[data-theme="purple"] .hero-wrap.sky-night .hc-btn:disabled{ background:rgba(247,243,254,.16); color:#A6E6C8; }

/* ---- Bottom bar: five equal tabs, and the + floating centred above ------- */
:root{ --nav-h:66px; --nav-gap:12px; }
.nav{ display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); align-items:stretch; gap:2px;
  left:50%; right:auto; width:min(calc(100% - 24px), 520px); max-width:none; margin:0; transform:translateX(-50%);
  bottom:calc(var(--nav-gap) + var(--safe-b)); height:var(--nav-h); padding:6px; border-radius:26px;
  background:var(--ink); box-shadow:0 14px 32px -10px rgba(30,32,28,.5), inset 0 1px 0 rgba(255,255,255,.06); }
.nav button{ flex:none; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  margin:0; padding:4px 0; border:0; border-radius:18px; background:transparent; color:rgba(252,250,245,.58);
  font:inherit; font-size:10.5px; font-weight:600; letter-spacing:0; line-height:1.1; cursor:pointer;
  -webkit-tap-highlight-color:transparent; transition:color .2s; }
.nav-ic{ display:flex; align-items:center; justify-content:center; width:50px; max-width:100%; height:30px;
  border-radius:999px; transition:background .25s ease, transform .15s ease; }
.nav-ic .ms{ font-size:22px; line-height:1; }
.nav-l{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px; }
.nav button[aria-current="page"]{ color:var(--cream); background:transparent; }
.nav button[aria-current="page"] .nav-ic{ background:rgba(252,250,245,.15); }
.nav button:active .nav-ic{ transform:scale(.9); }
.nav button:focus:not(:focus-visible){ outline:none; }
.nav button:focus-visible{ outline:2px solid var(--apricot); outline-offset:-2px; }

.nav-fab{ --glow: rgba(238,181,134,.62); --glow-soft: rgba(238,181,134,.20);
  position:fixed; left:50%; z-index:41; width:56px; height:56px; margin:0 0 0 -28px; padding:0;
  bottom:calc(var(--nav-gap) + var(--safe-b) + var(--nav-h) + 12px);
  display:flex; align-items:center; justify-content:center; border:0; border-radius:50%; cursor:pointer;
  background:var(--apricot); color:#3A2414;
  box-shadow:0 0 0 3px var(--glow-soft), 0 0 22px 4px var(--glow), 0 10px 20px -8px rgba(0,0,0,.45);
  -webkit-tap-highlight-color:transparent; transition:transform .15s ease; }
.nav-fab .ms{ font-size:28px; line-height:1; }
.nav-fab::after{ content:""; position:absolute; inset:-5px; border-radius:50%; pointer-events:none;
  box-shadow:0 0 18px 6px var(--glow); opacity:.35; animation:addGlow 2.8s ease-in-out infinite; }
.nav-fab:active{ transform:scale(.93); }
.nav-fab:focus:not(:focus-visible){ outline:none; }
.nav-fab:focus-visible{ outline:3px solid var(--apricot); outline-offset:4px; }
:root[data-theme="purple"] .nav-fab{ background:#C9B3F2; color:#2A1F3D;
  --glow: rgba(186,146,255,.70); --glow-soft: rgba(186,146,255,.24); }
.nav[hidden], .nav-fab[hidden]{ display:none !important; }

/* Sizes: a little roomier on tablets, tighter on small phones, icons only on
   the narrowest. Page content and toasts keep clear of the bar and the +. */
@media (min-width:600px) and (max-width:999px){
  :root{ --nav-h:70px; }
  .nav{ width:min(calc(100% - 48px), 560px); }
  .nav button{ font-size:11.5px; }
  .nav-ic{ width:56px; }
}
@media (max-width:359px){
  :root{ --nav-h:62px; --nav-gap:8px; }
  .nav{ width:calc(100% - 16px); padding:5px; border-radius:22px; }
  .nav button{ font-size:9.5px; }
  .nav-ic{ width:40px; height:28px; }
  .nav-ic .ms{ font-size:21px; }
  .nav-fab{ width:52px; height:52px; margin-left:-26px; }
}
@media (max-width:319px){
  :root{ --nav-h:52px; }
  .nav-l{ display:none; }
}
@media (max-width:999px){
  .wrap{ padding-bottom:calc(var(--nav-gap) + var(--safe-b) + var(--nav-h) + 110px); }
  .toast{ bottom:calc(var(--nav-gap) + var(--safe-b) + var(--nav-h) + 84px); }
}
@media (min-width:1000px){ .nav-fab{ display:none !important; } }
@media (prefers-reduced-motion:reduce){ .nav-fab::after{ animation:none; opacity:.6; } }

/* ---- Visualize --------------------------------------------------------- */
.vz-sec{ margin:0 0 var(--s5); }
.vz-sec.enter{ animation:gxRise .55s cubic-bezier(.22,.61,.36,1) backwards; }
.vz-head{ display:flex; align-items:flex-start; gap:12px; margin:0 2px 10px; }
.vz-ic{ flex:0 0 auto; width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  background:var(--apricot-lt); color:var(--apricot-dk); }
.vz-ic .ms{ font-size:20px; }
.vz-head h2{ margin:0; font-family:var(--serif); font-size:20px; font-weight:600; line-height:1.2; color:var(--ink); text-align:left; }
.vz-head p{ margin:2px 0 0; font-size:12.5px; color:var(--ink-3); }
.vz-card{ padding:var(--s4); overflow:hidden; }
.vz-headline{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; font-size:14px; color:var(--ink-2); }
.vz-big{ font-family:var(--serif); font-size:38px; font-weight:600; line-height:1; letter-spacing:-.02em; color:var(--ink);
  font-variant-numeric:tabular-nums; }
.vz-headline em{ font-style:normal; color:var(--ink-3); text-decoration:line-through;
  text-decoration-color:color-mix(in srgb, var(--bad) 55%, transparent); }
.vz-note{ margin:10px 2px 0; font-size:12.5px; line-height:1.45; color:var(--ink-3); }
.vz-note.vz-tight{ margin-top:6px; }
.vz-small{ font-size:12.5px !important; color:var(--ink-3) !important; }
.vz-empty{ padding:12px 6px; text-align:center; }
.vz-empty .ms{ font-size:34px; color:var(--apricot-dk); }
.vz-empty b{ display:block; margin-top:6px; font-size:16px; color:var(--ink); }
.vz-empty p{ margin:4px 0 0; font-size:13px; color:var(--ink-3); }
.vz-btn{ flex:0 0 auto; border:0; border-radius:999px; padding:6px 13px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
  background:var(--ink); color:var(--cream); -webkit-tap-highlight-color:transparent; }
.vz-btn.soft{ background:var(--fill-1); color:var(--ink); }
.vz-btn:disabled{ opacity:.6; cursor:default; }
.vz-btn:focus:not(:focus-visible){ outline:none; }
.vz-val{ font-size:15px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; }
.vz-val.neg{ color:var(--bad); } .vz-val.pos{ color:var(--good); }
.vz-b{ flex:1; min-width:0; }
.vz-t{ display:block; font-size:14px; line-height:1.3; color:var(--ink-2); }
.vz-t b{ font-weight:700; color:var(--ink); }
.vz-m{ display:block; margin-top:2px; font-size:12px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* settle everything */
.vz-svg{ display:block; width:100%; max-width:420px; height:auto; margin:4px auto 0; overflow:visible; }
.vz-flow{ fill:none; stroke-linecap:round; stroke-dasharray:7 7; animation:vzFlow 1.1s linear infinite; }
.vz-flow.out{ stroke:var(--bad); } .vz-flow.in{ stroke:var(--good); }
.vz-flow.other{ stroke:color-mix(in srgb, var(--ink) 32%, transparent); }
@keyframes vzFlow{ to{ stroke-dashoffset:-28; } }
.vz-arrow.out{ fill:var(--bad); } .vz-arrow.in{ fill:var(--good); }
.vz-arrow.other{ fill:color-mix(in srgb, var(--ink) 32%, transparent); }
.vz-amt{ font-size:11px; font-weight:700; text-anchor:middle; fill:var(--ink); paint-order:stroke; stroke:var(--surface);
  stroke-width:4px; stroke-linejoin:round; font-variant-numeric:tabular-nums; }
.vz-node circle{ stroke:var(--surface); stroke-width:3; }
.vz-node.me circle{ stroke:var(--apricot); stroke-width:4; }
.vz-node .ini{ font-size:12px; font-weight:700; fill:#fff; text-anchor:middle; dominant-baseline:central; }
.vz-node .nm{ font-size:11px; font-weight:600; fill:var(--ink-2); text-anchor:middle; }
.vz-legendline{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px 12px; margin:2px 0 0;
  font-size:11.5px; color:var(--ink-3); }
.vz-key{ display:inline-block; width:18px; height:3px; margin-right:-6px; border-radius:2px; vertical-align:middle; }
.vz-key.out{ background:var(--bad); } .vz-key.in{ background:var(--good); }
.vz-key.other{ background:color-mix(in srgb, var(--ink) 32%, transparent); }
.vz-list{ margin-top:12px; border-top:1px solid var(--line-2); }
.vz-move{ display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line-2); }
.vz-move:last-child{ border-bottom:0; }
.vz-pair{ flex:0 0 auto; display:flex; align-items:center; }
.vz-pair .av{ width:28px; height:28px; font-size:10.5px; }
.vz-pair > .ms{ margin:0 1px; font-size:13px; color:var(--ink-3); }
.vz-r{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.vz-even{ display:flex; align-items:center; gap:8px; margin-top:10px; padding:10px 12px; border-radius:12px;
  background:var(--fill-1); font-size:12.5px; color:var(--ink-2); }
.vz-even .ms{ font-size:18px; color:var(--ink-3); }
.vz-even .vz-btn{ margin-left:auto; }

/* who should pay next */
.vz-chips{ display:flex; gap:7px; overflow-x:auto; margin:0 0 12px; padding:0 0 2px; scrollbar-width:none; }
.vz-chips::-webkit-scrollbar{ display:none; }
.vz-chips .chip{ flex:0 0 auto; }
.vz-turn{ display:flex; align-items:center; flex-wrap:wrap; gap:14px 18px; }
.vz-donut{ position:relative; flex:0 0 auto; width:148px; height:148px; margin:0 auto; }
.vz-donut svg{ display:block; width:100%; height:100%; transform:rotate(-90deg); }
.vz-donut circle{ fill:none; stroke-width:18; }
.vz-donut .trk{ stroke:var(--fill-1); }
.vz-donut-c{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.vz-donut-c small{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.vz-donut-c b{ max-width:96px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-family:var(--serif); font-size:20px; font-weight:600; color:var(--ink); }
.vz-sec.enter .vz-seg{ animation:vzSeg .9s cubic-bezier(.22,.61,.36,1) .2s backwards; }
@keyframes vzSeg{ from{ stroke-dasharray:0 400; } }
.vz-turn-txt{ flex:1 1 200px; min-width:0; }
.vz-turn-txt p{ margin:0 0 8px; font-size:14px; line-height:1.45; color:var(--ink-2); }
.vz-turn-txt p b{ color:var(--ink); }
.vz-next{ margin-top:4px; }
.vz-bars{ display:flex; flex-direction:column; gap:12px; margin-top:16px; }
.vz-bar-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:4px 10px; }
.vz-bar-n{ display:flex; align-items:center; gap:6px; min-width:0; font-size:13.5px; font-weight:600; color:var(--ink); }
.vz-dot{ flex:0 0 auto; width:9px; height:9px; border-radius:50%; }
.vz-gap{ font-size:12px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
.vz-gap.pos{ color:var(--good); } .vz-gap.neg{ color:var(--bad); } .vz-gap.zero{ color:var(--ink-3); }
.vz-track{ grid-column:1 / -1; position:relative; height:8px; border-radius:999px; background:var(--fill-1); }
.vz-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; }
.vz-mark{ position:absolute; top:-3px; bottom:-3px; width:2px; border-radius:2px; background:var(--ink); }
.vz-sub{ grid-column:1 / -1; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.vz-sec.enter .vz-fill{ animation:vzGrow .9s cubic-bezier(.22,.61,.36,1) .2s backwards; }
@keyframes vzGrow{ from{ width:0; } }

/* what this really cost you */
.vz-stack{ display:flex; height:14px; margin:12px 0; overflow:hidden; border-radius:999px; background:var(--fill-1); }
.vz-stack i{ display:block; height:100%; }
.vz-sec.enter .vz-card > .vz-stack{ animation:vzGrow .9s cubic-bezier(.22,.61,.36,1) .2s backwards; }
.vz-legend{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px 14px; }
.vz-leg{ display:flex; align-items:center; gap:8px; min-width:0; font-size:13px; color:var(--ink-2); }
.vz-leg .ms{ flex:0 0 auto; width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:16px; color:#fff; }
.vz-leg-n{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vz-leg b{ margin-left:auto; color:var(--ink); font-variant-numeric:tabular-nums; }
.vz-gl{ display:flex; flex-direction:column; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line-2); }
.vz-gl-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; font-size:13px; color:var(--ink-2); }
.vz-gl-row b{ color:var(--ink); font-variant-numeric:tabular-nums; }
.vz-gl-row .vz-stack{ grid-column:1 / -1; height:6px; margin:0; }

/* old debts */
.vz-debt{ padding:12px 2px; border-bottom:1px solid var(--line-2); }
.vz-debt:first-child{ padding-top:2px; }
.vz-debt:last-of-type{ border-bottom:0; }
.vz-debt-top{ display:flex; align-items:center; gap:10px; }
.vz-debt-top .av{ width:34px; height:34px; font-size:12px; }
.vz-days{ flex:0 0 auto; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; }
.vz-days.fresh{ background:color-mix(in srgb, var(--good) 14%, transparent); color:var(--good); }
.vz-days.warm{ background:rgba(200,137,42,.16); color:#8A5A12; }
.vz-days.old{ background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad); }
.vz-agebar{ position:relative; height:6px; margin:9px 0 0 44px; border-radius:999px; background:var(--fill-1); }
.vz-agebar i{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; }
.vz-agebar i.fresh{ background:var(--good); } .vz-agebar i.warm{ background:#C8892A; } .vz-agebar i.old{ background:var(--bad); }
.vz-sec.enter .vz-agebar i{ animation:vzGrow .9s cubic-bezier(.22,.61,.36,1) .2s backwards; }

/* leave clean */
.vz-leave{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
.vz-lc{ padding:14px; }
.vz-lc.clean{ background:color-mix(in srgb, var(--good) 6%, var(--surface)); }
.vz-lc-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.vz-lc-h b{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; color:var(--ink); }
.vz-ok{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--good); }
.vz-ok .ms{ font-size:16px; }
.vz-todo{ flex:0 0 auto; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:700;
  background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); }
.vz-lc-sum{ margin:4px 0 6px; font-size:13px; color:var(--ink-3); }
.vz-lc-sum b{ color:var(--ink); }
.vz-lc-line{ display:flex; align-items:center; gap:8px; padding:8px 0 0; margin-top:8px; border-top:1px solid var(--line-2);
  font-size:13.5px; color:var(--ink-2); }
.vz-lc-line > .ms{ font-size:17px; color:var(--ink-3); }
.vz-lc-t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vz-lc-t b{ color:var(--ink); }

/* one payment across groups */
.ns-lines{ margin:0 0 14px; overflow:hidden; border-radius:16px; border:1px solid var(--line); }
.ns-line{ display:flex; justify-content:space-between; gap:10px; padding:11px 14px; border-top:1px solid var(--line-2);
  font-size:14px; color:var(--ink-2); }
.ns-line:first-child{ border-top:0; }
.ns-line .neg{ font-weight:700; color:var(--bad); } .ns-line .pos{ font-weight:700; color:var(--good); }
.ns-line.total{ align-items:center; background:color-mix(in srgb, var(--apricot) 14%, var(--surface)); font-weight:600; color:var(--ink); }
.ns-line.total b{ font-family:var(--serif); font-size:22px; font-variant-numeric:tabular-nums; }
#nsEtx:not(:empty){ margin-bottom:12px; }

@media (prefers-reduced-motion:reduce){
  .vz-flow{ animation:none; stroke-dasharray:none; }
  .vz-sec.enter, .vz-sec.enter .vz-fill, .vz-sec.enter .vz-seg, .vz-sec.enter .vz-agebar i,
  .vz-sec.enter .vz-card > .vz-stack{ animation:none; }
}
:root[data-theme="purple"] .vz-node.me circle{ stroke:#C9B3F2; }

/* ---- Record a payment: who to whom, the amount, then the details --------- */
.pf-sub{ margin:-4px 0 14px; text-align:center; font-size:13px; color:var(--ink-3); }
.pf{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:start; gap:8px;
  padding:18px 10px 16px; border-radius:20px; border:1px solid var(--line);
  background:color-mix(in srgb, var(--apricot) 12%, var(--surface)); }
.pf-person{ min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px; }
.pf-av{ width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden;
  color:#fff; font-size:18px; font-weight:700; box-shadow:0 0 0 4px var(--surface), 0 12px 22px -14px rgba(0,0,0,.5); }
.pf-av img{ width:100%; height:100%; object-fit:cover; }
.pf-role{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.pf-name{ display:flex; align-items:center; justify-content:center; min-height:36px; max-width:100%; padding:0 6px;
  text-align:center; font-size:14px; font-weight:600; line-height:1.2; color:var(--ink); overflow-wrap:anywhere; }
.pf-select{ position:relative; display:block; max-width:100%; margin:0; }
.pf-select select{ -webkit-appearance:none; appearance:none; display:block; max-width:100%; min-height:36px; margin:0;
  padding:6px 30px 6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); box-shadow:none;
  font:inherit; font-size:14px; font-weight:600; color:var(--ink); text-overflow:ellipsis; cursor:pointer; }
.pf-select .ms{ position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:18px; color:var(--ink-3); pointer-events:none; }
.pf-select select:disabled{ opacity:1; cursor:default; padding-right:14px; border-color:transparent; background:transparent;
  -webkit-text-fill-color:var(--ink); }
.pf-select select:disabled + .ms{ display:none; }
.pf-arrow{ display:flex; align-items:center; margin-top:17px; color:var(--apricot-dk); }
.pf-line{ width:20px; height:2px; opacity:.7; background:repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); }
.pf-arrow .ms{ margin-left:-2px; font-size:22px; animation:pfNudge 1.8s ease-in-out infinite; }
@keyframes pfNudge{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(4px); } }
.pf-amount{ margin:18px 0 4px; text-align:center; }
.pf-lab{ display:block; margin:0 0 2px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.pf-amt{ display:inline-flex; align-items:baseline; justify-content:center; gap:4px; max-width:100%; }
.pf-amt .cur{ font-family:var(--serif); font-size:34px; font-weight:600; color:var(--ink-3); }
.pf-amt input{ width:6.5ch; max-width:68vw; min-height:0; margin:0; padding:0 0 2px; border:0; border-bottom:2px solid var(--line);
  border-radius:0; background:transparent; box-shadow:none; outline:none; text-align:center; color:var(--ink);
  font-family:var(--serif); font-size:52px !important; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums;
  -moz-appearance:textfield; transition:border-color .15s; }
.pf-amt input::placeholder{ color:color-mix(in srgb, var(--ink) 22%, transparent); }
.pf-amt input:focus{ border-bottom-color:var(--apricot-dk); }
.pf-amt input::-webkit-outer-spin-button, .pf-amt input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.pf-why{ min-height:1em; margin-top:8px; font-size:12.5px; color:var(--ink-3); }
.pf-quick{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:10px; }
.pf-quick:empty{ display:none; }
.pf-chip{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 13px;
  font:inherit; font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; cursor:pointer;
  -webkit-tap-highlight-color:transparent; transition:transform .12s; }
.pf-chip:active{ transform:scale(.95); }
.pf-chip:focus:not(:focus-visible){ outline:none; }
#stEtx:not(:empty){ margin-top:16px; }
.pf-details{ display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:10px; margin-top:16px; }
.pf-details .field{ margin-bottom:12px; }
@media (max-width:380px){ .pf-details{ grid-template-columns:1fr; gap:0; } }
.pf-help{ margin:0 0 12px; text-align:center; font-size:12px; color:var(--ink-3); }
.pf-save{ display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; font-size:15.5px; }
.pf-save .ms{ font-size:20px; }
/* ---- Payment recorded: a check that draws itself, the amount, a chime ---- */
.paid-pop{ position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center; padding:24px;
  background:color-mix(in srgb, var(--ink) 40%, transparent); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  cursor:pointer; animation:paidFade .25s ease-out both; }
.paid-pop.out{ animation:paidFadeOut .3s ease-in both; }
@keyframes paidFade{ from{ opacity:0; } }
@keyframes paidFadeOut{ to{ opacity:0; } }
.paid-card{ position:relative; width:min(300px, 100%); padding:30px 24px 26px; border-radius:28px; text-align:center;
  background:var(--surface); color:var(--ink); box-shadow:0 30px 60px -24px rgba(0,0,0,.45);
  animation:paidPop .55s cubic-bezier(.34,1.56,.64,1) both; }
.paid-pop.out .paid-card{ animation:paidDrop .3s ease-in both; }
@keyframes paidPop{ from{ opacity:0; transform:translateY(22px) scale(.88); } }
@keyframes paidDrop{ to{ opacity:0; transform:translateY(10px) scale(.96); } }
.paid-mark{ position:relative; width:96px; height:96px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; }
/* The seal: the theme's apricot (lavender in purple) as a soft square, glowing
   like the + in the bar. */
.paid-seal{ position:relative; width:80px; height:80px; border-radius:27px; display:flex; align-items:center; justify-content:center;
  background:var(--apricot); color:#3A2414;
  box-shadow:0 0 0 4px rgba(238,181,134,.22), 0 0 26px 4px rgba(238,181,134,.55), 0 12px 24px -12px rgba(0,0,0,.35);
  animation:paidSeal .6s cubic-bezier(.3,1.6,.5,1) .05s both; }
@keyframes paidSeal{ from{ opacity:0; transform:scale(.3) rotate(-45deg); } }
.paid-seal svg{ position:relative; z-index:1; display:block; width:46px; height:46px; overflow:visible; }
.paid-check{ fill:none; stroke:currentColor; stroke-width:4.2; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:32; stroke-dashoffset:32; animation:paidDraw .38s cubic-bezier(.65,0,.45,1) .42s forwards; }
@keyframes paidDraw{ to{ stroke-dashoffset:0; } }
.paid-halo{ position:absolute; inset:-6px; border-radius:33px; border:2px solid var(--apricot); opacity:0;
  animation:paidHalo 1.15s ease-out .38s both; }
.paid-halo.h2{ animation-delay:.64s; }
@keyframes paidHalo{ 0%{ opacity:.85; transform:scale(.9); } 100%{ opacity:0; transform:scale(1.6); } }
:root[data-theme="purple"] .paid-seal{ background:#C9B3F2; color:#2A1F3D;
  box-shadow:0 0 0 4px rgba(186,146,255,.22), 0 0 26px 4px rgba(186,146,255,.55), 0 12px 24px -12px rgba(0,0,0,.35); }
:root[data-theme="purple"] .paid-halo{ border-color:#C9B3F2; }
.paid-dots{ position:absolute; left:50%; top:78px; width:0; height:0; pointer-events:none; }
.paid-dots i{ position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--c); opacity:0;
  animation:paidBurst .85s cubic-bezier(.22,.61,.36,1) .42s both; }
.paid-dots i:nth-child(even){ left:-3px; top:-3px; width:6px; height:6px; border-radius:2px; }
@keyframes paidBurst{ 0%{ opacity:1; transform:rotate(var(--a)) translateY(0) scale(1); }
  100%{ opacity:0; transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(.5); } }
.paid-lab{ font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
  animation:paidUp .4s ease-out .5s both; }
.paid-amt{ margin-top:6px; font-family:var(--serif); font-size:46px; font-weight:600; line-height:1; letter-spacing:-.02em;
  color:var(--ink); font-variant-numeric:tabular-nums; animation:paidUp .45s ease-out .58s both; }
.paid-to{ margin-top:8px; font-size:15px; color:var(--ink-2); animation:paidUp .45s ease-out .66s both; }
@keyframes paidUp{ from{ opacity:0; transform:translateY(8px); } }
@media (prefers-reduced-motion:reduce){
  .paid-pop, .paid-card, .paid-seal, .paid-lab, .paid-amt, .paid-to{ animation:none; }
  .paid-check{ animation:none; stroke-dashoffset:0; }
  .paid-halo, .paid-dots{ display:none; }
}

/* ---- Did it arrive? A slip that drops from the top and waits for an answer.
   Two-tone like a transfer stub: the dark top says what came and from whom,
