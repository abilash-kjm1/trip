<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settle — shared expenses</title>
<meta name="description" content="Split expenses with friends, flatmates and trips. Everyone adds from their own phone and it syncs live.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f2f7">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Settle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
/* ============================================================
   SETTLE — Liquid Glass, applied the way Apple specifies it

   The rule that matters: Liquid Glass is the material of the
   NAVIGATION layer only — the bar buttons, the tab bar, the
   floating action button, the sheet surface. It floats above
   content and refracts the content passing beneath it.

   It is never applied to content: lists, rows, cards, tiles,
   fields, text. And glass is never nested inside glass — so
   the controls inside a glass sheet are solid, and the bar
   buttons flatten once the bar itself turns to glass.

   Content is therefore an ordinary opaque iOS grouped list:
   white cards on a grey ground, hairline separators inset to
   the text. That contrast is what lets the glass read as
   glass at all.
   ============================================================ */
:root{
  color-scheme: light;

  /* iOS system colours, light */
  --green:#34C759; --green-dk:#1E7B34; --green-lt:rgba(52,199,89,.15);
  --blue:#007AFF;  --indigo:#5856D6;   --mint:#00C7BE;
  --red:#FF3B30;   --orange:#FF9500;

  --owed:#1E7B34;  /* they owe you */
  --owe:#C9271E;   /* you owe them */
  --danger:#C9271E;
  --tint:#34C759;

  /* content layer — solid, per iOS grouped-list convention */
  --ground:#f2f2f7;
  --surface:#ffffff;
  --fill-1:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.18);
  --fill-3:rgba(118,118,128,.24);

  --label:#000000;
  --label-2:rgba(60,60,67,.60);
  --label-3:rgba(60,60,67,.34);
  --sep:rgba(60,60,67,.20);

  /* navigation layer — the only place glass is allowed */
  --glass:rgba(255,255,255,.42);
  --glass-thick:rgba(255,255,255,.62);
  --lens: blur(22px) saturate(190%) brightness(1.08);
  --lens-soft: blur(16px) saturate(180%) brightness(1.06);
  --float: 0 1px 2px rgba(16,24,48,.06), 0 10px 28px rgba(16,24,48,.16);
  --float-s: 0 1px 2px rgba(16,24,48,.06), 0 5px 16px rgba(16,24,48,.13);
  --card-sh: 0 1px 2px rgba(16,24,48,.05), 0 6px 18px rgba(16,24,48,.06);

  --spring: cubic-bezier(.34,1.4,.64,1);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Inter", system-ui, "Segoe UI", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){ :root{
  color-scheme: light;
  --green:#34C759; --green-dk:#1E7B34; --green-lt:rgba(52,199,89,.15);
  --blue:#007AFF; --indigo:#5856D6; --mint:#00C7BE; --red:#FF3B30; --orange:#FF9500;
  --owed:#1E7B34; --owe:#C9271E; --danger:#C9271E; --tint:#34C759;
  --ground:#f2f2f7; --surface:#ffffff;
  --fill-1:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.18); --fill-3:rgba(118,118,128,.24);
  --label:#000000; --label-2:rgba(60,60,67,.60); --label-3:rgba(60,60,67,.34);
  --sep:rgba(60,60,67,.20);
  --glass:rgba(255,255,255,.42); --glass-thick:rgba(255,255,255,.62);
}}
:root[data-theme]{ color-scheme: light; }

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--ground); color:var(--label); font-family:var(--f);
  font-size:17px; line-height:1.41; letter-spacing:-.01em; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* A quiet wash on the ground. It shows in the gutters between cards, which is
   what the floating glass samples as content scrolls beneath it. */
.bgmesh{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(58% 40% at 8% 2%,   rgba(52,199,89,.20),  transparent 70%),
    radial-gradient(54% 38% at 96% 8%,  rgba(0,122,255,.16),  transparent 68%),
    radial-gradient(60% 42% at 88% 64%, rgba(88,86,214,.14),  transparent 70%),
    radial-gradient(56% 40% at 4% 82%,  rgba(0,199,190,.16),  transparent 70%),
    var(--ground);
}

.ms{ font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal;
  font-size:22px; line-height:1; letter-spacing:normal; text-transform:none;
  display:inline-block; white-space:nowrap; direction:ltr;
  font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; vertical-align:middle; }
:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }
button, input, select, textarea{ font:inherit; font-family:var(--f); }
[hidden]{ display:none !important; }

/* ============================================================
   THE GLASS — navigation layer only.
   ::before is the lens rim, a gradient ring masked to the border
   alone so the edge reads as the thickness of the material.
   ::after is the specular sweep over the curved surface.
   ============================================================ */
.glass{
  position:relative; isolation:isolate;
  background:var(--glass);
  backdrop-filter:var(--lens); -webkit-backdrop-filter:var(--lens);
}
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1.25px;
  background:linear-gradient(142deg,
    rgba(255,255,255,1) 0%, rgba(255,255,255,.45) 20%,
    rgba(255,255,255,.05) 47%, rgba(255,255,255,.32) 75%, rgba(255,255,255,.95) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none; z-index:2;
}
.glass::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(170deg,
    rgba(255,255,255,.42) 0%, rgba(255,255,255,.10) 24%, rgba(255,255,255,0) 48%);
  z-index:1;
}

/* ---------- navigation bar ---------- */
.bar{
  position:sticky; top:0; z-index:30; padding:calc(8px + var(--safe-t)) 12px 8px;
  display:flex; align-items:center; gap:8px; min-height:56px;
  background:transparent; transition:background .25s, box-shadow .25s;
}
.bar.scrolled{
  background:var(--glass);
  backdrop-filter:var(--lens); -webkit-backdrop-filter:var(--lens);
  box-shadow:0 .5px 0 var(--sep), inset 0 1px 0 rgba(255,255,255,.7);
}
.bar h1{
  position:absolute; left:50%; transform:translateX(-50%);
  max-width:calc(100% - 132px); margin:0; text-align:center;
  font-size:17px; font-weight:600; letter-spacing:-.02em; color:var(--label);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transition:opacity .22s;
}
.bar.scrolled h1{ opacity:1; }
.bar .spacer{ flex:1; }

/* Floating glass capsules while the bar itself is clear... */
.ibtn{
  width:40px; height:40px; border-radius:50%; border:0; cursor:pointer; flex:0 0 auto;
  color:var(--label); display:inline-flex; align-items:center; justify-content:center;
  box-shadow:var(--float-s);
  transition:transform .34s var(--spring), background .2s, box-shadow .25s;
}
.ibtn .ms{ font-size:21px; }
.ibtn:active{ transform:scale(.88); }
/* ...and flattened once the bar turns to glass, so glass never sits in glass. */
.bar.scrolled .ibtn{
  background:var(--fill-2); backdrop-filter:none; -webkit-backdrop-filter:none;
  box-shadow:none;
}
.bar.scrolled .ibtn::before, .bar.scrolled .ibtn::after{ display:none; }

/* large title lives in the content and scrolls away */
.ltitle{
  font-size:34px; line-height:1.12; font-weight:700; letter-spacing:-.028em;
  margin:2px 0 18px; text-align:center; color:var(--label);
}
.wrap{ max-width:620px; margin:0 auto; padding:2px 16px calc(180px + var(--safe-b)); }

/* ============================================================
   THE CONTENT — solid, so the glass above it has something to
   refract and the text never sits on a moving backdrop.
   ============================================================ */
.card{
  background:var(--surface); border-radius:22px; margin-bottom:18px; overflow:hidden;
  box-shadow:var(--card-sh);
}
.card.pad{ padding:20px; }
.sechead{
  font-size:13px; font-weight:600; letter-spacing:-.01em; color:var(--label-2);
  margin:24px 0 10px; text-align:center;
}

.row{
  display:flex; align-items:center; gap:13px; padding:13px 17px; width:100%;
  text-align:left; border:0; background:transparent; cursor:pointer; color:inherit;
  position:relative; transition:background .15s;
}
.row + .row::before, .daygroup + .row::before{
  content:""; position:absolute; left:71px; right:0; top:0; height:.5px; background:var(--sep);
}
.row:active{ background:var(--fill-1); }
.row .body{ flex:1; min-width:0; }
.row .t1{ font-size:17px; font-weight:600; letter-spacing:-.02em; display:block;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .t2{ font-size:14px; color:var(--label-2); margin-top:1px; letter-spacing:-.01em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.row .right{ text-align:right; flex:0 0 auto; }
.row .amt{ font-size:17px; font-weight:600; letter-spacing:-.02em; white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.row .cap{ font-size:12px; color:var(--label-3); display:block; margin-top:1px; }
.pos{ color:var(--owed); } .neg{ color:var(--owe); } .zero{ color:var(--label-3); }
.mine::after{
  content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px;
  border-radius:0 3px 3px 0; background:var(--tint);
}

.av{
  width:44px; height:44px; border-radius:50%; flex:0 0 auto; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:16px; letter-spacing:-.02em; text-transform:uppercase;
}
.av.sm{ width:30px; height:30px; font-size:12px; }
.av.lg{ width:62px; height:62px; font-size:24px; }
img.av{ object-fit:cover; background:var(--fill-1); }
.cat{
  width:44px; height:44px; border-radius:12px; flex:0 0 auto;
  background:var(--fill-1); color:var(--label-2);
  display:flex; align-items:center; justify-content:center;
}
.cat .ms{ font-size:23px; }
.cat.teal{ background:var(--green-lt); color:var(--green-dk); }
.cat.bad{ background:rgba(255,59,48,.13); color:var(--danger); }

.summary{
  background:var(--surface); border-radius:26px; padding:26px 20px 20px; margin-bottom:18px;
  box-shadow:var(--card-sh); text-align:center;
}
.summary .big{
  font-size:46px; line-height:1.04; font-weight:700; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.summary .lab{ font-size:15px; color:var(--label-2); margin-top:6px; letter-spacing:-.01em; }
.summary.flat{ background:var(--fill-1); box-shadow:none; }

.split{ display:flex; gap:12px; margin-top:20px; }
.split > div{ flex:1; background:var(--fill-1); border-radius:16px; padding:13px 10px; text-align:center; }
.summary.flat .split > div{ background:var(--surface); }
.split .k{ font-size:12px; color:var(--label-2); font-weight:500; }
.split .v{ font-size:20px; font-weight:600; letter-spacing:-.025em; margin-top:3px;
  font-variant-numeric:tabular-nums; }

/* ---------- controls: solid, they live in the content layer ---------- */
.btn{
  min-height:50px; padding:14px 22px; border-radius:16px; border:0; cursor:pointer;
  font-size:17px; font-weight:600; letter-spacing:-.02em;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .34s var(--spring), filter .18s, background .18s;
}
.btn:active{ transform:scale(.975); }
.btn.p{ background:var(--tint); color:#fff; }
.btn.p:active{ filter:brightness(.92); }
.btn.s, .btn.g{ background:var(--surface); color:var(--label); box-shadow:var(--card-sh); }
.btn.s:active, .btn.g:active{ background:var(--fill-1); }
.btn.g{ color:#3c4043; }
.btn.d{ background:rgba(255,59,48,.12); color:var(--danger); }
.btn.wide{ width:100%; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn.busy{ opacity:.6; }
.btnrow{ display:flex; gap:12px; }
.btnrow .btn{ flex:1; }

/* ---------- floating action button: navigation layer, prominent glass ---------- */
.fab{
  position:fixed; right:16px; bottom:calc(100px + var(--safe-b)); z-index:35;
  height:54px; padding:0 22px; border-radius:27px; border:0; cursor:pointer;
  background:var(--tint); color:#fff; font-size:17px; font-weight:600; letter-spacing:-.02em;
  display:inline-flex; align-items:center; gap:7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 8px 24px rgba(52,199,89,.42),
             0 2px 8px rgba(16,24,48,.18);
  transition:transform .34s var(--spring), filter .18s;
}
.fab .ms{ font-size:24px; }
.fab:active{ transform:scale(.92); filter:brightness(.94); }

/* ---------- tab bar: navigation layer ---------- */
.nav{
  position:fixed; left:12px; right:12px; bottom:calc(14px + var(--safe-b)); z-index:40;
  border-radius:28px; display:flex; padding:7px 6px;
  box-shadow:var(--float); max-width:596px; margin:0 auto;
}
.nav button{
  flex:1; border:0; background:transparent; cursor:pointer; padding:7px 4px 6px;
  border-radius:22px; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:500; color:var(--label-2);
  transition:color .18s, background .18s; position:relative; z-index:3;
}
.nav button .ms{ font-size:25px; }
.nav button[aria-current="page"]{ color:var(--green-dk); background:var(--green-lt); }


/* ---------- section headings, as the original tracker had them ---------- */
.sect{ margin:26px 2px 12px; text-align:center; }
.sect h2{
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:20px; font-weight:700; letter-spacing:-.025em; margin:0; color:var(--label);
}
.sect h2 .ms{ font-size:22px; color:var(--label-2); }
.sect p{ font-size:14px; color:var(--label-2); margin:5px 0 0; letter-spacing:-.01em; }

/* ---------- the inline add form ---------- */
.addform .ah{
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:18px; font-weight:700; letter-spacing:-.025em; margin:0 0 4px;
}
.addform .ah .ms{ font-size:21px; color:var(--label-2); }
.addform .asub{ font-size:14px; color:var(--label-2); margin:0 0 16px; text-align:center; }
.arow{ display:flex; gap:12px; flex-wrap:wrap; }
.arow .field{ margin-bottom:18px; }

/* ---------- who pays whom ---------- */
.owed{ padding:18px 18px 16px; }
.owedhead{ display:flex; align-items:center; gap:13px; margin-bottom:6px; }
.owedhead .txt{ flex:1; min-width:0; }
.owedhead .txt b{ display:block; font-weight:600; font-size:17px; letter-spacing:-.02em; }
.owedhead .txt small{ display:block; font-size:13px; color:var(--label-2); margin-top:1px; }
.owedhead .amt{ font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
.barrow{ display:flex; align-items:center; gap:11px; margin:10px 0 0; }
.barrow .who{
  flex:0 0 78px; font-size:14px; color:var(--label-2); font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.barrow .track{
  flex:1; height:24px; min-width:36px; border-radius:12px; overflow:hidden;
  background:var(--fill-1); display:block;
}
.barrow .fill{ display:block; height:100%; min-width:10px; border-radius:12px; }
.barrow .bamt{
  flex:0 0 auto; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;
  white-space:nowrap; min-width:66px; text-align:right;
}
@media(max-width:359px){
  .barrow .who{ flex-basis:58px; font-size:13px; }
  .barrow .bamt{ min-width:58px; font-size:13px; }
}


/* ---------- expense rows: who it was split between, and when ---------- */
.exrow{ align-items:flex-start; }
.exrow .av{ margin-top:2px; }
.row .who{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.wchip{
  display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500;
  color:var(--label-2); background:var(--fill-1); padding:3px 9px; border-radius:9px;
}
.wdot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
.row .added{
  display:flex; align-items:center; gap:5px; font-size:12px; color:var(--label-3);
  margin-top:6px;
}
.row .added .ms{ font-size:14px; }
.row .chev{ flex:0 0 auto; color:var(--label-3); margin-left:2px; }
.row .chev .ms{ font-size:20px; }
.linkbtn{
  display:block; width:100%; margin-top:14px; border:0; background:transparent;
  color:var(--blue); font-size:15px; font-weight:500; cursor:pointer; padding:6px;
  letter-spacing:-.01em;
}

/* ---------- who owes whom ---------- */
.barrow .val{
  flex:0 0 auto; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;
  white-space:nowrap; min-width:66px; text-align:right;
}

/* ---------- the receipt ---------- */
.rcrole{ text-align:center; font-size:13px; color:var(--label-2); margin:0 0 14px; }
#rcFilters{ margin-bottom:16px; }
.paper{
  background:var(--surface); border-radius:16px; padding:20px 18px;
  font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:13px;
  color:var(--label); box-shadow:var(--card-sh); line-height:1.5;
}
.rc-title{ text-align:center; font-size:17px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; margin-bottom:2px; }
.rc-sub{ text-align:center; font-size:12px; color:var(--label-2); }
.rc-rule{ border-top:1px dashed rgba(60,60,67,.35); margin:11px 0; }
.rc-rule.solid{ border-top:2px solid var(--label); margin:13px 0; }
.rc-grp{ font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--label-2);
  margin:14px 0 7px; }
.rc-line{ display:flex; justify-content:space-between; gap:12px; margin:4px 0; }
.rc-line .d{ flex:1; min-width:0; }
.rc-line .n{ flex:0 0 auto; font-variant-numeric:tabular-nums; }
.rc-line .note{ color:var(--label-3); }
.rc-tot{ display:flex; justify-content:space-between; gap:12px; font-weight:700; }
.rc-tot .n{ font-variant-numeric:tabular-nums; }
.rc-net{
  text-align:center; font-size:14px; font-weight:700; letter-spacing:.04em;
  padding:10px 4px 2px;
}


/* ---------- the expense list is capped and scrolls, as it used to ---------- */
.listwrap{ position:relative; }
.listwrap.capped > .card{
  max-height:58vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:rgba(118,118,128,.4) transparent;
}
.listwrap.capped > .card::-webkit-scrollbar{ width:8px; }
.listwrap.capped > .card::-webkit-scrollbar-thumb{
  background:rgba(118,118,128,.4); border-radius:4px; }
.listwrap.capped > .card::-webkit-scrollbar-track{ background:transparent; }
.listwrap.capped::after{
  content:""; position:absolute; left:0; right:0; bottom:18px; height:36px;
  pointer-events:none; border-radius:0 0 22px 22px;
  background:linear-gradient(180deg, rgba(255,255,255,0), var(--surface) 90%);
}
.scrollnote{
  margin:-6px 0 16px; font-size:13px; color:var(--label-2); font-weight:500;
  display:flex; align-items:center; justify-content:center; gap:6px; text-align:center;
}
.scrollnote .ms{ font-size:16px; }
.fulllink{
  display:flex; align-items:center; justify-content:center; gap:5px;
  font-size:15px; font-weight:500; color:var(--blue); text-decoration:none;
  margin:-4px 0 14px; padding:4px;
}
.fulllink .ms{ font-size:17px; }

/* ---------- expense filters ---------- */
.filters{ margin:0 0 14px; }
.filters input[type="search"]{
  width:100%; min-height:44px; padding:11px 16px; font-size:16px; color:var(--label);
  background:var(--fill-1); border:0; border-radius:13px; appearance:none;
  -webkit-appearance:none; letter-spacing:-.01em; margin-bottom:10px;
}
.filters input[type="search"]::placeholder{ color:var(--label-3); }
.filters input[type="search"]:focus{ outline:none; background:var(--surface); box-shadow:inset 0 0 0 2px var(--tint); }
.frow{
  display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px;
  scrollbar-width:none; -ms-overflow-style:none;
}
.frow::-webkit-scrollbar{ display:none; }
.frow .chip{ min-height:34px; padding:6px 13px; font-size:14px; flex:0 0 auto; border-radius:17px; }
.fcount{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-size:13px; color:var(--label-2); padding:2px 6px 10px;
}
.fcount button{
  border:0; background:transparent; color:var(--blue); font-size:15px; font-weight:600;
  cursor:pointer; padding:4px 2px; letter-spacing:-.01em;
}
.tag.warn{ background:rgba(255,149,0,.2); color:#8a5200; }

/* ---------- forms: content layer ---------- */
.field{ margin-bottom:18px; }
.field label{ display:block; font-size:13px; font-weight:500; color:var(--label-2);
  margin-bottom:7px; padding-left:4px; }
.field input, .field select, .field textarea{
  width:100%; min-height:52px; padding:14px 16px; font-size:17px; color:var(--label);
  background:var(--fill-1); border:0; border-radius:14px; appearance:none;
  letter-spacing:-.02em; transition:box-shadow .18s, background .18s;
}
.field textarea{ min-height:84px; resize:vertical; line-height:1.4; }
.field input::placeholder, .field textarea::placeholder{ color:var(--label-3); }
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; background:var(--surface); box-shadow:inset 0 0 0 2px var(--tint); }
.field .help{ font-size:13px; color:var(--label-2); margin-top:7px; padding-left:4px; line-height:1.45; }
.amtbig{ display:flex; align-items:center; gap:10px; }
.amtbig .cur{ font-size:34px; font-weight:600; color:var(--label-3); letter-spacing:-.03em; }
.amtbig input{ font-size:34px !important; font-weight:600; min-height:68px;
  letter-spacing:-.035em; font-variant-numeric:tabular-nums; }

.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  display:inline-flex; align-items:center; gap:6px; min-height:42px; padding:9px 15px;
  border-radius:21px; border:0; background:var(--fill-1); color:var(--label);
  font-size:15px; font-weight:500; letter-spacing:-.015em; cursor:pointer;
  transition:transform .34s var(--spring), background .18s, color .18s;
}
.chip:active{ transform:scale(.93); }
.chip[aria-pressed="true"]{ background:var(--tint); color:#fff; font-weight:600; }
.chip .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
.chip[aria-pressed="true"] .dot{ box-shadow:0 0 0 1.5px rgba(255,255,255,.95); }

.seg{
  display:flex; background:var(--fill-1); border-radius:14px; padding:3px; gap:3px;
  margin-bottom:18px;
}
.seg button{
  flex:1; border:0; background:transparent; cursor:pointer; padding:9px 6px; border-radius:11px;
  font-size:15px; font-weight:500; letter-spacing:-.015em; color:var(--label);
  transition:background .2s, box-shadow .2s;
}
.seg button[aria-pressed="true"]{
  background:var(--surface); font-weight:600;
  box-shadow:0 1px 2px rgba(16,24,48,.12), 0 3px 8px rgba(16,24,48,.08);
}

.splitrow{ display:flex; align-items:center; gap:10px; padding:11px 0; }
.splitrow + .splitrow{ box-shadow:inset 0 .5px 0 var(--sep); }
.splitrow .nm{ flex:1; min-width:0; font-size:16px; font-weight:500; letter-spacing:-.018em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.splitrow input{
  width:86px; min-height:44px; padding:10px 12px; text-align:right; border:0;
  background:var(--fill-1); border-radius:11px; font-size:17px;
  font-variant-numeric:tabular-nums; }
.splitrow .unit{ width:22px; font-size:14px; color:var(--label-3); }
.splitrow .calc{ width:72px; text-align:right; font-size:14px; color:var(--label-2);
  font-variant-numeric:tabular-nums; }
.splitsum{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  margin-top:14px; padding:12px 16px; border-radius:14px; background:var(--fill-1);
  font-size:14px; font-weight:600; letter-spacing:-.01em; }
.splitsum.bad{ color:var(--danger); }
.splitsum.ok{ color:var(--owed); }

/* ---------- sheet: navigation layer, so the surface is glass ---------- */
.scrim{ position:fixed; inset:0; background:rgba(28,32,48,.32); z-index:50; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51; max-height:93vh; overflow-y:auto;
  border-radius:38px 38px 0 0; padding:0 0 calc(24px + var(--safe-b));
  background:var(--glass-thick);
  backdrop-filter:var(--lens); -webkit-backdrop-filter:var(--lens);
  box-shadow:0 -12px 44px rgba(16,24,48,.24);
  -webkit-overflow-scrolling:touch;
}
@media(min-width:620px){
  .sheet{ left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%);
    width:520px; border-radius:34px; max-height:88vh;
    box-shadow:0 30px 70px rgba(16,24,48,.3); }
}
.sheet .shead{
  position:sticky; top:0; z-index:4; display:flex; align-items:center; gap:8px;
  padding:6px 14px 12px; background:rgba(255,255,255,.84);
  backdrop-filter:blur(20px) saturate(190%); -webkit-backdrop-filter:blur(20px) saturate(190%);
  box-shadow:0 .5px 0 var(--sep);
}
.sheet .shead h2{
  position:absolute; left:50%; transform:translateX(-50%); max-width:calc(100% - 116px);
  margin:0; text-align:center; font-size:17px; font-weight:600; letter-spacing:-.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sheet .shead .spacer{ flex:1; }
/* the close button sits inside glass, so it is flat */
.sheet .shead .ibtn{ background:var(--fill-2); box-shadow:none; }
.sheet .sbody{ padding:4px 20px 8px; position:relative; z-index:3; }
.grab{ width:38px; height:5px; border-radius:3px; background:var(--label-3);
  opacity:.5; margin:9px auto 2px; }
@media(min-width:620px){ .grab{ display:none; } }

/* ---------- misc: content layer ---------- */
.empty{ text-align:center; padding:40px 22px; color:var(--label-2); }
.empty .ms{ font-size:52px; color:var(--label-3); display:block; margin-bottom:12px; }
.empty h3{ font-size:20px; font-weight:600; letter-spacing:-.025em; color:var(--label); margin:0 0 7px; }
.empty p{ font-size:15px; margin:0 0 20px; line-height:1.45; }
.daygroup{ font-size:13px; font-weight:600; color:var(--label-2); padding:14px 17px 7px; text-align:center; }
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(116px + var(--safe-b)); z-index:70;
  background:rgba(28,32,48,.88); color:#fff; padding:13px 20px; border-radius:18px;
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  font-size:15px; font-weight:500; text-align:center;
  box-shadow:0 12px 34px rgba(16,24,48,.3);
  opacity:0; pointer-events:none; transition:opacity .2s; max-width:88vw;
}
.toast.on{ opacity:1; }
.sync{
  font-size:13px; font-weight:500; text-align:center; margin:0 16px 14px;
  padding:11px 16px; border-radius:14px; background:var(--surface); color:var(--label-2);
  box-shadow:var(--card-sh);
}
.sync.ok{ background:rgba(52,199,89,.16); color:var(--green-dk); box-shadow:none; }
.sync.warn{ background:rgba(255,149,0,.18); color:#8a5200; box-shadow:none; }
.sync.bad{ background:rgba(255,59,48,.13); color:var(--danger); box-shadow:none; }
.tag{
  display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:7px;
  vertical-align:middle; background:var(--fill-2); color:var(--label-2);
}
.tag.on{ background:var(--green-lt); color:var(--green-dk); }
.tag.admin{ background:rgba(255,149,0,.2); color:#8a5200; }

.signin{ text-align:center; padding:34px 24px 28px; margin-top:5vh; }
.signin .mark{
  width:84px; height:84px; border-radius:24px; margin:0 auto 22px;
  background:linear-gradient(160deg, #5ee07f, var(--tint) 55%, #00b8a0); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 14px 34px rgba(52,199,89,.36);
}
.signin .mark .ms{ font-size:44px; }
.signin h2{ font-size:28px; font-weight:700; letter-spacing:-.03em; margin:0 0 10px; line-height:1.15; }
.signin p{ font-size:16px; color:var(--label-2); margin:0 0 26px; line-height:1.45; }
.fine{ font-size:13px; color:var(--label-2); margin:16px 0 0; line-height:1.45; text-align:center; }
.lead{ font-size:15px; color:var(--label-2); margin:0 0 20px; line-height:1.45; text-align:center; }
.code{
  font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:15px;
  text-align:center; background:var(--fill-1); padding:14px 16px; border-radius:14px;
  word-break:break-all; margin:0;
}
.notice{
  display:flex; align-items:center; gap:13px; flex-wrap:wrap;
  background:var(--green-lt); border-radius:20px; padding:16px 18px; margin-bottom:18px;
  font-size:15px; color:var(--green-dk); line-height:1.4;
}
.notice .ms{ font-size:26px; flex:0 0 auto; }
.notice > div{ flex:1; min-width:150px; }
.notice .btn{ min-height:42px; padding:10px 18px; font-size:15px; }

@media(max-width:359px){
  .ltitle{ font-size:30px; }
  .summary .big{ font-size:40px; }
  .row{ padding:12px 14px; gap:11px; }
  .row + .row::before, .daygroup + .row::before{ left:65px; }
  .av, .cat{ width:40px; height:40px; }
  .row .t1{ font-size:16px; }
  .row .t2{ font-size:13px; }
  .splitrow input{ width:74px; }
  .splitrow .calc{ width:58px; font-size:13px; }
  .wrap{ padding-left:13px; padding-right:13px; }
  .sheet .sbody{ padding-left:15px; padding-right:15px; }
}

/* Accessibility: Apple requires glass to stand down for these. */
@media (prefers-reduced-transparency: reduce){
  .glass, .bar.scrolled, .sheet, .sheet .shead, .toast{
    background:rgba(255,255,255,.98) !important;
    backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  }
  .toast{ background:#1c2030 !important; }
  .glass::after{ display:none; }
  .bgmesh{ opacity:.3; }
}
@media (prefers-contrast: more){
  :root{ --label-2:rgba(40,40,46,.86); --label-3:rgba(40,40,46,.62); --sep:rgba(60,60,67,.42); }
  .glass{ background:rgba(255,255,255,.86); }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .glass, .bar.scrolled{ background:rgba(255,255,255,.94); }
  .sheet, .sheet .shead{ background:rgba(255,255,255,.98); }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

/* ---------- printing (kept last so it wins the cascade) ---------- */
#printArea{ display:none; }
@media print{
  @page{ margin:14mm; }
  body{ background:#fff; }
  body.printing > *{ display:none !important; }
  body.printing #printArea{ display:block !important; }
  #printArea{ font-size:11pt; color:#000; }
  #printArea h1{ font-size:19pt; margin:0 0 2px; letter-spacing:-.4px; }
  #printArea h2{ font-size:12.5pt; margin:22px 0 6px; padding-bottom:4px;
    border-bottom:1.5px solid #000; page-break-after:avoid; }
  #printArea .pmeta{ font-size:9.5pt; color:#444; margin:0 0 4px; }
  #printArea table{ width:100%; border-collapse:collapse; margin:0; font-size:9.5pt; }
  #printArea th, #printArea td{ border-bottom:1px solid #ccc; padding:5px 6px;
    text-align:left; vertical-align:top; }
  #printArea th{ font-size:8pt; text-transform:uppercase; letter-spacing:.05em;
    color:#333; border-bottom:1px solid #000; }
  #printArea .r{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  #printArea .who{ font-size:8.5pt; color:#444; }
  #printArea .note{ font-size:8.5pt; color:#555; font-style:italic; }
  #printArea ul{ margin:0; padding-left:18px; }
  #printArea li{ margin-bottom:3px; }
  #printArea tr{ page-break-inside:avoid; }
}
</style>

<body>
<div class="bgmesh" aria-hidden="true"></div>

<header class="bar" id="bar">
  <button class="ibtn glass" id="backBtn" aria-label="Back" hidden><span class="ms" aria-hidden="true">arrow_back</span></button>
  <span class="spacer"></span>
  <h1 id="barTitle">Groups</h1>
  <span class="spacer"></span>
  <button class="ibtn glass" id="gmenuBtn" aria-label="Group settings" hidden><span class="ms" aria-hidden="true">more_horiz</span></button>
</header>
<div class="sync" id="syncBar" hidden></div>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" hidden><span class="ms" aria-hidden="true">add</span><span id="fabLabel">Add expense</span></button>

<nav class="nav glass" id="nav" aria-label="Sections">
  <button data-tab="groups" aria-current="page"><span class="ms" aria-hidden="true">group</span>Groups</button>
  <button data-tab="activity"><span class="ms" aria-hidden="true">receipt_long</span>Activity</button>
  <button data-tab="account"><span class="ms" aria-hidden="true">account_circle</span>Account</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grab"></div>
  <div class="shead">
    <span class="spacer"></span>
    <h2 id="sheetTitle">…</h2>
    <span class="spacer"></span>
    <button class="ibtn" id="sheetClose" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button>
  </div>
  <div class="sbody" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="firebase-config.js"></script>
<script type="module">
/* ===========================================================================
   SETTLE — shared expense app
   Data model (Firebase Realtime Database):
     trips/{gid}/meta          {name, type, at, by}
     trips/{gid}/people/{k}    {n, c, uid?, email?, photo?}
     trips/{gid}/expenses/{k}  {desc, amount, payer, mode, between[], vals{}, cat, note, at, by}
     trips/{gid}/payments/{k}  {from, to, amount, note, at, by}
     users/{uid}/profile       {name, email, photo, at}
     users/{uid}/groups/{gid}  {name, at}      <- which groups this person is in
   Who you are comes from Google sign-in. Which groups you belong to lives in
   the database under your own uid, so it follows you to any device.
   =========================================================================== */
const $  = (id) => document.getElementById(id);
const el = (t, c, h) => { const n=document.createElement(t); if(c) n.className=c; if(h!=null) n.innerHTML=h; return n; };

// The tracker's own palette. People created by the original app carry a colour
// from this list, so any colour handed out later has to come from the same one
// or the avatars and the bars stop matching each other.
const PALETTE = ["#006b5d","#1565c0","#6a1b9a","#c62828","#ef6c00","#2e7d32",
                 "#ad1457","#4527a0","#00838f","#558b2f","#5d4037","#37474f"];
const CATS = [
  {k:"general",  i:"receipt_long",   n:"General"},
  {k:"food",     i:"restaurant",     n:"Food & drink"},
  {k:"grocery",  i:"shopping_cart",  n:"Groceries"},
  {k:"transport",i:"directions_car", n:"Transport"},
  {k:"fuel",     i:"local_gas_station", n:"Fuel"},
  {k:"home",     i:"home",           n:"Home & rent"},
  {k:"utilities",i:"bolt",           n:"Utilities"},
  {k:"travel",   i:"flight",         n:"Travel"},
  {k:"lodging",  i:"hotel",          n:"Lodging"},
  {k:"fun",      i:"celebration",    n:"Entertainment"},
  {k:"shopping", i:"shopping_bag",   n:"Shopping"},
  {k:"health",   i:"medical_services",n:"Health"}
];
const catOf = (k) => CATS.find(c=>c.k===k) || CATS[0];
const FULLVIEW = /[?&]full=1/.test(location.search);
const ADMIN_EMAIL = (window.ADMIN_EMAIL || "").toLowerCase();
const PEOPLE_LINKS = (function(){
  const src=window.PEOPLE_LINKS||{}, out={};
  Object.keys(src).forEach(k=> out[k.toLowerCase()]=src[k] );
  return out;
})();
// The name this account always goes by, if it has been pinned to one.
const linkedName = (email) => PEOPLE_LINKS[String(email||"").toLowerCase()] || null;

/* ---------------- local state ---------------- */
const LS = {
  grp: "settle.groups.v2",   // cached copy of users/{uid}/groups, for offline
  cur: "settle.cur.v2"
};
function lsGet(k, d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let USER     = null;                        // {uid, name, email, photo} from Google
let ME       = null;                        // my person-name inside CURRENT group
let JOINED   = lsGet(LS.grp, []);           // [{id,name}]
let CURRENT  = null;                        // active group id
let TAB      = "groups";                    // groups | activity | account
let DATA     = {};                          // gid -> {meta, people, expenses, payments}
let remote   = null;                        // firebase handles
const subs   = {};                          // gid -> unsubscribe

const isAdmin = () => !!(USER && ADMIN_EMAIL && (USER.email||"").toLowerCase()===ADMIN_EMAIL);

/* ---------------- helpers ---------------- */
function money(n){ const v=Math.round((n+Number.EPSILON)*100)/100; return (v<0?"-$":"$")+Math.abs(v).toFixed(2); }
function plain(n){ return (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); }
function trim(n){ return String(Math.round((n+Number.EPSILON)*100)/100); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(n){ const p=String(n||"?").trim().split(/\s+/); return (p[0].charAt(0)+(p[1]?p[1].charAt(0):"")).toUpperCase(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), 2600); }
function fmtDate(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d)) return "";
  const o={day:"numeric", month:"short"};
  if(d.getFullYear()!==new Date().getFullYear()) o.year="numeric";
  return d.toLocaleDateString(undefined,o);
}
function fmtWhen(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d)) return "";
  return fmtDate(ts)+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function dayKey(ts){ const d=new Date(ts||0);
  return isNaN(d) ? "" : d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function dayLabel(ts){
  const d=new Date(ts||0); if(isNaN(d)) return "Undated";
  const t=new Date();
  if(dayKey(ts)===dayKey(t)) return "Today";
  if(dayKey(ts)===dayKey(Date.now()-864e5)) return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"long"});
}
function avatarHTML(cls, name, colour, photo){
  if(photo) return '<img class="av '+cls+'" src="'+esc(photo)+'" alt="" referrerpolicy="no-referrer">';
  return '<span class="av '+cls+'" style="background:'+(colour||"#8e99a6")+'">'+esc(initials(name))+'</span>';
}

/* ---------------- group data accessors ---------------- */
function membersOf(gid){
  const g=DATA[gid]||{}, raw=g.people||{};
  const keys=Object.keys(raw).sort();
  const taken=new Set(); keys.forEach(k=>{ const c=raw[k] && raw[k].c; if(c) taken.add(c.toLowerCase()); });
  let next=0;
  return keys.map(k=>{
    const v=raw[k]; const obj=(v&&typeof v==="object")?v:{n:String(v)};
    const name=obj.n||"";
    let color=obj.c||null;
    if(!color){
      while(next<PALETTE.length && taken.has(PALETTE[next].toLowerCase())) next++;
      color=PALETTE[next%PALETTE.length]; taken.add(color.toLowerCase()); next++;
    }
    return {k, name, color, uid:obj.uid||null, email:obj.email||null, photo:obj.photo||null};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
const names   = (gid) => membersOf(gid||CURRENT).map(m=>m.name);
const memberOf= (n, gid) => membersOf(gid||CURRENT).find(x=>x.name===n) || null;
const colorOf = (n, gid) => { const m=memberOf(n, gid); return m?m.color:"#8e99a6"; };
function listOf(gid, what){
  const raw=(DATA[gid]||{})[what]||{};
  return Object.entries(raw).map(([k,v])=>Object.assign({k},v)).sort((a,b)=>(b.at||0)-(a.at||0));
}
const expensesOf = (gid) => listOf(gid||CURRENT, "expenses");
const paymentsOf = (gid) => listOf(gid||CURRENT, "payments");

// Which person in this group is me? Null until I have claimed a slot.
function meIn(gid){
  if(!USER) return null;
  const m=membersOf(gid).find(x=>x.uid===USER.uid);
  return m ? m.name : null;
}
const loaded = (gid) => !!(DATA[gid] && (DATA[gid].meta || DATA[gid].people || DATA[gid].expenses));

// Everyone the money actually involves. An expense can name someone who is no
// longer on the members list; they still hold a balance, so any screen that
// claims to show "everyone" has to include them or the figures will not add up.
function everyoneIn(gid){
  const out=names(gid).slice();
  Object.keys(balances(gid)).forEach(n=>{ if(out.indexOf(n)<0) out.push(n); });
  return out;
}

/* ---------------- split maths ---------------- */
// Returns {name: amountOwed}. Modes: equal | exact | percent | shares
function sharesOf(e){
  const out={};
  const between=(e.between&&e.between.length)?e.between:[e.payer];
  const vals=e.vals||{};
  const amt=Number(e.amount)||0;
  if(e.mode==="exact"){
    between.forEach(n=> out[n]=Number(vals[n])||0 );
  } else if(e.mode==="percent"){
    between.forEach(n=> out[n]= amt*((Number(vals[n])||0)/100) );
  } else if(e.mode==="shares"){
    const tot=between.reduce((a,n)=>a+(Number(vals[n])||0),0) || 1;
    between.forEach(n=> out[n]= amt*((Number(vals[n])||0)/tot) );
  } else {
    const per=amt/between.length;
    between.forEach(n=> out[n]=per );
  }
  return out;
}
// Net position per person: positive = they are owed, negative = they owe
function balances(gid){
  const b={};
  names(gid).forEach(n=> b[n]=0 );
  expensesOf(gid).forEach(e=>{
    if(!(e.payer in b)) b[e.payer]=0;
    b[e.payer]+=Number(e.amount)||0;
    const sh=sharesOf(e);
    Object.keys(sh).forEach(n=>{ if(!(n in b)) b[n]=0; b[n]-=sh[n]; });
  });
  paymentsOf(gid).forEach(p=>{
    if(!(p.from in b)) b[p.from]=0;
    if(!(p.to   in b)) b[p.to]=0;
    b[p.from]+=Number(p.amount)||0;   // paying down what you owe
    b[p.to]  -=Number(p.amount)||0;
  });
  return b;
}
// Fewest transfers that clear everyone
function settlements(gid){
  const b=balances(gid), cred=[], deb=[];
  Object.keys(b).forEach(n=>{ const v=Math.round(b[n]*100)/100;
    if(v>0.004) cred.push({n, v}); else if(v<-0.004) deb.push({n, v:-v}); });
  cred.sort((a,c)=>c.v-a.v); deb.sort((a,c)=>c.v-a.v);
  const out=[]; let i=0,j=0,guard=0;
  while(i<deb.length && j<cred.length && guard++<9999){
    const pay=Math.min(deb[i].v, cred[j].v);
    if(pay>0.004) out.push({from:deb[i].n, to:cred[j].n, amt:pay});
    deb[i].v-=pay; cred[j].v-=pay;
    if(deb[i].v<=0.004) i++;
    if(cred[j].v<=0.004) j++;
  }
  return out;
}
const myBalance = (gid) => { const n=meIn(gid); if(!n) return 0; const b=balances(gid); return b[n]||0; };
function totalOf(gid){ let t=0; expensesOf(gid).forEach(e=> t+=Number(e.amount)||0 ); return t; }

/* ---------------- writes ---------------- */
function ref(path){ return remote.ref(remote.db, path); }
function push(path, val){
  if(!remote){ toast("Not signed in yet"); return Promise.resolve(); }
  return remote.push(ref(path), val).catch(e=>toast("Could not save: "+e.message));
}
function set(path, val){
  if(!remote) return Promise.resolve();
  return remote.set(ref(path), val).catch(e=>toast("Could not save: "+e.message));
}
function del(path){
  if(!remote) return Promise.resolve();
  return remote.remove(ref(path)).catch(e=>toast("Could not remove: "+e.message));
}
function upd(path, obj){
  if(!remote) return Promise.resolve();
  return remote.update(ref(path), obj).catch(e=>toast("Could not save: "+e.message));
}

/* ---------------- linking an account to a name ---------------- */
function linkPerson(gid, key){
  return upd("trips/"+gid+"/people/"+key,
    {uid:USER.uid, email:USER.email, photo:USER.photo||null});
}
function unlinkPerson(gid, key){
  return upd("trips/"+gid+"/people/"+key, {uid:null, email:null, photo:null});
}

// Fold one person into another: everything `from` paid, owed or was split
// into becomes `to`, and `from` disappears. Used to repair a duplicate — the
// same human entered twice — which otherwise skews every split they are in.
// One atomic update, because a half-applied merge would silently change what
// people owe.
function mergePeople(gid, from, to){
  const u={};
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) u["expenses/"+e.k+"/payer"]=to;
    const b=e.between||[];
    if(b.indexOf(from)>-1){
      const vals=Object.assign({}, e.vals||{});
      if(vals[from]!=null){
        // both halves of the duplicate contributed, so their shares add up
        vals[to]=(Number(vals[to])||0)+(Number(vals[from])||0);
        delete vals[from];
      }
      const nb=[];
      b.forEach(n=>{ const m=(n===from)?to:n; if(nb.indexOf(m)<0) nb.push(m); });
      u["expenses/"+e.k+"/between"]=nb;
      u["expenses/"+e.k+"/vals"]=vals;
    }
  });
  paymentsOf(gid).forEach(p=>{
    const f=(p.from===from)?to:p.from, t=(p.to===from)?to:p.to;
    if(f===t) u["payments/"+p.k]=null;             // paying yourself means nothing
    else{
      if(f!==p.from) u["payments/"+p.k+"/from"]=f;
      if(t!==p.to)   u["payments/"+p.k+"/to"]=t;
    }
  });
  const gone   = membersOf(gid).find(x=>x.name===from);
  const target = membersOf(gid).find(x=>x.name===to);
  if(gone){
    // If the target is only a name carried on the expenses and has no record
    // of its own, deleting the source would throw away the account, the email
    // and the colour attached to it - and leave the name orphaned exactly as
    // before. Rename the record onto that name instead: same effect on the
    // money, and the orphan is absorbed rather than perpetuated.
    if(target) u["people/"+gone.k]=null;
    else       u["people/"+gone.k+"/n"]=to;
  }
  return upd("trips/"+gid, u);
}
// What a merge would touch, so it can be described before it happens.
function mergePreview(gid, from){
  let paid=0, inSplit=0, pays=0;
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) paid++;
    if((e.between||[]).indexOf(from)>-1) inSplit++;
  });
  paymentsOf(gid).forEach(p=>{ if(p.from===from||p.to===from) pays++; });
  return {paid, inSplit, pays};
}

// Renaming has to move the name everywhere it is used as a key, or the
// balances stop adding up. One atomic update so it cannot half-apply.
function renamePerson(gid, key, from, to){
  const u={}; u["people/"+key+"/n"]=to;
  expensesOf(gid).forEach(e=>{
    if(e.payer===from) u["expenses/"+e.k+"/payer"]=to;
    if(e.between && e.between.indexOf(from)>-1)
      u["expenses/"+e.k+"/between"]=e.between.map(n=> n===from?to:n );
    if(e.vals && Object.prototype.hasOwnProperty.call(e.vals, from)){
      const v={}; Object.keys(e.vals).forEach(n=> v[n===from?to:n]=e.vals[n] );
      u["expenses/"+e.k+"/vals"]=v;
    }
  });
  paymentsOf(gid).forEach(p=>{
    if(p.from===from) u["payments/"+p.k+"/from"]=to;
    if(p.to===from)   u["payments/"+p.k+"/to"]=to;
  });
  return upd("trips/"+gid, u);
}

/* ---------------- which groups I am in ---------------- */
function rememberGroup(id, name){
  if(!JOINED.some(g=>g.id===id)) JOINED.push({id, name});
  else JOINED = JOINED.map(g=> g.id===id ? {id, name:name||g.name} : g);
  lsSet(LS.grp, JOINED);
  if(remote && USER) set("users/"+USER.uid+"/groups/"+id, {name:name||id, at:Date.now()});
}
function forgetGroup(id){
  JOINED = JOINED.filter(g=>g.id!==id); lsSet(LS.grp, JOINED);
  if(subs[id]){ subs[id](); delete subs[id]; }
  delete DATA[id];
  if(remote && USER) del("users/"+USER.uid+"/groups/"+id);
}
function groupName(id){
  const g=DATA[id]&&DATA[id].meta&&DATA[id].meta.name;
  if(g) return g;
  const j=JOINED.find(x=>x.id===id);
  return j? j.name : "Group";
}

// An account pinned to a name in PEOPLE_LINKS takes that name without being
// asked, as long as it is on the list and nobody else has it.
function autoLink(gid){
  if(!USER || !remote || autoLinked[gid] || meIn(gid)) return false;
  const want = linkedName(USER.email);
  if(!want) return false;
  const m = membersOf(gid).find(x=> !x.uid && x.name.toLowerCase()===want.toLowerCase() );
  if(!m) return false;
  autoLinked[gid]=true; claimAsked[gid]=true;
  linkPerson(gid, m.k);
  return true;
}

/* ---------- expenses, with the filters the tracker had ---------- */
function groupExpenses(main, gid){
  const all=expensesOf(gid), ppl=names(gid);

  const wrap=el("div","filters");
  wrap.innerHTML=
    '<input id="fq" type="search" placeholder="Search expenses" aria-label="Search expenses" autocomplete="off">'+
    '<div class="frow" id="fPayer" role="group" aria-label="Who paid"></div>'+
    '<div class="frow" id="fWays" role="group" aria-label="How many ways it was split"></div>';
  main.appendChild(wrap);

  const q=$("fq"); q.value=FILT.q;
  let t;
  q.addEventListener("input", ()=>{ clearTimeout(t); t=setTimeout(()=>{ FILT.q=q.value; draw(); }, 140); });

  const payers=[""].concat(ppl);
  payers.forEach(n=>{
    const c=el("button","chip"); c.type="button";
    c.textContent = n || "Everyone";
    c.setAttribute("aria-pressed", FILT.payer===n ? "true":"false");
    c.addEventListener("click", ()=>{ FILT.payer=(FILT.payer===n && n)?"":n; refreshChips(); draw(); });
    $("fPayer").appendChild(c);
  });
  const maxWays=Math.max(2, ppl.length);
  const ways=[0]; for(let i=2;i<=maxWays;i++) ways.push(i);
  ways.forEach(w=>{
    const c=el("button","chip"); c.type="button";
    c.textContent = w ? ("split "+w) : "Any split";
    c.setAttribute("aria-pressed", FILT.ways===w ? "true":"false");
    c.addEventListener("click", ()=>{ FILT.ways=(FILT.ways===w && w)?0:w; refreshChips(); draw(); });
    $("fWays").appendChild(c);
  });
  function refreshChips(){
    [].forEach.call($("fPayer").children,(c,i)=> c.setAttribute("aria-pressed", FILT.payer===payers[i]?"true":"false"));
    [].forEach.call($("fWays").children,(c,i)=> c.setAttribute("aria-pressed", FILT.ways===ways[i]?"true":"false"));
  }

  const host=el("div"); host.id="expList"; main.appendChild(host);
  draw();

  function matches(e){
    if(FILT.payer && e.payer!==FILT.payer) return false;
    const b=(e.between&&e.between.length)?e.between:[e.payer];
    if(FILT.ways && b.length!==FILT.ways) return false;
    const needle=FILT.q.trim().toLowerCase();
    if(needle){
      const hay=(e.desc+" "+e.payer+" "+(e.note||"")+" "+b.join(" ")).toLowerCase();
      if(hay.indexOf(needle)<0) return false;
    }
    return true;
  }

  function draw(){
    const list=all.filter(matches);
    host.innerHTML="";
    if(FILT.q.trim() || FILT.payer || FILT.ways){
      let sum=0; list.forEach(e=> sum+=Number(e.amount)||0 );
      const line=el("div","fcount");
      line.innerHTML='<span>Showing <b>'+list.length+'</b> of '+all.length+' &middot; '+money(sum)+'</span>';
      const clr=el("button",null,"Clear");
      clr.addEventListener("click", ()=>{
        FILT.q=""; FILT.payer=""; FILT.ways=0; $("fq").value=""; refreshChips(); draw();
      });
      line.appendChild(clr); host.appendChild(line);
    }
    if(!all.length){
      host.appendChild(el("div","empty",
        '<span class="ms" aria-hidden="true">receipt</span><h3>Nothing logged yet.</h3>'));
      return;
    }
    if(!list.length){
      host.appendChild(el("div","empty",
        '<span class="ms" aria-hidden="true">search_off</span><h3>Nothing matches</h3>'+
        '<p>Try a different search, or clear the filters.</p>'));
      return;
    }
    const headcount=ppl.length;
    const CAP=6;
    const capped = !FULLVIEW && list.length > CAP;
    const wrapper=el("div","listwrap"+(capped?" capped":""));
    const card=el("div","card");
    list.forEach(e=>{
      const between=(e.between&&e.between.length)?e.between:[e.payer];
      const n=between.length;
      const label = (n===1) ? "just them"
                  : (headcount>1 && n===headcount) ? "everyone"
                  : n+(headcount>n ? " of "+headcount : "");
      const who=between.map(nm=>
        '<span class="wchip"><span class="wdot" style="background:'+colorOf(nm,gid)+'"></span>'+esc(nm)+'</span>').join("");
      const r=el("button","row exrow");
      r.innerHTML=
        '<span class="av" style="background:'+colorOf(e.payer,gid)+'">'+esc(initials(e.payer||"?"))+'</span>'+
        '<span class="body"><span class="t1">'+esc(e.desc)+'</span>'+
        '<span class="t2">'+esc(e.payer)+' paid &middot; '+label+
          (n>1 ? ' &middot; '+money(e.amount/n)+' each' : '')+'</span>'+
        '<span class="who">'+who+'</span>'+
        (fmtAdded(e.at) ? '<span class="added"><span class="ms" aria-hidden="true">schedule</span>'+
           esc(fmtAdded(e.at))+'</span>' : '')+
        '</span>'+
        '<span class="right"><span class="amt">'+money(e.amount)+'</span></span>';
      r.addEventListener("click", ()=>sheetExpense(e));
      card.appendChild(r);
    });
    wrapper.appendChild(card);
    host.appendChild(wrapper);
    if(capped){
      // the cap is by height, not by count, so do not claim how many are visible
      const note=el("p","scrollnote");
      note.innerHTML='<span class="ms" aria-hidden="true">swipe_vertical</span>'+
        '<span>'+list.length+' expenses \u2014 scroll the list, or open it full</span>';
      host.appendChild(note);
    }
  }
}
function fmtAdded(ts){
  if(!ts) return "";
  const d=new Date(ts); if(isNaN(d.getTime())) return "";
  const o={weekday:"short", day:"numeric", month:"short"};
  if(d.getFullYear()!==new Date().getFullYear()) o.year="numeric";
  const date=d.toLocaleDateString(undefined,o).replace(/,/g,"");
  const time=d.toLocaleTimeString(undefined,{hour:"2-digit", minute:"2-digit"});
  return date+" · "+time;
}

function sectionWhoOwes(main, gid){
  const st=settlements(gid);
  if(!st.length){
    main.appendChild(el("div","empty",
      '<span class="ms" aria-hidden="true">check_circle</span>'+
      '<h3>All square - nobody owes anybody.</h3>'));
    return;
  }
  const by={};
  st.forEach(t=>{ (by[t.to]=by[t.to]||[]).push(t); });
  let widest=0; st.forEach(t=>{ if(t.amt>widest) widest=t.amt; });
  if(!widest) widest=1;
  Object.keys(by).sort((a,c)=>{
    const sa=by[a].reduce((x,y)=>x+y.amt,0), sc=by[c].reduce((x,y)=>x+y.amt,0);
    return sc-sa;
  }).forEach(to=>{
    const rows=by[to].slice().sort((a,c)=>c.amt-a.amt), m=memberOf(to,gid);
    let total=0; rows.forEach(r=> total+=r.amt );
    const card=el("div","card pad owed");
    let h='<div class="owedhead">'+avatarHTML("", to, m&&m.color, m&&m.photo)+
      '<span class="txt"><b>'+esc(to)+'</b><small>is owed by '+rows.length+' '+
      (rows.length===1?"person":"people")+'</small></span>'+
      '<span class="amt">'+money(total)+'</span></div>';
    rows.forEach(r=>{
      const pct=Math.max(3, Math.round(r.amt/widest*100));
      h+='<div class="barrow"><span class="who">'+esc(r.from)+'</span>'+
         '<span class="track"><span class="fill" style="width:'+pct+'%;background:'+colorOf(r.from,gid)+'"></span></span>'+
         '<span class="val">'+money(r.amt)+'</span></div>';
    });
    card.innerHTML=h;
    [].forEach.call(card.querySelectorAll(".barrow"), (row,i)=>{
      row.style.cursor="pointer";
      row.addEventListener("click", ()=>sheetSettle(rows[i].from, to, rows[i].amt));
    });
    main.appendChild(card);
  });
}

let sheetOnClose=null;

  $("scrim").hidden=false; $("sheet").hidden=false;

}
function closeSheet(){
  $("scrim").hidden=true; $("sheet").hidden=true;
  document.body.style.overflow="";
  const f=sheetOnClose; sheetOnClose=null; if(f) f();
}
function fieldHTML(id, label, type, value, extra){
  return '<div class="field"><label for="'+id+'">'+label+'</label>'+
    '<input id="'+id+'" type="'+type+'" value="'+esc(value==null?"":value)+'" '+(extra||"")+'></div>';
}
function dateVal(ts){
  const d=new Date(ts||Date.now()); if(isNaN(d)) return "";
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function tsFromDate(v, old){
  if(!v) return old||Date.now();
  const parts=v.split("-").map(Number);
  const o=new Date(old||Date.now());
  const d=new Date(parts[0], parts[1]-1, parts[2], o.getHours(), o.getMinutes(), o.getSeconds());
  return isNaN(d)?(old||Date.now()):d.getTime();
}

          '<span class="right"><span class="ms" aria-hidden="true" style="color:var(--tint)">how_to_reg</span></span>';
        r.addEventListener("click", ()=>claim(gid, m.k, m.name));
        card.appendChild(r);
      });

    }
    $("clAdd").addEventListener("click", ()=>{
      const v=$("clNew").value.trim();
      if(!v) return toast("Enter a name");
      if(names(gid).some(n=>n.toLowerCase()===v.toLowerCase()))
        return toast(v+" is already on the list — pick that name above");
      push("trips/"+gid+"/people", {n:v, c:freeColour(gid), uid:USER.uid, email:USER.email, photo:USER.photo||null})
        .then(()=>{ rememberGroup(gid, groupName(gid)); closeSheet(); toast("You are in"); });
    });
  });
  function claim(gid, key, name){
    set("trips/"+gid+"/people/"+key+"/uid",   USER.uid)
      .then(()=> set("trips/"+gid+"/people/"+key+"/email", USER.email))
      .then(()=> USER.photo ? set("trips/"+gid+"/people/"+key+"/photo", USER.photo) : null)
      .then(()=>{ rememberGroup(gid, groupName(gid)); closeSheet(); toast("You are "+name+" in this group"); });
  }
}
function freeColour(gid){
  const used={}; membersOf(gid).forEach(m=>{ used[m.color.toLowerCase()]=1; });
  for(let i=0;i<PALETTE.length;i++){ if(!used[PALETTE[i].toLowerCase()]) return PALETTE[i]; }
  return PALETTE[membersOf(gid).length%PALETTE.length];
}

        '<button type="button" data-m="shares">Shares</button>'+
      '</div><div class="help" id="exModeHelp"></div></div>'+
      '<div class="field"><label>Between</label><div id="exSplit"></div>'+
        '<div class="splitsum" id="exSum"><span></span><span></span></div></div>'+
      fieldHTML("exDate","Date","date", dateVal(existing?existing.at:null))+
      '<div class="field"><label for="exNote">Note (optional)</label>'+
      '<textarea id="exNote" placeholder="Anything worth remembering">'+esc(existing?(existing.note||""):"")+'</textarea></div>'+
      '<div class="btnrow"><button class="btn p" id="exSave">'+(existing?"Save changes":"Add expense")+'</button></div>'+
      (existing?'<button class="btn d wide" id="exDel" style="margin-top:10px">Delete this expense</button>':'')+
      (existing?'<p class="fine" style="text-align:center;margin-top:12px">Added by '+
        esc(existing.by||existing.payer)+' · '+esc(fmtWhen(existing.at))+'</p>':'');

    const cats=$("exCats");
    CATS.forEach(c=>{
      const ch=el("button","chip"); ch.type="button";
      ch.innerHTML='<span class="ms" aria-hidden="true" style="font-size:18px">'+c.i+'</span>'+c.n;
      ch.setAttribute("aria-pressed", c.k===cat?"true":"false");
      ch.addEventListener("click",()=>{ cat=c.k;
        [].forEach.call(cats.children,x=>x.setAttribute("aria-pressed","false"));
        ch.setAttribute("aria-pressed","true"); });
      cats.appendChild(ch);
    });

    [].forEach.call($("exMode").children, btn=>{
      btn.addEventListener("click", ()=>{ mode=btn.dataset.m; drawMode(); drawSplit(); });
    });
    $("exAmt").addEventListener("input", drawSplit);
    drawMode(); drawSplit();

    $("exSave").addEventListener("click", save);
    if(existing) $("exDel").addEventListener("click", ()=>{
      if(!confirm('Delete "'+existing.desc+'"? This removes it for everyone.')) return;
      del("trips/"+gid+"/expenses/"+existing.k); closeSheet(); toast("Expense deleted");
    });

    function drawMode(){
      [].forEach.call($("exMode").children, b2=>
        b2.setAttribute("aria-pressed", b2.dataset.m===mode?"true":"false"));
      $("exModeHelp").textContent = mode==="equal" ? "Split evenly between everyone ticked below."
        : mode==="exact" ? "Type exactly what each person owes. It must add up to the total."
        : mode==="percent" ? "Type each person's percentage. It must add up to 100%."
        : "Give each person a number of shares — 2 shares pays twice as much as 1.";
    }
    function drawSplit(){
      const host=$("exSplit"); host.innerHTML="";
      const amt=Number($("exAmt").value)||0;
      if(mode==="equal"){
        const chips=el("div","chips");
        ppl.forEach(n=>{
          const on=between.indexOf(n)>-1;
          const ch=el("button","chip"); ch.type="button";
          ch.innerHTML='<span class="dot" style="background:'+colorOf(n,gid)+'"></span>'+esc(n)+(n===ME?" (you)":"");
          ch.setAttribute("aria-pressed", on?"true":"false");
          ch.addEventListener("click",()=>{
            const i=between.indexOf(n);
            if(i>-1){ if(between.length===1) return toast("At least one person"); between.splice(i,1); }
            else between.push(n);
            drawSplit();
          });
          chips.appendChild(ch);
        });
        host.appendChild(chips);
        const all=el("button","btn s","Everyone"); all.type="button";
        all.style.cssText="margin-top:12px;min-height:44px;padding:9px 18px;font-size:13.5px;border-radius:16px";
        all.addEventListener("click",()=>{ between=ppl.slice(); drawSplit(); });
        host.appendChild(all);
        const per=between.length?amt/between.length:0;
        setSum(between.length+(between.length===1?" person":" people")+" · "+money(per)+" each", "", true);
        return;
      }
      ppl.forEach(n=>{
        const on=between.indexOf(n)>-1;
        const r=el("div","splitrow");
        r.innerHTML=
          '<span class="av sm" style="background:'+(on?colorOf(n,gid):"#c9ced6")+'">'+esc(initials(n))+'</span>'+
          '<span class="nm" style="'+(on?"":"opacity:.5")+'">'+esc(n)+(n===ME?" (you)":"")+'</span>'+
          '<span class="calc" data-calc></span>'+
          '<input type="number" inputmode="decimal" step="'+(mode==="shares"?"1":"0.01")+'" min="0" '+
            'value="'+(on&&vals[n]!=null?esc(String(vals[n])):"")+'" aria-label="'+esc(n)+'">'+
          '<span class="unit">'+(mode==="percent"?"%":mode==="shares"?"sh":"$")+'</span>';
        const inp=r.querySelector("input");
        inp.addEventListener("input", ()=>{
          const v=inp.value.trim();
          if(v===""){ delete vals[n]; const i=between.indexOf(n); if(i>-1) between.splice(i,1); }
          else { vals[n]=Number(v)||0; if(between.indexOf(n)<0) between.push(n); }
          recalc();
        });
        host.appendChild(r);
      });
      recalc();
    }
    function recalc(){
      const amt=Number($("exAmt").value)||0;
      const rows=$("exSplit").querySelectorAll(".splitrow");
      const eff=between.filter(n=>ppl.indexOf(n)>-1);
      let tot=0; eff.forEach(n=> tot+=Number(vals[n])||0 );
      [].forEach.call(rows,(r,i)=>{
        const n=ppl[i], c=r.querySelector("[data-calc]"), on=eff.indexOf(n)>-1;
        r.querySelector(".nm").style.opacity = on?"1":".5";
        r.querySelector(".av").style.background = on?colorOf(n,gid):"#c9ced6";
        if(!on || !amt){ c.textContent=""; return; }
        const v=Number(vals[n])||0;
        c.textContent = mode==="exact" ? "" :
          mode==="percent" ? money(amt*v/100) :
          money(tot? amt*v/tot : 0);
      });
      if(mode==="exact"){
        const left=Math.round((amt-tot)*100)/100;
        setSum(money(tot)+" of "+money(amt),
               Math.abs(left)<0.005?"all accounted for":(left>0?money(left)+" left":money(-left)+" over"),
               Math.abs(left)<0.005);
      } else if(mode==="percent"){
        const left=Math.round((100-tot)*100)/100;
        setSum(trim(tot)+"% of 100%",
               Math.abs(left)<0.005?"adds up":(left>0?trim(left)+"% left":trim(-left)+"% over"),
               Math.abs(left)<0.005);
      } else {
        setSum(trim(tot)+" share"+(tot===1?"":"s")+" between "+eff.length,
               eff.length?"":"pick at least one", eff.length>0 && tot>0);
      }
    }
    function setSum(a, bTxt, ok){
      const s=$("exSum"); s.className="splitsum"+(ok?" ok":bTxt?" bad":"");
      s.children[0].textContent=a; s.children[1].textContent=bTxt;
    }
    function save(){
      const desc=$("exDesc").value.trim();
      const amt=Math.round((Number($("exAmt").value)||0)*100)/100;
      if(!desc) return toast("Give it a description");
      if(!(amt>0)) return toast("Enter an amount");
      const eff=between.filter(n=>ppl.indexOf(n)>-1);
      if(!eff.length) return toast("Pick who it is split between");
      const v={};
      if(mode!=="equal"){
        let tot=0; eff.forEach(n=>{ v[n]=Number(vals[n])||0; tot+=v[n]; });
        if(mode==="exact"   && Math.abs(tot-amt)>0.011) return toast("The amounts must add up to "+money(amt));
        if(mode==="percent" && Math.abs(tot-100)>0.011) return toast("The percentages must add up to 100");
        if(mode==="shares"  && tot<=0)                  return toast("Give someone at least one share");
      }
      const rec={
        desc: desc, amount: amt, payer: $("exPayer").value, mode: mode,
        between: eff, vals: v, cat: cat, note: $("exNote").value.trim(),
        at: tsFromDate($("exDate").value, existing?existing.at:null),
        by: existing ? (existing.by||ME||USER.name) : (ME||USER.name)
      };
      if(existing) set("trips/"+gid+"/expenses/"+existing.k, rec);
      else push("trips/"+gid+"/expenses", rec);
      closeSheet(); toast(existing?"Expense updated":"Expense added");
    }
  });
  setTimeout(()=>{ const d=$("exDesc"); if(d && !existing) d.focus(); }, 90);
}

/* ---------- record a payment ---------- */
function sheetSettle(from, to, amt, existing){
  const gid=CURRENT;
  // A payment can name someone who is no longer on the members list, so the
  // pickers have to offer those names too or editing it would silently move
  // the money to somebody else.
  const ppl=names(gid).slice();
  if(existing){ [existing.from, existing.to].forEach(n=>{ if(n && ppl.indexOf(n)<0) ppl.push(n); }); }
  if(ppl.length<2){ toast("You need at least two people"); return; }
  from = from || (ME && ppl.indexOf(ME)>-1 ? ME : ppl[0]);
  to   = to   || ppl.filter(n=>n!==from)[0] || ppl[0];
  openSheet(existing?"Edit payment":"Record a payment", (b)=>{
    b.innerHTML=
      '<p class="lead">Use this when cash or a transfer has actually changed hands.</p>'+
      '<div class="field"><label for="stFrom">Who paid</label><select id="stFrom">'+
        ppl.map(n=>'<option value="'+esc(n)+'"'+(n===from?' selected':'')+'>'+esc(n)+(n===ME?" (you)":"")+'</option>').join("")+
      '</select></div>'+
      '<div class="field"><label for="stTo">Who received it</label><select id="stTo">'+
        ppl.map(n=>'<option value="'+esc(n)+'"'+(n===to?' selected':'')+'>'+esc(n)+(n===ME?" (you)":"")+'</option>').join("")+
      '</select></div>'+
      '<div class="field"><label for="stAmt">Amount</label><div class="amtbig"><span class="cur">$</span>'+
      '<input id="stAmt" type="number" inputmode="decimal" step="0.01" min="0" value="'+(amt?esc(plain(amt)):"")+'"></div></div>'+
      fieldHTML("stDate","Date","date", dateVal(existing?existing.at:null))+
      '<div class="field"><label for="stNote">Note (optional)</label>'+
      '<input id="stNote" type="text" placeholder="e-transfer, cash…" value="'+
        esc(existing?(existing.note||""):"")+'"></div>'+
      '<button class="btn p wide" id="stSave">'+(existing?"Save changes":"Record payment")+'</button>'+
      (existing?'<button class="btn d wide" id="stDel" style="margin-top:10px">Delete this payment</button>'+
        '<p class="fine">Recorded by '+esc(existing.by||existing.from)+' · '+esc(fmtWhen(existing.at))+'</p>':'');
    $("stSave").addEventListener("click", ()=>{
      const f=$("stFrom").value, t=$("stTo").value;
      const a=Math.round((Number($("stAmt").value)||0)*100)/100;
      if(f===t) return toast("Pick two different people");
      if(!(a>0)) return toast("Enter an amount");
      const rec={from:f, to:t, amount:a, note:$("stNote").value.trim(),
                 at:tsFromDate($("stDate").value, existing?existing.at:null),
                 by: existing ? (existing.by||ME||USER.name) : (ME||USER.name)};
      if(existing) set("trips/"+gid+"/payments/"+existing.k, rec);
      else push("trips/"+gid+"/payments", rec);
      closeSheet(); toast(existing?"Payment updated":"Payment recorded");
    });
    if(existing) $("stDel").addEventListener("click", ()=>{
      if(!confirm("Delete this "+money(existing.amount)+" payment from "+existing.from+
                  " to "+existing.to+"? Everyone's balance will move.")) return;
      del("trips/"+gid+"/payments/"+existing.k); closeSheet(); toast("Payment deleted");
    });
  });
}

/* ---------- one person's detail ---------- */
/* ---------- the receipt: an itemised statement, as the tracker had it ---------- */
let rcFilter="__all__";
function sheetPerson(name){
  rcFilter="__all__";
  openSheet(name, (b)=>{
    b.innerHTML='<div class="rcrole" id="rcRole"></div>'+
      '<div class="frow" id="rcFilters"></div>'+
      '<div class="paper" id="rcPaper"></div>'+
      '<button class="btn p wide" id="rcSettle" style="margin-top:18px">Settle up</button>';
    drawFilters(); drawPaper();
    $("rcSettle").addEventListener("click", ()=>{
      const v=Math.round((balances(CURRENT)[name]||0)*100)/100;
      closeSheet();
      setTimeout(()=>{
        if(v<-0.004) sheetSettle(name, null, Math.abs(v));
        else if(v>0.004) sheetSettle(null, name, Math.abs(v));
        else sheetSettle();
      }, 220);
    });
  });

  function drawFilters(){
    const host=$("rcFilters"); host.innerHTML="";
    const opts=["__all__"].concat(everyoneIn(CURRENT).filter(n=>n!==name));
    opts.forEach(o=>{
      const c=el("button","chip"); c.type="button";
      c.textContent = o==="__all__" ? "Everything" : o;
      c.setAttribute("aria-pressed", rcFilter===o ? "true":"false");
      c.addEventListener("click", ()=>{ rcFilter=o; drawFilters(); drawPaper(); });
      host.appendChild(c);
    });
  }

  function drawPaper(){
    const gid=CURRENT, paper=$("rcPaper");
    let h='<div class="rc-title">'+esc(name)+'</div>';

    if(rcFilter==="__all__"){
      $("rcRole").textContent="how the balance is worked out";
      h+='<div class="rc-sub">every line that moves '+esc(name)+'&rsquo;s balance</div><div class="rc-rule"></div>';

      const all=expensesOf(gid);
      const paid=all.filter(e=> e.payer===name );
      const share=all.filter(e=>{
        const b2=(e.between&&e.between.length)?e.between:[e.payer];
        return b2.indexOf(name)!==-1;
      });

      let paidTotal=0;
      h+='<div class="rc-grp">PAID OUT &middot; '+paid.length+' item'+(paid.length===1?"":"s")+'</div>';
      if(!paid.length) h+='<div class="rc-line"><span class="d note">nothing</span><span class="n">'+money(0)+'</span></div>';
      paid.forEach((e,i)=>{
        paidTotal+=Number(e.amount)||0;
        h+='<div class="rc-line"><span class="d">'+(i+1)+') '+esc(e.desc)+'</span><span class="n">'+money(e.amount)+'</span></div>';
      });
      h+='<div class="rc-rule"></div><div class="rc-tot"><span class="d">total paid</span><span class="n">'+money(paidTotal)+'</span></div>';

      let shareTotal=0;
      h+='<div class="rc-grp">THEIR SHARE &middot; '+share.length+' item'+(share.length===1?"":"s")+'</div>';
      if(!share.length) h+='<div class="rc-line"><span class="d note">nothing</span><span class="n">'+money(0)+'</span></div>';
      share.forEach((e,i)=>{
        const sh=sharesOf(e), cut=sh[name]||0;
        const b2=(e.between&&e.between.length)?e.between:[e.payer];
        shareTotal+=cut;
        h+='<div class="rc-line"><span class="d">'+(i+1)+') '+esc(e.desc)+
           ' <span class="note">('+money(e.amount)+(e.mode&&e.mode!=="equal" ? "" : " &divide; "+b2.length)+')</span></span>'+
           '<span class="n">'+money(cut)+'</span></div>';
      });
      h+='<div class="rc-rule"></div><div class="rc-tot"><span class="d">total share</span><span class="n">'+money(shareTotal)+'</span></div>';

      let net=paidTotal-shareTotal;
      const pays=paymentsOf(gid).filter(p=> p.from===name || p.to===name );
      if(pays.length){
        h+='<div class="rc-grp">PAYMENTS &middot; '+pays.length+' item'+(pays.length===1?"":"s")+'</div>';
        pays.forEach((p,i)=>{
          const out = p.from===name;
          net += out ? (Number(p.amount)||0) : -(Number(p.amount)||0);
          h+='<div class="rc-line"><span class="d">'+(i+1)+') '+
             (out ? "paid "+esc(p.to) : "received from "+esc(p.from))+'</span>'+
             '<span class="n">'+(out?"+":"&minus;")+money(p.amount)+'</span></div>';
        });
      }

      h+='<div class="rc-rule solid"></div>';
      h+='<div class="rc-line" style="margin-top:2px"><span class="d">paid</span><span class="n">'+money(paidTotal)+'</span></div>';
      h+='<div class="rc-line"><span class="d">less their share</span><span class="n">&minus;'+money(shareTotal)+'</span></div>';
      h+='<div class="rc-rule"></div>';
      h+='<div class="rc-net">'+(Math.abs(net)<0.005
          ? "SQUARE &mdash; paid exactly their share"
          : (net>0 ? esc(name).toUpperCase()+" IS OWED "+money(net)
                   : esc(name).toUpperCase()+" OWES "+money(-net)))+'</div>';
      h+='<div class="rc-sub" style="margin-top:8px">Tap a name above to see it split person by person.</div>';
    } else {
      const other=rcFilter;
      $("rcRole").textContent="statement with "+other;
      h+='<div class="rc-sub">statement with '+esc(other)+'</div><div class="rc-rule"></div>';
      const theyOwe=itemsOwedTo(name, other), weOwe=itemsOwedTo(other, name);
      const a=sumShares(theyOwe), b2=sumShares(weOwe);

      h+='<div class="rc-grp">'+esc(other).toUpperCase()+' OWES '+esc(name).toUpperCase()+'</div>';
      if(!theyOwe.length) h+='<div class="rc-line"><span class="d note">nothing</span><span class="n">'+money(0)+'</span></div>';
      theyOwe.forEach((x,i)=>{
        h+='<div class="rc-line"><span class="d">'+(i+1)+') '+esc(x.desc)+' <span class="note">('+money(x.total)+' / '+x.ways+')</span></span><span class="n">'+money(x.share)+'</span></div>';
      });
      h+='<div class="rc-rule"></div><div class="rc-tot"><span class="d">subtotal</span><span class="n">'+money(a)+'</span></div>';

      h+='<div class="rc-grp">'+esc(name).toUpperCase()+' OWES '+esc(other).toUpperCase()+'</div>';
      if(!weOwe.length) h+='<div class="rc-line"><span class="d note">nothing</span><span class="n">'+money(0)+'</span></div>';
      weOwe.forEach((x,i)=>{
        h+='<div class="rc-line"><span class="d">'+(i+1)+') '+esc(x.desc)+' <span class="note">('+money(x.total)+' / '+x.ways+')</span></span><span class="n">'+money(x.share)+'</span></div>';
      });
      h+='<div class="rc-rule"></div><div class="rc-tot"><span class="d">subtotal</span><span class="n">'+money(b2)+'</span></div>';

      const net=a-b2;
      h+='<div class="rc-rule solid"></div>';
      h+='<div class="rc-net">'+(Math.abs(net)<0.005
          ? "SQUARE - nothing between you"
          : (net>0 ? esc(other).toUpperCase()+" OWES "+esc(name).toUpperCase()+" "+money(net)
                   : esc(name).toUpperCase()+" OWES "+esc(other).toUpperCase()+" "+money(-net)))+'</div>';
    }
    paper.innerHTML=h;
  }
}
// Lines where `debtor` carries a share of something `creditor` paid for.
function itemsOwedTo(creditor, debtor){
  const out=[];
  expensesOf(CURRENT).forEach(e=>{
    if(e.payer!==creditor) return;
    const b=(e.between&&e.between.length)?e.between:[e.payer];
    if(b.indexOf(debtor)<0) return;
    const sh=sharesOf(e);
    out.push({desc:e.desc, total:Number(e.amount)||0, ways:b.length, share:sh[debtor]||0});
  });
  return out;
}
function sumShares(list){ let t=0; list.forEach(x=> t+=x.share ); return t; }
function paidShareLine(n, gid){
  let paid=0, share=0;
  expensesOf(gid).forEach(e=>{
    if(e.payer===n) paid+=Number(e.amount)||0;
    const sh=sharesOf(e); if(sh[n]) share+=sh[n];
  });
  return 'paid '+money(paid)+' &middot; share '+money(share);
}

          '<span class="calc">'+(Math.abs(v)<0.005?"settled":money(v))+'</span>';
        if(mayEdit){
          const p=el("button","ibtn");
          p.style.cssText="color:var(--label-2);width:38px;height:38px";
          p.setAttribute("aria-label","Edit "+m.name);
          p.innerHTML='<span class="ms" aria-hidden="true" style="font-size:19px">edit</span>';
          p.addEventListener("click", ()=> sheetPersonEdit(gid, m, draw) );
          r.appendChild(p);
          const x=el("button","ibtn");
          x.style.cssText="color:var(--danger);width:38px;height:38px";
          x.setAttribute("aria-label","Remove "+m.name);
          x.innerHTML='<span class="ms" aria-hidden="true" style="font-size:20px">close</span>';
          x.addEventListener("click", ()=>{
            const used=expensesOf(gid).some(e=>e.payer===m.name||(e.between||[]).indexOf(m.name)>-1)
                    || paymentsOf(gid).some(p2=>p2.from===m.name||p2.to===m.name);
            if(used) return toast("Remove or edit their expenses first");
            del("trips/"+gid+"/people/"+m.k).then(()=>setTimeout(draw,150));
          });
          r.appendChild(x);
        }
        host.appendChild(r);
      });
      const add=()=>{
        const v=$("mName").value.trim();
        if(!v) return toast("Enter a name");
        if(names(gid).some(n=>n.toLowerCase()===v.toLowerCase())) return toast(v+" is already in this group");
        push("trips/"+gid+"/people", {n:v, c:freeColour(gid)}).then(()=>setTimeout(draw,150));
      };
      $("mAdd").addEventListener("click", add);
      $("mName").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });
    };
    draw();
  }, render);
}

  // A duplicate usually needs folding into a name that has fallen off the
  // members list, so offer those too - they still hold a balance.
  const others = everyoneIn(gid).filter(n=> n!==m.name ).map(n=>({name:n}));
  const pv = mergePreview(gid, m.name);
  openSheet(m.name, (b)=>{
    b.innerHTML=
      fieldHTML("pnName","Name","text", m.name)+
      '<div class="help" style="margin:-8px 0 16px">Changing this renames them on every expense and '+
      'payment in the group, so the balances stay right.</div>'+
      '<button class="btn p wide" id="pnSave">Save name</button>'+
      (m.email?'<div class="sechead">Account</div>'+
        '<p class="fine" style="margin:0 0 12px">'+esc(m.name)+' is signed in as '+esc(m.email)+'.</p>':'')+
      (isMe?'<button class="btn s wide" id="pnFree">This is not me — release this name</button>'+
